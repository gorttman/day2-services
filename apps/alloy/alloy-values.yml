# Grafana Alloy as the log collector (DaemonSet, every node) -> Loki.
#
# Why Alloy and not Fluent Bit: the spec asked for Fluent Bit, and it was tried
# first (2026-10-17). It crash-loops on every node here: "jemalloc: Unsupported
# system page size". The Pi 5 kernel (6.12.47+rpt-rpi-2712) uses 16 KiB memory
# pages and Fluent Bit's bundled allocator only supports 4 KiB. Alloy is Go, so
# it has no such limit, and it is Grafana's own Loki collector.
#
# Reads:  container logs from /var/log/pods (found through the Kubernetes API,
#         so labels come from pod metadata) and each node's systemd journal.
# Writes: to Loki, cluster-internal only.
#
# Labels sent to Loki are low-cardinality on purpose: cluster, node, namespace,
# app, signal_type (container | host). Pod and container name ride along as
# structured metadata - filter on them with `| pod="..."` in LogQL, they are not
# labels.
controller:
  type: daemonset
  tolerations:
    - operator: Exists
  volumes:
    extra:
      - name: runjournal
        hostPath: {path: /run/log/journal, type: DirectoryOrCreate}
      - name: machineid
        hostPath: {path: /etc/machine-id, type: File}
      - name: alloystate
        hostPath: {path: /var/lib/alloy, type: DirectoryOrCreate}

image:
  # Mirror of docker.io/grafana/alloy:v1.20.1 (see
  # .github/workflows/mirror-upstream-images.yml), pinned by digest.
  registry: ghcr.io
  repository: gorttman/alloy
  tag: v1.20.1
  digest: sha256:7da8bffc169818b996cab76cf88855bc713144b7f886ab8d94c77898311b156d

alloy:
  # Positions (how far each file has been read) survive restarts.
  storagePath: /var/lib/alloy/data
  mounts:
    varlog: true
    extra:
      - {name: runjournal, mountPath: /run/log/journal, readOnly: true}
      - {name: machineid, mountPath: /etc/machine-id, readOnly: true}
      - {name: alloystate, mountPath: /var/lib/alloy}
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  # Container log files are root-only.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 384Mi
  configMap:
    create: true
    content: |
      // ---- container logs ------------------------------------------------
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // Where the log files are: /var/log/pods/<ns>_<pod>_<uid>/<container>/N.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        // app: container name, overridden by the app label if the pod has one,
        // overridden again by app.kubernetes.io/name.
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = "(.+)"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "(.+)"
          target_label  = "app"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        stage.cri {}
        // pod and container become structured metadata, not labels.
        stage.structured_metadata {
          values = {
            pod       = "pod",
            container = "container",
          }
        }
        stage.label_drop {
          values = ["pod", "container", "filename", "stream"]
        }
        stage.static_labels {
          values = {
            cluster     = "pilab",
            signal_type = "container",
            node        = sys.env("NODE_NAME"),
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      // ---- host journal --------------------------------------------------
      loki.relabel "journal" {
        forward_to = []
        rule {
          source_labels = ["__journal_syslog_identifier"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__journal__systemd_unit"]
          target_label  = "unit"
        }
      }

      loki.source.journal "host" {
        max_age       = "12h"
        relabel_rules = loki.relabel.journal.rules
        labels = {
          cluster     = "pilab",
          signal_type = "host",
          namespace   = "host",
          node        = sys.env("NODE_NAME"),
        }
        forward_to = [loki.process.journal.receiver]
      }

      loki.process "journal" {
        // Unit is kept as structured metadata, like pod/container above.
        stage.structured_metadata {
          values = {
            unit = "unit",
          }
        }
        stage.label_drop {
          values = ["unit"]
        }
        forward_to = [loki.write.default.receiver]
      }

      // Retry for about two hours before dropping a batch (default is 10 tries, roughly
      // 5-8 minutes). Proven 2026-10-18: Loki down for 7 minutes made every node drop
      // batches. While retrying, Alloy stops reading and picks up where it left off, so
      // container and journal lines are held on disk rather than lost.
      loki.write "default" {
        endpoint {
          url                 = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
          min_backoff_period  = "500ms"
          max_backoff_period  = "1m"
          max_backoff_retries = 120
        }
      }

      // ---- UDM syslog -----------------------------------------------------
      // Network-device syslog, received on 1514 (UDP + TCP) in every Alloy pod.
      // A LoadBalancer Service (apps/alloy/udm-syslog) maps 192.168.20.231:514
      // onto whichever pods are up. UniFi sends RFC 3164 over UDP. RFC 3164 stamps
      // carry no year (Alloy dates them year 0 and Loki rejects them), so the
      // arrival time is used instead.
      loki.source.syslog "udm" {
        listener {
          address       = "0.0.0.0:1514"
          protocol      = "udp"
          syslog_format = "rfc3164"
          use_incoming_timestamp = false
          labels = {
            cluster     = "pilab",
            signal_type = "network",
            namespace   = "network",
            app         = "udm",
          }
        }
        listener {
          address       = "0.0.0.0:1514"
          protocol      = "tcp"
          syslog_format = "rfc3164"
          use_incoming_timestamp = false
          labels = {
            cluster     = "pilab",
            signal_type = "network",
            namespace   = "network",
            app         = "udm",
          }
        }
        forward_to = [loki.process.udm.receiver]
      }

      // ---- QNAP script logs ------------------------------------------------
      // The QNAP has no collector, so a small cron script on it (day0-infra-build
      // roles/qnap_log_shipper) sends new lines of its own logs (snapshot,
      // stream watcher, ...) as RFC 3164 over UDP to 192.168.20.231:5514, mapped
      // to 1515 here. The sending script's tag becomes the app label.
      // signal_type=storage matches no retention_stream selector, so these keep
      // the 6-month default.
      loki.relabel "qnap" {
        forward_to = []
        rule {
          source_labels = ["__syslog_message_app_name"]
          target_label  = "app"
        }
        // Forensic sources (kernel ring, QTS event log, per-minute NFS health,
        // one-time kmsg backfill) are kept 13 months, like host journals.
        rule {
          source_labels = ["__syslog_message_app_name"]
          regex         = "qnap-(kernel|kernel-backfill|event|nfsd)"
          target_label  = "signal_type"
          replacement   = "host"
        }
      }

      loki.source.syslog "qnap" {
        listener {
          address       = "0.0.0.0:1515"
          protocol      = "udp"
          syslog_format = "rfc3164"
          use_incoming_timestamp = false
          labels = {
            cluster     = "pilab",
            signal_type = "storage",
            namespace   = "qnap",
            node        = "qnap",
          }
        }
        relabel_rules = loki.relabel.qnap.rules
        forward_to    = [loki.write.default.receiver]
      }

      // Tier the UDM's logs for retention (apps/loki/loki-values.yml).
      // udm_class=chatter (firewall default-policy lines, wifi/hostapd, switch
      // LLDP, kernel, station tracker) is kept 30 days; everything else the UDM
      // says (admin activity, security, VPN, updates) is udm_class=event, 13 months.
      loki.process "udm" {
        stage.static_labels {
          values = { udm_class = "event" }
        }
        stage.match {
          selector = "{app=\"udm\"} |~ \"(hostapd|wevent|mcad|stahtd|LLDP|kernel:|[[]wifi|Gateway [[][A-Z_]+-[A-Z]+-[0-9]+[]])\""
          stage.static_labels {
            values = { udm_class = "chatter" }
          }
        }
        forward_to = [loki.write.default.receiver]
      }
