# Regenerates the dashboard from real current state under /mnt/backup
# every 15 minutes - matches how "live" actually needs to be for
# something that only changes once a day (postgres-backup at 02:00,
# qnap-snapshot at 03:00, sealed-secrets-backup at 04:00). Deliberately
# a periodic regenerate-and-write, not a live query-on-page-load
# service - simpler, no RBAC/API-server access needed at all, and
# fully consistent with every other CronJob-driven piece of this
# project. See apps/backup-dashboard/README.md.
#
# hostPath + nodeSelector: k8smaster, same pattern as postgres-backup -
# /mnt/backup only exists as a real mount on k8smaster
# (day0-infra-build's qnap_client role).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-dashboard-generator
  namespace: backup-dashboard
  labels:
    app: backup-dashboard
    app.kubernetes.io/name: backup-dashboard
    argocd.argoproj.io/managed-by: argocd
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: k8smaster
          containers:
            - name: generator
              image: python:3.12-alpine
              command: ["python3", "/scripts/generate_dashboard.py"]
              env:
                - name: DASHBOARD_OUT
                  value: /var/lib/backup-dashboard-html/index.html
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: backup
                  mountPath: /mnt/backup
                  readOnly: true
                - name: html
                  mountPath: /var/lib/backup-dashboard-html
          volumes:
            - name: scripts
              configMap:
                name: backup-dashboard-generator
                defaultMode: 0555
            - name: backup
              hostPath:
                path: /mnt/backup
                type: Directory
            - name: html
              hostPath:
                path: /var/lib/backup-dashboard-html
                type: DirectoryOrCreate
