# Single self-contained Python server, no nginx, no CronJob, no shared
# hostPath to coordinate between a writer and a reader - every request
# re-scans /mnt/backup and renders fresh inline. Simpler than the
# original CronJob-writes-static-file design and genuinely on-demand
# rather than periodic, per the actual ask. Still no RBAC/Kubernetes
# API access needed at all - it only ever reads local mounted files.
#
# nodeSelector: k8smaster, same as postgres-backup - /mnt/backup only
# exists as a real mount on that node (day0-infra-build's qnap_client
# role).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-dashboard
  namespace: backup-dashboard
  labels:
    app: backup-dashboard
    app.kubernetes.io/name: backup-dashboard
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backup-dashboard
  template:
    metadata:
      labels:
        app: backup-dashboard
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8smaster
      containers:
        - name: dashboard
          image: python:3.12-alpine
          command: ["python3", "/scripts/generate_dashboard.py"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: backup
              mountPath: /mnt/backup
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: scripts
          configMap:
            name: backup-dashboard-generator
            defaultMode: 0555
        - name: backup
          hostPath:
            path: /mnt/backup
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: backup-dashboard
  namespace: backup-dashboard
  labels:
    app: backup-dashboard
    app.kubernetes.io/name: backup-dashboard
    argocd.argoproj.io/managed-by: argocd
spec:
  selector:
    app: backup-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
