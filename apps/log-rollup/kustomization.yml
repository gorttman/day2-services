apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deploys into the existing "monitoring" namespace (owned by day1-foundation's
# grafana/influxdb apps), so there is no Namespace manifest here.
resources:
  - log-rollup-cronjob.yml

configMapGenerator:
  - name: log-rollup-script
    files:
      - log_rollup.py

# No hash suffix: kustomize does not rewrite the ConfigMap name inside a
# CronJob's jobTemplate, and each run is a fresh pod that reads the current one.
generatorOptions:
  disableNameSuffixHash: true
