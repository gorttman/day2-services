apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vscode-public
  namespace: vscode-server
  labels:
    app: vscode-gorttman
    app.kubernetes.io/name: vscode-server
    argocd.argoproj.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: "private-ca"
    # cloudflared's Public Hostname (Terraform-managed, day1-foundation
    # apps/cloudflare-tf) forwards here as plain HTTP, not HTTPS - without
    # this, nginx's default ssl-redirect would 308 that request to https
    # and loop.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Equivalent to the internal ingress's Traefik forwardAuth middleware -
    # same PAM-backed /verify endpoint, so app-level auth is still
    # enforced here. Cloudflare's mTLS WAF rule (day1-foundation
    # apps/cloudflare-tf) gates entry to this hostname at all; this is the
    # separate, second app-level gate - both are intentionally kept.
    nginx.ingress.kubernetes.io/auth-url: "http://vscode-gorttman-auth.vscode-server.svc.cluster.local:8081/verify"
    nginx.ingress.kubernetes.io/auth-response-headers: "Remote-User"
    # /verify returns 401 (not 302) when unauthenticated - nginx's
    # auth_request only understands 2xx/401/403, and builds this redirect
    # itself on a 401 rather than relying on anything from the subrequest's
    # own response. Must match the login page's expected query param name
    # ("redirect", see images/vscode-auth/auth_server.py).
    nginx.ingress.kubernetes.io/auth-signin: "https://$host/gorttman/auth?redirect=$escaped_request_uri"
    # Equivalent to the internal ingress's Traefik stripPrefix middleware.
    # NOTE: unlike Traefik's redirectRegex middleware, this does not issue
    # a browser redirect to add a trailing slash for a bare /gorttman
    # request - it just proxies it through as "/" directly. If
    # code-server's frontend resolves asset URLs relative to the browser's
    # address bar path, a bare (no trailing slash) request may load broken
    # relative assets on the public path specifically. Untested against
    # the live tunnel - verify once deployed.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - vscode.i3sec.com.au
    secretName: vscode-public-tls
  rules:
  - host: vscode.i3sec.com.au
    http:
      paths:
      - path: /gorttman(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: vscode-gorttman
            port:
              number: 80
