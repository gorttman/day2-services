apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vscode-public-auth
  namespace: vscode-server
  labels:
    app: vscode-gorttman-auth
    app.kubernetes.io/name: vscode-server
    argocd.argoproj.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  # Mirrors vscode-gorttman-auth-ingress.yml (the internal Traefik one) -
  # the browser-facing side of the PAM auth flow (e.g. a login form)
  # needs to be reachable through this public ingress too, not just the
  # server-to-server /verify call the auth-url annotation makes.
  ingressClassName: nginx
  tls:
  - hosts:
    - vscode.i3sec.com.au
    secretName: vscode-public-tls
  rules:
  - host: vscode.i3sec.com.au
    http:
      paths:
      - path: /gorttman/auth
        pathType: Prefix
        backend:
          service:
            name: vscode-gorttman-auth
            port:
              number: 8081
