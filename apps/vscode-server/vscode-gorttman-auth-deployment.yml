apiVersion: apps/v1
kind: Deployment
metadata:
  name: vscode-gorttman-auth
  namespace: vscode-server
  labels:
    app: vscode-gorttman-auth
    app.kubernetes.io/name: vscode-server
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vscode-gorttman-auth
  template:
    metadata:
      labels:
        app: vscode-gorttman-auth
        app.kubernetes.io/name: vscode-server
        app.kubernetes.io/component: auth
    spec:
      # Re-pinned 2026-09-04. Both Deployments mount hostPath
      # /home/gorttman, whose content only exists on k8smaster -
      # pinode-01 has a bare skeleton home with no gm-dev, so the
      # 2026-08-17 unpinning left the IDE running against an empty
      # directory. Soft workload-affinity below still applies among
      # nodes this selector allows.
      nodeSelector:
        kubernetes.io/hostname: k8smaster
      # Hard nodeSelector removed 2026-08-17: same resolved pinode-01
      # tmpfs constraint as every other app rebalanced this session.
      # Workload-affinity (vscode group) now handles placement.
      containers:
      - name: vscode-auth
        image: ghcr.io/gorttman/vscode-auth:latest
        imagePullPolicy: Always
        env:
        - name: ALLOWED_USER
          value: gorttman
        - name: PAM_SERVICE
          value: code-server
        - name: COOKIE_PATH
          value: /gorttman
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        volumeMounts:
        - name: shadow
          mountPath: /etc/shadow
          readOnly: true
        - name: passwd
          mountPath: /etc/passwd
          readOnly: true
        - name: pam-config
          mountPath: /etc/pam.d/code-server
          subPath: code-server
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "500m"
      volumes:
      - name: shadow
        hostPath:
          path: /etc/shadow
          type: File
      - name: passwd
        hostPath:
          path: /etc/passwd
          type: File
      - name: pam-config
        configMap:
          name: pam-gorttman
