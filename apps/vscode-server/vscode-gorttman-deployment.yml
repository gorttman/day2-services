apiVersion: apps/v1
kind: Deployment
metadata:
  name: vscode-gorttman
  namespace: vscode-server
  labels:
    app: vscode-gorttman
    app.kubernetes.io/name: vscode-server
    app.kubernetes.io/component: dev-tools
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vscode-gorttman
  template:
    metadata:
      labels:
        app: vscode-gorttman
        app.kubernetes.io/name: vscode-server
        app.kubernetes.io/component: dev-tools
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8smaster
      containers:
      - name: vscode-server
        image: ghcr.io/gorttman/vscode-server:latest
        imagePullPolicy: Always
        args:
        - --bind-addr=0.0.0.0:8080
        - --auth=pam
        - --allow-root
        - --base-path=/gorttman
        - /home/gorttman
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: HOME
          value: /home/gorttman
        - name: USER
          value: gorttman
        volumeMounts:
        - name: home
          mountPath: /home/gorttman
        - name: shadow
          mountPath: /etc/shadow
          readOnly: true
        - name: passwd
          mountPath: /etc/passwd
          readOnly: true
        - name: pam-config
          mountPath: /etc/pam.d/code-server
          subPath: code-server
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /gorttman/healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /gorttman/healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: home
        hostPath:
          path: /home/gorttman
          type: Directory
      - name: shadow
        hostPath:
          path: /etc/shadow
          type: File
      - name: passwd
        hostPath:
          path: /etc/passwd
          type: File
      - name: pam-config
        configMap:
          name: pam-gorttman
