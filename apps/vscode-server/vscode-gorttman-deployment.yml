apiVersion: apps/v1
kind: Deployment
metadata:
  name: vscode-gorttman
  namespace: vscode-server
  labels:
    app: vscode-gorttman
    app.kubernetes.io/name: vscode-server
    app.kubernetes.io/component: dev-tools
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vscode-gorttman
  template:
    metadata:
      labels:
        app: vscode-gorttman
        app.kubernetes.io/name: vscode-server
        app.kubernetes.io/component: dev-tools
    spec:
      # Hard nodeSelector removed 2026-08-17: same resolved pinode-01
      # tmpfs constraint as every other app rebalanced this session.
      # Workload-affinity (vscode group) now handles placement.
      containers:
      - name: vscode-server
        image: ghcr.io/gorttman/vscode-server:latest
        imagePullPolicy: Always
        args:
        - --bind-addr=0.0.0.0:8080
        - --auth=none
        # Single-user server over the user's own home dir - the Workspace
        # Trust prompt only blocks extensions without adding any security.
        - --disable-workspace-trust
        - /home/gorttman/.vscode-blank
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: HOME
          value: /home/gorttman
        - name: USER
          value: gorttman
        volumeMounts:
        - name: home
          mountPath: /home/gorttman
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: home
        hostPath:
          path: /home/gorttman
          type: Directory
