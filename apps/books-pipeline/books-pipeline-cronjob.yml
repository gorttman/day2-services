# import/, library/{books,comics}/, and quarantine/ are all
# subdirectories of the single qnap.i3sec.com.au:/books export - one nfs
# volume covers all of them, same as inbox-router's /mnt/books mount.
#
# Memory limit raised 2Gi -> 4Gi 2026-07-23: real runs showed the
# original 2Gi estimate was too low - dmesg confirmed the container's
# cgroup being OOM-killed (memory.oom.group, whole container including
# the main python3 process) by ebook-convert alone hitting ~2GB RSS
# converting some large/complex PDFs, recurring on every single
# 15-minute run for several cycles straight (01:18, 01:33, 01:48) and
# stalling the whole import backlog. Node has ~7.7Gi free at 4 cores/
# 16Gi allocatable, so 4Gi leaves comfortable headroom without starving
# anything else on k8smaster.
#
# Hard nodeSelector removed 2026-08-17: was pinned preemptively for the
# same tmpfs-image-store concern flagged in the prompt-3 image README,
# now resolved (pinode-01 has real persistent storage). Workload-
# affinity (books-pipeline group, affinity-patch.yml) now handles
# placement instead. The 4Gi memory-limit sizing note above was
# originally justified against k8smaster's 16Gi allocatable -
# pinode-01 has ~7.8Gi, still comfortable headroom today but worth
# rechecking if it ever looks pressured during a run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: books-pipeline
  namespace: books-pipeline
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # backoffLimit was 0 (zero retries) until 2026-08-14 - a single
      # transient blip (a "No route to host" connecting to
      # postgres.postgres.svc.cluster.local, seen live) was a hard
      # failure with no second attempt. 3 retries with Kubernetes' own
      # default exponential backoff (10s/20s/40s) is trivial against
      # the 30-minute deadline below.
      backoffLimit: 3
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: books-pipeline
              image: ghcr.io/gorttman/books-pipeline:0.2.0
              command: ["python3", "/app/books_pipeline.py"]
              env:
                - name: PIPELINE_CONFIG
                  value: /etc/books-pipeline/config.yaml
                - name: BOOKS_DB_HOST
                  value: postgres.postgres.svc.cluster.local
                - name: BOOKS_DB_PORT
                  value: "5432"
                - name: BOOKS_DB_NAME
                  value: books
                - name: BOOKS_DB_USER
                  value: books
                - name: BOOKS_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: books-pipeline-secret
                      key: BOOKS_DB_PASSWORD
              volumeMounts:
                - name: script
                  mountPath: /app
                - name: config
                  mountPath: /etc/books-pipeline
                - name: books
                  mountPath: /mnt/books
              resources:
                requests:
                  memory: 512Mi
                  cpu: 250m
                limits:
                  memory: 4Gi
                  cpu: 2000m
          volumes:
            - name: script
              configMap:
                name: books-pipeline-script
                defaultMode: 0555
            - name: config
              configMap:
                name: books-pipeline-config
            - name: books
              nfs:
                server: qnap
                path: /books
