# Lives in the EXISTING books-pipeline namespace, not a new one - it
# needs the exact same Postgres credentials and library mount as
# books_pipeline.py, and Secrets are namespace-scoped, so co-locating
# is what makes direct secret reuse possible at all (confirmed in
# prompt 6: a Secret can't be referenced across namespaces).
#
# Schedule: Sunday 03:00 - a genuine low-traffic window for a homelab
# (weekend, early morning, unlikely anyone's actively uploading or
# reading), and there's no reason for this to run more often than
# weekly - it's a drift check, not a processing pipeline.
#
# This CronJob's pod mounts the SAME books-pipeline-script ConfigMap
# used by the main pipeline CronJob (now three files:
# books_pipeline.py, bookutils.py, reconcile_fingerprints.py) rather
# than a separate one - avoids a third copy of bookutils.py, and the
# unused files are harmless since only reconcile_fingerprints.py is
# invoked here.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: books-fingerprint-reconcile
  namespace: books-pipeline
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # backoffLimit was 0 (zero retries) until 2026-08-14 - same
      # reasoning as books-pipeline-cronjob.yml (shares the same
      # Postgres connection, same class of transient-blip exposure).
      #
      # Cut 3 -> 1 on 2026-09-27. The comment this replaces said 3
      # retries were "trivial against the 15-minute deadline", which is
      # the wrong model: activeDeadlineSeconds is scoped to the whole
      # JOB, not per pod attempt, so every retry spends the SAME budget
      # the first attempt already ate. Once the walk alone approaches
      # the deadline, retries cannot succeed - they just guarantee the
      # job dies as DeadlineExceeded instead of surfacing the real
      # error. One retry still absorbs a transient Postgres blip, which
      # is all the original reasoning actually needed.
      backoffLimit: 1
      # 900 -> 3600 on 2026-09-27. This job had failed three Sundays
      # running (29820540, 29830620, 29840700), each killed at exactly
      # 15:00 - the deadline, not the QNAP incidents of 2026-09-12 and
      # 09-18/21 that it looked like at first.
      #
      # It is NFS-bound, not compute-bound. Measured live on a manual
      # run: PID 1 sat in D state (uninterruptible sleep on I/O) at
      # 1-4 millicores against a 500m limit and 10Mi of RAM, still
      # inside os.walk() past 14 minutes with no output. config.yaml
      # points library_dir at /mnt/books, the share ROOT, which holds
      # 5,253 book directories plus per-book metadata.opf/cover.jpg -
      # order 15,000+ entries stat-ed over NFSv4 at 32KB rsize from a
      # Pi. Historic good runs were 4m39s, 9m12s, then 9m49s; at 9m49s
      # it was already at 65% of the old ceiling, so ordinary library
      # growth was always going to cross it.
      #
      # 3600 buys headroom to observe the true runtime rather than a
      # number clipped by the limit. It treats the symptom: the walk
      # itself is what needs scoping, and raising this again instead of
      # doing that would be the wrong call.
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          # Hard nodeSelector removed 2026-08-17: same resolved tmpfs
          # constraint as books-pipeline-cronjob.yml. Workload-affinity
          # (books-pipeline group) now handles placement.
          containers:
            - name: books-fingerprint-reconcile
              image: ghcr.io/gorttman/books-pipeline:0.2.0
              command: ["python3", "/app/reconcile_fingerprints.py"]
              env:
                - name: PIPELINE_CONFIG
                  value: /etc/books-pipeline/config.yaml
                - name: BOOKS_DB_HOST
                  value: postgres.postgres.svc.cluster.local
                - name: BOOKS_DB_PORT
                  value: "5432"
                - name: BOOKS_DB_NAME
                  value: books
                - name: BOOKS_DB_USER
                  value: books
                - name: BOOKS_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: books-pipeline-secret
                      key: BOOKS_DB_PASSWORD
              volumeMounts:
                - name: script
                  mountPath: /app
                - name: config
                  mountPath: /etc/books-pipeline
                - name: books
                  mountPath: /mnt/books
              resources:
                requests:
                  memory: 128Mi
                  cpu: 50m
                limits:
                  memory: 512Mi
                  cpu: 500m
          volumes:
            - name: script
              configMap:
                name: books-pipeline-script
                defaultMode: 0555
            - name: config
              configMap:
                name: books-pipeline-config
            - name: books
              nfs:
                server: qnap
                path: /books
