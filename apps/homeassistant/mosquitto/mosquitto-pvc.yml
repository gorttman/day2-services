# Retained messages / persistence db. Plain files, low write rate -
# NFS-safe, so the broker can float between nodes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  namespace: homeassistant
  labels:
    app: mosquitto
    app.kubernetes.io/name: mosquitto
    argocd.argoproj.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  # Longhorn since 2026-09-02 - replicated so the data follows the pod
  # instead of pinning it to one node. Migrated with day1-foundation's
  # migration/pvc_migrate.sh; the old nfs-client volume was staged and restored.
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
