apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: homeassistant
  labels:
    app: mosquitto
    app.kubernetes.io/name: mosquitto
    argocd.argoproj.io/managed-by: argocd
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous false
    # generated by the init container from the mosquitto-users
    # SealedSecret (mosquitto_passwd hashes; never stored in git)
    password_file /mosquitto/etc/passwd
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
