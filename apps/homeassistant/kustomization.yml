apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - homeassistant-namespace.yml
  - homeassistant-configmap.yml
  - homeassistant-sealed-secret.yml
  - homeassistant-pvc.yml
  - homeassistant-deployment.yml
  - homeassistant-service.yml
  - homeassistant-ingress.yml
  - homeassistant-public-ingress.yml
  - mosquitto/mosquitto-configmap.yml
  - mosquitto/mosquitto-sealed-secret.yml
  - mosquitto/mosquitto-pvc.yml
  - mosquitto/mosquitto-deployment.yml
  - mosquitto/mosquitto-service.yml

# Switched OFF 2026-10-10 at the user's request, with Paperless, to take load
# off pinode-01 while its heat/Longhorn faults are investigated. Music
# Assistant is a separate app and stays on. Config and data volumes are
# untouched. To turn it back on: delete this patch block and let ArgoCD sync.
patches:
  - target:
      kind: Deployment
      name: "homeassistant|mosquitto"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
