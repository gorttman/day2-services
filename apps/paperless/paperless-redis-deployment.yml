apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-redis
  namespace: paperless
  labels:
    app: paperless-redis
    app.kubernetes.io/name: paperless-redis
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: paperless
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-redis
  template:
    metadata:
      labels:
        app: paperless-redis
        app.kubernetes.io/name: paperless-redis
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        imagePullPolicy: IfNotPresent
        # broker only - task queue state is disposable, no persistence
        args: ["--save", "", "--appendonly", "no"]
        ports:
        - name: redis
          containerPort: 6379
        resources:
          requests:
            memory: 32Mi
            cpu: 25m
          limits:
            memory: 128Mi
            cpu: 250m
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-redis
  namespace: paperless
  labels:
    app: paperless-redis
    app.kubernetes.io/name: paperless-redis
    argocd.argoproj.io/managed-by: argocd
spec:
  selector:
    app: paperless-redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
