apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless
  namespace: paperless
  labels:
    app: paperless
    app.kubernetes.io/name: paperless
    argocd.argoproj.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: "private-ca"
spec:
  # Internal-only: no Cloudflare Tunnel annotation (tunnel path blocked as
  # of 2026-07-04); DNS for this host lives in dns-conf (add post-merge).
  ingressClassName: traefik
  tls:
  - hosts:
    - paperless.i3sec.com.au
    secretName: paperless-tls
  rules:
  - host: paperless.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: paperless
            port:
              number: 8000
