apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - paperless-namespace.yml
  - paperless-sealed-secret.yml
  - paperless-pvcs.yml
  - paperless-redis-deployment.yml
  - paperless-gotenberg-deployment.yml
  - paperless-tika-deployment.yml
  - paperless-hepburn-hook-configmap.yml
  - paperless-deployment.yml
  - paperless-service.yml
  - paperless-ingress.yml
  - paperless-public-ingress.yml
  - paperless-config-seed-cm.yml
  - paperless-config-seed-job.yml

patches:
  - path: affinity-patch.yml
    target:
      kind: Deployment
      name: paperless
  - path: affinity-patch.yml
    target:
      kind: Deployment
      name: gotenberg
  - path: affinity-patch.yml
    target:
      kind: Deployment
      name: tika
  - path: affinity-patch.yml
    target:
      kind: Job
      name: paperless-config-seed

# Was switched OFF 2026-10-10 (heat test), switched back ON 2026-10-11 to
# ingest the backup-drive Documents through inbox/records. To switch it off
# again, add a patch on Deployment "paperless|gotenberg|tika|paperless-redis"
# replacing /spec/replicas with 0.
