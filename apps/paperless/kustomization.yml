apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - paperless-namespace.yml
  - paperless-sealed-secret.yml
  - paperless-pvcs.yml
  - paperless-redis-deployment.yml
  - paperless-gotenberg-deployment.yml
  - paperless-tika-deployment.yml
  - paperless-hepburn-hook-configmap.yml
  - paperless-deployment.yml
  - paperless-service.yml
  - paperless-ingress.yml
  - paperless-public-ingress.yml
  - paperless-config-seed-cm.yml
  - paperless-config-seed-job.yml

patches:
  - path: affinity-patch.yml
    target:
      kind: Deployment
      name: paperless
  - path: affinity-patch.yml
    target:
      kind: Deployment
      name: gotenberg
  - path: affinity-patch.yml
    target:
      kind: Deployment
      name: tika
  - path: affinity-patch.yml
    target:
      kind: Job
      name: paperless-config-seed

# Switched OFF 2026-10-10 at the user's request ("not ingesting, not looking
# for anything"). Documents already filed are safe (PVCs and the database are
# untouched); files sent to inbox/records simply wait in the consume folder.
# To turn it back on: delete this patch block and let ArgoCD sync.
  - target:
      kind: Deployment
      name: "paperless|gotenberg|tika|paperless-redis"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
