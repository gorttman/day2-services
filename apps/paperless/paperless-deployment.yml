apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
  labels:
    app: paperless
    app.kubernetes.io/name: paperless
    app.kubernetes.io/component: webserver
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
        app.kubernetes.io/name: paperless
    spec:
      # Hard pin to k8smaster removed 2026-08-17: pinode-01's k3s root
      # used to be RAM-backed tmpfs (this image - OCR + scipy/numpy deps
      # - is too large to unpack there: "no space left on device" on
      # 2026-08-01 confirmed this wasn't hypothetical), but pinode-01 was
      # rebuilt onto a real, persistent iSCSI-backed root that same night
      # (see day0-infra-build's iscsi_netboot role) - that constraint no
      # longer applies. Soft workload-affinity (affinity-patch.yml) now
      # does the placement job instead: prefers pinode-01, but - unlike
      # this hard pin - still schedules somewhere if pinode-01 is down.
      # The 'paperless' Service otherwise injects PAPERLESS_PORT=tcp://...
      # (legacy Docker service links), which Paperless misreads as its own
      # port config and crashes granian on boot
      enableServiceLinks: false
      containers:
      - name: paperless
        image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        env:
        # consume is a raw NFS export written by a different pod
        # (inbox-router) - inotify only fires for writes made through the
        # same client's local mount, so it never sees a second NFS
        # client's changes. Confirmed live 2026-08-01: a test file sat in
        # consume/ unconsumed with the log showing "Using inotify to
        # watch directory" until this was set. 30s matches Paperless's
        # own docs recommendation for network-share consume dirs.
        - name: PAPERLESS_CONSUMER_POLLING
          value: "30"
        - name: PAPERLESS_REDIS
          value: redis://paperless-redis:6379
        - name: PAPERLESS_DBHOST
          value: postgres.postgres.svc.cluster.local
        - name: PAPERLESS_DBNAME
          value: paperless
        - name: PAPERLESS_DBUSER
          value: paperless
        - name: PAPERLESS_DBPASS
          valueFrom:
            secretKeyRef:
              name: paperless-secret
              key: PAPERLESS_DBPASS
        - name: PAPERLESS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: paperless-secret
              key: PAPERLESS_SECRET_KEY
        - name: PAPERLESS_ADMIN_USER
          value: admin
        - name: PAPERLESS_ADMIN_MAIL
          value: gorttman@i3sec.com.au
        - name: PAPERLESS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: paperless-secret
              key: PAPERLESS_ADMIN_PASSWORD
        - name: PAPERLESS_URL
          value: https://paperless.i3sec.com.au
        # Global default filing scheme for any document that doesn't match
        # a more specific StoragePath rule. Old-style {var} placeholders,
        # not Jinja2 - Paperless auto-converts this one internally
        # (documents/templating/utils.py), whereas StoragePath.path (set
        # by paperless-config-seed-job.yml) uses raw Jinja2 directly. See
        # that job's README note for the actual tag/type/storage-path
        # config this pairs with.
        - name: PAPERLESS_FILENAME_FORMAT
          value: "{document_type}/{created_year}/{correspondent}-{title}"
        # OCR language left at default (eng) - no non-English documents
        # expected.
        # Added 2026-08-05: without these, Office formats (.docx/.xlsx/
        # .pptx/.odt/etc.) can't be consumed at all - see
        # paperless-gotenberg-deployment.yml and
        # paperless-tika-deployment.yml for what these actually are.
        - name: PAPERLESS_TIKA_ENABLED
          value: "1"
        - name: PAPERLESS_TIKA_ENDPOINT
          value: http://tika:9998
        - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
          value: http://gotenberg:3000
        # Added 2026-08-14: several real academic PDFs (ScienceDirect
        # journal articles) failed PDF/A conversion with "Ghostscript PDF/A
        # rendering failed" - root cause was a malformed internal pdfmark
        # (bookmark pointing past the PDF's actual page count), a "soft"
        # error that doesn't affect readable content. ocrmypdf's own error
        # message names this exact setting as the fix.
        - name: PAPERLESS_OCR_USER_ARGS
          value: '{"continue_on_soft_render_error": true}'
        # Added 2026-08-05: the "Property - Hepburn (Home)" tag can't use
        # Paperless's own Tag.match (256-char field, nowhere near enough
        # room for a real provider list) - hepburn-tag-hook.py does the
        # matching instead, called via Paperless's own post-consume hook.
        # See hepburn-providers.yaml (mounted below) and the README's
        # "Property tags: Greenlaw vs Hepburn" section for the full
        # design history.
        - name: PAPERLESS_POST_CONSUME_SCRIPT
          value: /etc/paperless-hooks/hepburn-tag-hook.py
        - name: PAPERLESS_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: paperless-secret
              key: PAPERLESS_API_TOKEN
        volumeMounts:
        - name: data
          mountPath: /usr/src/paperless/data
        - name: media
          mountPath: /usr/src/paperless/media
        - name: consume
          mountPath: /usr/src/paperless/consume
          subPath: consume
        - name: hepburn-hook
          mountPath: /etc/paperless-hooks
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            # Raised 2Gi -> 3Gi 2026-08-14: paperless itself was also
            # OOMKilled repeatedly (42x, dmesg-confirmed) alongside Tika
            # while processing the icloud-raw triage batch - see Tika's own
            # deployment comment for the matching root cause.
            memory: 3Gi
            cpu: "2"
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: paperless-data
      - name: media
        persistentVolumeClaim:
          claimName: paperless-media
      # Raw QNAP export, not a PVC - inbox-router writes into this same
      # export (qnap.i3sec.com.au:/paperless) from its own pod, so this has
      # to be a directly-mounted multi-consumer NFS volume like /books and
      # /inbox, not a single-writer PVC. subPath (in the volumeMount below,
      # not here - not a valid NFSVolumeSource field) selects the consume/
      # subdirectory, same pattern arr-stack uses for its books/import
      # handoff. See day1-foundation/apps/qnap-storage/README.md,
      # "paperless directory" section (2026-08-01).
      - name: consume
        nfs:
          server: qnap
          path: /paperless
      - name: hepburn-hook
        configMap:
          name: paperless-hepburn-hook
          defaultMode: 0555
