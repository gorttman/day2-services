# Added 2026-08-05: Paperless can't consume Office formats (.docx/.xlsx/
# .pptx/.odt etc.) on its own - it needs Gotenberg to convert them to PDF
# first, then OCRs/indexes the PDF like any other document. Six files
# from the i3sec.com.au records batch have been sitting untouched in
# consume/ for exactly this reason - see drive-migration-log.md.
#
# --chromium-disable-routes=true is Gotenberg's own documented
# hardening flag for exactly this setup: only the LibreOffice route is
# actually needed (Office format -> PDF), so the Chromium-based HTML/
# Markdown/URL-to-PDF routes are disabled entirely - smaller attack
# surface, no functional loss for what Paperless calls.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  namespace: paperless
  labels:
    app: gotenberg
    app.kubernetes.io/name: gotenberg
    app.kubernetes.io/component: office-conversion
    app.kubernetes.io/part-of: paperless
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
        app.kubernetes.io/name: gotenberg
    spec:
      # Hard nodeSelector removed 2026-08-17: same resolved tmpfs
      # constraint as paperless itself (LibreOffice + Chromium bundled
      # in this image are not small). Workload-affinity (paperless
      # group, kustomization.yml) now handles placement instead - still
      # co-locates with paperless/tika since they share the same
      # preference, preserving the point of the original note without
      # a hard pin.
      containers:
      - name: gotenberg
        image: docker.io/gotenberg/gotenberg:8.7
        imagePullPolicy: IfNotPresent
        args:
          - "gotenberg"
          - "--chromium-disable-routes=true"
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 1Gi
            cpu: "1"
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
  namespace: paperless
  labels:
    app: gotenberg
    app.kubernetes.io/name: gotenberg
    argocd.argoproj.io/managed-by: argocd
spec:
  selector:
    app: gotenberg
  ports:
  - name: http
    port: 3000
    targetPort: http
