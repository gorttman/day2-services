apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-hepburn-hook
  namespace: paperless
  labels:
    app.kubernetes.io/name: paperless
    app.kubernetes.io/component: hepburn-tag-hook
    app.kubernetes.io/part-of: paperless
    argocd.argoproj.io/managed-by: argocd
data:
  hepburn-providers.yaml: |
    # Provider list for the "Property - Hepburn (Home)" auto-tag, checked by
    # hepburn-tag-hook.py (Paperless post-consume script) against every newly
    # consumed document's content. Unlike the old approach (a regex baked
    # into Paperless's Tag.match field, capped at 256 characters), this file
    # has no size limit - the point of moving matching out of Paperless's
    # built-in mechanism entirely. See apps/paperless/README.md's "Property
    # tags: Greenlaw vs Hepburn" section for the full design history.
    #
    # Update this file when a provider changes or a new one needs adding -
    # no regex to hand-edit, no character budget to fight. Redeploy
    # (ConfigMap + pod restart) for changes to take effect on new documents;
    # already-consumed documents are untouched (same as Paperless's own
    # matching rules always have been - never retroactive).
    #
    # fixed: geography-determined, safe to treat as permanent unless the
    #   address itself changes.
    # electricity / gas: sourced 2026-08-05 from the Essential Services
    #   Commission (Victoria)'s live licensee register
    #   (esc.vic.gov.au/electricity-and-gas/electricity-and-gas-licences-and-exemptions/electricity-and-gas-licences)
    #   - Victoria runs its own retail licensing regime (not the national
    #     AER/Energy Made Easy framework other states use), confirmed by
    #     checking rather than assuming. Includes every currently licensed
    #     retailer at fetch time, not just well-known household brands -
    #     no reason to pre-filter since a name match on an obscure retailer
    #     is still a real signal, and there's no size cost to keeping them.
    # insurance: no equivalent government-run "home/contents insurers"
    #   registry exists (ASIC's AFS licensee register covers all financial
    #   services broadly, not specifically home insurers, and isn't usable
    #   as a curated list) - this list is general knowledge, not fetched
    #   from an authoritative source, and should be treated as lower
    #   confidence than the electricity/gas lists.

    fixed:
      - casey council
      - city of casey
      - south east water

    electricity:
      - agl
      - origin energy
      - energyaustralia
      - red energy
      - momentum energy
      - amber electric
      - discover energy
      - flo energy
      - energy locals
      - flipped energy
      - active utilities retail
      - sec energy
      - cleanpeak energy
      - cep energy retail
      - tesla energy ventures
      - ampol energy
      - hanwha energy retail
      - tilt renewables retail
      - gee power
      - telstra energy
      - potentia energy retail
      - mta energy
      - acacia energy
      - cleantech energy
      - real utilities
      - veolia energy
      - smartestenergy
      - totalenergies
      - ovo energy
      - balance commodities and energy
      - el retail energy
      - m2 energy
      - delta power
      - supa energy

    gas:
      - agl
      - origin energy
      - energyaustralia
      - supa energy
      - perpetual energy
      - flo energy
      - gee power
      - cleantech energy
      - real utilities
      - discover energy
      - ovo energy
      - el retail energy
      - pacific blue retail
      - energy matrix group

    insurance:
      - aami
      - budget direct
      - nrma
      - racv
      - allianz
      - qbe
      - suncorp
      - gio
      - cgu
      - youi
      - real insurance
      - australia post insurance
      - coles insurance
      - woolworths insurance
      - bingle
      - ahm
      - virgin money insurance
      - auto & general

    # Category-word fallback for things without a fixed "provider" to name
    # (tradespeople, mortgage, renovation work).
    generic:
      - home insurance
      - contents insurance
      - mortgage
      - plumber
      - electrician
      - concrete
      - building
      - renovation
      - strata
      - real estate
  hepburn-tag-hook.py: |
    #!/usr/bin/env python3
    """Paperless post-consume script. Tags a document
    "Property - Hepburn (Home)" if its content mentions the address plus a
    known provider/home-domain term. Exists because the equivalent check
    can't live in Paperless's own Tag.match field (256-char limit, far too
    small for a real provider list) - see hepburn-providers.yaml and
    apps/paperless/README.md for the design history.

    Invoked by Paperless itself (PAPERLESS_POST_CONSUME_SCRIPT) after every
    successful consumption, with DOCUMENT_ID set in the environment. Talks
    back to Paperless over its own REST API (PAPERLESS_API_TOKEN) rather
    than assuming Django internals are reachable from a subprocess - the
    documented, supported extension point.
    """
    import os
    import urllib.request
    import urllib.error
    import urllib.parse
    import json

    import yaml

    PAPERLESS_URL = os.environ.get("PAPERLESS_URL_INTERNAL", "http://localhost:8000")
    API_TOKEN = os.environ["PAPERLESS_API_TOKEN"].strip()
    PROVIDERS_PATH = os.environ.get("HEPBURN_PROVIDERS_PATH", "/etc/paperless-hooks/hepburn-providers.yaml")
    TAG_NAME = "Property - Hepburn (Home)"
    ADDRESS_TERM = "hepburn"


    def log(level, msg):
        print(f"[hepburn-tag-hook] {level:5} {msg}", flush=True)


    def api_request(path, method="GET", data=None):
        url = f"{PAPERLESS_URL}{path}"
        body = json.dumps(data).encode() if data is not None else None
        req = urllib.request.Request(url, data=body, method=method)
        req.add_header("Authorization", f"Token {API_TOKEN}")
        if body is not None:
            req.add_header("Content-Type", "application/json")
        with urllib.request.urlopen(req, timeout=15) as resp:
            return json.loads(resp.read())


    def load_provider_terms():
        with open(PROVIDERS_PATH) as f:
            data = yaml.safe_load(f)
        terms = []
        for category in ("fixed", "electricity", "gas", "insurance", "generic"):
            terms.extend(data.get(category, []))
        return terms


    def find_tag_id(name):
        result = api_request(f"/api/tags/?name__iexact={urllib.parse.quote(name)}")
        results = result.get("results", [])
        if not results:
            return None
        return results[0]["id"]


    def main():
        document_id = os.environ.get("DOCUMENT_ID")
        if not document_id:
            log("WARN", "DOCUMENT_ID not set, nothing to do")
            return

        try:
            doc = api_request(f"/api/documents/{document_id}/")
        except urllib.error.URLError as e:
            log("WARN", f"could not fetch document {document_id}: {e}")
            return

        content = (doc.get("content") or "").lower()
        if ADDRESS_TERM not in content:
            return

        terms = load_provider_terms()
        matched_term = next((t for t in terms if t in content), None)
        if not matched_term:
            log("INFO", f"document {document_id} mentions '{ADDRESS_TERM}' but no known provider/home term - not tagging")
            return

        tag_id = find_tag_id(TAG_NAME)
        if tag_id is None:
            log("WARN", f"tag '{TAG_NAME}' does not exist in Paperless - create it first")
            return

        existing_tags = doc.get("tags", [])
        if tag_id in existing_tags:
            log("INFO", f"document {document_id} already tagged, nothing to do")
            return

        api_request(
            f"/api/documents/{document_id}/",
            method="PATCH",
            data={"tags": existing_tags + [tag_id]},
        )
        log("INFO", f"tagged document {document_id} ({doc.get('title')!r}) - matched on '{matched_term}'")


    if __name__ == "__main__":
        main()
