apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  namespace: paperless
  labels:
    app: paperless
    argocd.argoproj.io/managed-by: argocd
spec:
  accessModes: ["ReadWriteOnce"]
  # Longhorn since 2026-09-02 - replicated so the data follows the pod
  # instead of pinning it to one node. Migrated with day1-foundation's
  # migration/pvc_migrate.sh; the old nfs-client volume was staged and restored.
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
# Migrated to the QNAP 2026-08-08 - real financial/legal documents had
# zero backup coverage on nfs-client (k8smaster's own local disk), same
# "wrong home" pattern already fixed for Obsidian's vault. Existing
# content copied and verified before this PVC was repointed - see
# day1-foundation/apps/qnap-storage/README.md's "paperless-media
# migrated to the QNAP" section for the full migration record.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media
  namespace: paperless
  labels:
    app: paperless
    argocd.argoproj.io/managed-by: argocd
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: qnap-static
  volumeName: qnap-paperless
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
# paperless-consume PVC removed 2026-08-01: consume is now a raw QNAP
# export (qnap.i3sec.com.au:/paperless), mounted directly in
# paperless-deployment.yml, not a PVC - inbox-router needs to write into
# the same directory from its own pod, which a single-writer PVC can't
# support. See day1-foundation/apps/qnap-storage/README.md.
