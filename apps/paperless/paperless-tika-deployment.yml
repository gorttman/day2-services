# Added 2026-08-05, alongside gotenberg-deployment.yml - see that file's
# header for why. Tika does the actual text/metadata extraction from the
# PDF Gotenberg produces (and handles some formats natively without
# Gotenberg at all); Paperless calls both together via
# PAPERLESS_TIKA_ENABLED in paperless-deployment.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: paperless
  labels:
    app: tika
    app.kubernetes.io/name: tika
    app.kubernetes.io/component: office-conversion
    app.kubernetes.io/part-of: paperless
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tika
  template:
    metadata:
      labels:
        app: tika
        app.kubernetes.io/name: tika
    spec:
      # Same pinode-01 RAM-tmpfs concern as paperless/gotenberg - JVM
      # base image is not small either.
      nodeSelector:
        kubernetes.io/hostname: k8smaster
      containers:
      - name: tika
        image: docker.io/apache/tika:2.9.2.1-full
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9998
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 512Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: tika
  namespace: paperless
  labels:
    app: tika
    app.kubernetes.io/name: tika
    argocd.argoproj.io/managed-by: argocd
spec:
  selector:
    app: tika
  ports:
  - name: http
    port: 9998
    targetPort: http
