# Idempotent - safe to leave in place and re-run (e.g. after deleting the
# completed Job to force a re-check). get_or_create + explicit field sync
# on every run, same pattern as postgres-books-db-init-configmap.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-config-seed
  namespace: paperless
  labels:
    app: paperless
    app.kubernetes.io/name: paperless
    argocd.argoproj.io/managed-by: argocd
data:
  seed_config.py: |
    from documents.models import Tag, DocumentType, StoragePath, Document
    from documents.matching import match_tags, match_document_types, _split_match

    # matching_algorithm: 0 = None (manual only), 1 = Any word
    #
    # IMPORTANT, found the hard way in TWO separate live incidents
    # (2026-08-04): Paperless's _split_match() only groups a phrase
    # together if it's double-quoted - and COMMAS ARE NOT DELIMITERS AT
    # ALL, they're just more non-whitespace to the tokenizer.
    #   Bug 1: 'vehicle, car service' (no quotes) silently became three
    #   independent any-word triggers - vehicle, car, bare service - and
    #   "service" matched almost every consulting-business document.
    #   Bug 2: even after quoting phrases, leaving the COMMAS in between
    #   them (e.g. '"I Cubed Consultants", ASIC, ...') left a lone ","
    #   as its own token. \b,\b matches any comma sitting between two
    #   digits - i.e. every thousands-separator in a dollar figure - so
    #   a plain financial spreadsheet got tagged Business from comma
    #   noise, nothing to do with the actual keywords.
    # Rule going forward: separate terms with SPACES ONLY, never commas.
    # Wrap multi-word phrases in double quotes. The validation loop
    # below fails the whole job loudly if any match string still
    # produces a token with no alphanumeric characters in it, so this
    # class of bug can't ship silently a third time.
    TAGS = [
        ("Tax", '"tax return" "tax invoice" ATO superannuation', 1),
        ("Property", '"property inspection" lease tenancy Greenlaw Berwick', 1),
        ("Insurance", 'insurance "insurance policy"', 1),
        ("Contracts", "contract agreement", 1),
        ("Business", '"I Cubed Consultants" ASIC ABN "company statement"', 1),
        ("Vehicle", 'vehicle "car service"', 1),
        ("Personal", "", 0),
        ("Correspondence", "", 0),
    ]
    for name, match, algo in TAGS:
        obj, created = Tag.objects.get_or_create(
            name=name,
            defaults={"matching_algorithm": algo, "match": match, "is_insensitive": True},
        )
        if not created:
            obj.matching_algorithm = algo
            obj.match = match
            obj.is_insensitive = True
            obj.save()
        print(("created" if created else "updated"), "tag", name)

    DOCTYPES = [
        ("Invoice", "invoice", 1),
        ("Statement", 'statement "tax return" ATO', 1),
        ("Contract", "contract agreement employment", 1),
        ("Report", '"inspection report" "routine inspection"', 1),
        ("Quote", "quote", 1),
    ]

    # Validate every match string BEFORE touching the database: fail loud
    # and early if any produces a token with no alphanumeric characters
    # (the exact shape of both bugs above - a bare "," or similar).
    class _Check:
        def __init__(self, m):
            self.match = m

    for name, match, algo in TAGS + DOCTYPES:
        if algo != 1 or not match:
            continue
        for token in _split_match(_Check(match)):
            if not any(c.isalnum() for c in token):
                raise ValueError(
                    f"Match string for {name!r} ({match!r}) produces a "
                    f"non-alphanumeric token {token!r} - this will match "
                    f"almost any document. Fix the match string before "
                    f"this job can run.",
                )

    for name, match, algo in DOCTYPES:
        obj, created = DocumentType.objects.get_or_create(
            name=name,
            defaults={"matching_algorithm": algo, "match": match, "is_insensitive": True},
        )
        if not created:
            obj.matching_algorithm = algo
            obj.match = match
            obj.is_insensitive = True
            obj.save()
        print(("created" if created else "updated"), "document type", name)

    # Re-evaluate tags/document type on every EXISTING document against the
    # rules above, not just future consumption - otherwise fixing a bad
    # match string here would only stop new mistakes, not correct
    # documents already mistagged by the old rules. Safe/idempotent to
    # re-run any time the rules change.
    retagged = 0
    for d in Document.objects.all():
        new_tags = set(match_tags(d, classifier=None))
        old_tags = set(d.tags.all())
        if new_tags != old_tags:
            d.tags.set(new_tags)
            retagged += 1
        new_types = match_document_types(d, classifier=None)
        new_type = new_types[0] if new_types else None
        if d.document_type != new_type:
            d.document_type = new_type
            d.save()
    print("re-evaluated tags/types on", Document.objects.count(), "documents,", retagged, "had tag changes")

    # Jinja2 syntax (raw, no conversion) - contrast with
    # PAPERLESS_FILENAME_FORMAT in paperless-deployment.yml, which uses the
    # old {var} style. matching_algorithm 0 here means this StoragePath
    # only applies where manually assigned - the actual global default for
    # every other document is PAPERLESS_FILENAME_FORMAT, using equivalent
    # placeholders in the old syntax. Kept in sync by hand; no code shares
    # the template string between the two because the syntaxes differ.
    template = (
        "{{ document.document_type.name|default('Unsorted') }}/"
        "{{ document.created|datetime('%Y') }}/"
        "{{ document.correspondent.name|default('Unknown') }}-{{ document.title }}"
    )
    sp, created = StoragePath.objects.get_or_create(
        name="Default filing",
        defaults={"path": template, "matching_algorithm": 0},
    )
    if not created:
        sp.path = template
        sp.save()
    print(("created" if created else "updated"), "storage path")
    print("DONE")
