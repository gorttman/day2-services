# The *arr pod: Sonarr, Radarr, Whisparr, LazyLibrarian and the wiring
# reconciler. Normal cluster egress (no VPN). Download clients and indexers
# (qBittorrent, SABnzbd, Prowlarr) run in the separate `arr-vpn` pod
# (arr-vpn-deployment.yml) behind gluetun and are reached over their Services.
#
# SPLIT 2026-10-18 from one eleven-container pod. Why: the VPN peer rotates
# often and a Radarr OOM used to restart gluetun too; every restart bounced
# every app and re-ran Radarr's start-up queue check. Now a VPN change touches
# only arr-vpn, and a Radarr restart touches only this pod.
#
# This pod must run on the same node as arr-vpn: the reconciler and the
# LazyLibrarian seeder read prowlarr-config / sabnzbd-config (Longhorn, single
# node) for API keys.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arr-stack
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: arr-stack
    app.kubernetes.io/component: media-automation
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  # RWO local-path volumes: old pod must release them before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arr-stack
  template:
    metadata:
      labels:
        app: arr-stack
        app.kubernetes.io/name: arr-stack
        app.kubernetes.io/component: media-automation
    spec:
      # No node pin. Every config PVC is Longhorn (2 replicas, one per node), so
      # the pod can run on either node. gluetun needs the tun module, which
      # day0-infra-build prep_prerequisites (sysctl.yml) persists on all k3s nodes.
      # To give the stack a preferred home instead, wire in
      # components/workload-affinity/ and add arr-stack to
      # day1-foundation/ansible/label-nodes.yml.
      enableServiceLinks: false  # SONARR_PORT etc. would collide with app config
      # arr-stack-rbac.yml - narrow (delete pods, this namespace only),
      # needed by the config-seed sidecars to self-restart the pod after
      # patching a config file the already-running process won't re-read
      # on its own. Restarts the WHOLE shared pod, not just one app - see
      # that file's own comment for why that's an accepted, one-time cost.
      serviceAccountName: arr-stack-seed
      # NOT shareProcessNamespace: true - tried it 2026-08-25 to let
      # qbittorrent-config-seed signal qBittorrent's own process
      # directly, but every container here is a linuxserver.io image
      # built on s6-overlay, and s6-overlay-suexec refuses to run
      # unless it's genuinely PID 1 of its own namespace ("fatal: can
      # only run as pid 1") - sharing the PID namespace broke every
      # single app in this pod simultaneously, not just qBittorrent.
      # See qbittorrent-config-init's own comment for the actual fix
      # (an initContainer, not a sidecar sharing PIDs).
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: arr-vpn
              topologyKey: kubernetes.io/hostname
      containers:
      - name: sonarr
        image: lscr.io/linuxserver/sonarr:4.0.19
        imagePullPolicy: IfNotPresent
        env:
        - {name: PUID, value: "1000"}
        - {name: PGID, value: "1000"}
        - {name: TZ, value: Australia/Sydney}
        ports:
        - {name: sonarr, containerPort: 8989, protocol: TCP}
        volumeMounts:
        - name: sonarr-config
          mountPath: /config
        - name: media
          mountPath: /tv
          subPath: tv
        # Same mount SABnzbd itself uses (arr-stack-deployment.yml's
        # sabnzbd container, subPath: downloads) - without this, Sonarr's
        # container has zero visibility into completed downloads at all
        # (its /tv mount is scoped to that one subdirectory), so it can't
        # import anything SABnzbd finishes. Confirmed live 2026-08-08:
        # Radarr's own UI surfaced this exact gap ("Download client
        # SABnzbd places downloads in ... but Radarr cannot see this
        # directory") once SABnzbd's own download_dir/complete_dir got
        # fixed from a bad relative path to the real /downloads mount.
        - name: media
          mountPath: /downloads
          subPath: downloads
        readinessProbe:
          tcpSocket: {port: 8989}
          initialDelaySeconds: 20
          periodSeconds: 15
        resources:
          requests: {memory: "128Mi", cpu: "50m"}
          limits: {memory: "1Gi", cpu: "1000m"}
      - name: radarr
        image: lscr.io/linuxserver/radarr:6.2.1
        imagePullPolicy: IfNotPresent
        env:
        - {name: PUID, value: "1000"}
        - {name: PGID, value: "1000"}
        - {name: TZ, value: Australia/Sydney}
        ports:
        - {name: radarr, containerPort: 7878, protocol: TCP}
        volumeMounts:
        - name: radarr-config
          mountPath: /config
        - name: media
          mountPath: /movies
          subPath: movies
        # Low-priority bulk catalog content - separate root folder so it
        # never mixes with the main /movies library. Quality-capped via
        # the Bulk SD-720p profile (wiring/arr-stack-wiring-config.yml).
        - name: media
          mountPath: /movies-bulk
          subPath: movies-bulk
        # See the same mount on the sonarr container above for why -
        # identical reasoning, Radarr needs it for the same reason.
        - name: media
          mountPath: /downloads
          subPath: downloads
        readinessProbe:
          tcpSocket: {port: 7878}
          initialDelaySeconds: 20
          periodSeconds: 15
        # 2Gi: 1Gi OOM-killed Radarr 122x in 35h (2026-10-16) on start-up bursts
        # (queue re-check + failed imports). Cache fills any limit, so the cap
        # only matters for real spikes.
        resources:
          requests: {memory: "512Mi", cpu: "50m"}
          limits: {memory: "2Gi", cpu: "1000m"}
      # bazarr and jdownloader2 REMOVED 2026-08-08 - deliberate, not a
      # gap. See README's "Removed: bazarr and jdownloader2" section for
      # the full reasoning. Left commented rather than deleted: both
      # worked fine, this is a preference/scope call, not a bug - easy
      # to bring back if that changes. Their PVCs, Services, and
      # Ingresses are similarly still defined but excluded from the top-
      # level kustomization.yml, not deleted, for the same reason.
      # - name: bazarr
      #   image: lscr.io/linuxserver/bazarr:1.6.0
      #   imagePullPolicy: IfNotPresent
      #   env:
      #   - {name: PUID, value: "1000"}
      #   - {name: PGID, value: "1000"}
      #   - {name: TZ, value: Australia/Sydney}
      #   ports:
      #   - {name: bazarr, containerPort: 6767, protocol: TCP}
      #   volumeMounts:
      #   - name: bazarr-config
      #     mountPath: /config
      #   readinessProbe:
      #     tcpSocket: {port: 6767}
      #     initialDelaySeconds: 20
      #     periodSeconds: 15
      #   resources:
      #     requests: {memory: "128Mi", cpu: "50m"}
      #     limits: {memory: "512Mi", cpu: "1000m"}
      # - name: jdownloader2
      #   image: jlesage/jdownloader-2:v26.03.1
      #   imagePullPolicy: IfNotPresent
      #   env:
      #   - {name: USER_ID, value: "1000"}
      #   - {name: GROUP_ID, value: "1000"}
      #   - {name: TZ, value: Australia/Sydney}
      #   ports:
      #   - {name: jdownloader2, containerPort: 5800, protocol: TCP}
      #   volumeMounts:
      #   - name: jdownloader2-config
      #     mountPath: /config
      #   readinessProbe:
      #     tcpSocket: {port: 5800}
      #     initialDelaySeconds: 30
      #     periodSeconds: 15
      #   resources:
      #     requests: {memory: "256Mi", cpu: "50m"}
      #     limits: {memory: "1Gi", cpu: "1000m"}
      - name: lazylibrarian
        image: lscr.io/linuxserver/lazylibrarian:a7c70e36-ls311
        imagePullPolicy: IfNotPresent
        env:
        - {name: PUID, value: "1000"}
        - {name: PGID, value: "1000"}
        - {name: TZ, value: Australia/Sydney}
        envFrom:
        - secretRef:
            name: lazylibrarian-secrets   # sealed placeholder - see lazylibrarian-sealed-secret.yml
        ports:
        - {name: lazylibrarian, containerPort: 5299, protocol: TCP}
        volumeMounts:
        - name: lazylibrarian-config
          mountPath: /config
        # books-pipeline's own import/ mount - post-processing writes
        # here directly, no per-book Author/Title folder (see
        # lazylibrarian-config-seed.yml). Never mounts the /books root -
        # this subPath is structurally the only thing this container
        # can see of the books export.
        - name: books-import
          mountPath: /import
          subPath: import
        readinessProbe:
          tcpSocket: {port: 5299}
          initialDelaySeconds: 20
          periodSeconds: 15
        resources:
          requests: {memory: "128Mi", cpu: "50m"}
          limits: {memory: "512Mi", cpu: "1000m"}
      # Whisparr (added 2026-08-27). A Radarr fork for adult content:
      # Radarr itself cannot do this job at all, because TMDB flags adult
      # titles out of the API responses Radarr consumes - it is an
      # upstream data limitation, not a setting.
      #
      # Image is ghcr.io/hotio/whisparr, not lscr.io/linuxserver like the
      # rest of this stack - LinuxServer publishes no whisparr image.
      # hotio's is multi-arch and confirmed to include linux/arm64
      # (checked against the registry manifest before adding, since an
      # amd64-only image would never schedule on these Pis).
      #
      # Tag is v3, NOT latest. hotio publishes two distinct Whisparr
      # generations under this one repo: `latest` is V2 (Sonarr-based,
      # Series/Episode data model - tracking a studio as a "Site" with
      # individual "Scenes", the way Sonarr tracks a show's episodes).
      # `v3` is the Radarr-based Movie data model - search and add by
      # title directly, same workflow as Radarr. Found live 2026-08-27:
      # `latest` only offered "Add Site", no title search at all, which
      # is unusable without already knowing specific studio names.
      # Confirmed `v3` also publishes linux/arm64 before switching.
      #
      # Deliberately mounts ONLY /movies-private, never /movies or
      # /movies-bulk. That containment is the point: anything this
      # container imports lands exclusively in the restricted Jellyfin
      # library, so it cannot leak into a library the LG/TV account can
      # see. Do not add the other media subPaths here.
      - name: whisparr
        image: ghcr.io/hotio/whisparr:v3
        imagePullPolicy: IfNotPresent
        env:
        - {name: PUID, value: "1000"}
        - {name: PGID, value: "1000"}
        - {name: TZ, value: Australia/Sydney}
        ports:
        - {name: whisparr, containerPort: 6969, protocol: TCP}
        volumeMounts:
        - name: whisparr-config
          mountPath: /config
        - name: media
          mountPath: /movies-private
          subPath: movies-private
        # Same shared download area every other arr uses, so imports are
        # a server-side rename rather than a cross-filesystem copy.
        - name: media
          mountPath: /downloads
          subPath: downloads
        readinessProbe:
          tcpSocket: {port: 6969}
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests: {memory: "128Mi", cpu: "50m"}
          limits: {memory: "768Mi", cpu: "1000m"}
      # Patches lazylibrarian's config.ini (DESTINATION_DIR, per-book
      # foldering off, and - 2026-07-23 - the SABnzbd download-client
      # section, reading arr-stack-wiring-config.yml the same way the
      # arr-wiring-reconciler sidecar does below) once it exists, then
      # self-restarts the pod so lazylibrarian picks it up - see
      # lazylibrarian-config-seed.yml for the full reasoning. Verified
      # 2026-07-23 against a live instance: the DESTINATION_DIR/
      # DESTINATION_COPY/EBOOK_DEST_FOLDER keys are correct as written.
      - name: lazylibrarian-config-seed
        image: lscr.io/linuxserver/lazylibrarian:a7c70e36-ls311
        imagePullPolicy: IfNotPresent
        command: ["python3", "/app/seed_config.py"]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        env:
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - {name: PROWLARR_HOST, value: prowlarr}
        volumeMounts:
        - name: lazylibrarian-config
          mountPath: /config
        - name: lazylibrarian-config-seed-script
          mountPath: /app
        - name: arr-stack-wiring-config
          mountPath: /wiring-config
          readOnly: true
        - name: arr-stack-wiring-secret
          mountPath: /wiring-secret
          readOnly: true
        - name: sabnzbd-config
          mountPath: /app-config/sabnzbd
          readOnly: true
        - name: prowlarr-config
          mountPath: /app-config/prowlarr
          readOnly: true
        resources:
          requests: {memory: "32Mi", cpu: "10m"}
          limits: {memory: "128Mi", cpu: "200m"}
      - name: arr-wiring-reconciler
        image: lscr.io/linuxserver/lazylibrarian:a7c70e36-ls311
        imagePullPolicy: IfNotPresent
        command: ["python3", "/app/reconcile.py"]
        env:
        - {name: RECONCILER_ROLE, value: arr}
        - {name: PROWLARR_HOST, value: prowlarr}
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: arr-wiring-reconciler-script
          mountPath: /app
        - name: arr-stack-wiring-config
          mountPath: /wiring-config
          readOnly: true
        - name: arr-stack-wiring-secret
          mountPath: /wiring-secret
          readOnly: true
        - name: qbittorrent-auth
          mountPath: /qbit-auth
          readOnly: true
        - name: sonarr-config
          mountPath: /app-config/sonarr
          readOnly: true
        - name: radarr-config
          mountPath: /app-config/radarr
          readOnly: true
        - name: prowlarr-config
          mountPath: /app-config/prowlarr
          readOnly: true
        - name: sabnzbd-config
          mountPath: /app-config/sabnzbd
          readOnly: true
        - name: whisparr-config
          mountPath: /app-config/whisparr
          readOnly: true
        resources:
          requests: {memory: "32Mi", cpu: "10m"}
          limits: {memory: "128Mi", cpu: "200m"}
      volumes:
      - name: sonarr-config
        persistentVolumeClaim: {claimName: sonarr-config}
      - name: radarr-config
        persistentVolumeClaim: {claimName: radarr-config}
      - name: prowlarr-config
        persistentVolumeClaim: {claimName: prowlarr-config}
      - name: sabnzbd-config
        persistentVolumeClaim: {claimName: sabnzbd-config}
      # bazarr-config/jdownloader2-config volumes removed with their
      # PVCs (see the container blocks above) - a Pod spec referencing
      # a PVC that no longer exists blocks scheduling entirely, not
      # just the two removed containers. Confirmed live 2026-08-08:
      # leaving these in after ArgoCD pruned the PVCs stuck the whole
      # arr-stack pod at 0/8 Pending.
      - name: lazylibrarian-config
        persistentVolumeClaim: {claimName: lazylibrarian-config}
      - name: whisparr-config
        persistentVolumeClaim: {claimName: whisparr-config}
      - name: lazylibrarian-config-seed-script
        configMap:
          name: lazylibrarian-config-seed-script
      - name: arr-wiring-reconciler-script
        configMap:
          name: arr-stack-wiring-reconciler-script
      # Whole-directory mount, deliberately not subPath - subPath
      # ConfigMaps don't hot-reload on this cluster (known gotcha, see
      # the Pi-hole DNS ConfigMap), a plain directory mount does via
      # kubelet's normal sync, which is what lets a wiring-config edit
      # take effect without a pod restart.
      - name: arr-stack-wiring-config
        configMap:
          name: arr-stack-wiring-config
      - name: arr-stack-wiring-secret
        secret:
          secretName: arr-stack-wiring-secret
      # Same raw-nfs-volume-not-PVC pattern books-pipeline/calibre-web
      # already use for /books - multiple containers in this one pod
      # need it (lazylibrarian, sabnzbd), so a 1:1-bound static PV/PVC
      # doesn't fit. subPath: import is applied per-volumeMount above,
      # not here - this volume itself can see the whole /books export,
      # each mount just restricts its own view.
      - name: books-import
        nfs:
          server: qnap
          path: /books
      # 2026-08-05: single /media export, not separate /media +
      # /downloads exports - subPath below splits it into tv/, movies/,
      # downloads/complete, downloads/incomplete per container. Because
      # every subPath here is a bind-mount of this one NFS mount, they
      # share the same underlying filesystem device from Sonarr/Radarr's
      # point of view, so importing a finished download is a real
      # server-side NFS rename, not a cross-export copy+delete (the old
      # separate /downloads export would have forced the copy path).
      # Directories pre-created on the QNAP export (tv/, movies/,
      # downloads/{complete,incomplete}, owner 1000:1000, mode 2775 -
      # matches PUID/PGID on every container here) since none of these
      # apps create their own root-folder tree on first boot. The old
      # standalone /downloads export is now unused by this deployment -
      # not deleted on the QNAP side, just no longer referenced here.
      - name: media
        nfs:
          server: qnap
          path: /media

      - name: qbittorrent-auth
        secret:
          secretName: qbittorrent-auth
