# One shared pod: containers in a pod share a network namespace, which is
# the Kubernetes equivalent of docker-compose `network_mode:
# service:gluetun`. Every arr app's traffic - inbound (Services/Ingress
# target this pod) and outbound - passes through Gluetun's namespace;
# Gluetun's firewall only admits the UI ports listed in
# FIREWALL_INPUT_PORTS and only routes egress via the VPN tunnel.
#
# LIVE 2026-07-22: real PIA (Private Internet Access) OpenVPN
# credentials sealed over gluetun-vpn - switched from Mullvad/WireGuard
# the same day, user already had a PIA subscription. OpenVPN, not
# WireGuard, deliberately: gluetun's native PIA support is OpenVPN-only.
# Disabled 2026-07-17 through 2026-07-22 on a placeholder VPN secret
# (gluetun CrashLoopBackOff, replicas: 0) - re-enabled once real creds
# landed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arr-stack
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: arr-stack
    app.kubernetes.io/component: media-automation
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  # RWO local-path volumes: old pod must release them before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arr-stack
  template:
    metadata:
      labels:
        app: arr-stack
        app.kubernetes.io/name: arr-stack
        app.kubernetes.io/component: media-automation
    spec:
      # workload-affinity: when the arr stack gets a preferred home, wire
      # in the patch template from components/workload-affinity/ and add
      # arr-stack to day1-foundation/ansible/label-nodes.yml.
      #
      # Hard pin to k8smaster, tied to the local-path placeholder (same
      # reasoning as apps/jellyfin). Half of the original reason is
      # resolved: pinode-01's k3s agent dir is real persistent storage
      # now (2026-08-16/17), not a 4G RAM tmpfs, so image-size eviction
      # is no longer a concern. What's NOT resolved: every PVC here
      # (sonarr/radarr/prowlarr/sabnzbd/lazylibrarian/etc.) is still
      # storageClassName: local-path, which is node-local - swapping
      # this to a soft workload-affinity preference would be unsafe, not
      # just imprecise, since a reschedule onto the other node would
      # silently create fresh empty volumes there instead of failing
      # loudly. Stays hard-pinned until these PVCs move to NFS-backed
      # storage (qnap-static/nfs-client, matching immich/paperless) -
      # that's the actual "storage swap" this needs, still open.
      nodeSelector:
        kubernetes.io/hostname: k8smaster
      enableServiceLinks: false  # SONARR_PORT etc. would collide with app config
      # arr-stack-rbac.yml - narrow (delete pods, this namespace only),
      # needed by the config-seed sidecars to self-restart the pod after
      # patching a config file the already-running process won't re-read
      # on its own. Restarts the WHOLE shared pod, not just one app - see
      # that file's own comment for why that's an accepted, one-time cost.
      serviceAccountName: arr-stack-seed
      # NOT shareProcessNamespace: true - tried it 2026-08-25 to let
      # qbittorrent-config-seed signal qBittorrent's own process
      # directly, but every container here is a linuxserver.io image
      # built on s6-overlay, and s6-overlay-suexec refuses to run
      # unless it's genuinely PID 1 of its own namespace ("fatal: can
      # only run as pid 1") - sharing the PID namespace broke every
      # single app in this pod simultaneously, not just qBittorrent.
      # See qbittorrent-config-init's own comment for the actual fix
      # (an initContainer, not a sidecar sharing PIDs).
      initContainers:
      # Seeds/patches qBittorrent.conf BEFORE qBittorrent's own container
      # ever starts, not as a sidecar racing against an already-running
      # process. qBittorrent (Qt/QSettings) holds its whole config in
      # memory for its process lifetime and flushes it back to disk
      # wholesale on graceful shutdown - a sidecar editing the file while
      # qBittorrent is already running gets silently reverted the moment
      # anything restarts it (confirmed live 2026-08-25: this caused an
      # infinite ~30s whole-pod restart loop, since qBittorrent's own
      # shutdown handler kept overwriting the sidecar's edit before the
      # freshly-recreated pod even finished coming up). An initContainer
      # sidesteps this entirely: it runs to completion and exits before
      # qBittorrent's container starts, so there's no in-memory state to
      # race against, and it re-runs (idempotently) on every pod restart
      # for any reason, not just the first one - no signaling, no shared
      # PID namespace, no extra RBAC needed.
      - name: qbittorrent-config-init
        image: lscr.io/linuxserver/lazylibrarian:a7c70e36-ls311
        imagePullPolicy: IfNotPresent
        command: ["python3", "/app/seed_config.py"]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: qbittorrent-config
          mountPath: /config
        - name: qbittorrent-config-seed-script
          mountPath: /app
        resources:
          requests: {memory: "32Mi", cpu: "10m"}
          limits: {memory: "128Mi", cpu: "200m"}
      containers:
      - name: gluetun
        image: qmcgaw/gluetun:v3.41.1
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        envFrom:
        # Split 2026-08-07: non-secret peer fields (endpoint IP/port,
        # server pubkey, assigned address) in the plain gluetun-config
        # ConfigMap; only WIREGUARD_PRIVATE_KEY stays in the Sealed
        # Secret. See gluetun-config.yml / gluetun-sealed-secret.yml.
        - configMapRef:
            name: gluetun-config
        - secretRef:
            name: gluetun-vpn
        env:
        - name: TZ
          value: Australia/Sydney
        # OpenVPN to PIA (UDP 1197, UDP 8080, TCP 501 - all tried) never
        # completes a handshake from this network: UDP got "TLS key
        # negotiation failed", TCP got a hard connect timeout, both
        # against multiple real server IPs across two regions. Basic
        # outbound connectivity is fine (control test to 1.1.1.1:443
        # succeeds from the same pod network) and PIA's own account API
        # (token issuance) works over plain HTTPS, so this points at
        # something in this network path specifically dropping OpenVPN
        # traffic, not a PIA-side or credentials problem - consistent
        # with the user's own prior experience of PIA working fine on
        # this same network segment via WireGuard (PIA's app default).
        # Switched 2026-07-23 to WireGuard via gluetun's "custom"
        # provider (native PIA WireGuard support doesn't exist in
        # gluetun - upstream confirms this is still work in progress).
        # The peer registration (keypair + PIA's /addKey API) is now
        # kept fresh automatically by the vpn-healer CronJob
        # (../vpn-healer/) - see gluetun-sealed-secret.yml for the full
        # rundown and what to do if a manual re-registration is ever
        # needed instead.
        # Admit the arr UIs through gluetun's firewall (inbound)
        - name: FIREWALL_INPUT_PORTS
          value: "8989,7878,9696,8080,8090,6767,5800,5299"
        # Keep cluster traffic (DNS, kubelet probes, pod/svc CIDRs) off the VPN
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: "10.42.0.0/16,10.43.0.0/16"
        volumeMounts:
        - name: dev-net-tun
          mountPath: /dev/net/tun
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      - name: sonarr
        image: lscr.io/linuxserver/sonarr:4.0.19
        imagePullPolicy: IfNotPresent
        env:
        - {name: PUID, value: "1000"}
        - {name: PGID, value: "1000"}
        - {name: TZ, value: Australia/Sydney}
        ports:
        - {name: sonarr, containerPort: 8989, protocol: TCP}
        volumeMounts:
        - name: sonarr-config
          mountPath: /config
        - name: media
          mountPath: /tv
          subPath: tv
        # Same mount SABnzbd itself uses (arr-stack-deployment.yml's
        # sabnzbd container, subPath: downloads) - without this, Sonarr's
        # container has zero visibility into completed downloads at all
        # (its /tv mount is scoped to that one subdirectory), so it can't
        # import anything SABnzbd finishes. Confirmed live 2026-08-08:
        # Radarr's own UI surfaced this exact gap ("Download client
        # SABnzbd places downloads in ... but Radarr cannot see this
        # directory") once SABnzbd's own download_dir/complete_dir got
        # fixed from a bad relative path to the real /downloads mount.
        - name: media
          mountPath: /downloads
          subPath: downloads
        readinessProbe:
          tcpSocket: {port: 8989}
          initialDelaySeconds: 20
          periodSeconds: 15
        resources:
          requests: {memory: "128Mi", cpu: "50m"}
          limits: {memory: "1Gi", cpu: "1000m"}
      - name: radarr
        image: lscr.io/linuxserver/radarr:6.2.1
        imagePullPolicy: IfNotPresent
        env:
        - {name: PUID, value: "1000"}
        - {name: PGID, value: "1000"}
        - {name: TZ, value: Australia/Sydney}
        ports:
        - {name: radarr, containerPort: 7878, protocol: TCP}
        volumeMounts:
        - name: radarr-config
          mountPath: /config
        - name: media
          mountPath: /movies
          subPath: movies
        # Low-priority bulk catalog content - separate root folder so it
        # never mixes with the main /movies library. Quality-capped via
        # the Bulk SD-720p profile (wiring/arr-stack-wiring-config.yml).
        - name: media
          mountPath: /movies-bulk
          subPath: movies-bulk
        # See the same mount on the sonarr container above for why -
        # identical reasoning, Radarr needs it for the same reason.
        - name: media
          mountPath: /downloads
          subPath: downloads
        readinessProbe:
          tcpSocket: {port: 7878}
          initialDelaySeconds: 20
          periodSeconds: 15
        resources:
          requests: {memory: "128Mi", cpu: "50m"}
          limits: {memory: "1Gi", cpu: "1000m"}
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:2.4.0
        imagePullPolicy: IfNotPresent
        env:
        - {name: PUID, value: "1000"}
        - {name: PGID, value: "1000"}
        - {name: TZ, value: Australia/Sydney}
        ports:
        - {name: prowlarr, containerPort: 9696, protocol: TCP}
        volumeMounts:
        - name: prowlarr-config
          mountPath: /config
        readinessProbe:
          tcpSocket: {port: 9696}
          initialDelaySeconds: 20
          periodSeconds: 15
        resources:
          requests: {memory: "128Mi", cpu: "50m"}
          limits: {memory: "512Mi", cpu: "1000m"}
      - name: sabnzbd
        image: lscr.io/linuxserver/sabnzbd:5.0.4
        imagePullPolicy: IfNotPresent
        env:
        - {name: PUID, value: "1000"}
        - {name: PGID, value: "1000"}
        - {name: TZ, value: Australia/Sydney}
        ports:
        - {name: sabnzbd, containerPort: 8080, protocol: TCP}
        volumeMounts:
        - name: sabnzbd-config
          mountPath: /config
        - name: media
          mountPath: /downloads
          subPath: downloads
        # books-pipeline's own import/ mount, direct - the "books"
        # category's completed-dir points here (Config > Categories >
        # books > Folder/Path = /books-import) so a finished books
        # download lands exactly where books-pipeline already scans, no
        # extra hop. Set live by arr-wiring-reconciler via SABnzbd's own
        # config API (mode=set_config&section=categories), not a blind
        # INI patch - sabnzbd.ini's category section uses ConfigObj's
        # nested [[section]] format, which configparser can't safely
        # round-trip, but SABnzbd's own API sidesteps that entirely.
        - name: books-import
          mountPath: /books-import
          subPath: import
        readinessProbe:
          tcpSocket: {port: 8080}
          initialDelaySeconds: 20
          periodSeconds: 15
        resources:
          requests: {memory: "128Mi", cpu: "50m"}
          limits: {memory: "1Gi", cpu: "1500m"}
      # Solves Cloudflare "Just a moment" JS challenges on behalf of
      # Prowlarr indexers tagged for it. Confirmed necessary live
      # 2026-08-26: 1337x.to returned HTTP 403 with `cf-mitigated:
      # challenge` and a challenge-platform body through this stack's
      # PIA exit IP - a solvable interstitial, NOT an IP ban ("Sorry,
      # you have been blocked"), which is the distinction that makes
      # FlareSolverr the right tool rather than a dead end.
      #
      # In-pod deliberately, not its own Deployment: it shares gluetun's
      # network namespace like everything else here, so tracker traffic
      # leaves via the VPN. Running it outside the pod would send
      # torrent-tracker requests out the bare WAN IP, which defeats the
      # reason this whole stack sits behind a VPN.
      #
      # Real memory limit, not BestEffort: this runs a headless Chromium
      # and k8smaster has OOM history (see apps/traefik and the argocd
      # controller). 1Gi ceiling with a modest request so it can't
      # balloon during a solve and evict its podmates.
      - name: flaresolverr
        image: flaresolverr/flaresolverr:v3.5.0
        imagePullPolicy: IfNotPresent
        env:
        - {name: LOG_LEVEL, value: info}
        - {name: TZ, value: Australia/Sydney}
        - {name: PORT, value: "8191"}
        ports:
        - {name: flaresolverr, containerPort: 8191, protocol: TCP}
        readinessProbe:
          tcpSocket: {port: 8191}
          initialDelaySeconds: 25
          periodSeconds: 15
        resources:
          requests: {memory: "256Mi", cpu: "50m"}
          limits: {memory: "1Gi", cpu: "1000m"}
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:5.2.3
        imagePullPolicy: IfNotPresent
        env:
        - {name: PUID, value: "1000"}
        - {name: PGID, value: "1000"}
        - {name: TZ, value: Australia/Sydney}
        - {name: WEBUI_PORT, value: "8090"}
        ports:
        - {name: qbittorrent, containerPort: 8090, protocol: TCP}
        volumeMounts:
        - name: qbittorrent-config
          mountPath: /config
        # Same shared /downloads mount every other download client here
        # uses - a finished torrent import is a plain rename for
        # Sonarr/Radarr, not a cross-filesystem copy.
        - name: media
          mountPath: /downloads
          subPath: downloads
        readinessProbe:
          tcpSocket: {port: 8090}
          initialDelaySeconds: 20
          periodSeconds: 15
        resources:
          requests: {memory: "128Mi", cpu: "50m"}
          limits: {memory: "1Gi", cpu: "1000m"}
      # bazarr and jdownloader2 REMOVED 2026-08-08 - deliberate, not a
      # gap. See README's "Removed: bazarr and jdownloader2" section for
      # the full reasoning. Left commented rather than deleted: both
      # worked fine, this is a preference/scope call, not a bug - easy
      # to bring back if that changes. Their PVCs, Services, and
      # Ingresses are similarly still defined but excluded from the top-
      # level kustomization.yml, not deleted, for the same reason.
      # - name: bazarr
      #   image: lscr.io/linuxserver/bazarr:1.6.0
      #   imagePullPolicy: IfNotPresent
      #   env:
      #   - {name: PUID, value: "1000"}
      #   - {name: PGID, value: "1000"}
      #   - {name: TZ, value: Australia/Sydney}
      #   ports:
      #   - {name: bazarr, containerPort: 6767, protocol: TCP}
      #   volumeMounts:
      #   - name: bazarr-config
      #     mountPath: /config
      #   readinessProbe:
      #     tcpSocket: {port: 6767}
      #     initialDelaySeconds: 20
      #     periodSeconds: 15
      #   resources:
      #     requests: {memory: "128Mi", cpu: "50m"}
      #     limits: {memory: "512Mi", cpu: "1000m"}
      # - name: jdownloader2
      #   image: jlesage/jdownloader-2:v26.03.1
      #   imagePullPolicy: IfNotPresent
      #   env:
      #   - {name: USER_ID, value: "1000"}
      #   - {name: GROUP_ID, value: "1000"}
      #   - {name: TZ, value: Australia/Sydney}
      #   ports:
      #   - {name: jdownloader2, containerPort: 5800, protocol: TCP}
      #   volumeMounts:
      #   - name: jdownloader2-config
      #     mountPath: /config
      #   readinessProbe:
      #     tcpSocket: {port: 5800}
      #     initialDelaySeconds: 30
      #     periodSeconds: 15
      #   resources:
      #     requests: {memory: "256Mi", cpu: "50m"}
      #     limits: {memory: "1Gi", cpu: "1000m"}
      - name: lazylibrarian
        image: lscr.io/linuxserver/lazylibrarian:a7c70e36-ls311
        imagePullPolicy: IfNotPresent
        env:
        - {name: PUID, value: "1000"}
        - {name: PGID, value: "1000"}
        - {name: TZ, value: Australia/Sydney}
        envFrom:
        - secretRef:
            name: lazylibrarian-secrets   # sealed placeholder - see lazylibrarian-sealed-secret.yml
        ports:
        - {name: lazylibrarian, containerPort: 5299, protocol: TCP}
        volumeMounts:
        - name: lazylibrarian-config
          mountPath: /config
        # books-pipeline's own import/ mount - post-processing writes
        # here directly, no per-book Author/Title folder (see
        # lazylibrarian-config-seed.yml). Never mounts the /books root -
        # this subPath is structurally the only thing this container
        # can see of the books export.
        - name: books-import
          mountPath: /import
          subPath: import
        readinessProbe:
          tcpSocket: {port: 5299}
          initialDelaySeconds: 20
          periodSeconds: 15
        resources:
          requests: {memory: "128Mi", cpu: "50m"}
          limits: {memory: "512Mi", cpu: "1000m"}
      # Patches lazylibrarian's config.ini (DESTINATION_DIR, per-book
      # foldering off, and - 2026-07-23 - the SABnzbd download-client
      # section, reading arr-stack-wiring-config.yml the same way the
      # arr-wiring-reconciler sidecar does below) once it exists, then
      # self-restarts the pod so lazylibrarian picks it up - see
      # lazylibrarian-config-seed.yml for the full reasoning. Verified
      # 2026-07-23 against a live instance: the DESTINATION_DIR/
      # DESTINATION_COPY/EBOOK_DEST_FOLDER keys are correct as written.
      - name: lazylibrarian-config-seed
        image: lscr.io/linuxserver/lazylibrarian:a7c70e36-ls311
        imagePullPolicy: IfNotPresent
        command: ["python3", "/app/seed_config.py"]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        env:
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: lazylibrarian-config
          mountPath: /config
        - name: lazylibrarian-config-seed-script
          mountPath: /app
        - name: arr-stack-wiring-config
          mountPath: /wiring-config
          readOnly: true
        - name: arr-stack-wiring-secret
          mountPath: /wiring-secret
          readOnly: true
        - name: sabnzbd-config
          mountPath: /app-config/sabnzbd
          readOnly: true
        - name: prowlarr-config
          mountPath: /app-config/prowlarr
          readOnly: true
        resources:
          requests: {memory: "32Mi", cpu: "10m"}
          limits: {memory: "128Mi", cpu: "200m"}
      # Applies arr-stack-wiring-config.yml's SABnzbd category and
      # Sonarr/Radarr download-client wiring live, via each app's own
      # REST API - unlike lazylibrarian-config-seed above, no pod
      # restart needed (confirmed live 2026-07-23 against the real
      # running apps, not guessed from docs - see
      # arr-stack-wiring-reconciler-script.yml's module docstring for
      # the full mechanism). Loops every 5 minutes, re-reading the
      # mounted wiring-config each pass, so an indexer/category change
      # is a commit away with no pod restart and no manual UI step.
      - name: arr-wiring-reconciler
        image: lscr.io/linuxserver/lazylibrarian:a7c70e36-ls311
        imagePullPolicy: IfNotPresent
        command: ["python3", "/app/reconcile.py"]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: arr-wiring-reconciler-script
          mountPath: /app
        - name: arr-stack-wiring-config
          mountPath: /wiring-config
          readOnly: true
        - name: arr-stack-wiring-secret
          mountPath: /wiring-secret
          readOnly: true
        - name: sonarr-config
          mountPath: /app-config/sonarr
          readOnly: true
        - name: radarr-config
          mountPath: /app-config/radarr
          readOnly: true
        - name: prowlarr-config
          mountPath: /app-config/prowlarr
          readOnly: true
        - name: sabnzbd-config
          mountPath: /app-config/sabnzbd
          readOnly: true
        resources:
          requests: {memory: "32Mi", cpu: "10m"}
          limits: {memory: "128Mi", cpu: "200m"}
      volumes:
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      - name: sonarr-config
        persistentVolumeClaim: {claimName: sonarr-config}
      - name: radarr-config
        persistentVolumeClaim: {claimName: radarr-config}
      - name: prowlarr-config
        persistentVolumeClaim: {claimName: prowlarr-config}
      - name: sabnzbd-config
        persistentVolumeClaim: {claimName: sabnzbd-config}
      - name: qbittorrent-config
        persistentVolumeClaim: {claimName: qbittorrent-config}
      - name: qbittorrent-config-seed-script
        configMap:
          name: qbittorrent-config-seed-script
      # bazarr-config/jdownloader2-config volumes removed with their
      # PVCs (see the container blocks above) - a Pod spec referencing
      # a PVC that no longer exists blocks scheduling entirely, not
      # just the two removed containers. Confirmed live 2026-08-08:
      # leaving these in after ArgoCD pruned the PVCs stuck the whole
      # arr-stack pod at 0/8 Pending.
      - name: lazylibrarian-config
        persistentVolumeClaim: {claimName: lazylibrarian-config}
      - name: lazylibrarian-config-seed-script
        configMap:
          name: lazylibrarian-config-seed-script
      - name: arr-wiring-reconciler-script
        configMap:
          name: arr-stack-wiring-reconciler-script
      # Whole-directory mount, deliberately not subPath - subPath
      # ConfigMaps don't hot-reload on this cluster (known gotcha, see
      # the Pi-hole DNS ConfigMap), a plain directory mount does via
      # kubelet's normal sync, which is what lets a wiring-config edit
      # take effect without a pod restart.
      - name: arr-stack-wiring-config
        configMap:
          name: arr-stack-wiring-config
      - name: arr-stack-wiring-secret
        secret:
          secretName: arr-stack-wiring-secret
      # Same raw-nfs-volume-not-PVC pattern books-pipeline/calibre-web
      # already use for /books - multiple containers in this one pod
      # need it (lazylibrarian, sabnzbd), so a 1:1-bound static PV/PVC
      # doesn't fit. subPath: import is applied per-volumeMount above,
      # not here - this volume itself can see the whole /books export,
      # each mount just restricts its own view.
      - name: books-import
        nfs:
          server: qnap
          path: /books
      # 2026-08-05: single /media export, not separate /media +
      # /downloads exports - subPath below splits it into tv/, movies/,
      # downloads/complete, downloads/incomplete per container. Because
      # every subPath here is a bind-mount of this one NFS mount, they
      # share the same underlying filesystem device from Sonarr/Radarr's
      # point of view, so importing a finished download is a real
      # server-side NFS rename, not a cross-export copy+delete (the old
      # separate /downloads export would have forced the copy path).
      # Directories pre-created on the QNAP export (tv/, movies/,
      # downloads/{complete,incomplete}, owner 1000:1000, mode 2775 -
      # matches PUID/PGID on every container here) since none of these
      # apps create their own root-folder tree on first boot. The old
      # standalone /downloads export is now unused by this deployment -
      # not deleted on the QNAP side, just no longer referenced here.
      - name: media
        nfs:
          server: qnap
          path: /media
