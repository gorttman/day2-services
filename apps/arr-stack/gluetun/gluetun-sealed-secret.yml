# PIA (Private Internet Access) via WireGuard, custom-provider mode -
# switched from OpenVPN 2026-07-23. gluetun has no native WireGuard
# support for PIA (confirmed against the gluetun wiki: "For now, native
# support cannot be added, this is a slow work in progress"), because
# PIA doesn't publish static WireGuard configs - it requires dynamically
# registering a fresh keypair against a chosen server via PIA's own
# WireGuard REST API. OpenVPN was tried first and ruled out: UDP 1197,
# UDP 8080, and TCP 501 all failed (TLS handshake timeout / hard
# connect timeout) against multiple real PIA server IPs across two
# regions, while a plain HTTPS control test from the same pod network
# succeeded - see arr-stack-deployment.yml's gluetun container comment
# for the full diagnostic history. WireGuard was chosen instead because
# the user has previously used PIA successfully on this same network
# segment via WireGuard (PIA's own app's default protocol), consistent
# with something in this network path specifically blocking OpenVPN.
#
# The peer registration was originally generated 2026-07-23 using PIA's
# own documented flow (github.com/pia-foss/manual-connections): POST
# username/password for a token, GET the live server list and pick an
# "aus" (AU Sydney) server, generate an X25519 keypair, GET /addKey to
# register it. Full rundown of that flow, and the two corrections found
# against it (multipart/form-data token auth, not Basic; PIA retiring a
# pinned server after ~12 days with no distinguishing error - see
# ../vpn-healer/reconcile_vpn.py's module docstring), is preserved in
# git history on this file from before the 2026-08-07 split below.
#
# SPLIT 2026-08-07: only WIREGUARD_PRIVATE_KEY is a genuine secret - it's
# the client half of the keypair, equivalent to a password. Everything
# else the old single gluetun-vpn secret held (VPN_SERVICE_PROVIDER,
# VPN_TYPE, WIREGUARD_ENDPOINT_IP/_PORT, WIREGUARD_PUBLIC_KEY - the PIA
# SERVER's own public key, WIREGUARD_ADDRESSES) isn't secret by nature
# (server pubkey is meant to be public; endpoint IP/port come straight
# from PIA's own public server list) and moved to the plain
# gluetun-config ConfigMap - see that file's own comment. This also
# unblocked the vpn-healer CronJob (../vpn-healer/): its automated
# rotations now only need to reseal one field instead of six, and the
# git history for a rotation is a readable ConfigMap diff instead of an
# opaque encryptedData blob every time.
#
# This peer is tied to one specific PIA server and doesn't expire on
# its own, but WILL go stale if PIA ever retires/rotates that server -
# vpn-healer (../vpn-healer/reconcile_vpn.py) checks for this
# automatically (~every 15 min: is the configured endpoint IP still in
# PIA's live server list, plus a gluetun-log restart-loop fallback) and
# re-registers + reseals + patches + restarts + commits on its own. No
# manual PIA account steps needed even for a from-scratch registration -
# see pia-account-credentials-sealed-secret.yml for where the account
# credentials live. Manual rotation (if ever needed): repeat the 4-step
# flow above, then `kubeseal --raw --scope strict --namespace arr-stack
# --name gluetun-vpn --from-file=WIREGUARD_PRIVATE_KEY=/dev/stdin`,
# replacing the encryptedData line below - same pattern as every other
# sealed secret in this repo.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: gluetun-vpn
  namespace: arr-stack
spec:
  encryptedData:
    WIREGUARD_PRIVATE_KEY: 
  template:
    metadata:
      creationTimestamp: null
      name: gluetun-vpn
      namespace: arr-stack
    type: Opaque
