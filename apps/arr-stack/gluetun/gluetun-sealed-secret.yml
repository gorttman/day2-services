# Switched from Mullvad/WireGuard to PIA/OpenVPN (2026-07-22) - user
# already has a PIA subscription, no need for a second VPN service.
# OpenVPN, not WireGuard, deliberately: gluetun's native PIA support is
# OpenVPN-only. WireGuard for PIA in gluetun needs a third-party config-
# generation tool and is documented upstream as work-in-progress -
# not worth the fragility for this.
#
# All five values below are sealed PLACEHOLDERS, same treatment as
# every other secret in this repo (lazylibrarian-secrets, the original
# Mullvad version of this file). VPN_SERVICE_PROVIDER and VPN_TYPE are
# real/correct as sealed ("private internet access" / "openvpn") -
# only OPENVPN_USER, OPENVPN_PASSWORD, and SERVER_REGIONS need your
# real values. To seal them for real:
#
#   echo -n '<pia-username>' | sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubeseal --raw \
#     --scope strict --namespace arr-stack --name gluetun-vpn
#
# ...and paste the output over OPENVPN_USER's value below (same command
# per field, swapping the input and the target key). Repeat for
# OPENVPN_PASSWORD and SERVER_REGIONS.
#
# SERVER_REGIONS: check gluetun's own PIA region list (gluetun-wiki,
# "Private Internet Access" page) for the exact valid string - not
# guessed here, don't assume a name without checking it against that
# list first.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: gluetun-vpn
  namespace: arr-stack
spec:
  encryptedData:
    VPN_SERVICE_PROVIDER: 
    VPN_TYPE: 
    OPENVPN_USER: 
    OPENVPN_PASSWORD: 
    SERVER_REGIONS: 
  template:
    metadata:
      creationTimestamp: null
      name: gluetun-vpn
      namespace: arr-stack
    type: Opaque
