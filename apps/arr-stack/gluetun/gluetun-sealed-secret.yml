# PIA (Private Internet Access) via WireGuard, custom-provider mode -
# switched from OpenVPN 2026-07-23. gluetun has no native WireGuard
# support for PIA (confirmed against the gluetun wiki: "For now, native
# support cannot be added, this is a slow work in progress"), because
# PIA doesn't publish static WireGuard configs - it requires dynamically
# registering a fresh keypair against a chosen server via PIA's own
# WireGuard REST API. OpenVPN was tried first and ruled out: UDP 1197,
# UDP 8080, and TCP 501 all failed (TLS handshake timeout / hard
# connect timeout) against multiple real PIA server IPs across two
# regions, while a plain HTTPS control test from the same pod network
# succeeded - see arr-stack-deployment.yml's gluetun container comment
# for the full diagnostic history. WireGuard was chosen instead because
# the user has previously used PIA successfully on this same network
# segment via WireGuard (PIA's own app's default protocol), consistent
# with something in this network path specifically blocking OpenVPN.
#
# The peer registration below was generated 2026-07-23 using PIA's own
# documented flow (github.com/pia-foss/manual-connections):
#   1. POST username/password to
#      https://www.privateinternetaccess.com/api/client/v2/token
#      to get a short-lived auth token.
#   2. GET https://serverlist.piaservers.net/vpninfo/servers/v6 and pick
#      a WireGuard server from the "aus" (AU Sydney) region.
#   3. Generate an X25519 keypair locally (this is exactly what
#      `wg genkey`/`wg pubkey` produce - raw Curve25519 keys, base64
#      encoded; no `wg` binary needed, Python's `cryptography` package
#      does the same maths).
#   4. GET https://<server-cn>:1337/addKey?pt=<token>&pubkey=<pubkey>
#      (TLS verified against PIA's own CA, pia-foss/manual-connections'
#      ca.rsa.4096.crt) to register the public key and receive back the
#      server's own WireGuard public key, the assigned tunnel IP
#      (peer_ip), and the port to connect on.
#
# Fields, mapped to gluetun's "custom" WireGuard provider:
#   VPN_SERVICE_PROVIDER = custom
#   VPN_TYPE              = wireguard
#   WIREGUARD_ENDPOINT_IP   = the PIA server's real IP (117.120.9.43,
#                             AU Sydney) - gluetun's custom provider
#                             requires a literal IP here, not a hostname
#   WIREGUARD_ENDPOINT_PORT = server_port from the /addKey response
#   WIREGUARD_PUBLIC_KEY    = server_key from the /addKey response (the
#                             PIA server's own WireGuard public key)
#   WIREGUARD_PRIVATE_KEY   = our generated private key
#   WIREGUARD_ADDRESSES     = peer_ip from the /addKey response + /32
#
# This registration does not expire on its own the way the 24h auth
# token does, but it IS tied to one specific server (117.120.9.43) -
# if that server is ever retired/rotated by PIA, the tunnel will need
# a fresh /addKey registration against a currently-listed server. To
# rotate: repeat the 4 steps above (real credentials: PIA account
# p4239118, password known to the user), then reseal each field with
# kubeseal --raw --scope strict --namespace arr-stack --name
# gluetun-vpn, replacing its line below - same pattern as every other
# multi-field sealed secret in this repo. No manual/UI PIA account
# steps are required - the whole flow above is script-only.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: gluetun-vpn
  namespace: arr-stack
spec:
  encryptedData:
    VPN_SERVICE_PROVIDER: 
    VPN_TYPE: 
    WIREGUARD_ENDPOINT_IP: 
    WIREGUARD_ENDPOINT_PORT: 
    WIREGUARD_PUBLIC_KEY: 
    WIREGUARD_PRIVATE_KEY: 
    WIREGUARD_ADDRESSES: 
  template:
    metadata:
      creationTimestamp: null
      name: gluetun-vpn
      namespace: arr-stack
    type: Opaque
