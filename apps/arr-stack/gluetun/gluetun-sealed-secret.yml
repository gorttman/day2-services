# PIA (Private Internet Access) via OpenVPN - switched from Mullvad/
# WireGuard 2026-07-22, user already had a PIA subscription. OpenVPN,
# not WireGuard, deliberately: gluetun's native PIA support is
# OpenVPN-only. WireGuard for PIA in gluetun needs a third-party
# config-generation tool and is documented upstream as work-in-progress
# - not worth the fragility for this.
#
# All five values are sealed for real (2026-07-22) - nothing left as a
# placeholder. SERVER_REGIONS is "AU Melbourne" - changed same-day from
# the original "AU Sydney" (both confirmed real, valid gluetun/PIA
# region names) purely as a diagnostic: both UDP (ports 1197 and 8080)
# and TCP (port 501) OpenVPN attempts against AU Sydney servers timed
# out/failed TLS handshake, so this tests whether it's that specific
# region's server pool or something broader. See arr-stack/README.md
# for the outcome. Rotate any one value later with kubeseal --raw
# (scope strict, namespace arr-stack, name gluetun-vpn), replacing only
# its line below - same pattern as every other multi-field sealed
# secret in this repo.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: gluetun-vpn
  namespace: arr-stack
spec:
  encryptedData:
    VPN_SERVICE_PROVIDER: 
    VPN_TYPE: 
    OPENVPN_USER: 
    OPENVPN_PASSWORD: 
    SERVER_REGIONS: 
  template:
    metadata:
      creationTimestamp: null
      name: gluetun-vpn
      namespace: arr-stack
    type: Opaque
