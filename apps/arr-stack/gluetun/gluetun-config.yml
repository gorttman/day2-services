# AirVPN via native WireGuard support - switched from PIA 2026-08-27.
# PIA's custom-provider WireGuard peer gave basic connectivity but
# rejected outbound UDP for BitTorrent/DHT signalling specifically
# (UDP-transport tracker announces got status=4 "Operation not
# permitted" while HTTP-transport trackers on the same torrents failed
# with ordinary DNS/timeout errors - the Linux errno signature of an
# upstream ICMP "administratively prohibited" REJECT, not reproducible
# as a fault in our own infrastructure). AirVPN is one of gluetun's
# natively-supported WireGuard providers (no custom-provider workaround
# needed, unlike PIA) and has a strong community reputation for
# P2P/BitTorrent use specifically. Full investigation history preserved
# in git log on this file from before the switch.
#
# WIREGUARD_PRIVATE_KEY/WIREGUARD_PRESHARED_KEY live in the Sealed
# Secret (gluetun-sealed-secret.yml) - both are genuine secrets.
# WIREGUARD_ADDRESSES is the tunnel IP AirVPN assigned this device;
# meaningless without the private key, so it's fine here in plain text
# (same non-secret/secret split the old PIA config used).
#
# Generated via AirVPN's Client Area Config Generator: Advanced mode
# OFF, single generic WireGuard entry - the key pair is region/
# server-agnostic (works against any AirVPN relay); gluetun's own
# server list plus SERVER_COUNTRIES picks the actual endpoint at
# connect time, not anything baked into the generated file. To rotate/
# regenerate: download a fresh config from the Config Generator, then
# run seal-airvpn-credentials.sh with its path.
#
# SERVER_COUNTRIES intentionally left unset for now - AirVPN has no
# Australia presence (confirmed against gluetun's own docs, 2026-08-27),
# so this needs live testing to find the fastest/most reliable region
# before pinning one down.
#
# FIREWALL_VPN_INPUT_PORTS: the forwarded port reserved in AirVPN's
# Client Area Ports section (30449, 2026-08-27) - this is the
# tunnel-side admit list (distinct from FIREWALL_INPUT_PORTS on the
# gluetun container itself, which is the LAN-side list admitting the
# arr UIs). qBittorrent's own listen_port is pinned to match via
# wiring.yml's qbittorrent.preferences - see reconcile_qbittorrent_preferences.
# One port is enough: qBittorrent is the only app in this pod doing
# inbound P2P: SABnzbd/Usenet is client-initiated only, and the arr web
# UIs go through FIREWALL_INPUT_PORTS, not this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gluetun-config
  namespace: arr-stack
  labels:
    app: arr-stack
    argocd.argoproj.io/managed-by: argocd
data:
  VPN_SERVICE_PROVIDER: "airvpn"
  VPN_TYPE: "wireguard"
  WIREGUARD_ADDRESSES: "10.184.42.16/32,fd7d:76ee:e68f:a993:e332:411e:62d6:74c9/128"
  WIREGUARD_MTU: "1320"
  WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: "25s"
  FIREWALL_VPN_INPUT_PORTS: "30449"
