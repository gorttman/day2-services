# Non-secret half of the PIA WireGuard peer registration - split out of
# gluetun-vpn (see gluetun-sealed-secret.yml) 2026-08-07 so the
# vpn-healer CronJob's automated peer rotations show up as plain,
# readable git diffs instead of an opaque re-encrypted blob every time.
#
# None of these fields are actually secret:
#   WIREGUARD_ENDPOINT_IP/_PORT - come straight out of PIA's own public
#     server list (serverlist.piaservers.net/vpninfo/servers/v6);
#     anyone can fetch the same list.
#   WIREGUARD_PUBLIC_KEY - this is the PIA SERVER's public key, not
#     ours; public keys are meant to be shared by definition.
#   WIREGUARD_ADDRESSES - the tunnel IP PIA assigned us; meaningless
#     without the private key, which stays in gluetun-vpn (Sealed
#     Secret).
#
# Kept in a plain directory-mount ConfigMap (not subPath - subPath
# ConfigMaps don't hot-reload on this cluster, same gotcha as the
# Pi-hole DNS ConfigMap), consumed via gluetun's `envFrom` alongside
# the trimmed gluetun-vpn Secret.
#
# WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: found set to 0 (disabled)
# 2026-08-09, very likely the REAL root cause of the "peer keeps going
# stale every ~15min" pattern vpn-healer had been papering over since
# it was built - without a keepalive, the tunnel sends nothing during
# idle moments, and this network's router (or any NAT in the path)
# silently drops the UDP connection-tracking entry after some timeout,
# breaking the tunnel regardless of which PIA server it points at -
# indistinguishable from "server went bad" to gluetun's own
# healthcheck, and indistinguishable to vpn-healer's own detection,
# which is exactly why rotating to a "fresh" server never durably
# fixed anything: the problem was never the server. 25s is WireGuard's
# own standard recommendation for exactly this NAT-traversal case -
# comfortably shorter than virtually any router's UDP timeout.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gluetun-config
  namespace: arr-stack
  labels:
    app: arr-stack
    argocd.argoproj.io/managed-by: argocd
data:
  VPN_SERVICE_PROVIDER: "custom"
  VPN_TYPE: "wireguard"
  WIREGUARD_ENDPOINT_IP: "220.158.199.253"
  WIREGUARD_ENDPOINT_PORT: "1337"
  WIREGUARD_PUBLIC_KEY: "UTf4NshHveyQZoak/VgsXwTBMwthi6qSlA9SQu208hA="
  WIREGUARD_ADDRESSES: "10.11.1.175/32"
  WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: "25s"
