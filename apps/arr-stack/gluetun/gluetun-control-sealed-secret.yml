# Control-server API key for gluetun (auth file + the same key for the vpn-healer).
# Lets the healer swap the VPN peer in place via port 8000 instead of deleting
# the pod. Keys: config.toml -> gluetun /gluetun/auth/config.toml, apikey -> healer.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: gluetun-control
  namespace: arr-stack
spec:
  encryptedData:
    apikey: 
    config.toml: 
  template:
    metadata:
      creationTimestamp: null
      name: gluetun-control
      namespace: arr-stack
    type: Opaque
