# Config volume on Longhorn (2 replicas). The internal SQLite DB lives here, so it
# must never sit directly on NFS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: sonarr
    argocd.argoproj.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  # Longhorn since 2026-09-02 - replicated so the data follows the pod
  # instead of pinning it to one node. Migrated with day1-foundation's
  # migration/pvc_migrate.sh; the old local-path volume was staged and restored.
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
