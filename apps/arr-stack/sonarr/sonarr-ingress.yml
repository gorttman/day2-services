apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: sonarr
    argocd.argoproj.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # Internal-only: no Cloudflare Tunnel annotation; DNS in dns-conf.
  # Backend is the shared arr-stack pod, i.e. traffic enters through
  # Gluetun's network namespace and firewall (FIREWALL_INPUT_PORTS).
  ingressClassName: traefik
  tls:
  - hosts:
    - sonarr.i3sec.com.au
    secretName: sonarr-tls
  rules:
  - host: sonarr.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sonarr
            port:
              number: 8989
