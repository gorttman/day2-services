# Internal-only, same as every other arr-stack ingress: no Cloudflare
# Tunnel annotation, DNS lives in dns-conf.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: movie-status
  namespace: arr-stack
  labels: {app: arr-stack, app.kubernetes.io/name: movie-status, argocd.argoproj.io/managed-by: argocd}
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - movie-status.i3sec.com.au
    secretName: movie-status-tls
  rules:
  - host: movie-status.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: movie-status
            port:
              number: 80
