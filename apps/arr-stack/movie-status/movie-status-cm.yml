# Server and page for the on-demand status board. See movie_status.py's
# docstring for what it shows and why it is self-hosted.
#
# A literal ConfigMap, not a configMapGenerator: the hashed name would
# roll the pod on every edit, but kustomize here does not rewrite the
# Deployment's volume reference to the hashed name, which leaves the pod
# mounting a ConfigMap that does not exist. The reload is handled inside
# the script instead - see watch_self().
apiVersion: v1
kind: ConfigMap
metadata:
  name: movie-status
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: movie-status
    argocd.argoproj.io/managed-by: argocd
data:
  movie_status.py: |
    #!/usr/bin/env python3
    """One on-demand status board for the whole media pipeline.

    Same shape as backup-dashboard and for the same reason: every request
    re-reads live state and renders fresh, rather than a CronJob writing a
    static file whose age you then have to trust. Nothing is cached and
    nothing is scheduled - the Refresh button is the whole mechanism.

    Self-hosted rather than a claude.ai artifact because the data lives on
    the LAN: the *arrs are only reachable in-cluster, and a hosted page
    cannot fetch them. That decision was already made once for
    backup-dashboard.

    Five panels, in the order you actually want them:

      health    is anything stuck right now - the stall watcher's own
                verdict, plus whatever the *arrs have flagged as needing a
                person. Stuck queue items never clear themselves.
      movies    /movies is the upgrade backfill: every title already has a
                file and the job is replacing bad copies. /movies-bulk is
                the midday-movie library: titles with no copy at all,
                driven by hand, so it gets a measured rate and no fake ETA.
      tv        legacy XviD/.avi episodes - the ones with no hardware
                decoder on the TV, which force Jellyfin to transcode.
      jobs      what runs unattended, when it last ran, and whether it has
                retired itself.

    Deliberately does NOT ask qBittorrent anything: its WebUI refuses
    unauthenticated calls from outside its own pod (LocalHostAuth=false
    covers only genuine 127.0.0.1, so the ClusterIP Service answers 403).
    The *arr queues carry protocol per item, which gives the torrent-vs-
    usenet split without needing those credentials, and measures what
    actually matters - whether work is finishing.
    """
    import datetime
    import json
    import os
    import re
    import ssl
    import sys
    import threading
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    import xml.etree.ElementTree as ET
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    ARRS = {
        "radarr":   ("/app-config/radarr/config.xml",   "http://radarr.arr-stack.svc.cluster.local:7878"),
        "sonarr":   ("/app-config/sonarr/config.xml",   "http://sonarr.arr-stack.svc.cluster.local:8989"),
        "whisparr": ("/app-config/whisparr/config.xml", "http://whisparr.arr-stack.svc.cluster.local:6969"),
    }
    SAB_INI = os.environ.get("SAB_INI", "/app-config/sabnzbd/sabnzbd.ini")
    SAB_URL = os.environ.get("SAB_URL", "http://sabnzbd.arr-stack.svc.cluster.local:8080")
    MAIN_ROOT = os.environ.get("MAIN_ROOT", "/movies")
    BULK_ROOT = os.environ.get("BULK_ROOT", "/movies-bulk")
    TAG_LABEL = os.environ.get("TAG_LABEL", "upgrade-searched")
    MAIN_BATCH = int(os.environ.get("MAIN_BATCH", "25"))
    BULK_BATCH = int(os.environ.get("BULK_BATCH", "50"))
    BULK_STATE = os.environ.get("BULK_STATE", "/state/bulk_backfill_state.json")
    STALL_STATE = os.environ.get("STALL_STATE", "/vault/inbox/media-pipeline-alerts/.stall_state.json")
    CRONJOBS = [c for c in os.environ.get(
        "CRONJOBS", "radarr-upgrade-search,radarr-upgrade-digest,download-stall-watch").split(",") if c]
    PORT = int(os.environ.get("PORT", "8080"))
    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    HISTORY_PAGES = int(os.environ.get("HISTORY_PAGES", "12"))
    LEGACY_CODECS = {"xvid", "divx", "mpeg4", "msmpeg4", "wmv3", "vc1"}
    BULK_PROFILE = int(os.environ.get("BULK_PROFILE", "8"))
    SEARCH_BATCH = int(os.environ.get("SEARCH_BATCH", "50"))
    STUCK_HOURS = int(os.environ.get("STUCK_HOURS", "24"))
    # Tiering copied from ~/gm-dev/bulk_backfill.py, which remains the
    # source of truth - the button exists so a batch can be run without a
    # terminal, not to become a second, subtly different implementation.
    # Drama/Thriller first, Romance demoted because it is the house style
    # and dominates; Christmas matched on text since TMDb has no such genre.
    CORE_GENRES = {"Drama", "Thriller"}
    # Leading \b only, not trailing: "the holidays" and "Christmases"
    # need to still match. advent gets a negative lookahead instead of a
    # boundary - a bare \badvent\b still matched inside "adventure" and
    # "adventurous" often enough to misclassify Finding Nemo, Harry
    # Potter and 40+ other clearly-not-Christmas titles (found 2026-09-12
    # chasing why upgrade-search's own copy of this pattern was giving
    # Hallmark precedence to the wrong movies). "holiday" itself stays
    # genuinely ambiguous - also a surname and English's word for a
    # vacation - so a rare non-Christmas title still slips in; not worth
    # chasing further with more regex guessing.
    XMAS = re.compile(r"\bchristmas|\bholiday|\bsanta|\bnoel|\byule|\bxmas|advent(?!ur)|"
                      r"\bmistletoe|\bnutcracker|\bsnowman|\bst\.? nick", re.I)


    def tier_of(mv):
        if XMAS.search((mv.get("title") or "") + " " + (mv.get("overview") or "")):
            return 4
        genres = set(mv.get("genres") or [])
        core, romance = bool(CORE_GENRES & genres), "Romance" in genres
        if core and not romance:
            return 1
        if core:
            return 2
        if romance:
            return 3
        return 5


    def arr(app, path):
        config, base = ARRS[app]
        key = ET.parse(config).getroot().findtext("ApiKey")
        req = urllib.request.Request("%s/api/v3/%s" % (base, path), headers={"X-Api-Key": key})
        with urllib.request.urlopen(req, timeout=90) as r:
            raw = r.read().decode()
        return json.loads(raw) if raw.strip() else {}


    def arr_post(app, path, body):
        config, base = ARRS[app]
        key = ET.parse(config).getroot().findtext("ApiKey")
        req = urllib.request.Request(
            "%s/api/v3/%s" % (base, path), data=json.dumps(body).encode(), method="POST",
            headers={"X-Api-Key": key, "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=90) as r:
            raw = r.read().decode()
        return json.loads(raw) if raw.strip() else {}


    def arr_delete(app, path):
        config, base = ARRS[app]
        key = ET.parse(config).getroot().findtext("ApiKey")
        req = urllib.request.Request("%s/api/v3/%s" % (base, path), method="DELETE",
                                     headers={"X-Api-Key": key})
        with urllib.request.urlopen(req, timeout=90) as r:
            return r.status


    def arr_queue(app):
        records, page = [], 1
        while True:
            q = arr(app, "queue?page=%d&pageSize=200" % page)
            records += q.get("records", [])
            if len(records) >= q.get("totalRecords", 0) or not q.get("records"):
                return records
            page += 1


    def cutoff_index(profile):
        pos, cut = {}, None
        for i, item in enumerate(profile["items"]):
            if item.get("quality"):
                pos[item["quality"]["id"]] = i
                if item["quality"]["id"] == profile["cutoff"]:
                    cut = i
            else:
                if item.get("id") == profile["cutoff"]:
                    cut = i
                for sub in item.get("items", []):
                    pos[sub["quality"]["id"]] = i
        return pos, cut


    def cronjob_state(name):
        try:
            with open(SA_DIR + "/token") as f:
                token = f.read().strip()
            with open(SA_DIR + "/namespace") as f:
                ns = f.read().strip()
            req = urllib.request.Request(
                "https://kubernetes.default.svc/apis/batch/v1/namespaces/%s/cronjobs/%s" % (ns, name),
                headers={"Authorization": "Bearer " + token})
            with urllib.request.urlopen(
                    req, context=ssl.create_default_context(cafile=SA_DIR + "/ca.crt"), timeout=15) as r:
                cj = json.load(r)
            return {"name": name, "found": True,
                    "suspended": bool(cj["spec"].get("suspend")),
                    "schedule": cj["spec"].get("schedule"),
                    "lastRun": cj.get("status", {}).get("lastScheduleTime")}
        except Exception as e:
            return {"name": name, "found": False, "error": str(e)[:100]}


    def sab():
        try:
            key = None
            with open(SAB_INI) as f:
                for line in f:
                    if line.startswith("api_key"):
                        key = line.split("=", 1)[1].strip()
                        break
            if not key:
                return {"ok": False, "error": "no api_key"}
            url = "%s/api?%s" % (SAB_URL, urllib.parse.urlencode(
                {"mode": "queue", "output": "json", "apikey": key}))
            with urllib.request.urlopen(url, timeout=30) as r:
                q = json.load(r)["queue"]
            by = {}
            for s in q.get("slots", []):
                by[s.get("status", "?")] = by.get(s.get("status", "?"), 0) + 1
            return {"ok": True, "speed": q.get("speed"), "paused": q.get("paused"),
                    "jobs": len(q.get("slots", [])), "byStatus": by,
                    "mbLeft": float(q.get("mbleft") or 0)}
        except Exception as e:
            return {"ok": False, "error": str(e)[:120]}


    def in_flight(app, recs):
        """What is actually moving right now, newest progress first.

        "43 items queued" answers nothing on its own - the question is
        always which ones, and whether any of them are stuck at 0%. Size
        and sizeleft give real progress; estimatedCompletionTime is
        Radarr's own guess and is often absent, so it is passed through
        rather than recomputed.
        """
        out = []
        for r in recs:
            if r.get("status") != "downloading":
                continue
            size = float(r.get("size") or 0)
            left = float(r.get("sizeleft") or 0)
            out.append({
                "app": app,
                "title": (r.get("title") or "?")[:95],
                "pct": round(100 * (size - left) / size, 1) if size else 0,
                "gb": round(size / 1e9, 2),
                "protocol": r.get("protocol"),
                "eta": r.get("estimatedCompletionTime"),
            })
        out.sort(key=lambda x: -x["pct"])
        return out


    def stuck_reason(r, cutoff):
        """Why the Clear button would act on this item, or None.

        The single predicate for both the button and the board. They used
        different rules at first, which produced the worst possible result:
        the board offered "Clear" for things the button refused, and stayed
        silent about phantoms the button could actually fix. One function
        now, so the two cannot drift apart again.
        """
        why_msgs = " ".join(m for x in r.get("statusMessages", []) for m in (x.get("messages") or []))
        if "executable file" in why_msgs.lower():
            return "bundled executable - not a real release"
        if r.get("status") == "completed":
            return None      # downloaded fine, import failed - a person's job
        size = float(r.get("size") or 0)
        left = float(r.get("sizeleft") or 0)
        old_enough = (r.get("added") or "9999") < cutoff
        if r.get("trackedDownloadStatus") in ("warning", "error"):
            return "flagged by the app"
        if size > 0 and left >= size and old_enough:
            return "no progress in %dh" % STUCK_HOURS
        if size == 0 and left == 0 and old_enough:
            return "empty phantom entry"
        return None


    def cutoff_stamp():
        return (datetime.datetime.now(datetime.timezone.utc)
                - datetime.timedelta(hours=STUCK_HOURS)).strftime("%Y-%m-%dT%H:%M:%SZ")


    def flagged_of(recs):
        out, cutoff = [], cutoff_stamp()
        for r in recs:
            reason = stuck_reason(r, cutoff)
            flagged = r.get("trackedDownloadStatus") in ("warning", "error")
            if not reason and not flagged:
                continue
            msgs = [m["messages"][0] for m in r.get("statusMessages", []) if m.get("messages")]
            out.append({"title": (r.get("title") or "?")[:90],
                        "status": r.get("status"),
                        "clearable": bool(reason),
                        "why": (reason or (msgs[0] if msgs else r.get("status", "")))[:130]})
        return out


    def movie_side():
        profiles = {p["id"]: p for p in arr("radarr", "qualityprofile")}
        cutoffs = {pid: cutoff_index(p) for pid, p in profiles.items()}
        tag_id = next((t["id"] for t in arr("radarr", "tag") if t["label"] == TAG_LABEL), None)
        movies = arr("radarr", "movie")
        roots = {r["path"]: r for r in arr("radarr", "rootfolder")}
        queue = arr_queue("radarr")

        now = datetime.datetime.now(datetime.timezone.utc)
        day = (now - datetime.timedelta(days=1)).strftime("%Y-%m-%dT%H:%M:%SZ")
        week = (now - datetime.timedelta(days=7)).strftime("%Y-%m-%dT%H:%M:%SZ")
        hist, page = [], 1
        while page <= HISTORY_PAGES:
            h = arr("radarr", "history?page=%d&pageSize=250&sortKey=date&sortDirection=descending" % page)
            recs = h.get("records", [])
            hist += recs
            if not recs or len(hist) >= h.get("totalRecords", 0):
                break
            page += 1

        def below(m):
            prof = profiles.get(m["qualityProfileId"])
            if prof is None:
                return False
            pos, cut = cutoffs[m["qualityProfileId"]]
            i = pos.get(m["movieFile"]["quality"]["quality"]["id"])
            return i is not None and i < cut

        def side(root, mode):
            mine = {m["id"]: m for m in movies if m.get("rootFolderPath") == root}
            met = withfile = 0
            on_disk = 0
            tiers = {"1": 0, "2": 0, "3": 0}
            for m in mine.values():
                if not m.get("hasFile"):
                    continue
                withfile += 1
                on_disk += int(m["movieFile"].get("size") or 0)
                if not below(m):
                    met += 1
                else:
                    r = m["movieFile"]["quality"]["quality"]["resolution"]
                    tiers[str(1 if r < 720 else (2 if r == 720 else 3))] += 1
            qm = [r for r in queue if r.get("movieId") in mine]
            hm = [x for x in hist if x["movieId"] in mine]
            imported = [x for x in hm if x["eventType"] == "downloadFolderImported"]
            if mode == "upgrade":
                searched = sum(1 for m in mine.values()
                               if tag_id is not None and tag_id in m.get("tags", []))
                remaining = sum(1 for m in mine.values()
                                if m.get("hasFile") and m.get("isAvailable", True)
                                and (tag_id is None or tag_id not in m.get("tags", []))
                                and profiles.get(m["qualityProfileId"], {}).get("upgradeAllowed")
                                and below(m))
                nights = (remaining + MAIN_BATCH - 1) // MAIN_BATCH
                eta = (datetime.date.today() + datetime.timedelta(days=nights)).isoformat() if nights else None
            else:
                try:
                    with open(BULK_STATE) as f:
                        searched = len(json.load(f).get("searched", []))
                except Exception:
                    searched = None
                remaining = len(mine) - withfile
                nights = eta = None
            return {
                "root": root, "mode": mode, "titles": len(mine), "withFile": withfile,
                "meetCutoff": met, "belowCutoff": sum(tiers.values()), "tiers": tiers,
                "searched": searched, "remaining": remaining,
                "replaced": sum(1 for x in hm if x["eventType"] == "movieFileDeleted"
                                and x.get("data", {}).get("reason") == "Upgrade"),
                "onDisk": on_disk,
                "queue": {"total": len(qm),
                          "downloading": sum(1 for r in qm if r.get("status") == "downloading"),
                          "queued": sum(1 for r in qm if r.get("status") != "downloading"),
                          "inFlightBytes": sum(int(r.get("size") or 0) for r in qm),
                          "torrent": sum(1 for r in qm if r.get("protocol") == "torrent"),
                          "usenet": sum(1 for r in qm if r.get("protocol") == "usenet")},
                "imported24h": sum(1 for x in imported if x["date"] >= day),
                "imported7d": sum(1 for x in imported if x["date"] >= week),
                "failed7d": sum(1 for x in hm if x["eventType"] == "downloadFailed" and x["date"] >= week),
                "recent": [{"title": mine[x["movieId"]]["title"], "year": mine[x["movieId"]].get("year"),
                            "quality": x["quality"]["quality"]["name"], "date": x["date"]}
                           for x in imported[:10]],
                "batch": MAIN_BATCH if mode == "upgrade" else BULK_BATCH,
                "nights": nights, "eta": eta,
            }

        return (side(MAIN_ROOT, "upgrade"), side(BULK_ROOT, "missing"),
                round(roots.get(MAIN_ROOT, {}).get("freeSpace", 0) / 1e12, 2),
                flagged_of(queue), len(queue), in_flight("radarr", queue))


    def tv_side():
        series = arr("sonarr", "series")
        profiles = {p["id"]: p for p in arr("sonarr", "qualityprofile")}
        queue = arr_queue("sonarr")
        shows = []
        legacy_total = ep_total = 0
        on_disk = [0]
        for s in series:
            try:
                files = arr("sonarr", "episodefile?seriesId=%d" % s["id"])
            except Exception:
                continue
            legacy = [f for f in files
                      if ((f.get("mediaInfo") or {}).get("videoCodec", "") or "").lower() in LEGACY_CODECS]
            ep_total += len(files)
            legacy_total += len(legacy)
            on_disk[0] += sum(int(f.get("size") or 0) for f in files)
            if legacy:
                shows.append({"title": s["title"], "legacy": len(legacy), "files": len(files),
                              "profile": profiles.get(s["qualityProfileId"], {}).get("name", "?"),
                              "upgradeAllowed": bool(profiles.get(s["qualityProfileId"], {}).get("upgradeAllowed"))})
        shows.sort(key=lambda x: -x["legacy"])
        return {
            "series": len(series), "episodeFiles": ep_total,
            "legacyFiles": legacy_total, "shows": shows[:12],
            "onDisk": on_disk[0],
            "queue": {"total": len(queue),
                      "downloading": sum(1 for r in queue if r.get("status") == "downloading"),
                      "queued": sum(1 for r in queue if r.get("status") != "downloading"),
                      "inFlightBytes": sum(int(r.get("size") or 0) for r in queue),
                      "torrent": sum(1 for r in queue if r.get("protocol") == "torrent"),
                      "usenet": sum(1 for r in queue if r.get("protocol") == "usenet")},
            "flagged": flagged_of(queue),
            "inFlight": in_flight("sonarr", queue),
        }


    def health():
        stall = {}
        try:
            with open(STALL_STATE) as f:
                st = json.load(f)
            for app, v in (st.get("previous") or {}).items():
                stall[app] = {"stalled": bool((st.get("stalled") or {}).get(app)),
                              "strikes": (st.get("strikes") or {}).get(app, 0),
                              "items": v.get("items"), "bytesLeft": v.get("bytesLeft")}
            checked = st.get("checkedAt")
        except Exception:
            checked = None
        return {"stall": stall, "checkedAt": checked}


    def collect():
        main, bulk, free, rflag, rq, rflight = movie_side()
        tv = tv_side()
        try:
            wq = arr_queue("whisparr")
            wflag = flagged_of(wq)
            wflight = in_flight("whisparr", wq)
        except Exception:
            wq, wflag, wflight = [], [], []
        return {
            "generated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "freeTB": free,
            "health": health(),
            "sab": sab(),
            # Split deliberately. The board previously showed one "needs a
            # person" count that included items the Clear button refuses to
            # touch, so pressing it changed nothing and looked broken.
            # canClear is what the button will act on; needsYou is what only
            # a person can fix in the app's own UI.
            "needsPerson": rflag + tv["flagged"] + wflag,
            "canClear": [f for f in rflag + tv["flagged"] + wflag if f.get("clearable")],
            "needsYou": [f for f in rflag + tv["flagged"] + wflag if not f.get("clearable")],
            "inFlight": sorted(rflight + tv["inFlight"] + wflight, key=lambda x: -x["pct"]),
            "queues": {"radarr": rq, "sonarr": tv["queue"]["total"], "whisparr": len(wq)},
            "groups": groups(main, bulk, tv),
            "main": main, "bulk": bulk, "tv": tv,
            "jobs": [cronjob_state(c) for c in CRONJOBS],
        }


    def run_search(batch=None):
        """Search the next batch of missing midday movies, worst-first.

        Same selection and the same state file as bulk_backfill.py, so
        running this and running the script by hand cannot disagree about
        what has already been tried.
        """
        batch = batch or SEARCH_BATCH
        movies = [m for m in arr("radarr", "movie")
                  if m.get("rootFolderPath") == BULK_ROOT
                  and m.get("qualityProfileId") == BULK_PROFILE]
        try:
            with open(BULK_STATE) as f:
                done = set(json.load(f).get("searched", []))
        except Exception:
            done = set()
        missing = [m for m in movies if not m.get("hasFile")
                   and m.get("monitored") and m.get("isAvailable")]
        todo = [m for m in missing if m["id"] not in done]
        todo.sort(key=lambda m: (tier_of(m), -(m.get("year") or 0)))
        pick = todo[:batch]
        if not pick:
            return {"ok": True, "searched": 0, "remaining": 0,
                    "message": "Nothing left to search - every missing title has been tried."}
        ids = [m["id"] for m in pick]
        cmd = arr_post("radarr", "command", {"name": "MoviesSearch", "movieIds": ids})
        # State only after Radarr accepts the command, so a failure retries
        # the same batch rather than skipping it.
        done |= set(ids)
        with open(BULK_STATE, "w") as f:
            json.dump({"searched": sorted(done)}, f)
        tiers = {}
        for m in pick:
            t = "tier %d" % tier_of(m)
            tiers[t] = tiers.get(t, 0) + 1
        return {"ok": True, "searched": len(ids), "remaining": len(todo) - len(ids),
                "tiers": tiers, "commandId": cmd.get("id"),
                "message": "Searching %d titles (%s). %d still unsearched."
                           % (len(ids), ", ".join("%s: %s" % kv for kv in sorted(tiers.items())),
                              len(todo) - len(ids))}


    def run_unstick():
        """Clear dead queue items so their slots free up and they re-search.

        Removed through the owning *arr with blocklist=true, never through
        the download client, so the bad release is remembered and a
        replacement is looked for straight away.

        'completed' items are mostly left alone even when flagged: those
        are the "Manual Import required" and "already imported" ones, where
        the download actually succeeded and only the import failed, so
        blocklisting would throw away a good file and ban a good release.

        The exception is a release carrying a bundled executable. Sonarr
        reports those as "Found executable file with extension: '.exe'" -
        a .exe inside a TV release is a malware pattern, not a real episode,
        and four of them were sitting in the queue on 2026-09-10. There the
        release itself is the problem, so it gets blocklisted like any other
        bad grab and a replacement is searched. Nothing of value is lost -
        the "file" was never the episode.
        """
        cutoff = cutoff_stamp()
        removed, skipped, failed = [], [], []
        for app in ARRS:
            try:
                recs = arr_queue(app)
            except Exception as e:
                failed.append({"app": app, "why": str(e)[:100]})
                continue
            for r in recs:
                title = (r.get("title") or "?")[:90]
                reason = stuck_reason(r, cutoff)
                if not reason:
                    if r.get("trackedDownloadStatus") in ("warning", "error"):
                        skipped.append({"app": app, "title": title,
                                        "why": "downloaded fine, import failed - needs a manual import"})
                    continue
                try:
                    arr_delete(app, "queue/%s?removeFromClient=true&blocklist=true&skipRedownload=false"
                               % r["id"])
                    removed.append({"app": app, "title": title, "why": reason})
                except Exception as e:
                    failed.append({"app": app, "title": title, "why": str(e)[:100]})
        msg = "Removed %d and blocklisted them, so replacements are being searched." % len(removed)
        junk = sum(1 for r in removed if "executable" in r["why"])
        if junk:
            msg += " %d of those carried a bundled executable rather than media." % junk
        if skipped:
            msg += " %d left alone - they downloaded fine and need a manual import." % len(skipped)
        if failed:
            msg += " %d could not be removed." % len(failed)
        if not removed and not skipped and not failed:
            msg = "Nothing stuck - no dead items to clear."
        return {"ok": True, "removed": removed, "skipped": skipped, "failed": failed, "message": msg}


    def groups(main, bulk, tv):
        """The four things being worked on, in one shape.

        Every group answers the same four questions - how far through, how
        much is queued, how much is downloading, how much is finished - so
        the board can render them identically and they can be compared at a
        glance. "Finished" means the same thing in each: a file that is on
        disk and is what we want.

        Regular movies and replacements are split deliberately. They share a
        root folder but are different jobs: one is "do we have it at all",
        the other is "is the copy any good", and merging them hides whichever
        is going badly.
        """
        return [
            {"key": "movies", "name": "Regular movies",
             "what": "titles at Bluray-1080p", "root": main["root"],
             "done": main["meetCutoff"], "total": main["titles"],
             "queued": main["queue"]["queued"], "downloading": main["queue"]["downloading"],
             "finished": main["meetCutoff"],
             "onDisk": main["onDisk"], "inFlight": main["queue"]["inFlightBytes"],
             "note": "Every title already has a file; this is how many are at the quality we want."},
            {"key": "replacements", "name": "Replacements",
             "what": "poor copies replaced", "root": main["root"],
             "done": main["replaced"], "total": main["replaced"] + main["queue"]["total"] + main["remaining"],
             "queued": main["queue"]["queued"], "downloading": main["queue"]["downloading"],
             "finished": main["replaced"],
             "onDisk": None, "inFlight": main["queue"]["inFlightBytes"],
             "eta": main["eta"], "nights": main["nights"],
             "note": "Runs itself nightly. A title that went 480p to WEB 1080p counts as remaining "
                     "but will not be searched again."},
            {"key": "midday", "name": "Midday movies",
             "what": "titles found", "root": bulk["root"],
             "done": bulk["withFile"], "total": bulk["titles"],
             "queued": bulk["queue"]["queued"], "downloading": bulk["queue"]["downloading"],
             "finished": bulk["withFile"],
             "onDisk": bulk["onDisk"], "inFlight": bulk["queue"]["inFlightBytes"],
             "note": "Titles with no copy at all. Only moves when bulk_backfill.py is run."},
            {"key": "tv", "name": "TV",
             "what": "episodes on a modern codec", "root": "/tv",
             "done": tv["episodeFiles"] - tv["legacyFiles"], "total": tv["episodeFiles"],
             "queued": tv["queue"]["queued"], "downloading": tv["queue"]["downloading"],
             "finished": tv["episodeFiles"] - tv["legacyFiles"],
             "onDisk": tv["onDisk"], "inFlight": tv["queue"]["inFlightBytes"],
             "note": "The remainder is XviD/DivX, which has no hardware decoder on the TV and "
                     "forces Jellyfin to transcode."},
        ]


    class Handler(BaseHTTPRequestHandler):
        def log_message(self, *a):
            pass

        def _send(self, code, body, ctype):
            raw = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(raw)))
            self.send_header("Cache-Control", "no-store, must-revalidate")
            self.end_headers()
            self.wfile.write(raw)

        def do_POST(self):
            # No auth in front of this. It is LAN-only behind Pi-hole DNS and
            # Traefik, and both actions are bounded and reversible-ish: a
            # search costs indexer queries, an unstick blocklists releases
            # that were already failing. Worth knowing before it is ever
            # exposed more widely.
            actions = {"/api/run/search": run_search, "/api/run/unstick": run_unstick}
            fn = actions.get(self.path.split("?")[0])
            if not fn:
                return self._send(404, json.dumps({"error": "no such action"}), "application/json")
            try:
                self._send(200, json.dumps(fn()), "application/json")
            except Exception as e:
                self._send(500, json.dumps({"ok": False, "error": str(e)[:300]}), "application/json")

        def do_GET(self):
            if self.path.startswith("/api/status"):
                try:
                    self._send(200, json.dumps(collect()), "application/json")
                except Exception as e:
                    self._send(500, json.dumps({"error": str(e)[:300]}), "application/json")
            elif self.path == "/healthz":
                self._send(200, "ok", "text/plain")
            else:
                with open("/app/index.html") as f:
                    self._send(200, f.read(), "text/html; charset=utf-8")


    def watch_self():
        """Re-exec when this file changes on disk.

        The script is loaded once at process start, so editing the mounted
        ConfigMap updated the file and changed nothing - the pod carried on
        serving the old response shape, which is the same trap
        arr-wiring-reconciler documents. A content-hashed configMapGenerator
        would roll the pod instead, but kustomize here does not rewrite the
        Deployment's volume reference to the hashed name, which leaves the
        pod mounting a ConfigMap that no longer exists.

        So the reload lives in the process itself: watch our own mtime and
        exec a fresh interpreter when it moves. Self-contained, nothing to
        remember, and no dependency on generator behaviour. index.html needs
        none of this - it is read per request.
        """
        path = os.path.abspath(__file__)
        try:
            start = os.stat(path).st_mtime
        except OSError:
            return
        while True:
            time.sleep(20)
            try:
                if os.stat(path).st_mtime != start:
                    print("movie_status.py changed on disk, reloading", flush=True)
                    os.execv(sys.executable, [sys.executable, path])
            except OSError:
                pass


    if __name__ == "__main__":
        threading.Thread(target=watch_self, daemon=True).start()
        ThreadingHTTPServer(("", PORT), Handler).serve_forever()
  index.html: |
    <!-- Rendered by movie_status.py. React from CDN, no build step: a
         one-user LAN dashboard, where a toolchain would cost more than it
         saves.

         Colours are the dataviz reference palette used verbatim - the first
         three categorical slots plus the fixed status palette. Nothing was
         re-stepped or invented, so the documented validation for that set
         still applies (the validator itself needs node, which this host
         does not have). Only two categorical slots are ever on screen at
         once; "remaining" is the neutral track, not a third hue, because it
         is absence rather than a category.

         Status colours are reserved for state and always ship with a label,
         never colour alone - warning and serious sit below 3:1 on the light
         surface by design, and the label is the mitigation. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Media pipeline status</title>
    <style>
      :root {
        color-scheme: light dark;
        --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --ink3:#77766f;
        --line:#e3e6ea; --track:#e8ebef;
        --s1:#2a78d6; --s2:#eb6834;
        --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --ink3:#96958c;
          --line:#2b2b29; --track:#262624;
          --s1:#3987e5; --s2:#d95926;
        }
      }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--plane); color:var(--ink);
             font:15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .wrap { max-width:1040px; margin:0 auto; padding:22px 16px 60px; }
      header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
      h1 { font-size:19px; margin:0; letter-spacing:-.01em; }
      .stamp { color:var(--ink3); font-size:13px; }
      button { margin-left:auto; font:inherit; font-weight:600; cursor:pointer; background:var(--s1);
               color:#fff; border:0; border-radius:8px; padding:8px 16px; }
      button[disabled] { opacity:.55; cursor:default; }
      .card { background:var(--surface); border:1px solid var(--line); border-radius:12px;
              padding:18px; margin-bottom:14px; }
      .card h2 { font-size:15px; margin:0 0 3px; }
      .sub { color:var(--ink2); font-size:13px; margin-bottom:16px; }

      /* hero: the one number the board leads with */
      .hero { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
      .hero .figure { font-size:52px; font-weight:650; letter-spacing:-.03em; line-height:1; }
      .hero .what { color:var(--ink2); font-size:14px; }
      .pill { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600;
              border-radius:999px; padding:5px 13px; border:1.5px solid currentColor; }
      .pill .dot { width:9px; height:9px; border-radius:50%; background:currentColor; flex:none; }

      /* KPI row of stat tiles */
      .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px; }
      .kpi { border:1px solid var(--line); border-radius:10px; padding:11px 13px; }
      .kpi b { display:block; font-size:26px; font-weight:650; letter-spacing:-.02em; line-height:1.15; }
      .kpi span { color:var(--ink3); font-size:12px; }

      /* meters and part-to-whole bars: thin marks, 2px surface gaps, rounded data ends */
      .meter { margin:14px 0 6px; }
      .meter .track { height:10px; background:var(--track); border-radius:99px; display:flex; gap:2px;
                      overflow:hidden; }
      .meter .seg { height:100%; }
      .meter .seg:first-child { border-radius:99px 0 0 99px; }
      .meter .seg.cap { border-radius:99px; }
      .labels { display:flex; gap:16px; flex-wrap:wrap; margin-top:9px; font-size:12.5px;
                color:var(--ink2); }
      .labels s { width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:6px;
                  text-decoration:none; }
      .labels b { color:var(--ink); font-weight:650; }
      .note { color:var(--ink3); font-size:12.5px; margin-top:10px; }
      .note b { color:var(--ink2); }
      .jobs { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; }
      .job { border:1px solid var(--line); border-radius:10px; padding:11px 13px; }
      .job .n { font-size:13px; font-weight:600; }
      .job .m { color:var(--ink3); font-size:12px; margin-top:3px; }
      .badge { display:inline-block; font-size:11.5px; font-weight:600; padding:2px 8px;
               border-radius:999px; border:1px solid var(--line); color:var(--ink3);
               vertical-align:middle; margin-left:4px; }
      .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
      .act { font:inherit; font-size:13px; font-weight:600; cursor:pointer; margin:0;
             background:transparent; color:var(--s1); border:1.5px solid currentColor;
             border-radius:8px; padding:7px 14px; }
      .act[disabled] { opacity:.5; cursor:default; }
      .result { margin-top:10px; font-size:13px; color:var(--ink2); border-left:3px solid var(--s1);
                padding:8px 12px; background:var(--track); border-radius:0 6px 6px 0; }
      .result.bad { border-left-color:var(--critical); color:var(--critical); }
      .result ul { margin:0; padding:0; list-style:none; }
      .result li { display:flex; gap:10px; padding:3px 0; font-size:12.5px; }
      .result li span { margin-left:auto; opacity:.75; text-align:right; }
      .dls { margin-top:12px; }
      .dl { display:flex; align-items:center; gap:10px; padding:4px 0; font-size:12.5px; }
      .dl .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink2); }
      .dl .p { font-weight:700; min-width:40px; text-align:right; }
      .err { color:var(--critical); }
    </style>
    <div id="root" class="wrap"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
    <script>
    const html = htm.bind(React.createElement);
    const {useState, useEffect, useCallback} = React;
    const N = v => (v===null||v===undefined) ? '?' : v.toLocaleString();
    const pc = (n,d) => d>0 ? Math.round(n/d*1000)/10 : 0;
    const when = s => s ? new Date(s).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : '-';
    const ago = s => { if(!s) return 'never'; const m=Math.round((Date.now()-new Date(s))/60000);
      return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'; };

    // Fixed status steps, not a continuous red-green interpolation - a
    // smooth hue sweep through that axis is exactly what protanopia and
    // deuteranopia collapse, so it fails for a real fraction of readers.
    // Four bands read the same "getting better toward green" story
    // without relying on hue alone. A stalled item's app overrides the
    // band outright: a stuck download is critical regardless of how far
    // it got before it stopped.
    const pctColor = (pct, isStalled) => isStalled ? 'var(--critical)'
      : pct>=75 ? 'var(--good)' : pct>=40 ? 'var(--warning)' : pct>=10 ? 'var(--serious)' : 'var(--critical)';

    function Kpi({v,label}) { return html`<div class="kpi"><b>${v}</b><span>${label}</span></div>`; }

    // Part-to-whole. Segments carry a 2px surface gap; the track itself is the
    // remainder, so absence is never given a hue of its own.
    function Meter({segs,total}) {
      return html`<div class="meter">
        <div class="track">
          ${segs.filter(s=>s.v>0).map((s,i)=>html`<i key=${i} class=${'seg'+(segs.filter(x=>x.v>0).length===1?' cap':'')}
            style=${{width:pc(s.v,total)+'%', background:s.c}}></i>`)}
        </div>
        <div class="labels">
          ${segs.map((s,i)=>html`<span key=${i}><s style=${{background:s.c}}></s>${s.k} <b>${N(s.v)}</b></span>`)}
          <span><s style=${{background:'var(--track)'}}></s>${'remaining'} <b>${N(total-segs.reduce((a,s)=>a+s.v,0))}</b></span>
        </div>
      </div>`;
    }

    function Actions({onDone, canClear}) {
      const [busy,setBusy]=useState(null); const [res,setRes]=useState(null);
      const run=(path,label,confirmText)=>{
        if (confirmText && !window.confirm(confirmText)) return;
        setBusy(label); setRes(null);
        fetch(path,{method:'POST'}).then(r=>r.json())
          .then(j=>{ setRes({ok:j.ok!==false, text:j.message||j.error||'done'}); if(onDone) onDone(); })
          .catch(e=>setRes({ok:false,text:e.message}))
          .finally(()=>setBusy(null));
      };
      return html`<div>
        <div class="actions">
          <button class="act" disabled=${!!busy}
            onClick=${()=>run('/api/run/search','search',
              'Search the next batch of missing midday movies? This uses indexer queries.')}>
            ${busy==='search'?'Searching...':'Search more midday movies'}</button>
          <button class="act" disabled=${!!busy || !canClear} title=${canClear?'':'Nothing the button can clear'}
            onClick=${()=>run('/api/run/unstick','unstick',
              'Clear stuck downloads? Dead items are blocklisted and re-searched. Anything that downloaded fine and only failed to import is left alone.')}>
            ${busy==='unstick'?'Clearing...':(canClear?`Clear ${canClear} stuck download${canClear>1?'s':''}`:'Nothing to clear')}</button>
        </div>
        ${res && html`<div class=${'result'+(res.ok?'':' bad')}>${res.text}</div>`}
      </div>`;
    }

    function Health({d}) {
      const stalled = Object.keys(d.health.stall||{}).filter(k=>d.health.stall[k].stalled);
      const clearable = (d.canClear||[]).length;
      const needsYou = (d.needsYou||[]);
      const stuck = clearable + needsYou.length;
      const bad = stalled.length>0 || clearable>0, warn = needsYou.length>0;
      const state = bad ? {t:'Stalled', c:'var(--critical)'} : warn ? {t:'Needs a look', c:'var(--warning)'}
                                                                    : {t:'All moving', c:'var(--good)'};
      const inFlight = d.inFlight||[];
      const dl = inFlight.length;
      const stalledSet = new Set(stalled);
      const shown = inFlight.slice(0,8);
      return html`<div class="card">
        <div class="hero">
          <div>
            <div class="figure" style=${{color:state.c}}>${dl}</div>
            <div class="what">downloading right now</div>
          </div>
          <div style=${{marginLeft:'auto',textAlign:'right'}}>
            <div class="pill" style=${{color:state.c}}><i class="dot"></i>${state.t}</div>
            <div class="what" style=${{marginTop:'8px'}}>stall check ${ago(d.health.checkedAt)}</div>
          </div>
        </div>
        <div class="kpis" style=${{marginTop:'18px'}}>
          <${Kpi} v=${stuck} label="stuck, needs a person" />
          <${Kpi} v=${d.sab.ok ? (d.sab.paused?'paused':d.sab.speed) : '?'} label="usenet speed" />
          <${Kpi} v=${N(d.queues.radarr+d.queues.sonarr+d.queues.whisparr)} label="queued in total" />
          <${Kpi} v=${d.freeTB+' TB'} label="free space" />
        </div>
        ${shown.length ? html`<div class="dls">
          ${shown.map((it,i)=>html`<div class="dl" key=${i}>
            <span class="t">${it.title}<span class="badge">${it.app}</span></span>
            <span class="p" style=${{color:pctColor(it.pct, stalledSet.has(it.app))}}>${it.pct}%</span>
          </div>`)}
          ${dl>shown.length ? html`<div class="note">+${dl-shown.length} more downloading</div>` : null}
        </div>` : null}
        ${stalled.length ? html`<div class="note"><b>Not moving:</b> ${stalled.join(', ')} - queue is
          non-empty and bytes-left has not dropped across consecutive checks.</div>` : null}
        ${clearable ? html`<div class="note"><b>${clearable} dead item${clearable>1?'s':''}</b> -
          the Clear button below will blocklist ${clearable>1?'them':'it'} and search for
          ${clearable>1?'replacements':'a replacement'}.</div>` : null}
        ${needsYou.length ? html`<div class="result bad" style=${{marginTop:'10px'}}>
          <b>${needsYou.length} need${needsYou.length>1?'':'s'} you, not the button.</b>
          ${' '}The download worked; only the import failed, so clearing would bin a good file.
          Fix ${needsYou.length>1?'these':'this'} in the app's own Activity, then Queue.
          <ul style=${{marginTop:'6px'}}>${needsYou.slice(0,6).map((f,i)=>
            html`<li key=${i}>${f.title}<span>${f.why}</span></li>`)}</ul>
        </div>` : null}
        <${Actions} onDone=${d.reload} canClear=${clearable} />
      </div>`;
    }

    const sz = b => { if(b===null||b===undefined) return null;
      return b>=1e12 ? (b/1e12).toFixed(2)+' TB' : b>=1e9 ? (b/1e9).toFixed(0)+' GB' : (b/1e6).toFixed(0)+' MB'; };

    // One shape for every group, so four different jobs can be compared at a
    // glance instead of each inventing its own layout.
    function Group({g}) {
      const rest = Math.max(g.total - g.done - g.queued - g.downloading, 0);
      return html`<div class="card">
        <h2>${g.name} <span class="badge">${g.root}</span></h2>
        <div class="sub">${g.note}</div>
        <div class="hero">
          <div>
            <div class="figure">${N(g.done)}<span style=${{fontSize:'22px',color:'var(--ink3)'}}> of ${N(g.total)}</span></div>
            <div class="what">${g.what} - ${pc(g.done,g.total)}%</div>
          </div>
          <div class="kpis" style=${{flex:'1 1 300px'}}>
            <${Kpi} v=${N(g.queued)} label="queued" />
            <${Kpi} v=${N(g.downloading)} label="downloading" />
            <${Kpi} v=${N(g.finished)} label="finished" />
          </div>
        </div>
        <${Meter} segs=${[
          {k:'finished', v:g.done, c:'var(--s1)'},
          {k:'downloading', v:g.downloading, c:'var(--s2)'}]} total=${g.total} />
        <div class="note">
          ${g.onDisk!==null ? html`<b>${sz(g.onDisk)}</b> on disk. ` : null}
          ${g.inFlight ? html`<b>${sz(g.inFlight)}</b> in flight. ` : null}
          ${g.nights ? html`About <b>${g.nights}</b> more nights - <b>${g.eta}</b>.` : null}
        </div>
      </div>`;
    }

    function Jobs({jobs}) {
      return html`<div class="card">
        <h2>Unattended jobs</h2>
        <div class="sub">Two of these switch themselves off once their backlog is done.</div>
        <div class="jobs">
          ${jobs.map((j,i)=>{
            const c = !j.found ? 'var(--critical)' : j.suspended ? 'var(--ink3)' : 'var(--good)';
            const t = !j.found ? 'unreadable' : j.suspended ? 'retired' : 'active';
            return html`<div class="job" key=${i}>
              <div class="n">${j.name}</div>
              <div style=${{marginTop:'7px'}}><span class="pill" style=${{color:c,fontSize:'12px',padding:'3px 10px'}}>
                <i class="dot"></i>${t}</span></div>
              <div class="m">${j.found ? `${j.schedule} - ran ${ago(j.lastRun)}` : (j.error||'')}</div>
            </div>`;
          })}
        </div>
      </div>`;
    }

    function App() {
      const [d,setD]=useState(null); const [err,setErr]=useState(null); const [busy,setBusy]=useState(false);
      const load=useCallback(()=>{ setBusy(true); setErr(null);
        fetch('/api/status',{cache:'no-store'}).then(r=>r.json())
          .then(j=>j.error?Promise.reject(new Error(j.error)):setD(j))
          .catch(e=>setErr(e.message)).finally(()=>setBusy(false)); },[]);
      useEffect(load,[load]);
      if (err) return html`<div><header><h1>Media pipeline</h1>
        <button onClick=${load} disabled=${busy}>Retry</button></header>
        <div class="card err">Could not read the pipeline: ${err}</div></div>`;
      return html`<div>
        <header><h1>Media pipeline</h1>
          <div class="stamp">${d?`as at ${when(d.generated)}`:busy?'loading':''}</div>
          <button onClick=${load} disabled=${busy}>${busy?'Refreshing':'Refresh'}</button></header>
        ${d && html`<${Health} d=${{...d, reload:load}} />`}
        ${d && (d.groups||[]).map((g,i)=>html`<${Group} key=${i} g=${g} />`)}
        ${d && html`<${Jobs} jobs=${d.jobs} />`}
      </div>`;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
    </script>
