# Server and page for the on-demand backfill status board. See
# movie_status.py's docstring for why this is self-hosted rather than a
# hosted page: the data only exists on the LAN.
#
# Whole-directory mount, not subPath, so editing either file here
# reaches the pod on kubelet's next sync. The Python process still
# needs a restart to pick up code changes (it loads movie_status.py
# once at start) - index.html is re-read per request and does not.
apiVersion: v1
kind: ConfigMap
metadata:
  name: movie-status
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: movie-status
    argocd.argoproj.io/managed-by: argocd
data:
  movie_status.py: |
    #!/usr/bin/env python3
    """One on-demand status board for the whole media pipeline.

    Same shape as backup-dashboard and for the same reason: every request
    re-reads live state and renders fresh, rather than a CronJob writing a
    static file whose age you then have to trust. Nothing is cached and
    nothing is scheduled - the Refresh button is the whole mechanism.

    Self-hosted rather than a claude.ai artifact because the data lives on
    the LAN: the *arrs are only reachable in-cluster, and a hosted page
    cannot fetch them. That decision was already made once for
    backup-dashboard.

    Five panels, in the order you actually want them:

      health    is anything stuck right now - the stall watcher's own
                verdict, plus whatever the *arrs have flagged as needing a
                person. Stuck queue items never clear themselves.
      movies    /movies is the upgrade backfill: every title already has a
                file and the job is replacing bad copies. /movies-bulk is
                the midday-movie library: titles with no copy at all,
                driven by hand, so it gets a measured rate and no fake ETA.
      tv        legacy XviD/.avi episodes - the ones with no hardware
                decoder on the TV, which force Jellyfin to transcode.
      jobs      what runs unattended, when it last ran, and whether it has
                retired itself.

    Deliberately does NOT ask qBittorrent anything: its WebUI refuses
    unauthenticated calls from outside its own pod (LocalHostAuth=false
    covers only genuine 127.0.0.1, so the ClusterIP Service answers 403).
    The *arr queues carry protocol per item, which gives the torrent-vs-
    usenet split without needing those credentials, and measures what
    actually matters - whether work is finishing.
    """
    import datetime
    import json
    import os
    import ssl
    import urllib.error
    import urllib.parse
    import urllib.request
    import xml.etree.ElementTree as ET
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    ARRS = {
        "radarr":   ("/app-config/radarr/config.xml",   "http://radarr.arr-stack.svc.cluster.local:7878"),
        "sonarr":   ("/app-config/sonarr/config.xml",   "http://sonarr.arr-stack.svc.cluster.local:8989"),
        "whisparr": ("/app-config/whisparr/config.xml", "http://whisparr.arr-stack.svc.cluster.local:6969"),
    }
    SAB_INI = os.environ.get("SAB_INI", "/app-config/sabnzbd/sabnzbd.ini")
    SAB_URL = os.environ.get("SAB_URL", "http://sabnzbd.arr-stack.svc.cluster.local:8080")
    MAIN_ROOT = os.environ.get("MAIN_ROOT", "/movies")
    BULK_ROOT = os.environ.get("BULK_ROOT", "/movies-bulk")
    TAG_LABEL = os.environ.get("TAG_LABEL", "upgrade-searched")
    MAIN_BATCH = int(os.environ.get("MAIN_BATCH", "25"))
    BULK_BATCH = int(os.environ.get("BULK_BATCH", "50"))
    BULK_STATE = os.environ.get("BULK_STATE", "/state/bulk_backfill_state.json")
    STALL_STATE = os.environ.get("STALL_STATE", "/vault/inbox/media-pipeline-alerts/.stall_state.json")
    CRONJOBS = [c for c in os.environ.get(
        "CRONJOBS", "radarr-upgrade-search,radarr-upgrade-digest,download-stall-watch").split(",") if c]
    PORT = int(os.environ.get("PORT", "8080"))
    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    HISTORY_PAGES = int(os.environ.get("HISTORY_PAGES", "12"))
    LEGACY_CODECS = {"xvid", "divx", "mpeg4", "msmpeg4", "wmv3", "vc1"}


    def arr(app, path):
        config, base = ARRS[app]
        key = ET.parse(config).getroot().findtext("ApiKey")
        req = urllib.request.Request("%s/api/v3/%s" % (base, path), headers={"X-Api-Key": key})
        with urllib.request.urlopen(req, timeout=90) as r:
            raw = r.read().decode()
        return json.loads(raw) if raw.strip() else {}


    def arr_queue(app):
        records, page = [], 1
        while True:
            q = arr(app, "queue?page=%d&pageSize=200" % page)
            records += q.get("records", [])
            if len(records) >= q.get("totalRecords", 0) or not q.get("records"):
                return records
            page += 1


    def cutoff_index(profile):
        pos, cut = {}, None
        for i, item in enumerate(profile["items"]):
            if item.get("quality"):
                pos[item["quality"]["id"]] = i
                if item["quality"]["id"] == profile["cutoff"]:
                    cut = i
            else:
                if item.get("id") == profile["cutoff"]:
                    cut = i
                for sub in item.get("items", []):
                    pos[sub["quality"]["id"]] = i
        return pos, cut


    def cronjob_state(name):
        try:
            with open(SA_DIR + "/token") as f:
                token = f.read().strip()
            with open(SA_DIR + "/namespace") as f:
                ns = f.read().strip()
            req = urllib.request.Request(
                "https://kubernetes.default.svc/apis/batch/v1/namespaces/%s/cronjobs/%s" % (ns, name),
                headers={"Authorization": "Bearer " + token})
            with urllib.request.urlopen(
                    req, context=ssl.create_default_context(cafile=SA_DIR + "/ca.crt"), timeout=15) as r:
                cj = json.load(r)
            return {"name": name, "found": True,
                    "suspended": bool(cj["spec"].get("suspend")),
                    "schedule": cj["spec"].get("schedule"),
                    "lastRun": cj.get("status", {}).get("lastScheduleTime")}
        except Exception as e:
            return {"name": name, "found": False, "error": str(e)[:100]}


    def sab():
        try:
            key = None
            with open(SAB_INI) as f:
                for line in f:
                    if line.startswith("api_key"):
                        key = line.split("=", 1)[1].strip()
                        break
            if not key:
                return {"ok": False, "error": "no api_key"}
            url = "%s/api?%s" % (SAB_URL, urllib.parse.urlencode(
                {"mode": "queue", "output": "json", "apikey": key}))
            with urllib.request.urlopen(url, timeout=30) as r:
                q = json.load(r)["queue"]
            by = {}
            for s in q.get("slots", []):
                by[s.get("status", "?")] = by.get(s.get("status", "?"), 0) + 1
            return {"ok": True, "speed": q.get("speed"), "paused": q.get("paused"),
                    "jobs": len(q.get("slots", [])), "byStatus": by,
                    "mbLeft": float(q.get("mbleft") or 0)}
        except Exception as e:
            return {"ok": False, "error": str(e)[:120]}


    def flagged_of(recs):
        out = []
        for r in recs:
            if r.get("trackedDownloadStatus") in ("warning", "error"):
                msgs = [m["messages"][0] for m in r.get("statusMessages", []) if m.get("messages")]
                out.append({"title": (r.get("title") or "?")[:90],
                            "status": r.get("status"),
                            "why": (msgs[0] if msgs else r.get("status", "")) [:130]})
        return out


    def movie_side():
        profiles = {p["id"]: p for p in arr("radarr", "qualityprofile")}
        cutoffs = {pid: cutoff_index(p) for pid, p in profiles.items()}
        tag_id = next((t["id"] for t in arr("radarr", "tag") if t["label"] == TAG_LABEL), None)
        movies = arr("radarr", "movie")
        roots = {r["path"]: r for r in arr("radarr", "rootfolder")}
        queue = arr_queue("radarr")

        now = datetime.datetime.now(datetime.timezone.utc)
        day = (now - datetime.timedelta(days=1)).strftime("%Y-%m-%dT%H:%M:%SZ")
        week = (now - datetime.timedelta(days=7)).strftime("%Y-%m-%dT%H:%M:%SZ")
        hist, page = [], 1
        while page <= HISTORY_PAGES:
            h = arr("radarr", "history?page=%d&pageSize=250&sortKey=date&sortDirection=descending" % page)
            recs = h.get("records", [])
            hist += recs
            if not recs or len(hist) >= h.get("totalRecords", 0):
                break
            page += 1

        def below(m):
            prof = profiles.get(m["qualityProfileId"])
            if prof is None:
                return False
            pos, cut = cutoffs[m["qualityProfileId"]]
            i = pos.get(m["movieFile"]["quality"]["quality"]["id"])
            return i is not None and i < cut

        def side(root, mode):
            mine = {m["id"]: m for m in movies if m.get("rootFolderPath") == root}
            met = withfile = 0
            tiers = {"1": 0, "2": 0, "3": 0}
            for m in mine.values():
                if not m.get("hasFile"):
                    continue
                withfile += 1
                if not below(m):
                    met += 1
                else:
                    r = m["movieFile"]["quality"]["quality"]["resolution"]
                    tiers[str(1 if r < 720 else (2 if r == 720 else 3))] += 1
            qm = [r for r in queue if r.get("movieId") in mine]
            hm = [x for x in hist if x["movieId"] in mine]
            imported = [x for x in hm if x["eventType"] == "downloadFolderImported"]
            if mode == "upgrade":
                searched = sum(1 for m in mine.values()
                               if tag_id is not None and tag_id in m.get("tags", []))
                remaining = sum(1 for m in mine.values()
                                if m.get("hasFile") and m.get("isAvailable", True)
                                and (tag_id is None or tag_id not in m.get("tags", []))
                                and profiles.get(m["qualityProfileId"], {}).get("upgradeAllowed")
                                and below(m))
                nights = (remaining + MAIN_BATCH - 1) // MAIN_BATCH
                eta = (datetime.date.today() + datetime.timedelta(days=nights)).isoformat() if nights else None
            else:
                try:
                    with open(BULK_STATE) as f:
                        searched = len(json.load(f).get("searched", []))
                except Exception:
                    searched = None
                remaining = len(mine) - withfile
                nights = eta = None
            return {
                "root": root, "mode": mode, "titles": len(mine), "withFile": withfile,
                "meetCutoff": met, "belowCutoff": sum(tiers.values()), "tiers": tiers,
                "searched": searched, "remaining": remaining,
                "replaced": sum(1 for x in hm if x["eventType"] == "movieFileDeleted"
                                and x.get("data", {}).get("reason") == "Upgrade"),
                "queue": {"total": len(qm),
                          "byStatus": {s: sum(1 for r in qm if r.get("status") == s)
                                       for s in {r.get("status") for r in qm}},
                          "torrent": sum(1 for r in qm if r.get("protocol") == "torrent"),
                          "usenet": sum(1 for r in qm if r.get("protocol") == "usenet")},
                "imported24h": sum(1 for x in imported if x["date"] >= day),
                "imported7d": sum(1 for x in imported if x["date"] >= week),
                "failed7d": sum(1 for x in hm if x["eventType"] == "downloadFailed" and x["date"] >= week),
                "recent": [{"title": mine[x["movieId"]]["title"], "year": mine[x["movieId"]].get("year"),
                            "quality": x["quality"]["quality"]["name"], "date": x["date"]}
                           for x in imported[:10]],
                "batch": MAIN_BATCH if mode == "upgrade" else BULK_BATCH,
                "nights": nights, "eta": eta,
            }

        return (side(MAIN_ROOT, "upgrade"), side(BULK_ROOT, "missing"),
                round(roots.get(MAIN_ROOT, {}).get("freeSpace", 0) / 1e12, 2),
                flagged_of(queue), len(queue))


    def tv_side():
        series = arr("sonarr", "series")
        profiles = {p["id"]: p for p in arr("sonarr", "qualityprofile")}
        queue = arr_queue("sonarr")
        shows = []
        legacy_total = ep_total = 0
        for s in series:
            try:
                files = arr("sonarr", "episodefile?seriesId=%d" % s["id"])
            except Exception:
                continue
            legacy = [f for f in files
                      if ((f.get("mediaInfo") or {}).get("videoCodec", "") or "").lower() in LEGACY_CODECS]
            ep_total += len(files)
            legacy_total += len(legacy)
            if legacy:
                shows.append({"title": s["title"], "legacy": len(legacy), "files": len(files),
                              "profile": profiles.get(s["qualityProfileId"], {}).get("name", "?"),
                              "upgradeAllowed": bool(profiles.get(s["qualityProfileId"], {}).get("upgradeAllowed"))})
        shows.sort(key=lambda x: -x["legacy"])
        return {
            "series": len(series), "episodeFiles": ep_total,
            "legacyFiles": legacy_total, "shows": shows[:12],
            "queue": {"total": len(queue),
                      "torrent": sum(1 for r in queue if r.get("protocol") == "torrent"),
                      "usenet": sum(1 for r in queue if r.get("protocol") == "usenet")},
            "flagged": flagged_of(queue),
        }


    def health():
        stall = {}
        try:
            with open(STALL_STATE) as f:
                st = json.load(f)
            for app, v in (st.get("previous") or {}).items():
                stall[app] = {"stalled": bool((st.get("stalled") or {}).get(app)),
                              "strikes": (st.get("strikes") or {}).get(app, 0),
                              "items": v.get("items"), "bytesLeft": v.get("bytesLeft")}
            checked = st.get("checkedAt")
        except Exception:
            checked = None
        return {"stall": stall, "checkedAt": checked}


    def collect():
        main, bulk, free, rflag, rq = movie_side()
        tv = tv_side()
        try:
            wq = arr_queue("whisparr")
            wflag = flagged_of(wq)
        except Exception:
            wq, wflag = [], []
        return {
            "generated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "freeTB": free,
            "health": health(),
            "sab": sab(),
            "needsPerson": rflag + tv["flagged"] + wflag,
            "queues": {"radarr": rq, "sonarr": tv["queue"]["total"], "whisparr": len(wq)},
            "main": main, "bulk": bulk, "tv": tv,
            "jobs": [cronjob_state(c) for c in CRONJOBS],
        }


    class Handler(BaseHTTPRequestHandler):
        def log_message(self, *a):
            pass

        def _send(self, code, body, ctype):
            raw = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(raw)))
            self.send_header("Cache-Control", "no-store, must-revalidate")
            self.end_headers()
            self.wfile.write(raw)

        def do_GET(self):
            if self.path.startswith("/api/status"):
                try:
                    self._send(200, json.dumps(collect()), "application/json")
                except Exception as e:
                    self._send(500, json.dumps({"error": str(e)[:300]}), "application/json")
            elif self.path == "/healthz":
                self._send(200, "ok", "text/plain")
            else:
                with open("/app/index.html") as f:
                    self._send(200, f.read(), "text/html; charset=utf-8")


    if __name__ == "__main__":
        ThreadingHTTPServer(("", PORT), Handler).serve_forever()
  index.html: |
    <!-- Rendered by movie_status.py. React from CDN, no build step: this is
         a one-user LAN dashboard, and a toolchain to maintain would cost
         more than it saves. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Media pipeline status</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9; --card: #fff; --ink: #14161a; --muted: #666e7a;
        --line: #e3e6ea; --accent: #2f6feb; --good: #1a7f4b; --warn: #b45309;
        --bad: #b42318; --track: #e8ebef;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1216; --card: #171b21; --ink: #e8eaed; --muted: #98a1ad;
          --line: #262c34; --accent: #6ea8fe; --good: #4ade80; --warn: #fbbf24;
          --bad: #f87171; --track: #232931;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink);
             font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 60px; }
      header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
               margin-bottom: 18px; }
      h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
      .stamp { color: var(--muted); font-size: 13px; }
      button { margin-left: auto; font: inherit; font-weight: 600; cursor: pointer;
               background: var(--accent); color: #fff; border: 0; border-radius: 8px;
               padding: 8px 16px; }
      button[disabled] { opacity: .55; cursor: default; }
      .card { background: var(--card); border: 1px solid var(--line);
              border-radius: 12px; padding: 18px; margin-bottom: 16px; }
      .card > h2 { font-size: 16px; margin: 0 0 2px; }
      .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
      .badge { display: inline-block; font-size: 12px; font-weight: 600;
               padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line);
               color: var(--muted); }
      .badge.on { color: var(--good); border-color: currentColor; }
      .badge.off { color: var(--muted); }
      .badge.man { color: var(--warn); border-color: currentColor; }
      .nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
              gap: 12px; margin-bottom: 16px; }
      .num { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
      .num b { display: block; font-size: 24px; font-weight: 650; letter-spacing: -.02em; }
      .num span { color: var(--muted); font-size: 12px; }
      .bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden;
             display: flex; margin: 4px 0 6px; }
      .bar i { display: block; height: 100%; }
      .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted);
                font-size: 12px; margin-bottom: 14px; }
      .legend s { width: 8px; height: 8px; border-radius: 2px; display: inline-block;
                  margin-right: 5px; }
      .eta { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
      .eta b { color: var(--ink); }
      h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
           color: var(--muted); margin: 16px 0 8px; }
      ul { margin: 0; padding: 0; list-style: none; }
      li { padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px;
           display: flex; gap: 10px; }
      li span { color: var(--muted); font-size: 12px; margin-left: auto;
                white-space: nowrap; }
      .alert { border-left: 3px solid var(--bad); background: color-mix(in srgb, var(--bad) 7%, transparent);
               border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
      .alert b { color: var(--bad); }
      .none { color: var(--muted); font-size: 14px; }
      .err { color: var(--bad); }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      td { padding: 5px 0; border-top: 1px solid var(--line); }
      td:last-child { text-align: right; color: var(--muted); }
    </style>
    <div id="root" class="wrap"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
    <script>
    const html = htm.bind(React.createElement);
    const {useState, useEffect, useCallback} = React;
    const pct = (n, d) => d > 0 ? Math.round(n / d * 1000) / 10 : 0;
    const when = s => s ? new Date(s).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : '-';
    const ago = s => { if(!s) return '-'; const m=Math.round((Date.now()-new Date(s))/60000);
      return m<60 ? m+'m ago' : (m<1440 ? Math.round(m/60)+'h ago' : Math.round(m/1440)+'d ago'); };
    const N = v => (v===null||v===undefined) ? '?' : v.toLocaleString();

    function Num({v, label}) {
      return html`<div class="num"><b>${N(v)}</b><span>${label}</span></div>`;
    }

    function Health({d}) {
      const stall = d.health.stall || {};
      const stalled = Object.keys(stall).filter(k => stall[k].stalled);
      const need = d.needsPerson || [];
      const ok = !stalled.length && !need.length;
      return html`<div class="card">
        <h2>Right now ${ok ? html`<span class="badge on">all moving</span>`
                           : html`<span class="badge" style=${{color:'var(--bad)',borderColor:'currentColor'}}>needs a look</span>`}</h2>
        <div class="sub">
          ${d.sab.ok ? html`SABnzbd ${d.sab.paused ? 'paused' : d.sab.speed} - ${d.sab.jobs} jobs.` : html`SABnzbd unreadable.`}
          ${' '}Queues: radarr ${d.queues.radarr}, sonarr ${d.queues.sonarr}, whisparr ${d.queues.whisparr}.
          ${' '}${d.freeTB} TB free.
          ${d.health.checkedAt ? html` Stall check ${ago(d.health.checkedAt)}.` : html` Stall watcher has not run yet.`}
        </div>
        ${stalled.length ? html`<div class="alert">
          <b>Not moving: ${stalled.join(', ')}.</b> Queue is non-empty and bytes-left has not
          dropped across consecutive checks. Clear dead items through the owning app's queue
          (blocklist=true) so they are re-searched, then re-check - more usually surface behind them.
        </div>` : null}
        ${need.length ? html`<div class="alert">
          <b>${need.length} item${need.length>1?'s':''} stuck.</b> These never clear themselves.
          <ul>${need.slice(0,8).map((f,i)=>html`<li key=${i}>${f.title}<span>${f.why}</span></li>`)}</ul>
        </div>` : null}
        ${ok ? html`<div class="none">Nothing flagged, nothing stalled.</div>` : null}
      </div>`;
    }

    function Movies({d, free}) {
      const done=d.replaced, q=d.queue.total, left=d.remaining, total=done+q+left||1;
      return html`<div class="card">
        <h2>Main library <span class="badge">${d.root}</span></h2>
        <div class="sub">Replacing poor copies with better ones. ${N(d.titles)} titles.</div>
        <div class="nums">
          <${Num} v=${done} label="replaced" /><${Num} v=${q} label="in the queue" />
          <${Num} v=${left} label="left to search" /><${Num} v=${d.meetCutoff} label="at Bluray-1080p" />
        </div>
        <div class="bar">
          <i style=${{width:pct(done,total)+'%',background:'var(--good)'}}></i>
          <i style=${{width:pct(q,total)+'%',background:'var(--accent)'}}></i></div>
        <div class="legend">
          <span><s style=${{background:'var(--good)'}}></s>done ${pct(done,total)}%</span>
          <span><s style=${{background:'var(--accent)'}}></s>queued (${d.queue.usenet} usenet / ${d.queue.torrent} torrent)</span>
          <span><s style=${{background:'var(--track)'}}></s>remaining</span></div>
        <div class="eta">${d.nights
          ? html`<b>${d.nights}</b> more nights at ${d.batch}/night - about <b>${d.eta}</b>.`
          : html`Backlog finished.`}</div>
        <h3>Still below cutoff (${N(d.belowCutoff)})</h3>
        <table><tbody>
          <tr><td>Under 720p</td><td>${N(d.tiers['1'])}</td></tr>
          <tr><td>720p</td><td>${N(d.tiers['2'])}</td></tr>
          <tr><td>1080p, not Bluray</td><td>${N(d.tiers['3'])}</td></tr>
        </tbody></table>
        <div class="eta" style=${{marginTop:'10px'}}>A title that went 480p to WEB 1080p is a big
          win but still below a Bluray cutoff - it counts here and will not be searched again.</div>
        <${Recent} d=${d} />
      </div>`;
    }

    function Bulk({d}) {
      const have=d.withFile, q=d.queue.total, total=d.titles||1;
      return html`<div class="card">
        <h2>Midday movies <span class="badge man">run by hand</span></h2>
        <div class="sub">${d.root} - titles with no copy at all. ${N(d.titles)} tracked.</div>
        <div class="nums">
          <${Num} v=${have} label="found and kept" /><${Num} v=${q} label="in the queue" />
          <${Num} v=${d.remaining} label="still missing" /><${Num} v=${d.searched} label="searched" />
        </div>
        <div class="bar">
          <i style=${{width:pct(have,total)+'%',background:'var(--good)'}}></i>
          <i style=${{width:pct(q,total)+'%',background:'var(--accent)'}}></i></div>
        <div class="legend">
          <span><s style=${{background:'var(--good)'}}></s>have ${pct(have,total)}%</span>
          <span><s style=${{background:'var(--accent)'}}></s>queued</span>
          <span><s style=${{background:'var(--track)'}}></s>missing</span></div>
        <div class="eta">No schedule - only moves when <b>bulk_backfill.py</b> is run.
          ${d.searched===null?'':html` ${N(total-d.searched)} never searched, about
          ${Math.ceil((total-d.searched)/d.batch)} more batches of ${d.batch}.`}</div>
        <${Recent} d=${d} />
      </div>`;
    }

    function TV({d}) {
      return html`<div class="card">
        <h2>TV <span class="badge">${d.series} series</span></h2>
        <div class="sub">Legacy XviD/DivX episodes have no hardware decoder on the TV, so Jellyfin
          transcodes them. That is the codec worth chasing, not resolution.</div>
        <div class="nums">
          <${Num} v=${d.episodeFiles} label="episode files" />
          <${Num} v=${d.legacyFiles} label="legacy codec" />
          <${Num} v=${d.queue.total} label="in the queue" />
          <${Num} v=${d.shows.length} label="shows affected" />
        </div>
        <div class="bar">
          <i style=${{width:pct(d.episodeFiles-d.legacyFiles,d.episodeFiles||1)+'%',background:'var(--good)'}}></i></div>
        <div class="legend"><span><s style=${{background:'var(--good)'}}></s>modern
          ${pct(d.episodeFiles-d.legacyFiles,d.episodeFiles||1)}%</span>
          <span><s style=${{background:'var(--track)'}}></s>legacy</span></div>
        ${d.shows.length ? html`<h3>Worst offenders</h3><table><tbody>
          ${d.shows.map((s,i)=>html`<tr key=${i}><td>${s.title}${s.upgradeAllowed?'':' *'}</td>
            <td>${s.legacy} of ${s.files}</td></tr>`)}
        </tbody></table>
        <div class="eta" style=${{marginTop:'10px'}}>* profile does not allow upgrades, so Sonarr
          will never replace these on its own.</div>` : html`<div class="none">No legacy codecs left.</div>`}
      </div>`;
    }

    function Recent({d}) {
      return html`<div>
        <h3>Landed - ${d.imported24h} in 24h, ${d.imported7d} in 7 days${d.failed7d?`, ${d.failed7d} failed`:''}</h3>
        ${d.recent.length
          ? html`<ul>${d.recent.map((r,i)=>html`<li key=${i}>${r.title} ${r.year?`(${r.year})`:''}
              <span>${r.quality} - ${ago(r.date)}</span></li>`)}</ul>`
          : html`<div class="none">Nothing in the window this covers.</div>`}
      </div>`;
    }

    function Jobs({jobs}) {
      return html`<div class="card">
        <h2>Unattended jobs</h2>
        <div class="sub">These run without anyone watching. Two of them switch themselves off when
          their backlog is done.</div>
        <table><tbody>
          ${jobs.map((j,i)=>html`<tr key=${i}>
            <td>${j.name}${j.found && j.suspended ? ' - retired' : ''}</td>
            <td>${j.found ? html`${j.schedule} - last ${ago(j.lastRun)}` : 'unreadable'}</td>
          </tr>`)}
        </tbody></table>
      </div>`;
    }

    function App() {
      const [d,setD]=useState(null); const [err,setErr]=useState(null); const [busy,setBusy]=useState(false);
      const load=useCallback(()=>{ setBusy(true); setErr(null);
        fetch('/api/status',{cache:'no-store'}).then(r=>r.json())
          .then(j=>j.error?Promise.reject(new Error(j.error)):setD(j))
          .catch(e=>setErr(e.message)).finally(()=>setBusy(false)); },[]);
      useEffect(load,[load]);
      return html`<div>
        <header>
          <h1>Media pipeline</h1>
          <div class="stamp">${d?`as at ${when(d.generated)}`:busy?'loading':''}</div>
          <button onClick=${load} disabled=${busy}>${busy?'Refreshing':'Refresh'}</button>
        </header>
        ${err && html`<div class="card err">Could not read the pipeline: ${err}</div>`}
        ${d && html`<${Health} d=${d} />`}
        ${d && html`<${Movies} d=${d.main} free=${d.freeTB} />`}
        ${d && html`<${Bulk} d=${d.bulk} />`}
        ${d && html`<${TV} d=${d.tv} />`}
        ${d && html`<${Jobs} jobs=${d.jobs} />`}
      </div>`;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
    </script>
