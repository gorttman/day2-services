# seed ConfigMap holds the list as of 2026-10-10 and is copied in by an
# init container ONLY if the PVC has no state yet, so the button's own
# updates are never overwritten. bulk_backfill.py (host script) no longer
# shares this list: use the status page's "search more" button.
