<!-- Rendered by movie_status.py. React from CDN, no build step: a
     one-user LAN dashboard, where a toolchain would cost more than it
     saves.

     Colours are the dataviz reference palette used verbatim - the first
     three categorical slots plus the fixed status palette. Nothing was
     re-stepped or invented, so the documented validation for that set
     still applies (the validator itself needs node, which this host
     does not have). Only two categorical slots are ever on screen at
     once; "remaining" is the neutral track, not a third hue, because it
     is absence rather than a category.

     Status colours are reserved for state and always ship with a label,
     never colour alone - warning and serious sit below 3:1 on the light
     surface by design, and the label is the mitigation. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media pipeline status</title>
<style>
  :root {
    color-scheme: light dark;
    --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --ink3:#77766f;
    --line:#e3e6ea; --track:#e8ebef;
    --s1:#2a78d6; --s2:#eb6834;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --ink3:#96958c;
      --line:#2b2b29; --track:#262624;
      --s1:#3987e5; --s2:#d95926;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--plane); color:var(--ink);
         font:15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width:1040px; margin:0 auto; padding:22px 16px 60px; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  h1 { font-size:19px; margin:0; letter-spacing:-.01em; }
  .stamp { color:var(--ink3); font-size:13px; }
  button { margin-left:auto; font:inherit; font-weight:600; cursor:pointer; background:var(--s1);
           color:#fff; border:0; border-radius:8px; padding:8px 16px; }
  button[disabled] { opacity:.55; cursor:default; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:12px;
          padding:18px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 3px; }
  .sub { color:var(--ink2); font-size:13px; margin-bottom:16px; }

  /* hero: the one number the board leads with */
  .hero { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .hero .figure { font-size:52px; font-weight:650; letter-spacing:-.03em; line-height:1; }
  .hero .what { color:var(--ink2); font-size:14px; }
  .pill { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600;
          border-radius:999px; padding:5px 13px; border:1.5px solid currentColor; }
  .pill .dot { width:9px; height:9px; border-radius:50%; background:currentColor; flex:none; }

  /* KPI row of stat tiles */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px; }
  .kpi { border:1px solid var(--line); border-radius:10px; padding:11px 13px; }
  .kpi b { display:block; font-size:26px; font-weight:650; letter-spacing:-.02em; line-height:1.15; }
  .kpi span { color:var(--ink3); font-size:12px; }

  /* meters and part-to-whole bars: thin marks, 2px surface gaps, rounded data ends */
  .meter { margin:14px 0 6px; }
  .meter .track { height:10px; background:var(--track); border-radius:99px; display:flex; gap:2px;
                  overflow:hidden; }
  .meter .seg { height:100%; }
  .meter .seg:first-child { border-radius:99px 0 0 99px; }
  .meter .seg.cap { border-radius:99px; }
  .labels { display:flex; gap:16px; flex-wrap:wrap; margin-top:9px; font-size:12.5px;
            color:var(--ink2); }
  .labels s { width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:6px;
              text-decoration:none; }
  .labels b { color:var(--ink); font-weight:650; }
  .note { color:var(--ink3); font-size:12.5px; margin-top:10px; }
  .note b { color:var(--ink2); }
  .jobs { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; }
  .job { border:1px solid var(--line); border-radius:10px; padding:11px 13px; }
  .job .n { font-size:13px; font-weight:600; }
  .job .m { color:var(--ink3); font-size:12px; margin-top:3px; }
  .badge { display:inline-block; font-size:11.5px; font-weight:600; padding:2px 8px;
           border-radius:999px; border:1px solid var(--line); color:var(--ink3);
           vertical-align:middle; margin-left:4px; }
  .err { color:var(--critical); }
</style>
<div id="root" class="wrap"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const html = htm.bind(React.createElement);
const {useState, useEffect, useCallback} = React;
const N = v => (v===null||v===undefined) ? '?' : v.toLocaleString();
const pc = (n,d) => d>0 ? Math.round(n/d*1000)/10 : 0;
const when = s => s ? new Date(s).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : '-';
const ago = s => { if(!s) return 'never'; const m=Math.round((Date.now()-new Date(s))/60000);
  return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'; };

function Kpi({v,label}) { return html`<div class="kpi"><b>${v}</b><span>${label}</span></div>`; }

// Part-to-whole. Segments carry a 2px surface gap; the track itself is the
// remainder, so absence is never given a hue of its own.
function Meter({segs,total}) {
  return html`<div class="meter">
    <div class="track">
      ${segs.filter(s=>s.v>0).map((s,i)=>html`<i key=${i} class=${'seg'+(segs.filter(x=>x.v>0).length===1?' cap':'')}
        style=${{width:pc(s.v,total)+'%', background:s.c}}></i>`)}
    </div>
    <div class="labels">
      ${segs.map((s,i)=>html`<span key=${i}><s style=${{background:s.c}}></s>${s.k} <b>${N(s.v)}</b></span>`)}
      <span><s style=${{background:'var(--track)'}}></s>${'remaining'} <b>${N(total-segs.reduce((a,s)=>a+s.v,0))}</b></span>
    </div>
  </div>`;
}

function Health({d}) {
  const stalled = Object.keys(d.health.stall||{}).filter(k=>d.health.stall[k].stalled);
  const stuck = (d.needsPerson||[]).length;
  const bad = stalled.length>0, warn = stuck>0;
  const state = bad ? {t:'Stalled', c:'var(--critical)'} : warn ? {t:'Needs a look', c:'var(--warning)'}
                                                                : {t:'All moving', c:'var(--good)'};
  const dl = (d.inFlight||[]).length;
  return html`<div class="card">
    <div class="hero">
      <div>
        <div class="figure" style=${{color:state.c}}>${dl}</div>
        <div class="what">downloading right now</div>
      </div>
      <div style=${{marginLeft:'auto',textAlign:'right'}}>
        <div class="pill" style=${{color:state.c}}><i class="dot"></i>${state.t}</div>
        <div class="what" style=${{marginTop:'8px'}}>stall check ${ago(d.health.checkedAt)}</div>
      </div>
    </div>
    <div class="kpis" style=${{marginTop:'18px'}}>
      <${Kpi} v=${stuck} label="stuck, needs a person" />
      <${Kpi} v=${d.sab.ok ? (d.sab.paused?'paused':d.sab.speed) : '?'} label="usenet speed" />
      <${Kpi} v=${N(d.queues.radarr+d.queues.sonarr+d.queues.whisparr)} label="queued in total" />
      <${Kpi} v=${d.freeTB+' TB'} label="free space" />
    </div>
    ${bad ? html`<div class="note"><b>Not moving:</b> ${stalled.join(', ')} - queue is
      non-empty and bytes-left has not dropped across consecutive checks.</div>` : null}
    ${warn && !bad ? html`<div class="note"><b>${stuck} stuck item${stuck>1?'s':''}</b> -
      these never clear themselves; Activity, then Queue, in the owning app.</div>` : null}
  </div>`;
}

const sz = b => { if(b===null||b===undefined) return null;
  return b>=1e12 ? (b/1e12).toFixed(2)+' TB' : b>=1e9 ? (b/1e9).toFixed(0)+' GB' : (b/1e6).toFixed(0)+' MB'; };

// One shape for every group, so four different jobs can be compared at a
// glance instead of each inventing its own layout.
function Group({g}) {
  const rest = Math.max(g.total - g.done - g.queued - g.downloading, 0);
  return html`<div class="card">
    <h2>${g.name} <span class="badge">${g.root}</span></h2>
    <div class="sub">${g.note}</div>
    <div class="hero">
      <div>
        <div class="figure">${N(g.done)}<span style=${{fontSize:'22px',color:'var(--ink3)'}}> of ${N(g.total)}</span></div>
        <div class="what">${g.what} - ${pc(g.done,g.total)}%</div>
      </div>
      <div class="kpis" style=${{flex:'1 1 300px'}}>
        <${Kpi} v=${N(g.queued)} label="queued" />
        <${Kpi} v=${N(g.downloading)} label="downloading" />
        <${Kpi} v=${N(g.finished)} label="finished" />
      </div>
    </div>
    <${Meter} segs=${[
      {k:'finished', v:g.done, c:'var(--s1)'},
      {k:'downloading', v:g.downloading, c:'var(--s2)'}]} total=${g.total} />
    <div class="note">
      ${g.onDisk!==null ? html`<b>${sz(g.onDisk)}</b> on disk. ` : null}
      ${g.inFlight ? html`<b>${sz(g.inFlight)}</b> in flight. ` : null}
      ${g.nights ? html`About <b>${g.nights}</b> more nights - <b>${g.eta}</b>.` : null}
    </div>
  </div>`;
}

function Jobs({jobs}) {
  return html`<div class="card">
    <h2>Unattended jobs</h2>
    <div class="sub">Two of these switch themselves off once their backlog is done.</div>
    <div class="jobs">
      ${jobs.map((j,i)=>{
        const c = !j.found ? 'var(--critical)' : j.suspended ? 'var(--ink3)' : 'var(--good)';
        const t = !j.found ? 'unreadable' : j.suspended ? 'retired' : 'active';
        return html`<div class="job" key=${i}>
          <div class="n">${j.name}</div>
          <div style=${{marginTop:'7px'}}><span class="pill" style=${{color:c,fontSize:'12px',padding:'3px 10px'}}>
            <i class="dot"></i>${t}</span></div>
          <div class="m">${j.found ? `${j.schedule} - ran ${ago(j.lastRun)}` : (j.error||'')}</div>
        </div>`;
      })}
    </div>
  </div>`;
}

function App() {
  const [d,setD]=useState(null); const [err,setErr]=useState(null); const [busy,setBusy]=useState(false);
  const load=useCallback(()=>{ setBusy(true); setErr(null);
    fetch('/api/status',{cache:'no-store'}).then(r=>r.json())
      .then(j=>j.error?Promise.reject(new Error(j.error)):setD(j))
      .catch(e=>setErr(e.message)).finally(()=>setBusy(false)); },[]);
  useEffect(load,[load]);
  if (err) return html`<div><header><h1>Media pipeline</h1>
    <button onClick=${load} disabled=${busy}>Retry</button></header>
    <div class="card err">Could not read the pipeline: ${err}</div></div>`;
  return html`<div>
    <header><h1>Media pipeline</h1>
      <div class="stamp">${d?`as at ${when(d.generated)}`:busy?'loading':''}</div>
      <button onClick=${load} disabled=${busy}>${busy?'Refreshing':'Refresh'}</button></header>
    ${d && html`<${Health} d=${d} />`}
    ${d && (d.groups||[]).map((g,i)=>html`<${Group} key=${i} g=${g} />`)}
    ${d && html`<${Jobs} jobs=${d.jobs} />`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
