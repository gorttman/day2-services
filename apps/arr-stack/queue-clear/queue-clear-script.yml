# Runs the same "Clear" the movie-status board's button already offers,
# on a schedule instead of waiting for a person to notice and click it.
#
# No logic lives here - it just POSTs to movie-status's own
# /api/run/unstick handler, so this can never drift from what the
# button does. That handler (see run_unstick() in movie_status.py) only
# ever touches items stuck_reason() calls clearable: dead/no-progress
# entries, empty phantom queue rows, and releases carrying a bundled
# executable. Anything that downloaded fine but only failed to import
# ("Manual Import required", "already imported") is deliberately left
# alone - stuck_reason() returns None for those - because blocklisting
# a release that actually worked bans a good release for nothing. That
# case is handled by the second step (fiximports), which only acts where
# the right answer is not a judgement call. The third step feeds the next
# batch of midday-movie searches once the previous one has drained.
apiVersion: v1
kind: ConfigMap
metadata:
  name: queue-clear-script
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: queue-clear
    argocd.argoproj.io/managed-by: argocd
data:
  queue_clear.py: |
    #!/usr/bin/env python3
    # Three steps, in order, each independent so one failing does not stop
    # the others:
    #   unstick     clear dead downloads (the board's Clear button)
    #   fiximports  resolve the safe "needs you" items (see run_fiximports)
    #   feed        search the next 50 midday movies if the pipe has drained
    import json
    import urllib.error
    import urllib.request

    BASE = "http://movie-status.arr-stack.svc.cluster.local/api/run/"
    rc = 0

    for step, timeout in (("unstick", 60), ("fiximports", 240), ("feed", 120)):
        try:
            with urllib.request.urlopen(urllib.request.Request(BASE + step, method="POST"),
                                        timeout=timeout) as r:
                body = json.load(r)
        except (urllib.error.URLError, OSError, ValueError) as e:
            print("%s: FAILED - %s" % (step, e))
            rc = 1
            continue
        print("%s: %s" % (step, body.get("message", json.dumps(body))))
        for key in ("fixed", "left", "failed"):
            for f in body.get(key, []):
                print("  %s %s %s - %s" % (key, f.get("app", ""), f.get("title", ""),
                                           f.get("did") or f.get("why", "")))
        for f in body.get("failed", []) if step == "unstick" else []:
            rc = 1
    raise SystemExit(rc)
