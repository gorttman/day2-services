# seed_config.py, mounted read-only into the qbittorrent-config-init
# INIT container - see arr-stack-deployment.yml's comment for why this
# runs before qBittorrent's own container starts, not as a sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-config-seed-script
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: qbittorrent
    argocd.argoproj.io/managed-by: argocd
data:
  seed_config.py: |
    #!/usr/bin/env python3
    # Ensures qBittorrent.conf (plain INI, [Preferences] section) has
    # the keys automation needs, before qBittorrent's own process ever
    # starts. Runs to completion and exits - this is an initContainer,
    # not a long-running sidecar, so it re-runs fresh on every pod
    # (re)start with no in-memory state on either side to race against.
    #
    # WebUI\LocalHostAuth=false - every other container in this pod calls
    # qBittorrent over localhost (shared network namespace), same as every
    # other app-to-app call in this stack. Bypassing auth for genuine
    # 127.0.0.1 traffic only is qBittorrent's own documented mechanism for
    # this, not a workaround - it does not open the WebUI to anything
    # outside the pod, since Ingress-routed traffic arrives from the
    # ingress controller's pod IP, not from 127.0.0.1.
    #
    # WebUI\HostHeaderValidation=false - qBittorrent rejects any request
    # whose Host header it doesn't recognise (its own anti-DNS-rebinding
    # protection) - without this, the Ingress path (Host: qbittorrent.
    # i3sec.com.au) gets rejected outright regardless of credentials.
    # Well-documented behaviour for any qBittorrent instance behind a
    # reverse proxy, not specific to this cluster.
    #
    # Downloads\SavePath - same shared /downloads mount Sonarr/Radarr/
    # SABnzbd already use, so a finished torrent import is a plain rename
    # like every other download client here, not a cross-filesystem copy.
    #
    # Writing this BEFORE qBittorrent ever starts (not patching a live
    # instance) is the actual fix for a real bug found live 2026-08-25:
    # qBittorrent (Qt/QSettings) holds its whole config in memory for its
    # process lifetime and flushes it back to disk wholesale on graceful
    # shutdown, which silently reverted an external edit made to a file
    # it already had open, causing an infinite whole-pod restart loop.
    # There's nothing running yet when this executes, so there's nothing
    # to revert it.
    import configparser
    import os

    CONFIG_PATH = "/config/qBittorrent/qBittorrent.conf"

    DESIRED = {
        "Preferences": {
            "WebUI\\LocalHostAuth": "false",
            "WebUI\\HostHeaderValidation": "false",
            "Downloads\\SavePath": "/downloads/",
        },
        # Queue limits. Seeded here, not set through the WebUI API,
        # because API-set values do not survive a pod restart - proven
        # live 2026-09-07: all four were raised via
        # POST /api/v2/app/setPreferences, confirmed applied, and were
        # back at their old values within the hour once vpn-healer
        # recreated the pod on a PIA peer rotation. Qt only flushes its
        # in-memory config wholesale at shutdown, so anything set at
        # runtime is lost whenever the pod goes away without a clean
        # flush - which, for this pod, is routine rather than rare.
        #
        # The defaults (10/15/5) are far too low for a bulk backfill.
        # With 15 active slots, a handful of magnets stuck in metaDL
        # plus a few stalled torrents held every slot and 38 healthy
        # torrents sat queued behind them, whole-client throughput
        # 13 kB/s. IgnoreSlowTorrentsForQueueing is the structural half
        # of the fix: a torrent doing nothing stops occupying a slot at
        # all, so a dead magnet can no longer wedge the queue the way
        # it did.
        "BitTorrent": {
            "Session\\MaxActiveDownloads": "20",
            "Session\\MaxActiveTorrents": "40",
            "Session\\MaxActiveUploads": "10",
            "Session\\IgnoreSlowTorrentsForQueueing": "true",
        },
    }

    os.makedirs(os.path.dirname(CONFIG_PATH), exist_ok=True)

    cp = configparser.ConfigParser()
    cp.optionxform = str  # preserve case - qBittorrent's own keys are mixed-case
    cp.read(CONFIG_PATH)
    changed = False
    for section, keys in DESIRED.items():
        if not cp.has_section(section):
            cp.add_section(section)
        for key, value in keys.items():
            current = cp.get(section, key, fallback=None)
            if current != value:
                cp.set(section, key, value)
                changed = True
                print(f"{section}.{key}: {current!r} -> {value!r}", flush=True)

    if changed:
        with open(CONFIG_PATH, "w") as f:
            # space_around_delimiters=False writes qBittorrent's own
            # native format instead of configparser's "key = value".
            # NOT the fix for the queue limits - that hypothesis was
            # tested on 2026-09-10 and disproved: with this in place the
            # init container patched 20/40/10 in native format, its log
            # said so, and qBittorrent still came up at 10/15/5 and
            # rewrote the file four seconds later. Kept anyway, because
            # rewriting the whole file in a foreign format is worth
            # avoiding on its own. The limits are now enforced through
            # the WebUI API by the qbittorrent-prefs sidecar instead -
            # see enforce_prefs.py below.
            # Original note kept for the record: configparser
            # defaults to writing "key = value"; qBittorrent writes and
            # expects "key=value", and rewriting the whole file in the
            # spaced form is what made this seed silently ineffective -
            # the init container patched 10/15/5 -> 20/40/10 on every
            # single boot (its log says so), and qBittorrent came up with
            # the old values anyway and flushed them back over the file
            # minutes later. Found 2026-09-10, after the queue wedged a
            # second time with 61 torrents stuck behind 15 dead slots.
            cp.write(f, space_around_delimiters=False)
        print("qBittorrent.conf seeded/patched", flush=True)
    else:
        print("qBittorrent.conf already correct, nothing to do", flush=True)
  enforce_prefs.py: |
    #!/usr/bin/env python3
    """Keep qBittorrent's queue limits at the values we actually want.

    Seeding qBittorrent.conf does not work for these keys, and that is not
    a formatting problem - it was tested. On 2026-09-10 the init container
    patched the file to 20/40/10 in qBittorrent's own native format (no
    spaces around "="), its log confirmed the change, and qBittorrent still
    came up at the stock 10/15/5 four seconds later and rewrote the file.
    Its own log shows no config error. Whatever the reason, qBittorrent
    does not honour these three keys from disk on this build, while it does
    honour others seeded the same way in the same file - IgnoreSlow-
    TorrentsForQueueing has survived every restart.

    So stop arguing with the config file. The WebUI API applies these
    immediately and reliably, which is proven every time someone fixes the
    jam by hand. This asserts them through that API instead, once qBittorrent
    is actually up, and then keeps re-asserting - same shape as
    arr-wiring-reconciler, and for the same reason: re-applying desired
    state on a loop is simpler and more honest than tracking drift.

    Why it matters that this is enforced rather than set once: at the stock
    15 active-torrent limit, a handful of dead magnets in metaDL takes the
    whole client to zero throughput with dozens of healthy torrents queued
    behind them. That has now happened twice, on 2026-09-07 and again on
    2026-09-10.
    """
    import json
    import os
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    BASE = os.environ.get("QBIT_URL", "http://localhost:8090")
    INTERVAL = int(os.environ.get("INTERVAL_SECONDS", "300"))
    DESIRED = {
        "max_active_downloads": int(os.environ.get("MAX_ACTIVE_DOWNLOADS", "20")),
        "max_active_torrents": int(os.environ.get("MAX_ACTIVE_TORRENTS", "40")),
        "max_active_uploads": int(os.environ.get("MAX_ACTIVE_UPLOADS", "10")),
        # The structural half of the fix: a torrent doing nothing stops
        # occupying a slot at all, so a dead magnet cannot wedge the queue.
        "dont_count_slow_torrents": True,
        "queueing_enabled": True,
    }


    def log(msg):
        print("%s  %s" % (time.strftime("%Y-%m-%dT%H:%M:%S"), msg), flush=True)


    def get_prefs():
        with urllib.request.urlopen(BASE + "/api/v2/app/preferences", timeout=20) as r:
            return json.load(r)


    def set_prefs(payload):
        data = urllib.parse.urlencode({"json": json.dumps(payload)}).encode()
        req = urllib.request.Request(BASE + "/api/v2/app/setPreferences", data=data,
                                     method="POST")
        with urllib.request.urlopen(req, timeout=20) as r:
            return r.status


    def main():
        # No auth: WebUI\LocalHostAuth=false, and this runs in the same pod,
        # so every call is genuine 127.0.0.1 - the same path every other
        # app-to-app call in this stack already uses.
        while True:
            try:
                current = get_prefs()
                drift = {k: v for k, v in DESIRED.items() if current.get(k) != v}
                if drift:
                    set_prefs(drift)
                    after = get_prefs()
                    still = {k: after.get(k) for k in drift if after.get(k) != DESIRED[k]}
                    if still:
                        log("applied %s but qBittorrent still reports %s" % (drift, still))
                    else:
                        log("corrected %s" % drift)
            except urllib.error.URLError as e:
                # Expected while qBittorrent is still starting, or during the
                # window where gluetun is reconnecting the tunnel.
                log("qBittorrent not reachable yet (%s)" % str(e)[:80])
            except Exception as e:
                log("unexpected: %s" % str(e)[:150])
            time.sleep(INTERVAL)


    if __name__ == "__main__":
        main()
