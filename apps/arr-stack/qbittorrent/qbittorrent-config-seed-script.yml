# seed_config.py, mounted read-only into the qbittorrent-config-seed
# sidecar - see arr-stack-deployment.yml's comment for why this exists.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-config-seed-script
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: qbittorrent
    argocd.argoproj.io/managed-by: argocd
data:
  seed_config.py: |
    #!/usr/bin/env python3
    # Patches qBittorrent.conf (plain INI, [Preferences] section) once
    # qBittorrent creates it on first boot, then restarts qBittorrent's
    # own process (not the whole pod) so it picks the change up.
    #
    # WebUI\LocalHostAuth=false - every other container in this pod calls
    # qBittorrent over localhost (shared network namespace), same as every
    # other app-to-app call in this stack. Bypassing auth for genuine
    # 127.0.0.1 traffic only is qBittorrent's own documented mechanism for
    # this, not a workaround - it does not open the WebUI to anything
    # outside the pod, since Ingress-routed traffic arrives from the
    # ingress controller's pod IP, not from 127.0.0.1.
    #
    # WebUI\HostHeaderValidation=false - qBittorrent rejects any request
    # whose Host header it doesn't recognise (its own anti-DNS-rebinding
    # protection) - without this, the Ingress path (Host: qbittorrent.
    # i3sec.com.au) gets rejected outright regardless of credentials.
    # Well-documented behaviour for any qBittorrent instance behind a
    # reverse proxy, not specific to this cluster.
    #
    # Downloads\SavePath - same shared /downloads mount Sonarr/Radarr/
    # SABnzbd already use, so a finished torrent import is a plain rename
    # like every other download client here, not a cross-filesystem copy.
    #
    # RESTART MECHANISM - deliberately NOT the whole-pod self-delete every
    # other config-seed sidecar here uses. Confirmed live 2026-08-25:
    # qBittorrent (Qt/QSettings) holds its entire config in memory for its
    # whole process lifetime and flushes it back to qBittorrent.conf
    # wholesale on graceful shutdown - restarting the whole pod sends
    # qBittorrent a normal SIGTERM as part of that, so its own shutdown
    # handler immediately overwrote this script's just-written keys with
    # its stale in-memory copy (which never had them), before the pod
    # even finished restarting. Every fresh pod's qBittorrent.conf was
    # missing the WebUI keys again, so this patched and restarted the
    # whole pod again, forever - an infinite ~30s restart loop that took
    # down every other app in the shared pod too (Sonarr/Radarr/Prowlarr/
    # SABnzbd), not just qBittorrent. Fix: find qBittorrent's own process
    # directly (needs shareProcessNamespace: true on the pod, see
    # arr-stack-deployment.yml) and SIGKILL it specifically - that skips
    # its graceful-shutdown handler entirely, so the file this script
    # just wrote survives, and only qBittorrent itself restarts (s6
    # supervises it as a child process, same as every other app here).
    import configparser
    import os
    import signal
    import subprocess
    import time

    CONFIG_PATH = "/config/qBittorrent/qBittorrent.conf"
    RECHECK_INTERVAL_SECONDS = 300

    BASE_DESIRED = {
        "Preferences": {
            "WebUI\\LocalHostAuth": "false",
            "WebUI\\HostHeaderValidation": "false",
            "Downloads\\SavePath": "/downloads/",
        },
    }


    def wait_for_config():
        while not os.path.exists(CONFIG_PATH):
            print("waiting for qBittorrent to create qBittorrent.conf...", flush=True)
            time.sleep(5)
        # Give the app a moment past file-creation to finish its own
        # first-run writes before this reads/rewrites it.
        time.sleep(5)


    def patch_config():
        cp = configparser.ConfigParser()
        cp.optionxform = str  # preserve case - qBittorrent's own keys are mixed-case
        cp.read(CONFIG_PATH)
        changed = False
        for section, keys in BASE_DESIRED.items():
            if not cp.has_section(section):
                cp.add_section(section)
            for key, value in keys.items():
                current = cp.get(section, key, fallback=None)
                if current != value:
                    cp.set(section, key, value)
                    changed = True
                    print(f"{section}.{key}: {current!r} -> {value!r}", flush=True)
        if changed:
            with open(CONFIG_PATH, "w") as f:
                cp.write(f)
        return changed


    def find_qbittorrent_pid():
        result = subprocess.run(["ps", "-eo", "pid,args"], capture_output=True, text=True)
        for line in result.stdout.splitlines():
            parts = line.strip().split(maxsplit=1)
            if len(parts) == 2 and "qbittorrent-nox" in parts[1]:
                return int(parts[0])
        return None


    def restart_qbittorrent():
        pid = find_qbittorrent_pid()
        if pid is None:
            print("qbittorrent process not found (shareProcessNamespace not visible yet?) - will retry next pass", flush=True)
            return False
        os.kill(pid, signal.SIGKILL)
        print(f"qbittorrent process (pid {pid}) force-killed - s6 will restart it fresh with the patched config", flush=True)
        return True


    wait_for_config()
    while True:
        try:
            if patch_config():
                print("qBittorrent.conf patched - restarting qbittorrent's own process", flush=True)
                restart_qbittorrent()
                time.sleep(30)
            else:
                print("qbittorrent-config-seed: no change this pass, idling", flush=True)
        except Exception as e:
            print(f"CRIT unhandled error during patch pass: {e}", flush=True)
        time.sleep(RECHECK_INTERVAL_SECONDS)
