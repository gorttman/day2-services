apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: qbittorrent
    argocd.argoproj.io/managed-by: argocd
spec:
  type: ClusterIP
  # The shared pod is NotReady while gluetun CrashLoops on the sealed
  # placeholder VPN creds; keep the UIs reachable regardless.
  publishNotReadyAddresses: true
  selector:
    app: arr-stack
  ports:
  - name: http
    port: 8090
    targetPort: 8090
    protocol: TCP
