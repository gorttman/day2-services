# qBittorrent WebUI login used by Sonarr/Radarr/Whisparr (download clients) now
# that they run in a different pod from qBittorrent. Keys: username, password.
# The qbittorrent-config-init initContainer hashes this into qBittorrent.conf
# (WebUI\Username + Password_PBKDF2); the reconciler hands the same pair to the
# *arr download-client definitions. In-pod callers still skip auth on 127.0.0.1.
# Rotate: re-seal with new values (sudo -E kubeseal, controller kube-system).
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: qbittorrent-auth
  namespace: arr-stack
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      creationTimestamp: null
      name: qbittorrent-auth
      namespace: arr-stack
