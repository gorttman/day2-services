# Real credentials sealed 2026-07-23 - nothing left as a placeholder.
#
# nzbgeek_api_key - NZBgeek's indexer API key, referenced from
# arr-stack-wiring-config.yml's prowlarr.indexers list.
#
# frugal_username / frugal_password - Frugal Usenet's NNTP account
# (the actual news-server login, not an indexer). Applied via
# reconcile_sabnzbd_servers() in arr-stack-wiring-reconciler-script.yml
# against aunews.frugalusenet.com (Sydney) - see wiring.yml's servers
# block.
#
# lazylibrarian_api_key - not an external credential, a self-generated
# token (secrets.token_hex(16)) so lazylibrarian-config-seed.yml can
# turn on LazyLibrarian's own API and drive it the same way every other
# app in this stack is driven (real HTTP calls, not hand-editing its
# database). Treated as a real secret anyway, same as everything else
# here, since the public ingress would expose /api too if this leaked -
# mTLS still gates that, but no reason to keep it in plaintext.
#
# Rotate any one value with: kubeseal --raw --scope strict --namespace
# arr-stack --name arr-stack-wiring-secret, replacing only its line
# below - same pattern as every other multi-field sealed secret in
# this repo.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: arr-stack-wiring-secret
  namespace: arr-stack
spec:
  encryptedData:
    nzbgeek_api_key: 
    frugal_username: 
    frugal_password: 
    lazylibrarian_api_key: 
  template:
    metadata:
      creationTimestamp: null
      name: arr-stack-wiring-secret
      namespace: arr-stack
    type: Opaque
