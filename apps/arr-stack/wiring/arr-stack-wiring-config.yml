# Human-edited desired state for arr-stack's cross-app wiring (SABnzbd
# category, which app gets it as a download client, which Prowlarr
# indexers to run) - edit this file, commit, push. The
# arr-wiring-reconciler sidecar (see arr-stack-wiring-reconciler-script.yml)
# picks it up automatically: mounted as a whole directory, not subPath,
# so kubelet's normal sync updates it in place without a pod restart -
# same "commit away" workflow as the Pi-hole DNS ConfigMap
# (dns-conf/pihole/pihole-custom-dns-cm.yml), minus that one's
# manual-restart limitation, since Sonarr/Radarr/Prowlarr/SABnzbd's
# REST APIs apply changes live (only LazyLibrarian's config.ini-based
# wiring needs a restart, handled separately by
# lazylibrarian-config-seed.yml, which reads this same file).
#
# What's NOT here on purpose: any app's own auto-generated API key.
# Those aren't ours to set or predict - the reconciler reads each one
# live from that app's own config file (config.xml's <ApiKey>, or
# sabnzbd.ini's api_key) every reconcile pass.
apiVersion: v1
kind: ConfigMap
metadata:
  name: arr-stack-wiring-config
  namespace: arr-stack
data:
  wiring.yml: |
    sabnzbd:
      categories:
        - name: books
          dir: /books-import
        # Whisparr's category - empty dir matches the tv/movies
        # convention (confirmed live 2026-08-27: SABnzbd's own
        # get_config shows tv/movies both have an empty dir, meaning
        # "use the default per-category subfolder"; only books
        # overrides it, for the books-pipeline staging step Whisparr
        # has no equivalent of).
        - name: adult
          dir: ""

      # Frugal Usenet account (2026-07-23) - username/password sealed
      # and ready (frugal_username/frugal_password in
      # arr-stack-wiring-sealed-secret.yml). aunews.frugalusenet.com is
      # Frugal's Sydney server, straight from the account's own server
      # list (up to 200 connections allowed there) - picked over the
      # US East Coast main server for the obvious latency win from this
      # network. connections=20 is a conservative default, well under
      # the 200 ceiling; raise it if downloads are connection-starved.
      servers:
        - name: frugal
          host: aunews.frugalusenet.com
          port: 563
          ssl: true
          connections: 20
          usernameSecretKey: frugal_username
          passwordSecretKey: frugal_password

    downloadClients:
      - name: SABnzbd
        implementation: Sabnzbd
        host: localhost
        port: 8080
        apps:
          - app: sonarr
            category: tv
          - app: radarr
            category: movies
          - app: lazylibrarian
            category: books
          - app: whisparr
            category: adult

      # 2026-08-25: torrent protocol coverage - qBittorrent joins the
      # shared pod, same as SABnzbd. No credentials here: WebUI\
      # LocalHostAuth=false (set by qbittorrent-config-seed) bypasses
      # auth entirely for same-pod (genuine 127.0.0.1) calls, which is
      # what every app-to-app call in this stack already is.
      - name: qBittorrent
        implementation: QBittorrent
        host: localhost
        port: 8090
        apps:
          - app: sonarr
            category: tv
          - app: radarr
            category: movies
          - app: whisparr
            category: adult

    # 2026-08-05: matches the tv/movies subPath split on the shared
    # /media NFS export (see arr-stack-deployment.yml) - created once
    # via POST /api/v3/rootfolder if missing, never updated after (a
    # root folder's path is its identity; there's nothing else on it
    # to reconcile).
    sonarr:
      rootFolder: /tv

    radarr:
      rootFolders:
        - /movies
        - /movies-bulk

      # Tells Jellyfin to scan the moment Radarr imports something,
      # instead of Jellyfin only noticing on its own periodic scan.
      # Implementation is "MediaBrowser" (Emby's old name - Jellyfin
      # forked from Emby and speaks the same protocol); Radarr labels
      # it "Emby / Jellyfin" in the UI.
      #
      # No mapFrom/mapTo path mapping: Radarr writes /movies-bulk and
      # Jellyfin reads /movies-bulk - the same path on the same NFS
      # export. Mismatched paths are the usual reason this notification
      # silently does nothing, so it's worth keeping them identical.
      notifications:
        - name: Jellyfin
          implementation: MediaBrowser
          onDownload: true       # fires on import
          onUpgrade: true
          onRename: true
          onMovieDelete: true
          onMovieFileDelete: true
          settings:
            host: jellyfin.jellyfin.svc.cluster.local
            port: 8096
            useSsl: false
            updateLibrary: true
            notify: false        # library refresh only, no user-facing popups
          apiKeySecretKey: jellyfin_api_key

      # Import lists, all targeted at the bulk root folder + capped
      # profile from Phase 2a - never the main /movies library.
      #
      # qualityProfile is by NAME, not id: the profile is itself
      # reconciler-created, so its id isn't stable across a rebuild.
      #
      # Sync interval is NOT set here - Radarr treats minRefreshInterval
      # as a read-only property of each list implementation (confirmed
      # live 2026-08-26: requesting 24:00:00 came back as 12:00:00).
      # Both list types below floor at 12h, i.e. twice daily.
      importLists:
        # Created by hand once (Trakt needs a browser OAuth consent
        # flow - there's no key to paste, so this one entry can't be
        # created headlessly). The reconciler ADOPTS it by name and
        # only manages the fields below; the OAuth tokens Radarr
        # stores are never touched. See the reconciler's own comment.
        - name: Bulk Trakt List
          implementation: TraktListImport
          enabled: true
          rootFolder: /movies-bulk
          qualityProfile: Bulk SD-720p
          settings:
            username: dcswitzer
            listname: hallmark-all
            limit: 100

        # TMDb company lists need only a companyId - no OAuth, no API
        # key - so these are created from nothing by the reconciler.
        # IDs confirmed against themoviedb.org 2026-08-26 along with
        # their real catalog sizes; several same-named companies exist
        # and most are empty stubs (304438 "Hallmark Media" and 215057
        # "Lifetime Movie Network" both return 0 movies, for instance).
        - name: Bulk TMDb - Hallmark Media
          implementation: TMDbCompanyImport
          enabled: true
          rootFolder: /movies-bulk
          qualityProfile: Bulk SD-720p
          settings:
            companyId: "53015"      # 466 movies

        # ~1,485 movies, roughly 2-4TB at this profile's ceiling, on
        # top of everything else here - enabled deliberately 2026-08-26
        # after the capacity numbers were reviewed (14.3TB free at the
        # time), not by default. searchOnAdd stays false so this adds
        # to the library steadily rather than firing thousands of
        # indexer searches at once.
        - name: Bulk TMDb - Lifetime
          implementation: TMDbCompanyImport
          enabled: true
          rootFolder: /movies-bulk
          qualityProfile: Bulk SD-720p
          settings:
            companyId: "3431"       # 1,485 movies

      # Size-cap enforcement lives in a Custom Format, not the global
      # Quality Definitions page - editing that page's per-quality max
      # sizes would also cap SD/720p for the stock HD-1080p/Ultra-HD
      # profiles, which still allow those as fallback tiers. A Custom
      # Format's score only applies within the profile that references
      # it, so this stays scoped to Bulk SD-720p alone. Confirmed live
      # 2026-08-23 against this exact install (Radarr 6.2.1) that
      # SizeSpecification exists as a real custom-format condition -
      # see /api/v3/customformat/schema.
      customFormats:
        - name: Bulk oversized reject
          specifications:
            - implementation: SizeSpecification
              min: 4      # GB - at or above this, hard-rejected
              max: 999

      qualityProfiles:
        - name: Bulk SD-720p
          upgradeAllowed: true
          cutoffQuality: Bluray-720p
          allowedQualities:
            - SDTV
            - DVD
            - WEBDL-480p
            - WEBRip-480p
            - Bluray-480p
            - Bluray-576p
            - HDTV-720p
            - WEBDL-720p
            - WEBRip-720p
            - Bluray-720p
          formatScores:
            - format: Bulk oversized reject
              score: -1000
          minFormatScore: 0

    # /movies-private is Whisparr's own isolated library mount (see
    # arr-stack-deployment.yml's whisparr container comment) - deliberately
    # separate from the /movies and /movies-bulk paths above.
    whisparr:
      rootFolders:
        - /movies-private

    prowlarr:
      # Empty on purpose - which indexer(s) to use is a real choice
      # (cost, retention, reliability), not something to pick a default
      # for. Add entries here once you've settled on a provider, e.g.:
      #
      #   indexers:
      #     - name: NZBgeek          # must match a definitionName in
      #                               # Prowlarr's own indexer/schema list
      #       secretKey: nzbgeek_api_key   # key name in
      #                                     # arr-stack-wiring-sealed-secret.yml
      #
      # Reseal the real key with: kubeseal --raw --scope strict
      # --namespace arr-stack --name arr-stack-wiring-secret, then add
      # the encryptedData line + reference it here - same pattern as
      # every other multi-field sealed secret in this repo.
      # NO FlareSolverr / 1337x here - tried and abandoned 2026-08-26,
      # recorded so it isn't re-attempted. 1337x.to returns a Cloudflare
      # JS challenge from this stack's VPN exit IP, which looked
      # solvable (`cf-mitigated: challenge`, not an IP ban), so
      # FlareSolverr was deployed in-pod. It launched fine and DETECTED
      # the challenge every time, but never solved one: "Error solving
      # the challenge. Timeout after 60.0 seconds", repeatedly. Raising
      # the budget to 180s just got the container OOMKilled (headless
      # Chromium peaked past its 1Gi limit at ~711m CPU) on a node
      # already sitting at ~78% CPU / 67% memory.
      #
      # The fix was not more resources - it was that three other public
      # movie trackers work with no challenge and no extra
      # infrastructure at all. Measured live on the same searches:
      # "Love Comes Softly" went 8 results (usenet only) -> 34, and
      # "The Beach House 2018" 3 -> 27, once these were added. If
      # torrent coverage ever needs widening again, start by testing
      # candidate trackers for a challenge (curl -D- and look for
      # `cf-mitigated`) rather than reaching for FlareSolverr.
      indexers:
        - name: NZBgeek
          secretKey: nzbgeek_api_key
        # 2026-08-25: 1337x - genuinely public torrent tracker, no
        # credentials required (confirmed live against this exact
        # Prowlarr install's own /api/v1/indexer/schema). Occasionally
        # needs FlareSolverr to stay reachable through Cloudflare
        # challenges - not wired up, just a known characteristic of
        # this tracker, not a hidden requirement for it to work at all.
        # Public torrent trackers - no credentials, no proxy, all
        # confirmed live 2026-08-26 to both validate in Prowlarr and
        # return real movie results through this stack's VPN exit IP.
        - name: The Pirate Bay
        - name: LimeTorrents
        - name: YTS

    # Categories for the torrent download client (qBittorrent) - same
    # naming as SABnzbd's for consistency. Created via qBittorrent's own
    # POST /api/v2/torrents/createCategory API, not a config-file edit.
    qbittorrent:
      categories:
        - name: tv
          savePath: /downloads
        - name: movies
          savePath: /downloads
        - name: adult
          savePath: /downloads

      # qBittorrent's own defaults (max_active_downloads: 3,
      # max_active_torrents: 5) silently cap how much of the bulk
      # backlog ever runs at once - everything past the cap sits in
      # queuedDL state and never even attempts a tracker announce, no
      # error anywhere. Found live 2026-08-27: 24 of 27 queued torrents
      # had NEVER contacted a single tracker, hours after being added -
      # this is what "downloads have stalled" actually was. Not
      # unlimited: with ~2,000 titles still to come, letting every one
      # try to run simultaneously would be its own problem.
      # Pinned to AirVPN's forwarded port (see gluetun-config.yml's
      # FIREWALL_VPN_INPUT_PORTS, reserved in AirVPN's Client Area Ports
      # section, 2026-08-27) so qBittorrent is actually reachable for
      # inbound peer/DHT connections through the tunnel - random_port
      # must be off or qBittorrent picks its own port every restart,
      # which the VPN-side firewall isn't admitting. upnp off too:
      # UPnP can't reach past the VPN tunnel to the router anyway, and
      # leaving it on just means qBittorrent wastes time trying.
      preferences:
        listen_port: 30449
        random_port: false
        upnp: false
        max_active_downloads: 10
        max_active_torrents: 15
        max_active_uploads: 5

    lazylibrarian:
      # Format preference for what LazyLibrarian will search for/keep -
      # comma-separated, most preferred first (LazyLibrarian's own
      # EBOOK_TYPE setting, General section). epub-only per 2026-07-24 -
      # books-pipeline converts everything to epub before it ever
      # reaches the library anyway, so this isn't about the final
      # library format, it's about not pulling down mobi/pdf copies
      # into /import that just get discarded at conversion time.
      ebookTypes: epub
