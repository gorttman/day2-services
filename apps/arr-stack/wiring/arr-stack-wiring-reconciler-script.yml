# Reconciler for arr-stack-wiring-config.yml's desired state: SABnzbd's
# category, Sonarr/Radarr's download client, Prowlarr's indexers.
# Applied live via each app's own REST API (schema-driven, same
# mechanism the apps' own web UI uses internally - confirmed 2026-07-23
# against the real running Sonarr 4.0.19/Radarr 6.2.1/Prowlarr
# 2.4.0/SABnzbd 5.0.4 in this pod, not guessed from docs), so unlike
# LazyLibrarian's config.ini-based wiring (see
# lazylibrarian-config-seed.yml), no pod restart is needed - this just
# loops, re-applies the desired state every 5 minutes, and picks up any
# change to the mounted wiring-config automatically (it's a whole-
# directory ConfigMap mount, not subPath, so kubelet's normal sync
# refreshes it in place).
#
# That "no restart" promise is about DATA changes to wiring.yml only -
# load_wiring_config() genuinely re-reads it fresh every pass. It does
# NOT cover CODE changes to this script: Python loads reconcile.py
# once at process start and keeps running those function definitions
# in memory for the container's whole lifetime, so editing this
# ConfigMap updates the file on disk but not the already-running
# process. Learned this the hard way 2026-07-23: the appProfileId fix
# and the whole reconcile_sabnzbd_servers() function sat on disk,
# confirmed correct via one-off `python3 -c` runs (which read the
# current file fresh each time), while the actual long-running
# container kept executing stale pre-fix code and either failing
# deterministically (appProfileId=0 on every real pass, which looked
# like NZBgeek flakiness but wasn't) or silently doing nothing (no
# reconcile_sabnzbd_servers() call existed yet in its loaded memory).
# A code change to this script needs the arr-wiring-reconciler
# container restarted (pod delete, Recreate strategy) to actually take
# effect - the wiring.yml data hot-reload has no such requirement.
#
# Every reconcile pass unconditionally re-applies (POST if missing, PUT
# if it already exists) rather than diffing first - each app's API
# masks privacy-flagged fields like apiKey as "********" on GET, which
# would make a real diff always look changed for the one field that
# actually matters, so "always re-assert desired state" is both
# simpler and more correct than tracking drift.
apiVersion: v1
kind: ConfigMap
metadata:
  name: arr-stack-wiring-reconciler-script
  namespace: arr-stack
data:
  reconcile.py: |
    #!/usr/bin/env python3
    import json
    import os
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    import xml.etree.ElementTree as ET

    import yaml

    WIRING_CONFIG_PATH = "/wiring-config/wiring.yml"
    WIRING_SECRET_DIR = "/wiring-secret"
    RECONCILE_INTERVAL_SECONDS = 300

    APP_PORTS = {"sonarr": 8989, "radarr": 7878, "prowlarr": 9696}
    # Sonarr/Radarr name their SABnzbd category field differently -
    # confirmed live via each app's own /downloadclient/schema, not
    # guessed (Sonarr: tvCategory, Radarr: movieCategory).
    CATEGORY_FIELD = {"sonarr": "tvCategory", "radarr": "movieCategory"}

    CONFIG_XML_PATHS = {
        "sonarr": "/app-config/sonarr/config.xml",
        "radarr": "/app-config/radarr/config.xml",
        "prowlarr": "/app-config/prowlarr/config.xml",
    }
    SABNZBD_INI_PATH = "/app-config/sabnzbd/sabnzbd.ini"


    def log(level, msg):
        ts = time.strftime("%Y-%m-%dT%H:%M:%S", time.gmtime())
        print(f"[{ts}] {level:5} {msg}", flush=True)


    def http_json(method, url, body=None):
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(url, data=data, method=method)
        req.add_header("Content-Type", "application/json")
        with urllib.request.urlopen(req, timeout=15) as resp:
            raw = resp.read()
            return json.loads(raw) if raw else None


    def read_apikey_xml(path):
        if not os.path.exists(path):
            return None
        try:
            el = ET.parse(path).getroot().find("ApiKey")
        except ET.ParseError:
            return None
        return el.text if el is not None else None


    def read_sabnzbd_apikey(path):
        # Not configparser: sabnzbd.ini starts with __version__/__encoding__
        # lines before any [section] header (confirmed live 2026-07-23),
        # which configparser rejects outright as MissingSectionHeaderError.
        # Only one value is ever needed from this file, so a plain line
        # scan sidesteps that entirely rather than fighting configparser
        # into tolerating SABnzbd's actual ini dialect.
        if not os.path.exists(path):
            return None
        section = None
        with open(path) as f:
            for line in f:
                line = line.strip()
                if line.startswith("[") and line.endswith("]"):
                    section = line[1:-1]
                elif section == "misc" and line.startswith("api_key"):
                    _, _, value = line.partition("=")
                    return value.strip()
        return None


    def load_wiring_config():
        with open(WIRING_CONFIG_PATH) as f:
            return yaml.safe_load(f) or {}


    def load_secret(key):
        path = os.path.join(WIRING_SECRET_DIR, key)
        if not os.path.exists(path):
            return None
        with open(path) as f:
            return f.read().strip()


    # ---------------------------------------------------------------------
    # SABnzbd categories
    # ---------------------------------------------------------------------

    def reconcile_sabnzbd_categories(desired, sab_apikey):
        base = "http://localhost:8080/api"
        for cat in desired.get("sabnzbd", {}).get("categories", []):
            params = f"mode=set_config&section=categories&name={cat['name']}&dir={urllib.parse.quote(cat['dir'])}&apikey={sab_apikey}&output=json"
            http_json("GET", f"{base}?{params}")
            log("INFO", f"sabnzbd category ensured: {cat['name']} -> {cat['dir']}")


    def reconcile_sabnzbd_servers(desired, sab_apikey):
        base = "http://localhost:8080/api"
        for srv in desired.get("sabnzbd", {}).get("servers", []):
            if "CHANGEME" in srv["host"]:
                log("INFO", f"sabnzbd server {srv['name']!r} has a placeholder host - skipping until the real hostname is filled in")
                continue
            username = load_secret(srv["usernameSecretKey"])
            password = load_secret(srv["passwordSecretKey"])
            if not username or not password:
                log("CRIT", f"sabnzbd server {srv['name']!r}: missing sealed credentials ({srv['usernameSecretKey']!r}/{srv['passwordSecretKey']!r}) - skipping")
                continue
            params = "&".join([
                "mode=set_config",
                "section=servers",
                f"name={urllib.parse.quote(srv['name'])}",
                f"host={urllib.parse.quote(srv['host'])}",
                f"port={srv['port']}",
                f"connections={srv.get('connections', 8)}",
                f"ssl={1 if srv.get('ssl', True) else 0}",
                "enable=1",
                f"username={urllib.parse.quote(username)}",
                f"password={urllib.parse.quote(password)}",
                f"apikey={sab_apikey}",
                "output=json",
            ])
            http_json("GET", f"{base}?{params}")
            log("INFO", f"sabnzbd server ensured: {srv['name']} ({srv['host']}:{srv['port']})")


    # ---------------------------------------------------------------------
    # Sonarr/Radarr root folders
    # ---------------------------------------------------------------------

    def reconcile_rootfolders(desired, apikeys):
        for app in ("sonarr", "radarr"):
            apikey = apikeys.get(app)
            if not apikey:
                continue
            paths = desired.get(app, {}).get("rootFolders")
            if paths is None:
                single = desired.get(app, {}).get("rootFolder")
                paths = [single] if single else []
            base = f"http://localhost:{APP_PORTS[app]}/api/v3"
            existing = http_json("GET", f"{base}/rootfolder?apikey={apikey}") or []
            existing_paths = {rf["path"] for rf in existing}
            for path in paths:
                if path in existing_paths:
                    continue
                # Fails until the underlying mount actually exists in this
                # container (Sonarr/Radarr validate accessibility before
                # accepting a root folder) - that's expected before the
                # media-mount change lands, not a bug; next pass retries.
                http_json("POST", f"{base}/rootfolder?apikey={apikey}", body={"path": path})
                log("INFO", f"{app}: created root folder {path}")


    # ---------------------------------------------------------------------
    # Radarr custom formats (size-cap enforcement for bulk-content profiles)
    # ---------------------------------------------------------------------

    def reconcile_radarr_customformats(desired, apikey):
        base = "http://localhost:7878/api/v3"
        cfs = desired.get("radarr", {}).get("customFormats", [])
        if not cfs:
            return {}
        existing = http_json("GET", f"{base}/customformat?apikey={apikey}") or []
        spec_schema_list = http_json("GET", f"{base}/customformat/schema?apikey={apikey}") or []
        ids = {}
        for cf_cfg in cfs:
            specs = []
            for spec_cfg in cf_cfg.get("specifications", []):
                spec_schema = next(
                    (s for s in spec_schema_list if s["implementation"] == spec_cfg["implementation"]),
                    None,
                )
                if spec_schema is None:
                    log("CRIT", f"radarr: no custom format specification {spec_cfg['implementation']!r}")
                    continue
                spec = json.loads(json.dumps(spec_schema))
                spec["name"] = spec_cfg.get("name", spec_cfg["implementation"])
                spec["negate"] = spec_cfg.get("negate", False)
                spec["required"] = spec_cfg.get("required", True)
                for f in spec["fields"]:
                    if f["name"] in spec_cfg:
                        f["value"] = spec_cfg[f["name"]]
                specs.append(spec)

            body = {"name": cf_cfg["name"], "includeCustomFormatWhenRenaming": False, "specifications": specs}
            match = next((e for e in existing if e.get("name") == cf_cfg["name"]), None)
            if match is None:
                created = http_json("POST", f"{base}/customformat?apikey={apikey}", body=body)
                ids[cf_cfg["name"]] = created["id"]
                log("INFO", f"radarr: created custom format {cf_cfg['name']!r}")
            else:
                body["id"] = match["id"]
                http_json("PUT", f"{base}/customformat/{match['id']}?apikey={apikey}", body=body)
                ids[cf_cfg["name"]] = match["id"]
                log("INFO", f"radarr: re-applied custom format {cf_cfg['name']!r}")
        return ids


    # ---------------------------------------------------------------------
    # Radarr quality profiles
    # ---------------------------------------------------------------------

    def _flatten_quality_items(items):
        # Some items are grouped one level deep (e.g. "WEB 720p" wraps
        # WEBDL-720p + WEBRip-720p) - flatten so name lookups don't need
        # to know which qualities happen to be grouped.
        flat = []
        for item in items:
            flat.extend(item["items"] if item.get("items") else [item])
        return flat


    def reconcile_radarr_qualityprofiles(desired, apikey, customformat_ids):
        base = "http://localhost:7878/api/v3"
        profiles_cfg = desired.get("radarr", {}).get("qualityProfiles", [])
        if not profiles_cfg:
            return
        existing = http_json("GET", f"{base}/qualityprofile?apikey={apikey}") or []
        schema = http_json("GET", f"{base}/qualityprofile/schema?apikey={apikey}")

        for p_cfg in profiles_cfg:
            body = json.loads(json.dumps(schema))
            body["name"] = p_cfg["name"]
            body["upgradeAllowed"] = p_cfg.get("upgradeAllowed", False)

            allowed_names = set(p_cfg.get("allowedQualities", []))
            cutoff_id = None
            for item in _flatten_quality_items(body["items"]):
                q = item["quality"]
                item["allowed"] = q["name"] in allowed_names
                if q["name"] == p_cfg.get("cutoffQuality"):
                    cutoff_id = q["id"]
            # Radarr does NOT derive a group's own allowed flag from its
            # children - confirmed live 2026-08-23 (scratch test profile,
            # created and deleted immediately: leaving a group's allowed
            # unset left it false even with both children set true). Set
            # it explicitly here instead.
            for item in body["items"]:
                if item.get("items"):
                    item["allowed"] = any(c["allowed"] for c in item["items"])
            if cutoff_id is None:
                log("CRIT", f"radarr: cutoffQuality {p_cfg.get('cutoffQuality')!r} not found for profile {p_cfg['name']!r}")
                continue
            body["cutoff"] = cutoff_id

            body["formatItems"] = []
            for fs in p_cfg.get("formatScores", []):
                cf_id = customformat_ids.get(fs["format"])
                if cf_id is None:
                    log("CRIT", f"radarr: custom format {fs['format']!r} not found - skipping formatScore in {p_cfg['name']!r}")
                    continue
                body["formatItems"].append({"format": cf_id, "name": fs["format"], "score": fs["score"]})
            body["minFormatScore"] = p_cfg.get("minFormatScore", 0)

            match = next((e for e in existing if e.get("name") == p_cfg["name"]), None)
            if match is None:
                http_json("POST", f"{base}/qualityprofile?apikey={apikey}", body=body)
                log("INFO", f"radarr: created quality profile {p_cfg['name']!r}")
            else:
                body["id"] = match["id"]
                http_json("PUT", f"{base}/qualityprofile/{match['id']}?apikey={apikey}", body=body)
                log("INFO", f"radarr: re-applied quality profile {p_cfg['name']!r}")


    # ---------------------------------------------------------------------
    # Sonarr/Radarr download clients (schema-driven - see module docstring)
    # ---------------------------------------------------------------------

    def reconcile_downloadclient(app, apikey, dc_cfg, category, sab_apikey):
        port = APP_PORTS[app]
        base = f"http://localhost:{port}/api/v3"
        category_field = CATEGORY_FIELD[app]

        existing = http_json("GET", f"{base}/downloadclient?apikey={apikey}") or []
        match = next(
            (e for e in existing if e.get("implementation") == "Sabnzbd" and e.get("name") == dc_cfg["name"]),
            None,
        )

        schema_list = http_json("GET", f"{base}/downloadclient/schema?apikey={apikey}")
        schema = next(e for e in schema_list if e["implementation"] == "Sabnzbd")
        schema["enable"] = True
        schema["name"] = dc_cfg["name"]

        field_values = {
            "host": dc_cfg["host"],
            "port": dc_cfg["port"],
            "apiKey": sab_apikey,
            category_field: category,
        }
        for f in schema["fields"]:
            if f["name"] in field_values:
                f["value"] = field_values[f["name"]]

        if match is None:
            http_json("POST", f"{base}/downloadclient?apikey={apikey}", body=schema)
            log("INFO", f"{app}: created download client {dc_cfg['name']!r} (category={category})")
        else:
            schema["id"] = match["id"]
            http_json("PUT", f"{base}/downloadclient/{match['id']}?apikey={apikey}", body=schema)
            log("INFO", f"{app}: re-applied download client {dc_cfg['name']!r} (category={category})")


    # ---------------------------------------------------------------------
    # Prowlarr indexers
    # ---------------------------------------------------------------------

    def reconcile_prowlarr_indexers(desired, apikey):
        indexers = desired.get("prowlarr", {}).get("indexers", [])
        if not indexers:
            return
        base = "http://localhost:9696/api/v1"
        existing = http_json("GET", f"{base}/indexer?apikey={apikey}") or []
        schema_list = http_json("GET", f"{base}/indexer/schema?apikey={apikey}")

        # An indexer's schema defaults appProfileId to 0, which
        # Prowlarr's own validation rejects outright ("must be greater
        # than 0") - confirmed live 2026-07-23. Every fresh Prowlarr
        # install ships a default "Standard" app profile; use whichever
        # profile is actually first rather than hardcoding id=1, in
        # case that ever changes.
        profiles = http_json("GET", f"{base}/appprofile?apikey={apikey}") or []
        if not profiles:
            log("CRIT", "prowlarr: no app profile exists yet - skipping indexer reconcile this pass")
            return
        app_profile_id = profiles[0]["id"]

        for idx_cfg in indexers:
            schema = next((e for e in schema_list if e["name"] == idx_cfg["name"]), None)
            if schema is None:
                log("CRIT", f"prowlarr: no indexer definition named {idx_cfg['name']!r} - check spelling against /api/v1/indexer/schema")
                continue

            indexer_apikey = load_secret(idx_cfg["secretKey"])
            if not indexer_apikey or indexer_apikey.startswith("placeholder-"):
                log("CRIT", f"prowlarr: {idx_cfg['name']!r} has no real key sealed under {idx_cfg['secretKey']!r} yet - skipping")
                continue

            schema["enable"] = True
            schema["appProfileId"] = app_profile_id
            for f in schema["fields"]:
                if f["name"] == "apiKey":
                    f["value"] = indexer_apikey

            match = next((e for e in existing if e.get("name") == idx_cfg["name"]), None)
            if match is None:
                http_json("POST", f"{base}/indexer?apikey={apikey}", body=schema)
                log("INFO", f"prowlarr: created indexer {idx_cfg['name']!r}")
            else:
                schema["id"] = match["id"]
                http_json("PUT", f"{base}/indexer/{match['id']}?apikey={apikey}", body=schema)
                log("INFO", f"prowlarr: re-applied indexer {idx_cfg['name']!r}")


    # ---------------------------------------------------------------------
    # Prowlarr "Apps" sync - pushes Prowlarr's own indexers out into
    # Sonarr/Radarr automatically, so adding one indexer in Prowlarr is
    # enough rather than also wiring each *arr app's Indexers page by
    # hand. Found live 2026-07-24: without this, Sonarr's own health
    # check reports "No indexers available" even though Prowlarr has
    # one configured and working - Prowlarr never pushes anything out
    # on its own without an Application link. implementationName here
    # is confirmed against /api/v1/applications/schema (also lists
    # LazyLibrarian, Lidarr, Readarr, etc., not just Sonarr/Radarr, in
    # case more get wired the same way later).
    # ---------------------------------------------------------------------

    def reconcile_prowlarr_apps(prowlarr_apikey, apikeys):
        base = "http://localhost:9696/api/v1"
        existing = http_json("GET", f"{base}/applications?apikey={prowlarr_apikey}") or []
        schema_list = http_json("GET", f"{base}/applications/schema?apikey={prowlarr_apikey}")

        for app in ("sonarr", "radarr"):
            if not apikeys.get(app):
                continue
            schema = next((e for e in schema_list if e["implementation"].lower() == app), None)
            if schema is None:
                log("CRIT", f"prowlarr: no applications/schema entry for {app!r}")
                continue

            schema["name"] = app.capitalize()
            for f in schema["fields"]:
                if f["name"] == "apiKey":
                    f["value"] = apikeys[app]

            match = next((e for e in existing if e.get("name") == app.capitalize()), None)
            if match is None:
                http_json("POST", f"{base}/applications?apikey={prowlarr_apikey}", body=schema)
                log("INFO", f"prowlarr: linked application {app.capitalize()!r}")
            else:
                schema["id"] = match["id"]
                http_json("PUT", f"{base}/applications/{match['id']}?apikey={prowlarr_apikey}", body=schema)
                log("INFO", f"prowlarr: re-applied application link {app.capitalize()!r}")


    # ---------------------------------------------------------------------

    def reconcile_once():
        desired = load_wiring_config()

        apikeys = {app: read_apikey_xml(path) for app, path in CONFIG_XML_PATHS.items()}
        sab_apikey = read_sabnzbd_apikey(SABNZBD_INI_PATH)

        if sab_apikey:
            try:
                reconcile_sabnzbd_categories(desired, sab_apikey)
            except (urllib.error.URLError, urllib.error.HTTPError, OSError) as e:
                log("CRIT", f"sabnzbd category reconcile failed: {e}")
            try:
                reconcile_sabnzbd_servers(desired, sab_apikey)
            except (urllib.error.URLError, urllib.error.HTTPError, OSError) as e:
                log("CRIT", f"sabnzbd server reconcile failed: {e}")
        else:
            log("INFO", "sabnzbd api key not available yet (config.ini not written) - skipping this pass")

        try:
            reconcile_rootfolders(desired, apikeys)
        except (urllib.error.URLError, urllib.error.HTTPError, OSError) as e:
            log("CRIT", f"root folder reconcile failed: {e}")

        for dc_cfg in desired.get("downloadClients", []):
            if not sab_apikey:
                break
            for entry in dc_cfg.get("apps", []):
                app = entry["app"]
                if app not in APP_PORTS:
                    continue  # lazylibrarian etc. handled by their own config-seed sidecar, not here
                if not apikeys.get(app):
                    log("INFO", f"{app} api key not available yet (config.xml not written) - skipping this pass")
                    continue
                try:
                    reconcile_downloadclient(app, apikeys[app], dc_cfg, entry["category"], sab_apikey)
                except (urllib.error.URLError, urllib.error.HTTPError, OSError) as e:
                    log("CRIT", f"{app} download client reconcile failed: {e}")

        if apikeys.get("prowlarr"):
            try:
                reconcile_prowlarr_indexers(desired, apikeys["prowlarr"])
            except (urllib.error.URLError, urllib.error.HTTPError, OSError) as e:
                log("CRIT", f"prowlarr indexer reconcile failed: {e}")
            try:
                reconcile_prowlarr_apps(apikeys["prowlarr"], apikeys)
            except (urllib.error.URLError, urllib.error.HTTPError, OSError) as e:
                log("CRIT", f"prowlarr application-link reconcile failed: {e}")
        else:
            log("INFO", "prowlarr api key not available yet (config.xml not written) - skipping this pass")

        if apikeys.get("radarr"):
            try:
                cf_ids = reconcile_radarr_customformats(desired, apikeys["radarr"])
                reconcile_radarr_qualityprofiles(desired, apikeys["radarr"], cf_ids)
            except (urllib.error.URLError, urllib.error.HTTPError, OSError) as e:
                log("CRIT", f"radarr custom format/quality profile reconcile failed: {e}")


    if __name__ == "__main__":
        while True:
            try:
                reconcile_once()
            except Exception as e:
                log("CRIT", f"unhandled error during reconcile pass: {e}")
            time.sleep(RECONCILE_INTERVAL_SECONDS)
