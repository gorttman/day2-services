# PLACEHOLDER STORAGE: local-path is node-local and non-durable - same
# caveats and the same temporary k8smaster nodeSelector as apps/jellyfin
# (see the arr-stack deployment). The internal SQLite DB lives here, so
# it must never sit directly on NFS. No shared media PVC yet - that is a
# configuration-time decision, out of scope for the install pass.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jdownloader2-config
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: jdownloader2
    argocd.argoproj.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  # Longhorn since 2026-09-02 - replicated so the data follows the pod
  # instead of pinning it to one node. Migrated with day1-foundation's
  # migration/pvc_migrate.sh; the old local-path volume was staged and restored.
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
