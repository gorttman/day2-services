apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jdownloader2-public
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: jdownloader2
    argocd.argoproj.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: "private-ca"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - jdownloader.i3sec.com.au
    secretName: jdownloader-public-tls
  rules:
  - host: jdownloader.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jdownloader2
            port:
              number: 5800
