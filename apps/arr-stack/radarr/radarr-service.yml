apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: radarr
    argocd.argoproj.io/managed-by: argocd
spec:
  type: ClusterIP
  # The shared pod is NotReady while gluetun CrashLoops on the sealed
  # placeholder VPN creds; keep the UIs reachable regardless.
  publishNotReadyAddresses: true
  selector:
    app: arr-stack
  ports:
  - name: http
    port: 7878
    targetPort: 7878
    protocol: TCP
