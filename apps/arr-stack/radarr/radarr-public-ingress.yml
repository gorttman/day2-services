apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-public
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: radarr
    argocd.argoproj.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - radarr.i3sec.com.au
    secretName: radarr-public-tls
  rules:
  - host: radarr.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: radarr
            port:
              number: 7878
