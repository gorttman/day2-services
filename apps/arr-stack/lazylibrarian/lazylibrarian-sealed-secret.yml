# Sealed PLACEHOLDER value, deliberately - same treatment as
# gluetun/gluetun-sealed-secret.yml. This install pass does not touch
# a real Goodreads API key. LazyLibrarian will run with metadata
# lookups disabled/degraded until a real key is sealed over this (same
# name lazylibrarian-secrets, namespace arr-stack, key GR_API_KEY) with
# kubeseal, then commit and restart the deployment.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: lazylibrarian-secrets
  namespace: arr-stack
spec:
  encryptedData:
    GR_API_KEY: ""