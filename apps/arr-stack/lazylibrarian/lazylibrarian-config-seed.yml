apiVersion: v1
kind: ConfigMap
metadata:
  name: lazylibrarian-config-seed-script
  namespace: arr-stack
data:
  seed_config.py: |
    #!/usr/bin/env python3
    # Patches LazyLibrarian's own config.ini (INI format, same shape as
    # every other *arr app) so its post-processing step drops files flat
    # into books-pipeline's import/ mount instead of organizing its own
    # Author/Title folder tree - "no library organisation" per the
    # arr-stack extension proposal (2026-07-21). books-pipeline already
    # does all real organizing from embedded ebook metadata, not from
    # folder structure, so LazyLibrarian doing its own foldering would
    # just be redundant work immediately flattened away downstream.
    #
    # GENERAL.EBOOK_DIR, not DESTINATION_DIR - found live 2026-07-24:
    # DESTINATION_DIR doesn't exist anywhere in this pinned image's own
    # configdefs.py (an earlier, unverified guess that silently wrote a
    # key LazyLibrarian never reads - configparser doesn't error on
    # unknown keys, so this looked "verified" purely because the file
    # contained the string, without confirming the app actually uses
    # it). filesystem.py's get_directory("eBook") is what LazyLibrarian
    # actually calls to find where post-processed ebooks land, and that
    # reads EBOOK_DIR. It shipped defaulted to /books - a path this
    # container doesn't even mount (only /import, via books-import's
    # subPath) - so left alone, post-processing would have tried
    # writing straight into the shared library root and either failed
    # outright or bypassed books-pipeline's dedup/metadata handling
    # entirely, not landed in /import as intended.
    #
    # Same reasoning as calibre-web's config_calibre_dir seed for why
    # this waits for the app to create its own config file first rather
    # than shipping one: config.ini is LazyLibrarian's own writable
    # state (library settings, indexer state), not something safe to
    # own externally - only specific keys get patched, idempotently,
    # never the whole file.
    #
    # 2026-07-23: also wires SABnzbd in as LazyLibrarian's usenet
    # downloader, reading arr-stack-wiring-config.yml's downloadClients
    # list for the connection details and SABnzbd's own sabnzbd.ini for
    # its auto-generated API key - same source of truth the
    # arr-wiring-reconciler sidecar uses for Sonarr/Radarr, just
    # applied differently here since LazyLibrarian only reads config.ini
    # at startup (no REST API for this), so this loops and self-restarts
    # the pod on any real change instead of idling after one check.
    # Real key names confirmed against this exact pinned image's own
    # installed source (/app/lazylibrarian/lazylibrarian/configdefs.py
    # inside the container): section [SABNZBD], keys SAB_HOST/SAB_PORT/
    # SAB_API/SAB_CAT; the enable toggle is NZB_DOWNLOADER_SABNZBD
    # under section [USENET]. See the BASE_DESIRED comment below for
    # why "confirmed against source" alone wasn't enough here.
    #
    # Also wires the first arr-stack-wiring-config.yml prowlarr.indexers
    # entry in as LazyLibrarian's own search provider (Providers tab,
    # [Newznab_0]) - see newznab_desired()'s docstring for why this
    # can't just inherit Prowlarr's indexer the way Sonarr/Radarr do.
    import configparser
    import http.client
    import json
    import os
    import ssl
    import time
    import urllib.error
    import urllib.request
    import xml.etree.ElementTree as ET

    import yaml

    CONFIG_PATH = "/config/config.ini"
    IMPORT_DEST = "/import"
    WIRING_CONFIG_PATH = "/wiring-config/wiring.yml"
    WIRING_SECRET_DIR = "/wiring-secret"
    SABNZBD_INI_PATH = "/app-config/sabnzbd/sabnzbd.ini"
    PROWLARR_CONFIG_XML_PATH = "/app-config/prowlarr/config.xml"
    RECHECK_INTERVAL_SECONDS = 300

    # Section names are ALL-CAPS, confirmed 2026-07-23 against this
    # exact image's own installed source (/app/lazylibrarian/
    # lazylibrarian/configdefs.py inside the container - NOT
    # upstream's current GitHub master, which is a meaningfully
    # different, newer codebase and gave wrong answers earlier: master
    # declares mixed-case section names like 'General'/'PostProcess',
    # but this pinned image's own config-loading code normalizes to
    # GENERAL/SABNZBD/POSTPROCESS/USENET, confirmed by inspecting the
    # live config.ini after a save cycle - GENERAL and POSTPROCESS
    # written in mixed case never actually populated LazyLibrarian's
    # own live sections (silently orphaned, no error), while SABnzbd/
    # USENET happened to already be correct. Ground truth is always
    # the specific pinned image, not whatever's on GitHub's default
    # branch right now.
    BASE_DESIRED = {
        "GENERAL": {
            "EBOOK_DIR": IMPORT_DEST,
            "DESTINATION_COPY": "0",  # move, not copy - books-pipeline removes the source itself after a verified import
        },
        "POSTPROCESS": {
            "EBOOK_DEST_FOLDER": "",   # no per-book folder - flat into EBOOK_DIR
            "EBOOK_DEST_FILE": "$Title - $Author",
        },
    }


    def read_sabnzbd_apikey():
        # Not configparser: sabnzbd.ini starts with __version__/__encoding__
        # lines before any [section] header (confirmed live 2026-07-23),
        # which configparser rejects outright as MissingSectionHeaderError.
        # Only one value is ever needed from this file, so a plain line
        # scan sidesteps that entirely rather than fighting configparser
        # into tolerating SABnzbd's actual ini dialect.
        section = None
        with open(SABNZBD_INI_PATH) as f:
            for line in f:
                line = line.strip()
                if line.startswith("[") and line.endswith("]"):
                    section = line[1:-1]
                elif section == "misc" and line.startswith("api_key"):
                    _, _, value = line.partition("=")
                    return value.strip()
        return None


    def sabnzbd_desired():
        """Returns the {"SABNZBD": {...}, "USENET": {...}} block, or {}
        if either the wiring-config has no lazylibrarian entry yet or
        SABnzbd hasn't written its own API key yet - never blocks the
        BASE_DESIRED patch above on this being ready."""
        if not os.path.exists(WIRING_CONFIG_PATH) or not os.path.exists(SABNZBD_INI_PATH):
            return {}
        with open(WIRING_CONFIG_PATH) as f:
            wiring = yaml.safe_load(f) or {}
        sab_apikey = read_sabnzbd_apikey()
        if not sab_apikey:
            return {}
        for dc in wiring.get("downloadClients", []):
            for entry in dc.get("apps", []):
                if entry["app"] == "lazylibrarian":
                    return {
                        "SABNZBD": {
                            "SAB_HOST": dc["host"],
                            "SAB_PORT": str(dc["port"]),
                            "SAB_API": sab_apikey,
                            "SAB_CAT": entry["category"],
                        },
                        "USENET": {
                            "NZB_DOWNLOADER_SABNZBD": "1",
                        },
                    }
        return {}


    def read_apikey_xml(path):
        if not os.path.exists(path):
            return None
        try:
            el = ET.parse(path).getroot().find("ApiKey")
        except ET.ParseError:
            return None
        return el.text if el is not None else None


    def load_secret(key):
        path = os.path.join(WIRING_SECRET_DIR, key)
        if not os.path.exists(path):
            return None
        with open(path) as f:
            return f.read().strip()


    def newznab_desired():
        """Returns {"Newznab_0": {...}} for the first prowlarr.indexers
        entry in wiring.yml, or {} if any dependency isn't ready yet.
        LazyLibrarian's own Providers tab doesn't inherit Prowlarr's
        indexers automatically - Prowlarr's "Apps" sync feature only
        covers the Servarr family (Sonarr/Radarr/Readarr/...), not
        LazyLibrarian - so this wires it directly: reads the indexer's
        live baseUrl from Prowlarr's own API (already-reconciled by
        arr-wiring-reconciler, so this is the same source of truth, not
        a second copy) and the real key from the wiring secret. Array
        section naming/keys confirmed against this exact pinned image's
        own installed source (configdefs.py's ARRAY_DEFS['NEWZNAB'],
        template 'Newznab_%s') - and unlike GENERAL/POSTPROCESS/etc,
        config2.py's _load_array_section() uppercases the array-name
        prefix before matching, so case doesn't matter for this one
        specifically, matching what BASE_DESIRED's comment above found
        the hard way for the non-array sections."""
        if not os.path.exists(WIRING_CONFIG_PATH):
            return {}
        with open(WIRING_CONFIG_PATH) as f:
            wiring = yaml.safe_load(f) or {}
        indexers = wiring.get("prowlarr", {}).get("indexers", [])
        if not indexers:
            return {}
        idx_cfg = indexers[0]  # one is enough to get LazyLibrarian searching; add more slots later if needed

        prowlarr_apikey = read_apikey_xml(PROWLARR_CONFIG_XML_PATH)
        if not prowlarr_apikey:
            return {}
        indexer_apikey = load_secret(idx_cfg["secretKey"])
        if not indexer_apikey or indexer_apikey.startswith("placeholder-"):
            return {}

        try:
            req = urllib.request.Request(f"http://localhost:9696/api/v1/indexer?apikey={prowlarr_apikey}")
            with urllib.request.urlopen(req, timeout=10) as resp:
                existing = json.loads(resp.read())
        except (urllib.error.URLError, OSError):
            return {}
        match = next((e for e in existing if e.get("name") == idx_cfg["name"]), None)
        if not match:
            return {}
        base_url = next((f["value"] for f in match["fields"] if f["name"] == "baseUrl"), None)
        if not base_url:
            return {}

        return {
            "Newznab_0": {
                "NAME": "Newznab",
                "DISPNAME": idx_cfg["name"],
                "ENABLED": "1",
                "HOST": base_url,
                "API": indexer_apikey,
                "GENERALSEARCH": "search",
                "BOOKSEARCH": "book",
                "BOOKCAT": "7000,7020",
            },
        }


    def wait_for_config():
        while not os.path.exists(CONFIG_PATH):
            print("waiting for LazyLibrarian to create config.ini...", flush=True)
            time.sleep(5)
        # Give the app a moment past file-creation to finish its own
        # first-run writes before this reads/rewrites it.
        time.sleep(5)


    def patch_config():
        desired = {**BASE_DESIRED}
        for section, keys in {**sabnzbd_desired(), **newznab_desired()}.items():
            desired[section] = {**desired.get(section, {}), **keys}

        cp = configparser.ConfigParser()
        cp.read(CONFIG_PATH)
        changed = False
        for section, keys in desired.items():
            if not cp.has_section(section):
                cp.add_section(section)
            for key, value in keys.items():
                current = cp.get(section, key, fallback=None)
                if current != value:
                    cp.set(section, key, value)
                    changed = True
                    if key in ("SAB_API", "API"):  # don't log real api keys
                        print(f"{section}.{key}: changed", flush=True)
                    else:
                        print(f"{section}.{key}: {current!r} -> {value!r}", flush=True)
        if changed:
            with open(CONFIG_PATH, "w") as f:
                cp.write(f)
        return changed


    RESTART_PENDING_MARKER = "/tmp/restart-pending"


    def restart_pod():
        """Returns True only if the DELETE was actually accepted by the
        API server. Found live 2026-07-23: right at this container's
        own startup, cluster DNS ("kubernetes.default.svc") can briefly
        fail to resolve - a transient race, not a real outage - which
        silently ate a config.ini patch's restart entirely under the
        old fire-and-forget version of this function: patch_config()
        had already written the file, so the very next pass saw
        changed=False and never tried the restart again, leaving
        LazyLibrarian running with its stale in-memory config
        indefinitely despite the file being correct on disk. Retries a
        few times with a short backoff (DNS races like this clear
        within a few seconds) before giving up for this pass."""
        pod_name = os.environ.get("MY_POD_NAME")
        if not pod_name:
            print("MY_POD_NAME not set - cannot self-restart, restart the pod manually", flush=True)
            return False
        secrets_dir = "/var/run/secrets/kubernetes.io/serviceaccount"
        with open(f"{secrets_dir}/token") as f:
            token = f.read().strip()
        with open(f"{secrets_dir}/namespace") as f:
            namespace = f.read().strip()
        context = ssl.create_default_context(cafile=f"{secrets_dir}/ca.crt")

        for attempt in range(1, 6):
            try:
                conn = http.client.HTTPSConnection("kubernetes.default.svc", 443, context=context, timeout=10)
                try:
                    conn.request(
                        "DELETE",
                        f"/api/v1/namespaces/{namespace}/pods/{pod_name}",
                        headers={"Authorization": f"Bearer {token}"},
                    )
                    resp = conn.getresponse()
                    print(f"self-restart requested for {pod_name}: HTTP {resp.status}", flush=True)
                    resp.read()
                    return True
                finally:
                    conn.close()
            except OSError as e:
                print(f"self-restart attempt {attempt}/5 failed: {e}", flush=True)
                if attempt < 5:
                    time.sleep(5)
        return False


    wait_for_config()
    while True:
        try:
            changed = patch_config()
            restart_owed = changed or os.path.exists(RESTART_PENDING_MARKER)
            if restart_owed:
                if changed:
                    print("config.ini patched - self-restarting the whole arr-stack pod so LazyLibrarian picks it up", flush=True)
                else:
                    print("retrying a previously-failed self-restart", flush=True)
                if restart_pod():
                    if os.path.exists(RESTART_PENDING_MARKER):
                        os.remove(RESTART_PENDING_MARKER)
                    time.sleep(30)
                else:
                    # keep retrying next pass even though the file is
                    # already correct and patch_config() will report no
                    # further changes - see restart_pod()'s docstring
                    open(RESTART_PENDING_MARKER, "w").close()
            else:
                print("lazylibrarian-config-seed: no change this pass, idling", flush=True)
        except Exception as e:
            print(f"CRIT unhandled error during patch pass: {e}", flush=True)
        time.sleep(RECHECK_INTERVAL_SECONDS)
