apiVersion: v1
kind: ConfigMap
metadata:
  name: lazylibrarian-config-seed-script
  namespace: arr-stack
data:
  seed_config.py: |
    #!/usr/bin/env python3
    # Patches LazyLibrarian's own config.ini (INI format, same shape as
    # every other *arr app) so its post-processing step drops files flat
    # into books-pipeline's import/ mount instead of organizing its own
    # Author/Title folder tree - "no library organisation" per the
    # arr-stack extension proposal (2026-07-21). books-pipeline already
    # does all real organizing from embedded ebook metadata, not from
    # folder structure, so LazyLibrarian doing its own foldering would
    # just be redundant work immediately flattened away downstream.
    #
    # Verified 2026-07-23 against a live instance (once gluetun's PIA
    # WireGuard tunnel came up for real): config.ini ends up with
    # destination_dir=/import, destination_copy=0, ebook_dest_folder
    # empty, ebook_dest_file=$Title - $Author, exactly as intended.
    # configparser lower-cases option names on write; LazyLibrarian
    # reads config.ini case-insensitively so this doesn't matter.
    #
    # Same reasoning as calibre-web's config_calibre_dir seed for why
    # this waits for the app to create its own config file first rather
    # than shipping one: config.ini is LazyLibrarian's own writable
    # state (library settings, indexer state), not something safe to
    # own externally - only specific keys get patched, idempotently,
    # never the whole file.
    #
    # 2026-07-23: also wires SABnzbd in as LazyLibrarian's usenet
    # downloader, reading arr-stack-wiring-config.yml's downloadClients
    # list for the connection details and SABnzbd's own sabnzbd.ini for
    # its auto-generated API key - same source of truth the
    # arr-wiring-reconciler sidecar uses for Sonarr/Radarr, just
    # applied differently here since LazyLibrarian only reads config.ini
    # at startup (no REST API for this), so this loops and self-restarts
    # the pod on any real change instead of idling after one check.
    # Real key names confirmed against LazyLibrarian's own source
    # (lazylibrarian/__init__.py's CONFIG_DEFINITIONS): section
    # [SABnzbd], keys SAB_HOST/SAB_PORT/SAB_API/SAB_CAT; the enable
    # toggle is NZB_DOWNLOADER_SABNZBD under section [USENET].
    import configparser
    import http.client
    import os
    import ssl
    import time

    import yaml

    CONFIG_PATH = "/config/config.ini"
    IMPORT_DEST = "/import"
    WIRING_CONFIG_PATH = "/wiring-config/wiring.yml"
    SABNZBD_INI_PATH = "/app-config/sabnzbd/sabnzbd.ini"
    RECHECK_INTERVAL_SECONDS = 300

    BASE_DESIRED = {
        "General": {
            "DESTINATION_DIR": IMPORT_DEST,
            "DESTINATION_COPY": "0",  # move, not copy - books-pipeline removes the source itself after a verified import
        },
        "postprocess": {
            "EBOOK_DEST_FOLDER": "",   # no per-book folder - flat into DESTINATION_DIR
            "EBOOK_DEST_FILE": "$Title - $Author",
        },
    }


    def sabnzbd_desired():
        """Returns the {"SABnzbd": {...}, "USENET": {...}} block, or {}
        if either the wiring-config has no lazylibrarian entry yet or
        SABnzbd hasn't written its own API key yet - never blocks the
        BASE_DESIRED patch above on this being ready."""
        if not os.path.exists(WIRING_CONFIG_PATH) or not os.path.exists(SABNZBD_INI_PATH):
            return {}
        with open(WIRING_CONFIG_PATH) as f:
            wiring = yaml.safe_load(f) or {}
        sab_cp = configparser.ConfigParser()
        sab_cp.read(SABNZBD_INI_PATH)
        sab_apikey = sab_cp.get("misc", "api_key", fallback=None)
        if not sab_apikey:
            return {}
        for dc in wiring.get("downloadClients", []):
            for entry in dc.get("apps", []):
                if entry["app"] == "lazylibrarian":
                    return {
                        "SABnzbd": {
                            "SAB_HOST": dc["host"],
                            "SAB_PORT": str(dc["port"]),
                            "SAB_API": sab_apikey,
                            "SAB_CAT": entry["category"],
                        },
                        "USENET": {
                            "NZB_DOWNLOADER_SABNZBD": "1",
                        },
                    }
        return {}


    def wait_for_config():
        while not os.path.exists(CONFIG_PATH):
            print("waiting for LazyLibrarian to create config.ini...", flush=True)
            time.sleep(5)
        # Give the app a moment past file-creation to finish its own
        # first-run writes before this reads/rewrites it.
        time.sleep(5)


    def patch_config():
        desired = {**BASE_DESIRED}
        for section, keys in sabnzbd_desired().items():
            desired[section] = {**desired.get(section, {}), **keys}

        cp = configparser.ConfigParser()
        cp.read(CONFIG_PATH)
        changed = False
        for section, keys in desired.items():
            if not cp.has_section(section):
                cp.add_section(section)
            for key, value in keys.items():
                current = cp.get(section, key, fallback=None)
                if current != value:
                    cp.set(section, key, value)
                    changed = True
                    if key == "SAB_API":  # don't log the real api key
                        print(f"{section}.{key}: changed", flush=True)
                    else:
                        print(f"{section}.{key}: {current!r} -> {value!r}", flush=True)
        if changed:
            with open(CONFIG_PATH, "w") as f:
                cp.write(f)
        return changed


    def restart_pod():
        pod_name = os.environ.get("MY_POD_NAME")
        if not pod_name:
            print("MY_POD_NAME not set - cannot self-restart, restart the pod manually", flush=True)
            return
        secrets_dir = "/var/run/secrets/kubernetes.io/serviceaccount"
        with open(f"{secrets_dir}/token") as f:
            token = f.read().strip()
        with open(f"{secrets_dir}/namespace") as f:
            namespace = f.read().strip()
        context = ssl.create_default_context(cafile=f"{secrets_dir}/ca.crt")
        conn = http.client.HTTPSConnection("kubernetes.default.svc", 443, context=context)
        try:
            conn.request(
                "DELETE",
                f"/api/v1/namespaces/{namespace}/pods/{pod_name}",
                headers={"Authorization": f"Bearer {token}"},
            )
            resp = conn.getresponse()
            print(f"self-restart requested for {pod_name}: HTTP {resp.status}", flush=True)
            resp.read()
        finally:
            conn.close()


    wait_for_config()
    while True:
        if patch_config():
            print("config.ini patched - self-restarting the whole arr-stack pod so LazyLibrarian picks it up", flush=True)
            restart_pod()
            time.sleep(30)
        else:
            print("lazylibrarian-config-seed: no change this pass, idling", flush=True)
        time.sleep(RECHECK_INTERVAL_SECONDS)
