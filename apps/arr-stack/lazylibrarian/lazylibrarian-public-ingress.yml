apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lazylibrarian-public
  namespace: arr-stack
  labels:
    app: arr-stack
    app.kubernetes.io/name: lazylibrarian
    argocd.argoproj.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: "private-ca"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - lazylibrarian.i3sec.com.au
    secretName: lazylibrarian-public-tls
  rules:
  - host: lazylibrarian.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lazylibrarian
            port:
              number: 5299
