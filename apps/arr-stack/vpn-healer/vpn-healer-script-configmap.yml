# reconcile_vpn.py, mounted read-only into the vpn-healer CronJob's
# pod - see that file's own module docstring for the full design
# rationale (why this can't live inside arr-stack's own pod, what it
# checks, what it does on a stale peer).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vpn-healer-script
  namespace: arr-stack
  labels:
    app: vpn-healer
    argocd.argoproj.io/managed-by: argocd
data:
  reconcile_vpn.py: |
    """
    vpn-healer: keeps arr-stack's PIA WireGuard peer alive without a human.

    PIA doesn't publish static WireGuard configs - gluetun's "custom"
    provider pins to one specific server IP, registered once via PIA's own
    REST API (github.com/pia-foss/manual-connections: get a token -> pick
    a server from the live list -> generate an X25519 keypair -> /addKey).
    That registration doesn't expire on its own, but IS tied to one
    specific server - if PIA ever retires/rotates it, gluetun just
    crash-loops silently forever ("WireGuard setup is complete... i/o
    timeout"), indistinguishable from a generic network failure, until
    someone notices and manually redoes the 4-step flow (this happened
    twice already: 2026-07-23 -> retired ~12 days later, then again within
    ~36-48h of the manual fix).

    This script automates that. It deliberately does NOT live inside the
    arr-stack pod: every container there shares gluetun's network
    namespace, and gluetun's own firewall force-routes all non-cluster
    egress through the VPN tunnel - a healer living in there would be
    stuck trying to reach PIA's API through the very tunnel it's supposed
    to be fixing. Runs instead as its own CronJob, normal cluster egress.

    Each run: checks whether the currently-configured peer is still valid
    (primary: is its server IP still in PIA's own live server list -
    proactive, catches retirement before gluetun even notices; backup:
    scan gluetun's recent logs for a sustained restart loop, to catch
    other failure causes too). If stale, redoes the registration, patches
    the live gluetun-config ConfigMap and gluetun-vpn SealedSecret,
    restarts the arr-stack pod so gluetun picks it up, and commits the
    rotation back to git so a future ArgoCD sync doesn't revert to the
    stale peer.
    """
    import base64
    import json
    import os
    import re
    import shutil
    import subprocess
    import sys
    import time
    import urllib.parse

    import requests
    from cryptography.hazmat.primitives import serialization
    from cryptography.hazmat.primitives.asymmetric import x25519

    NAMESPACE = os.environ.get("NAMESPACE", "arr-stack")
    CONFIGMAP_NAME = os.environ.get("CONFIGMAP_NAME", "gluetun-config")
    SEALEDSECRET_NAME = os.environ.get("SEALEDSECRET_NAME", "gluetun-vpn")
    POD_SELECTOR = os.environ.get("POD_SELECTOR", "app=arr-stack")
    GLUETUN_CONTAINER = os.environ.get("GLUETUN_CONTAINER", "gluetun")
    PIA_REGION = os.environ.get("PIA_REGION", "aus")
    # How long to keep re-reading gluetun's endpoint after a restart before
    # calling the restart itself failed. Generous on purpose: gluetun is up
    # in seconds, but this pod's slowest container (sabnzbd, ~3.5min to pass
    # its probe under load) gates pod-level Ready, and exec can be refused
    # until then. Cheaper to wait here than to delete the pod again - every
    # spurious delete aborts an in-flight SABnzbd unpack and strands an
    # _UNPACK_ folder (1,062 of them, 766 GB, found 2026-09-20).
    ENDPOINT_POLL_TIMEOUT = int(os.environ.get("ENDPOINT_POLL_TIMEOUT", "300"))
    RESTART_LOOP_WINDOW = os.environ.get("RESTART_LOOP_WINDOW", "5m")
    RESTART_LOOP_THRESHOLD = int(os.environ.get("RESTART_LOOP_THRESHOLD", "10"))
    SEALED_SECRETS_CERT_URL = os.environ.get(
        "SEALED_SECRETS_CERT_URL",
        "http://sealed-secrets-controller.kube-system.svc.cluster.local:8080/v1/cert.pem",
    )
    PIA_CA_CERT = os.environ.get("PIA_CA_CERT", "/etc/ssl/pia-ca.rsa.4096.crt")
    PIA_CREDENTIALS_DIR = os.environ.get("PIA_CREDENTIALS_DIR", "/run/secrets/pia")
    GIT_SSH_KEY = os.environ.get("GIT_SSH_KEY", "/run/secrets/git-deploy-key/id_ed25519")
    GIT_REPO_URL = os.environ.get("GIT_REPO_URL", "git@github.com:gorttman/day2-services.git")
    GIT_CLONE_DIR = os.environ.get("GIT_CLONE_DIR", "/tmp/day2-services")
    CONFIGMAP_MANIFEST = "apps/arr-stack/gluetun/gluetun-config.yml"
    SEALEDSECRET_MANIFEST = "apps/arr-stack/gluetun/gluetun-sealed-secret.yml"


    def kubectl(*args, check=True, capture=True, timeout=30):
        # Confirmed live 2026-08-10: three separate runs hit the Job's own
        # activeDeadlineSeconds (300s) with no rotation ever happening - a
        # plain kubectl call (get/logs, not even the restart path) had
        # silently hung with nothing to bound it except that coarse,
        # 5-minutes-later pod kill. A client-side timeout here means a
        # stuck call fails fast with a clear error instead of burning the
        # whole deadline silently. wait_for_pod_ready passes its own longer
        # timeout since it already waits up to `settle_timeout`s via
        # kubectl's own --timeout flag - this one just has to be a bit
        # longer than that, not the default.
        try:
            result = subprocess.run(
                ["kubectl", "-n", NAMESPACE, *args],
                capture_output=capture, text=True, timeout=timeout,
            )
        except subprocess.TimeoutExpired:
            raise RuntimeError(f"kubectl {' '.join(args)} timed out after {timeout}s "
                                "- API server or network likely unresponsive")
        if check and result.returncode != 0:
            raise RuntimeError(f"kubectl {' '.join(args)} failed: {result.stderr}")
        return result.stdout.strip() if capture else None


    def get_current_endpoint_ip():
        return kubectl("get", "configmap", CONFIGMAP_NAME,
                        "-o", "jsonpath={.data.WIREGUARD_ENDPOINT_IP}")


    def fetch_pia_server_list():
        resp = requests.get("https://serverlist.piaservers.net/vpninfo/servers/v6", timeout=15)
        resp.raise_for_status()
        # First block is JSON; anything after the blank line is a PGP
        # signature over that JSON - confirmed against the v6 endpoint's
        # actual response shape (2026-07-23, 2026-08-05 rotations).
        body = resp.text.split("\n\n", 1)[0]
        return json.loads(body)


    def find_region_wg_servers(server_list, region_id):
        for region in server_list["regions"]:
            if region["id"] == region_id:
                return region["servers"]["wg"]
        raise RuntimeError(f"region {region_id!r} not found in PIA server list")


    # PIA_STALENESS_SAMPLES/DELAY: confirmed live 2026-08-24 that PIA's
    # server-list endpoint returns a small ROTATING subset per region per
    # call, not a stable full list - the "aus" region only ever shows 3
    # servers out of a real pool of 4, and which 3 changes between calls
    # seconds apart. A single snapshot is not a reliable staleness signal:
    # this was the actual root cause of vpn-healer rotating (and
    # git-committing, and restarting the arr-stack pod) on very close to
    # every single 15-minute run since 2026-08-07, not just on genuine PIA
    # retirements - the currently-valid, perfectly healthy peer simply
    # wasn't in that one snapshot roughly 1 call in 4. Sampling 5 times ~2s
    # apart and checking the union brings a false-"stale" read down to
    # (1/4)^5 =~ 0.1%, empirically verified against the real endpoint
    # (7/8 single-shot fetches contained the known-good current peer).
    PIA_STALENESS_SAMPLES = int(os.environ.get("PIA_STALENESS_SAMPLES", "5"))
    PIA_STALENESS_SAMPLE_DELAY = float(os.environ.get("PIA_STALENESS_SAMPLE_DELAY", "2"))


    def collect_region_wg_ips(region_id, samples=PIA_STALENESS_SAMPLES, delay=PIA_STALENESS_SAMPLE_DELAY):
        seen_ips = set()
        last_list = None
        for i in range(samples):
            last_list = fetch_pia_server_list()
            seen_ips |= {s["ip"] for s in find_region_wg_servers(last_list, region_id)}
            if i < samples - 1:
                time.sleep(delay)
        return seen_ips, last_list


    def is_endpoint_stale(current_ip, wg_ips_seen):
        return current_ip not in wg_ips_seen


    def get_arr_stack_pod_name():
        # Deliberately NOT `{.items[0].metadata.name}`. During a restart
        # there are briefly TWO pods matching this selector - the old one
        # still Terminating and the new one coming up - and items[0] is
        # whichever the API server lists first, frequently the terminating
        # one. `kubectl exec` into a terminating pod fails, kubectl() with
        # check=False turns that into '', and restart_arr_stack() then read
        # that '' as "the restart did not take" and deleted the pod again.
        # That is the whole reason a single genuine PIA rotation was costing
        # four pod restarts (confirmed live 2026-09-20 from a healer job
        # log: four consecutive "came up with endpoint ''" retries against
        # four different pod names, while the pod that was actually running
        # had the correct endpoint all along).
        #
        # Filter to a pod that is Running and has no deletionTimestamp, so
        # the name we hand to exec is one that can actually serve it.
        #
        # The filtering is done in Python, NOT in a jsonpath predicate.
        # `?(@.metadata.deletionTimestamp=='')` looks like it should work
        # and silently matches NOTHING: on a pod that is not being deleted
        # the field is absent entirely, and kubectl's jsonpath does not
        # treat an absent field as equal to ''. Verified live 2026-09-20 -
        # that predicate returned zero rows against a healthy single-pod
        # arr-stack, which would have made this fall through to the same
        # items[0] behaviour it exists to replace. Emit the fields and
        # decide here instead. Pipe-separated because a literal tab needs
        # escaping through both YAML and jsonpath to get here intact.
        rows = kubectl(
            "get", "pods", "-l", POD_SELECTOR,
            # NOTE the doubled backslash. kubectl's jsonpath parser wants
            # the literal two characters \n inside {"..."}; a real newline
            # there is a parse error ('error parsing jsonpath', rc=1, empty
            # stdout) which check=False would have turned into a silent
            # fall-through to items[0] - the exact bug being fixed.
            # Verified both spellings against live kubectl 2026-09-20.
            "-o", 'jsonpath={range .items[*]}{.metadata.name}{"|"}'
                  '{.status.phase}{"|"}{.metadata.deletionTimestamp}{"\\n"}{end}',
            check=False)
        for line in (rows or "").splitlines():
            parts = line.split("|")
            if len(parts) >= 3 and parts[1] == "Running" and not parts[2]:
                return parts[0]
        # Fall back to the old behaviour rather than hard-failing: a
        # single-pod steady state still resolves fine this way.
        return kubectl("get", "pods", "-l", POD_SELECTOR,
                        "-o", "jsonpath={.items[0].metadata.name}", check=False)


    def gluetun_is_restart_looping():
        # Deliberately NOT `kubectl logs -l ...` - kubectl silently applies
        # a default --tail=10 whenever a label selector is used, regardless
        # of --since, which made this always see ~1 restart line instead of
        # the dozens actually happening in the window (confirmed live
        # 2026-08-07: real restart cadence is ~1 every 6-7s, but `-l` +
        # --since=5m returned only 10 lines total). Resolving the pod name
        # first and logging that directly avoids the hidden cap.
        pod_name = get_arr_stack_pod_name()
        logs = kubectl("logs", pod_name, "-c", GLUETUN_CONTAINER,
                        f"--since={RESTART_LOOP_WINDOW}", check=False)
        count = (logs or "").count("restarting VPN because it failed to pass the healthcheck")
        return count >= RESTART_LOOP_THRESHOLD


    def read_pia_credentials():
        with open(os.path.join(PIA_CREDENTIALS_DIR, "PIA_USERNAME")) as f:
            username = f.read().strip()
        with open(os.path.join(PIA_CREDENTIALS_DIR, "PIA_PASSWORD")) as f:
            password = f.read().strip()
        return username, password


    def get_pia_token(username, password):
        # multipart/form-data, not HTTP Basic Auth - confirmed 2026-08-05
        # against pia-foss/manual-connections/get_token.sh directly; Basic
        # Auth got a 401 even with the correct password.
        resp = requests.post(
            "https://www.privateinternetaccess.com/api/client/v2/token",
            files={"username": (None, username), "password": (None, password)},
            timeout=15,
        )
        resp.raise_for_status()
        return resp.json()["token"]


    def generate_keypair():
        private_key = x25519.X25519PrivateKey.generate()
        public_key = private_key.public_key()
        priv_b64 = base64.b64encode(
            private_key.private_bytes(
                encoding=serialization.Encoding.Raw,
                format=serialization.PrivateFormat.Raw,
                encryption_algorithm=serialization.NoEncryption(),
            )
        ).decode()
        pub_b64 = base64.b64encode(
            public_key.public_bytes(
                encoding=serialization.Encoding.Raw,
                format=serialization.PublicFormat.Raw,
            )
        ).decode()
        return priv_b64, pub_b64


    def register_key(server, token, pubkey_b64):
        # Uses curl's --resolve, matching pia-foss/manual-connections
        # exactly: connect to the server's real IP but present/verify its
        # real hostname (cn) for TLS SNI + certificate validation against
        # PIA's own CA. A plain `requests` call can't do this (the URL host
        # would have to be the IP, which breaks SNI/hostname matching).
        query = urllib.parse.urlencode({"pt": token, "pubkey": pubkey_b64})
        url = f"https://{server['cn']}:1337/addKey?{query}"
        result = subprocess.run(
            ["curl", "-fsS", "--max-time", "15", "--cacert", PIA_CA_CERT,
             "--resolve", f"{server['cn']}:1337:{server['ip']}",
             url],
            capture_output=True, text=True, timeout=20,
        )
        if result.returncode != 0:
            raise RuntimeError(f"PIA /addKey call failed: {result.stderr}")
        data = json.loads(result.stdout)
        if data.get("status") != "OK":
            raise RuntimeError(f"PIA /addKey rejected registration: {data}")
        return data


    def patch_configmap(fields):
        kubectl("patch", "configmap", CONFIGMAP_NAME, "--type", "merge",
                "-p", json.dumps({"data": fields}))


    def reseal_private_key(private_key_b64):
        proc = subprocess.run(
            ["kubeseal", "--raw", "--scope", "strict",
             "--namespace", NAMESPACE, "--name", SEALEDSECRET_NAME,
             "--cert", SEALED_SECRETS_CERT_URL,
             "--from-file", "WIREGUARD_PRIVATE_KEY=/dev/stdin"],
            input=private_key_b64, capture_output=True, text=True, timeout=20,
        )
        if proc.returncode != 0:
            raise RuntimeError(f"kubeseal failed: {proc.stderr}")
        return proc.stdout.strip()


    def patch_sealed_secret(encrypted_private_key):
        patch = {"spec": {"encryptedData": {"WIREGUARD_PRIVATE_KEY": encrypted_private_key}}}
        kubectl("patch", "sealedsecrets.bitnami.com", SEALEDSECRET_NAME,
                "--type", "merge", "-p", json.dumps(patch))


    # attempts dropped 4 -> 2 (2026-09-20). Four existed to fight the race
    # that read_endpoint_ip() now handles directly; with the read no longer
    # reporting false failures, extra deletes only cost aborted unpacks.
    def restart_arr_stack(expected_endpoint_ip, attempts=2, settle_timeout=60,
                           endpoint_poll_timeout=ENDPOINT_POLL_TIMEOUT):
        # A single delete-and-hope isn't enough: confirmed live 2026-08-09
        # that a concurrent restart (ArgoCD self-heal, or an overlapping
        # healer run - manually triggering a Job alongside this CronJob
        # doesn't prevent overlap, concurrencyPolicy: Forbid only blocks the
        # controller's own scheduled runs, not hand-created ones) can win the
        # race and leave a pod running with the stale endpoint baked into its
        # env - patching the ConfigMap alone never restarts anything, so a
        # pod created from a transient/stale ConfigMap state stays wrong
        # forever with no error anywhere. Verify the replacement actually
        # picked up what we just wrote, and retry the delete if not.
        for attempt in range(1, attempts + 1):
            kubectl("delete", "pod", get_arr_stack_pod_name(), "--wait=true",
                    f"--timeout={settle_timeout}s", check=False, timeout=settle_timeout + 10)
            wait_for_pod_ready(GLUETUN_CONTAINER, timeout=settle_timeout)
            # Poll the endpoint rather than reading it once. gluetun itself
            # is serving within seconds, but pod-level condition=Ready needs
            # ALL of this pod's containers, and sabnzbd alone takes ~3.5min
            # to pass its probe under load - so wait_for_pod_ready() times
            # out routinely on a pod that is perfectly fine, and a single
            # exec fired right after it hits a container that cannot answer
            # yet. An empty read means "ask again", NOT "the restart
            # failed": treating it as failure is what caused the delete
            # storm this function was meant to prevent.
            actual_ip = read_endpoint_ip(timeout=endpoint_poll_timeout)
            if actual_ip == expected_endpoint_ip:
                return
            print(f"restart attempt {attempt}/{attempts}: pod came up with "
                  f"endpoint {actual_ip!r}, expected {expected_endpoint_ip!r} - retrying")
        raise RuntimeError(
            f"arr-stack pod never came up with endpoint {expected_endpoint_ip!r} "
            f"after {attempts} restart attempts - needs a human look")


    def read_endpoint_ip(timeout):
        """Read gluetun's live WIREGUARD_ENDPOINT_IP, tolerating startup.

        Returns the value as soon as it reads non-empty, or '' if the whole
        window passes without one. Every failure mode here - pod still
        terminating, container not accepting exec yet, transient API error -
        surfaces from kubectl(check=False) as '', and all of them are worth
        retrying for a bounded time instead of concluding anything.
        """
        deadline = time.monotonic() + timeout
        while True:
            pod_name = get_arr_stack_pod_name()
            if pod_name:
                value = kubectl("exec", pod_name, "-c", GLUETUN_CONTAINER,
                                 "--", "printenv", "WIREGUARD_ENDPOINT_IP",
                                 check=False)
                if value:
                    return value
            if time.monotonic() >= deadline:
                return ""
            time.sleep(5)


    def wait_for_pod_ready(container, timeout):
        # `kubectl()` always returns a string when capture=True (the
        # default) - even a timed-out `wait` with check=False just returns
        # empty stdout, never None. Checking for None here never actually
        # caught a failure; checking for an empty/falsy result does.
        result = kubectl("wait", "pods", "-l", POD_SELECTOR,
                          "--for=condition=Ready",
                          f"--timeout={timeout}s", check=False, timeout=timeout + 10)
        if not result:
            return None
        return get_arr_stack_pod_name()


    def git_commit_rotation(old_ip, new_ip, configmap_fields, encrypted_private_key):
        # ConnectTimeout bounds the SSH handshake itself; the subprocess
        # timeout below is the backstop for a connection that hangs *after*
        # connecting (a stalled transfer, not just a slow/dead handshake).
        ssh_cmd = (
            f"ssh -i {GIT_SSH_KEY} -o StrictHostKeyChecking=yes "
            f"-o UserKnownHostsFile=/etc/ssh/github_known_hosts "
            f"-o ConnectTimeout=10"
        )
        env = {**os.environ, "GIT_SSH_COMMAND": ssh_cmd}

        def git(*args, timeout=30):
            subprocess.run(["git", "-C", GIT_CLONE_DIR, *args], check=True, env=env, timeout=timeout)

        if os.path.isdir(GIT_CLONE_DIR):
            shutil.rmtree(GIT_CLONE_DIR)
        subprocess.run(["git", "clone", "--depth", "1", GIT_REPO_URL, GIT_CLONE_DIR],
                        check=True, env=env, timeout=30)
        git("config", "user.name", "vpn-healer")
        git("config", "user.email", "vpn-healer@arr-stack.local")

        configmap_path = os.path.join(GIT_CLONE_DIR, CONFIGMAP_MANIFEST)
        with open(configmap_path) as f:
            content = f.read()
        for key, value in configmap_fields.items():
            content = re.sub(
                rf'^(\s*{re.escape(key)}:\s*)"[^"]*"$',
                rf'\1"{value}"',
                content, flags=re.MULTILINE,
            )
        with open(configmap_path, "w") as f:
            f.write(content)

        sealedsecret_path = os.path.join(GIT_CLONE_DIR, SEALEDSECRET_MANIFEST)
        with open(sealedsecret_path) as f:
            content = f.read()
        content = re.sub(
            r"^(\s*WIREGUARD_PRIVATE_KEY:\s*).*$",
            rf"\1{encrypted_private_key}",
            content, count=1, flags=re.MULTILINE,
        )
        with open(sealedsecret_path, "w") as f:
            f.write(content)

        git("add", CONFIGMAP_MANIFEST, SEALEDSECRET_MANIFEST)
        git("commit", "-m",
            f"arr-stack: vpn-healer auto-rotated PIA WireGuard peer\n\n"
            f"PIA's pinned server ({old_ip}) went stale - re-registered "
            f"against {new_ip} automatically, no human involved.")
        git("push", "origin", "HEAD:main")


    def main():
        current_ip = get_current_endpoint_ip()
        wg_ips_seen, server_list = collect_region_wg_ips(PIA_REGION)
        wg_servers = find_region_wg_servers(server_list, PIA_REGION)

        stale = is_endpoint_stale(current_ip, wg_ips_seen)
        looping = gluetun_is_restart_looping()
        # Diagnostic escape hatch only - never set on the CronJob itself, so
        # every normal scheduled run stays exactly as staleness-gated as
        # before. Exists for the one legitimate case that gate can't cover:
        # confirming whether P2P (BitTorrent) connectivity is bad on this
        # specific PIA exit node specifically, not whether the peer itself
        # is stale - those are different questions, and only a real rotation
        # to a different server answers the second one.
        forced = os.environ.get("FORCE_ROTATE") == "1"

        if not stale and not looping and not forced:
            print(f"OK: peer {current_ip} still listed in PIA's {PIA_REGION!r} region, "
                  "no restart loop detected.")
            return 0

        reason = ("server no longer in PIA's live list" if stale
                  else "gluetun stuck in a restart loop" if looping
                  else "forced (FORCE_ROTATE=1)")
        print(f"Rotating PIA WireGuard peer - {reason} (current: {current_ip}).")

        username, password = read_pia_credentials()
        token = get_pia_token(username, password)

        candidates = [s for s in wg_servers if s["ip"] != current_ip] or wg_servers
        server = candidates[0]

        private_key_b64, public_key_b64 = generate_keypair()
        registration = register_key(server, token, public_key_b64)

        new_fields = {
            "VPN_SERVICE_PROVIDER": "custom",
            "VPN_TYPE": "wireguard",
            "WIREGUARD_ENDPOINT_IP": server["ip"],
            "WIREGUARD_ENDPOINT_PORT": str(registration["server_port"]),
            "WIREGUARD_PUBLIC_KEY": registration["server_key"],
            "WIREGUARD_ADDRESSES": f"{registration['peer_ip']}/32",
        }

        encrypted_private_key = reseal_private_key(private_key_b64)

        # Git FIRST, live cluster SECOND - deliberately. arr-stack is an
        # ArgoCD-managed Application: if the live ConfigMap/SealedSecret get
        # patched before git reflects the same values, ArgoCD's own
        # self-heal sees that as drift and reverts it back to the stale
        # peer, undoing the fix - confirmed live 2026-08-07 (a git push
        # failure here left the tunnel silently re-broken with no error
        # about IT). Committing first means a git failure aborts before
        # anything live changes (clean retry next run, no wasted PIA
        # registration burned for nothing), and once git succeeds, ArgoCD
        # becomes a backstop instead of an adversary if the live patch step
        # below has its own hiccup.
        git_commit_rotation(current_ip, server["ip"], new_fields, encrypted_private_key)

        patch_configmap(new_fields)
        patch_sealed_secret(encrypted_private_key)
        restart_arr_stack(new_fields["WIREGUARD_ENDPOINT_IP"])

        print(f"Done: rotated {current_ip} -> {server['ip']}, arr-stack restarted, "
              "git updated.")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
