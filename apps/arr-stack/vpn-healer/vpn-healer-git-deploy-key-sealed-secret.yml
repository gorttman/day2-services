# SSH deploy key vpn-healer uses to push its own PIA peer rotations
# back into this repo (see reconcile_vpn.py's git_commit_rotation).
# Generated 2026-08-07 specifically for this purpose - not reused from
# anywhere else. Needs write access on GitHub as a repo Deploy Key
# (Settings > Deploy keys > Add deploy key on gorttman/day2-services,
# "Allow write access" checked) - the matching public half is:
#   ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPhXR9YbUMd3kTIpa6f4bRVwf2egxPcHbyaM+7rXquOP vpn-healer@arr-stack
#
# Verifies GitHub's identity via /etc/ssh/github_known_hosts (baked
# into the gluetun-vpn-healer image from GitHub's own published
# ed25519 host key), StrictHostKeyChecking=yes - not
# trust-on-first-connect.
#
# To rotate: generate a fresh ed25519 keypair, replace the deploy key
# on GitHub with the new public half, then reseal with
# `kubeseal --raw --scope strict --namespace arr-stack --name
# vpn-healer-git-deploy-key --from-file=id_ed25519=/dev/stdin`,
# replacing the encryptedData line below - same pattern as every
# other sealed secret in this repo.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: vpn-healer-git-deploy-key
  namespace: arr-stack
spec:
  encryptedData:
    id_ed25519: 
  template:
    metadata:
      creationTimestamp: null
      name: vpn-healer-git-deploy-key
      namespace: arr-stack
    type: Opaque
