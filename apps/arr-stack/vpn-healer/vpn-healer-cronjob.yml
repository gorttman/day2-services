# Self-heals arr-stack's PIA WireGuard peer registration - see
# reconcile_vpn.py's module docstring for the why. Runs as its own
# CronJob, NOT inside the arr-stack pod: gluetun's firewall
# force-routes every container in that shared pod's network namespace
# through the VPN tunnel, so a healer living there would be stuck
# trying to reach PIA's API through the very tunnel it's fixing.
#
# Schedule: every 15 minutes. Frequent enough that a stale peer gets
# caught and fixed well within an hour of PIA retiring a server
# (instead of however long it takes someone to notice sabnzbd/prowlarr
# have no internet), infrequent enough not to hammer PIA's account API
# or the git remote.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vpn-healer
  namespace: arr-stack
  labels:
    app: vpn-healer
    argocd.argoproj.io/managed-by: argocd
spec:
  schedule: "*/15 * * * *"
  # Declared explicitly on purpose. This was suspended live while Git
  # said nothing about suspend, and ArgoCD cannot diff a field the
  # desired state omits - so the job sat dead and the app stayed
  # Synced. With the field present, selfHeal reverts any future
  # suspension.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # Raised 300 -> 1200 (2026-09-20). A rotation now waits up to
      # ENDPOINT_POLL_TIMEOUT (300s) per restart attempt for gluetun's
      # endpoint to be readable, because pod-level Ready is gated by
      # sabnzbd's ~3.5min startup. Two attempts x (delete 60s + wait 60s +
      # poll 300s) plus PIA sampling does not fit in 300s, and a rotation
      # killed midway by this deadline is what left three Failed jobs in
      # the last 24h with the peer already committed to git.
      # concurrencyPolicy: Forbid above means a long run just skips the
      # next 15-minute tick rather than overlapping.
      activeDeadlineSeconds: 1200
      template:
        spec:
          restartPolicy: Never
          # Hard nodeSelector removed 2026-08-17: was pinned for the
          # same resolved tmpfs constraint as everything else, but
          # unlike arr-stack itself this CronJob has no PVC of its own
          # (just a configMap-mounted script) - nothing ties it to
          # arr-stack's node, and arr-stack stays hard-pinned regardless
          # (its config PVCs are local-path, not portable - see
          # arr-stack-deployment.yml). Left unpinned rather than given
          # a workload-affinity preference: no co-location requirement,
          # free to land wherever the scheduler puts it.
          serviceAccountName: vpn-healer
          # fsGroup 100 ("users") matches the image's own runtime GID
          # (see images/gluetun-vpn-healer/Dockerfile) - without it, the
          # git-deploy-key Secret volume is owned by root and this
          # container's UID 1000 process can't read its own SSH key
          # ("Permission denied" from ssh, confirmed live 2026-08-07).
          securityContext:
            fsGroup: 100
          containers:
            - name: vpn-healer
              image: ghcr.io/gorttman/gluetun-vpn-healer:0.1.0
              command: ["python3", "/app/reconcile_vpn.py"]
              resources:
                requests: {memory: "32Mi", cpu: "10m"}
                limits: {memory: "256Mi", cpu: "500m"}
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: pia-credentials
                  mountPath: /run/secrets/pia
                  readOnly: true
                - name: git-deploy-key
                  mountPath: /run/secrets/git-deploy-key
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: vpn-healer-script
            - name: pia-credentials
              secret:
                secretName: pia-account-credentials
            - name: git-deploy-key
              secret:
                secretName: vpn-healer-git-deploy-key
                # Group-read (not owner-only): fsGroup above makes the
                # mount's group ownership 100, and the container's own
                # runtime GID is also 100 - this is what actually lets
                # UID 1000 read it, not just the fsGroup assignment
                # alone (base file mode still gates access).
                defaultMode: 0440
