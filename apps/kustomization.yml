apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pihole/pihole-app.yml
  - novnc/novnc-app.yml
  - cert-manager/cert-manager-app.yml
  - obsidian/obsidian-app.yml
  - vscode-server/vscode-server-app.yml
  - ca-portal/ca-portal-app.yml
  - postgres/postgres-app.yml
  - paperless/paperless-app.yml
  - jellyfin/jellyfin-app.yml
  # calibre-web was disabled earlier on 2026-09-03: its two qnap PVs
  # (qnap-books, qnap-calibre-web-live) carried a stuck deletionTimestamp from
  # the 2026-08-30 VLAN20 PV churn and could not finish deleting while their
  # PVCs stayed bound, holding qnap-storage - and so the whole day1-foundation
  # parent - permanently Progressing.
  #
  # RE-ENABLED later the same day. The stated precondition is met: both PVs
  # have finished deleting and no longer exist in the cluster, and they are
  # re-enabled in day1-foundation/apps/qnap-storage with the explicit
  # claimRefs that were added while they were disabled. reclaimPolicy stayed
  # Retain throughout, so the QNAP data was never at risk.
  #
  # Found because books.i3sec.com.au returned 404, not a DNS failure: Pi-hole
  # still resolves the name to ingress-nginx, but with the app gone there was
  # no ingress to serve it.
  - calibre-web/calibre-web-app.yml   # replaces kavita 2026-07-17 - see homelab-book chapter 002
  # arr-stack re-enabled 2026-09-03: sabnzbd's limit is now 2Gi, which was
  # the stated precondition when it was parked earlier the same day (it
  # OOMKilled in a loop against 1Gi, par2/python3 rss ~1010Mi, cgroup OOM
  # in dmesg, leaving the shared pod permanently 9/10).
  # Also disabled 2026-07-17-2026-07-22 on a placeholder VPN secret
  # (gluetun CrashLoopBackOff); real PIA creds sealed over gluetun-vpn
  # 2026-07-22.
  - arr-stack/arr-stack-app.yml
  - homeassistant/homeassistant-app.yml
  - backup-dashboard/backup-dashboard-app.yml
  # Commented out 2026-09-04: n8n has zero workflows and is not in
  # use. Manifests are kept in apps/n8n/ - uncomment this line to
  # bring it back. The postgres n8n database is deliberately left
  # in place and still backed up nightly.
  # - n8n/n8n-app.yml
  - inbox-router/inbox-router-app.yml
  - books-pipeline/books-pipeline-app.yml
