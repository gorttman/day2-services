apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
    app.kubernetes.io/name: jellyfin
    argocd.argoproj.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # Internal-only: no Cloudflare Tunnel annotation; DNS for this host
  # lives in dns-conf.
  ingressClassName: traefik
  tls:
  - hosts:
    - jellyfin.i3sec.com.au
    secretName: jellyfin-tls
  rules:
  - host: jellyfin.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jellyfin
            port:
              number: 8096
