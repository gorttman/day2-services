apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
    app.kubernetes.io/name: jellyfin
    argocd.argoproj.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # This Ingress is LAN-only: no Cloudflare Tunnel annotation, reached via
  # the split-horizon dns-conf record (pihole + coredns -> Traefik VIP).
  # Off-LAN access is separate - cloudflare-tf tunnels jellyfin.i3sec.com.au
  # straight to the jellyfin Service, bypassing this Ingress (added
  # 2026-09-08, behind the zone-wide mTLS WAF rule).
  ingressClassName: traefik
  tls:
  - hosts:
    - jellyfin.i3sec.com.au
    secretName: jellyfin-tls
  rules:
  - host: jellyfin.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jellyfin
            port:
              number: 8096
