# PLACEHOLDER STORAGE: local-path (k3s default) is node-local and
# non-durable - data lives in /var/lib/rancher/k3s/storage on whichever
# node the pod first schedules to, and the pod is pinned there from then
# on (WaitForFirstConsumer + RWO). Swap storageClassName to an NFS-backed
# class once real storage exists; that swap requires recreating the PVCs
# (delete + resync), not just editing them in place.
#
# NOTE: only k8smaster has real disk. On the diskless pinode-01,
# /var/lib/rancher/k3s (including local-path volumes) is a 4G RAM tmpfs
# wiped on reboot - never bind local-path PVCs there. Hence the
# nodeSelector in the deployment.
#
# Jellyfin's internal SQLite DB lives on the config volume, which is the
# other reason this is NOT on nfs-client today: SQLite on NFS corrupts
# (see the pihole gravity.db incident, day2-services apps/pihole).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: jellyfin
  labels:
    app: jellyfin
    app.kubernetes.io/name: jellyfin
    argocd.argoproj.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  # Longhorn since 2026-09-03. local-path is node-local, which is what hard-pinned
  # this workload to k8smaster; Longhorn replicates the volume across both
  # nodes so the pod can float. Not NFS - a Longhorn volume is attached as a
  # local block device, so neither the SQLite-on-NFS corruption nor the hard
  # -mount hang that drove the earlier retreat to local-path applies.
  storageClassName: longhorn
  resources:
    requests:
      # 8Gi, not 2Gi, since 2026-09-03: the real config directory is 3.0G
      # (37,031 files - metadata, images and the transcode DB). local-path
      # never enforced the 2Gi request, Longhorn does, and the first restore
      # silently truncated because busybox cp discarded its own ENOSPC.
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-cache
  namespace: jellyfin
  labels:
    app: jellyfin
    app.kubernetes.io/name: jellyfin
    argocd.argoproj.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  # Longhorn since 2026-09-03. local-path is node-local, which is what hard-pinned
  # this workload to k8smaster; Longhorn replicates the volume across both
  # nodes so the pod can float. Not NFS - a Longhorn volume is attached as a
  # local block device, so neither the SQLite-on-NFS corruption nor the hard
  # -mount hang that drove the earlier retreat to local-path applies.
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
