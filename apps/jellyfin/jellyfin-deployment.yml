apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/component: media-server
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  # RWO local-path volume: old pod must release it before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
        app.kubernetes.io/name: jellyfin
        app.kubernetes.io/component: media-server
    spec:
      # workload-affinity: when Jellyfin gets a preferred home, wire in the
      # patch template from components/workload-affinity/ and add jellyfin
      # to day1-foundation/ansible/label-nodes.yml.
      #
      # Hard pin to k8smaster, tied to the local-path placeholder. Half
      # of the original reason is resolved: pinode-01 has real
      # persistent storage now (2026-08-16/17), not a 4G RAM tmpfs, so
      # image-size eviction is no longer a concern (confirmed live -
      # much larger images than this one now pull and run fine there).
      # What's NOT resolved: this app's PVCs are still
      # storageClassName: local-path, node-local storage that doesn't
      # travel with the pod - a soft workload-affinity preference would
      # be unsafe here, not just imprecise, since landing on the other
      # node would silently create a fresh empty library/config volume
      # instead of failing loudly. Stays hard-pinned until these PVCs
      # move to NFS-backed storage (qnap-static/nfs-client, matching
      # immich/paperless) - that's the actual "storage swap" needed,
      # still open (same as arr-stack's identical situation).
      # Unpinned 2026-09-03: jellyfin-config and jellyfin-cache moved to Longhorn,
      # so the volumes follow the pod instead of living on one node. Soft
      # workload-affinity now comes from affinity-patch.yml.
      enableServiceLinks: false  # avoid injected <SVC>_PORT env vars (bit paperless)
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:10.11.11
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8096
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: cache
          mountPath: /cache
        # Same qnap:/media NFS export arr-stack already mounts (Sonarr/
        # Radarr land finished imports in tv/ and movies/ there).
        # Jellyfin only reads it, never imports/renames - read-only.
        - name: media
          mountPath: /movies
          subPath: movies
          readOnly: true
        - name: media
          mountPath: /tv
          subPath: tv
          readOnly: true
        # Bulk catalog content (Radarr's second root folder, added
        # 2026-08-23) - a separate mount so it can be a separate
        # Jellyfin library rather than being mixed into the main movie
        # library. Without this Jellyfin simply cannot see anything
        # Radarr files into /movies-bulk: found live 2026-08-26 with
        # Radarr reporting 4 downloaded movies and Jellyfin showing 2.
        - name: media
          mountPath: /movies-bulk
          subPath: movies-bulk
          readOnly: true
        # Restricted-access library (2026-08-27). A folder inside the
        # existing /media export rather than a separate share - the
        # restriction is enforced by Jellyfin per-user library access,
        # not by storage permissions. The LG account was switched to
        # EnableAllFolders=false with an explicit three-library
        # allow-list BEFORE this mount existed, so this library is
        # invisible to it from creation rather than briefly exposed.
        # Note the corollary: any future library is also invisible to
        # LG until explicitly added to that allow-list.
        - name: media
          mountPath: /movies-private
          subPath: movies-private
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: jellyfin-config
      # emptyDir, not a PVC, since 2026-09-03. /cache holds only re-derivable
      # data - verified by inspection, not assumed: transcodes (HLS segments,
      # deleted when playback ends), images + imagesbyname (artwork, re-fetched),
      # omdb (cached OMDb API JSON), concat (ffmpeg lists). No database files.
      # Watched status, resume positions, users, playlists and collections all
      # live in jellyfin.db under /config, which stays on Longhorn.
      #
      # Why not Longhorn for this one: Longhorn acknowledges a write only once
      # both replicas confirm over the network. That is correct for real data
      # and pure cost for a transcode scratchpad ffmpeg writes to continuously
      # during playback.
      #
      # Measured, 500 x 4k synchronous writes, corrected figures:
      #   host NVMe          ~654 ms
      #   emptyDir in-pod    ~1040-1325 ms
      #   Longhorn in-pod    ~2364-3871 ms
      # So Longhorn is roughly 2-3x slower than local disk here.
      #
      # CORRECTION, same day: an earlier version of this comment claimed ~80x,
      # from a baseline of 29ms. That baseline was written to /tmp, which is
      # tmpfs on BOTH nodes (8G on k8smaster, 4G on pinode-01) - it measured
      # RAM, not storage. Recorded because the mistake is easy to repeat: on
      # these nodes /tmp is never a disk benchmark. The decision stands on the
      # 2-3x figure and on not replicating disposable data at all.
      #
      # Why not local-path either: that binds the volume to one node and would
      # re-pin this workload, which is exactly what the Longhorn migration was
      # meant to end. emptyDir is node-local AND follows the pod - it is simply
      # recreated empty wherever it lands. Confirmed backed by /dev/nvme0n1p2
      # (ext4) on pinode-01, not NFS; the older "emptyDir is NFS-backed" note
      # predates these nodes having NVMe.
      #
      # Cost of a reschedule: artwork and OMDb lookups re-fetch on demand. No
      # user-visible state is lost.
      - name: cache
        emptyDir:
          sizeLimit: 10Gi
      # Raw NFS volume, not a PVC - same pattern books-pipeline/arr-stack
      # use for /books and /media. subPath above splits this one export
      # into movies/ and tv/ per mount.
      - name: media
        nfs:
          server: qnap
          path: /media
