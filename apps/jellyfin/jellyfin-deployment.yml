apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/component: media-server
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  # RWO local-path volume: old pod must release it before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
        app.kubernetes.io/name: jellyfin
        app.kubernetes.io/component: media-server
    spec:
      # workload-affinity: when Jellyfin gets a preferred home, wire in the
      # patch template from components/workload-affinity/ and add jellyfin
      # to day1-foundation/ansible/label-nodes.yml.
      #
      # Hard pin to k8smaster, tied to the local-path placeholder. Half
      # of the original reason is resolved: pinode-01 has real
      # persistent storage now (2026-08-16/17), not a 4G RAM tmpfs, so
      # image-size eviction is no longer a concern (confirmed live -
      # much larger images than this one now pull and run fine there).
      # What's NOT resolved: this app's PVCs are still
      # storageClassName: local-path, node-local storage that doesn't
      # travel with the pod - a soft workload-affinity preference would
      # be unsafe here, not just imprecise, since landing on the other
      # node would silently create a fresh empty library/config volume
      # instead of failing loudly. Stays hard-pinned until these PVCs
      # move to NFS-backed storage (qnap-static/nfs-client, matching
      # immich/paperless) - that's the actual "storage swap" needed,
      # still open (same as arr-stack's identical situation).
      nodeSelector:
        kubernetes.io/hostname: k8smaster
      enableServiceLinks: false  # avoid injected <SVC>_PORT env vars (bit paperless)
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:10.11.11
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8096
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: cache
          mountPath: /cache
        # Same qnap:/media NFS export arr-stack already mounts (Sonarr/
        # Radarr land finished imports in tv/ and movies/ there).
        # Jellyfin only reads it, never imports/renames - read-only.
        - name: media
          mountPath: /movies
          subPath: movies
          readOnly: true
        - name: media
          mountPath: /tv
          subPath: tv
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: jellyfin-config
      - name: cache
        persistentVolumeClaim:
          claimName: jellyfin-cache
      # Raw NFS volume, not a PVC - same pattern books-pipeline/arr-stack
      # use for /books and /media. subPath above splits this one export
      # into movies/ and tv/ per mount.
      - name: media
        nfs:
          server: qnap
          path: /media
