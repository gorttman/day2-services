# calibre-web's own config/database runs in a RAM emptyDir (same
# pihole/kavita/grafana pattern - SQLite must never sit on NFS). This
# PVC holds the periodic tar backups.
#
# Migrated to the QNAP 2026-08-10 - nfs-client is k8smaster's own local
# disk, so these "backups" had zero durability against the one failure
# mode a backup is supposed to survive.
#
# Repointed again 2026-08-13, off the backup disk's
# active_backup/calibre-web and onto the QNAP main pool's /calibre-web
# export - the backup disk is the one directory tree the QNAP snapshot
# job can't back up (it excludes itself), so these tar backups had zero
# generational history and zero protection if the backup disk itself
# failed. Existing content (3 files, 908K) copied and verified before
# this PVC was repointed - see day1-foundation/apps/qnap-storage/
# README.md's pihole/calibre-web migration section.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-config-backup
  namespace: calibre-web
  labels:
    app: calibre-web
    app.kubernetes.io/name: calibre-web
    argocd.argoproj.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: qnap-static
  volumeName: qnap-calibre-web-live
  volumeMode: Filesystem
  resources:
    requests:
      storage: 2Gi
