# Plaintext generated once (2026-07-18) and shown only in that session -
# not recoverable from this file. To read a current password:
#   kubectl exec -n calibre-web deploy/calibre-web -c calibre-web -- true
#   (there's no read-back path by design - sealed-secrets is one-way)
# To rotate a password: generate a new one, reseal just that key with
# kubeseal --raw (scope strict, namespace calibre-web, name
# calibre-web-user-passwords), replace its line below, then also delete
# the user's row from app.db (or update it directly) - the seed script
# only creates missing rows, it will not overwrite an existing password.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: calibre-web-user-passwords
  namespace: calibre-web
spec:
  encryptedData:
    gorttman: ""
    brett: ""
