apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calibre-web
  namespace: calibre-web
  labels:
    app: calibre-web
    app.kubernetes.io/name: calibre-web
    argocd.argoproj.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # Internal-only: no Cloudflare Tunnel annotation; DNS for this host
  # lives in dns-conf. http->https redirect is global (day0-bootstrap
  # apps/traefik/traefik-config.yml). Same pattern as kavita's internal
  # ingress.
  ingressClassName: traefik
  tls:
  - hosts:
    - calibre-web.i3sec.com.au
    secretName: calibre-web-tls
  rules:
  - host: calibre-web.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: calibre-web
            port:
              number: 8083
