# PUID/PGID set to 10001 (not linuxserver's default 1000) to match
# books-pipeline's non-root UID - both containers need to read AND
# write the same library files and metadata.db, so they need to agree
# on ownership rather than fighting over it.
#
# DOCKER_MODS (linuxserver's optional on-the-fly conversion mod) is
# deliberately NOT set - it's x86-64 only per linuxserver's own docs,
# and unnecessary regardless: books-pipeline (prompt 3/4) already does
# all real Calibre conversion work in its own container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  namespace: calibre-web
  labels:
    app: calibre-web
    app.kubernetes.io/name: calibre-web
    app.kubernetes.io/component: reading-server
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calibre-web
  template:
    metadata:
      labels:
        app: calibre-web
        app.kubernetes.io/name: calibre-web
        app.kubernetes.io/component: reading-server
    spec:
      # Same reasoning as kavita's pin: this image needs to reliably
      # fit pinode-01's 4G tmpfs image store, and config is RAM+backup
      # so the pod would otherwise be free to float.
      nodeSelector:
        kubernetes.io/hostname: k8smaster
      enableServiceLinks: false
      initContainers:
      - name: config-restore
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          set -e
          cd /config
          if [ -f /backup/calibre-web-config.tar ] && tar -xf /backup/calibre-web-config.tar -C /config 2>/dev/null; then
            echo "restored calibre-web-config.tar"
          elif [ -f /backup/calibre-web-config.prev.tar ] && tar -xf /backup/calibre-web-config.prev.tar -C /config 2>/dev/null; then
            echo "restored calibre-web-config.prev.tar (newest was unreadable)"
          else
            echo "no backup found - starting fresh"
          fi
          chown -R 10001:10001 /config
          chmod 0775 /config
        volumeMounts:
        - name: config
          mountPath: /config
        - name: backup
          mountPath: /backup
      containers:
      - name: calibre-web
        image: lscr.io/linuxserver/calibre-web:0.6.26-ls391
        imagePullPolicy: IfNotPresent
        env:
        - name: PUID
          value: "10001"
        - name: PGID
          value: "10001"
        - name: TZ
          value: Australia/Sydney
        ports:
        - name: http
          containerPort: 8083
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: books
          mountPath: /books
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /
            port: 8083
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8083
          initialDelaySeconds: 45
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
      # Seeds real accounts (gorttman, brett - see calibre-web-user-seed-script.yml
      # for the full reasoning) directly into app.db, so no one has to click
      # through the setup wizard by hand. Can't be an initContainer: app.db
      # doesn't exist until calibre-web itself creates it on first boot, so
      # this waits that out as a plain long-running container instead of
      # racing it. Idempotent - only creates rows that don't exist yet.
      - name: user-seed
        image: lscr.io/linuxserver/calibre-web:0.6.26-ls391
        imagePullPolicy: IfNotPresent
        command: ["python3", "/app/seed_users.py"]
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
        env:
        - name: CALIBRE_PW_GORTTMAN
          valueFrom:
            secretKeyRef:
              name: calibre-web-user-passwords
              key: gorttman
        - name: CALIBRE_PW_BRETT
          valueFrom:
            secretKeyRef:
              name: calibre-web-user-passwords
              key: brett
        volumeMounts:
        - name: config
          mountPath: /config
        - name: user-seed-script
          mountPath: /app
        resources:
          requests: {memory: "32Mi", cpu: "10m"}
          limits: {memory: "128Mi", cpu: "200m"}
      - name: config-backup
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          backup() {
            tar -cf /backup/.tmp.tar -C /config --exclude=cache --exclude=temp --exclude=logs . || return 1
            sz=$(stat -c %s /backup/.tmp.tar 2>/dev/null || echo 0)
            if [ "$sz" -gt 10240 ]; then
              [ -f /backup/calibre-web-config.tar ] && cp /backup/calibre-web-config.tar /backup/calibre-web-config.prev.tar
              mv /backup/.tmp.tar /backup/calibre-web-config.tar
              echo "backup ok ($sz bytes) $(date)"
            else
              echo "backup skipped - suspiciously small ($sz bytes)"
              rm -f /backup/.tmp.tar
            fi
          }
          while true; do sleep 3600; backup; done
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "tar -cf /backup/.tmp.tar -C /config --exclude=cache --exclude=temp --exclude=logs . && sz=$(stat -c %s /backup/.tmp.tar) && [ \"$sz\" -gt 10240 ] && { [ -f /backup/calibre-web-config.tar ] && cp /backup/calibre-web-config.tar /backup/calibre-web-config.prev.tar; mv /backup/.tmp.tar /backup/calibre-web-config.tar; } || rm -f /backup/.tmp.tar"]
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: backup
          mountPath: /backup
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "200m"
      volumes:
      - name: config
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: backup
        persistentVolumeClaim:
          claimName: calibre-web-config-backup
      - name: user-seed-script
        configMap:
          name: calibre-web-user-seed-script
      - name: books
        persistentVolumeClaim:
          claimName: calibre-web-books
