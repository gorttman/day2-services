apiVersion: v1
kind: ConfigMap
metadata:
  name: calibre-web-user-seed-script
  namespace: calibre-web
data:
  seed_users.py: |
    #!/usr/bin/env python3
    # Creates real calibre-web accounts for this homelab's actual people
    # (day1-foundation/apps/cloudflare-tf's warp_authorized_emails - the
    # only place this repo enumerates who's allowed to use it) by writing
    # directly into app.db's `user` table with the same scrypt hash format
    # calibre-web itself uses (werkzeug.security, method="scrypt"), rather
    # than going through the setup wizard by hand.
    #
    # Idempotent and safe to leave running forever: only INSERTs a row
    # when no user with that name exists yet, so it never overwrites a
    # password someone has since changed via the calibre-web UI. Runs as
    # a plain extra container in the calibre-web pod (not an init
    # container) because app.db doesn't exist until calibre-web itself
    # creates it on first boot - this waits that out instead of racing it.
    #
    # Role bitmask (from the image's own cps/constants.py, confirmed
    # 2026-07-17 against lscr.io/linuxserver/calibre-web:0.6.26-ls391):
    #   ROLE_ADMIN=1 ROLE_DOWNLOAD=2 ROLE_UPLOAD=4 ROLE_EDIT=8
    #   ROLE_PASSWD=16 ROLE_ANONYMOUS=32 ROLE_EDIT_SHELFS=64
    #   ROLE_DELETE_BOOKS=128 ROLE_VIEWER=256
    # ROLE_READER (350) = DOWNLOAD+UPLOAD+EDIT+PASSWD+EDIT_SHELFS+VIEWER -
    # a full reader/curator account (can change their own password) but
    # not ROLE_ADMIN (server settings/user management) or
    # ROLE_DELETE_BOOKS. Promote via the calibre-web UI (Admin > Edit
    # User) if that's ever not enough.
    #
    # Also sets config_calibre_dir (2026-07-18) - without this,
    # calibre-web shows its "Location of Calibre database" setup screen
    # forever, since nothing else in this deployment ever tells it where
    # the library is. Only touches it if it's currently blank, same
    # idempotency rule as the user rows - never overwrites a path an
    # admin has since changed via the UI.
    #
    # calibre-web reads config_calibre_dir (and config_session, added
    # 2026-08-04 - see configure_session_protection() below) into memory
    # once at process startup - writing it directly into app.db from this
    # sidecar (a different process) doesn't make the already-running
    # calibre-web process notice. The only way to make it notice, short of
    # a human clicking Save in the Admin UI, is a fresh boot - so this
    # self-deletes the pod via the Kubernetes API when it makes either
    # change, and the Deployment controller recreates it immediately. See
    # calibre-web-rbac.yml for the (deliberately narrow: delete pods, this
    # namespace only) permission that requires.
    import http.client
    import os
    import sqlite3
    import ssl
    import time

    from werkzeug.security import generate_password_hash

    DB_PATH = "/config/app.db"
    LIBRARY_PATH = "/books"
    ROLE_READER = 2 + 4 + 8 + 16 + 64 + 256

    USERS = [
        {"name": "gorttman", "email": "gorttman@i3sec.com.au", "password_env": "CALIBRE_PW_GORTTMAN"},
        {"name": "brett", "email": "brett@i3sec.com.au", "password_env": "CALIBRE_PW_BRETT"},
    ]


    def wait_for_schema():
        while True:
            if os.path.exists(DB_PATH):
                try:
                    conn = sqlite3.connect(DB_PATH)
                    conn.execute("SELECT 1 FROM user LIMIT 1")
                    conn.close()
                    return
                except sqlite3.Error:
                    pass
            print("waiting for calibre-web to create app.db...", flush=True)
            time.sleep(5)


    def seed():
        conn = sqlite3.connect(DB_PATH)
        cur = conn.cursor()
        for u in USERS:
            cur.execute("SELECT id FROM user WHERE name = ?", (u["name"],))
            if cur.fetchone():
                print(f"{u['name']}: already exists, skipping", flush=True)
                continue
            password = os.environ.get(u["password_env"])
            if not password:
                print(f"{u['name']}: {u['password_env']} not set, skipping", flush=True)
                continue
            pw_hash = generate_password_hash(password, method="scrypt")
            cur.execute(
                """
                INSERT INTO user
                    (name, email, role, password, kindle_mail, locale,
                     sidebar_view, default_language, denied_tags,
                     allowed_tags, denied_column_value, allowed_column_value,
                     view_settings, kobo_only_shelves_sync)
                VALUES (?, ?, ?, ?, '', 'en', 262143, 'all', '', '', '', '', '{}', 0)
                """,
                (u["name"], u["email"], ROLE_READER, pw_hash),
            )
            conn.commit()
            print(f"{u['name']}: created", flush=True)
        conn.close()


    def configure_library():
        """Returns True if config_calibre_dir was blank and just got set -
        that's the signal the caller uses to decide whether a restart is
        needed. Never touches a non-blank value."""
        conn = sqlite3.connect(DB_PATH)
        cur = conn.cursor()
        cur.execute("SELECT config_calibre_dir FROM settings")
        row = cur.fetchone()
        current = row[0] if row else None
        if current:
            print(f"config_calibre_dir already set to {current!r}, leaving alone", flush=True)
            conn.close()
            return False
        cur.execute(
            "UPDATE settings SET config_calibre_dir = ? WHERE config_calibre_dir IS NULL OR config_calibre_dir = ''",
            (LIBRARY_PATH,),
        )
        conn.commit()
        conn.close()
        print(f"config_calibre_dir was blank, set to {LIBRARY_PATH}", flush=True)
        return True


    def configure_session_protection():
        """Returns True if config_session was just changed from Strong (1)
        to Basic (0). Flask-Login's Strong protection hashes each session
        to the request's (remote_addr, user_agent) pair and silently kills
        the session the moment that hash doesn't match on a later request -
        which happens routinely behind a reverse proxy (traefik here), so
        every click after a successful login bounced straight back to the
        login page (reported live 2026-08-04). Basic protection only
        clears the remember-me cookie on a mismatch instead of the whole
        session, which is the documented fix for exactly this deployment
        shape. Idempotent: only touches a value of 1, never re-touches
        after it's 0 (e.g. if an admin deliberately sets it back via the
        UI)."""
        conn = sqlite3.connect(DB_PATH)
        cur = conn.cursor()
        cur.execute("SELECT config_session FROM settings")
        row = cur.fetchone()
        current = row[0] if row else None
        if current != 1:
            print(f"config_session already {current!r}, leaving alone", flush=True)
            conn.close()
            return False
        cur.execute("UPDATE settings SET config_session = 0 WHERE config_session = 1")
        conn.commit()
        conn.close()
        print("config_session was Strong (1), set to Basic (0) - fixes the login loop behind a reverse proxy", flush=True)
        return True


    def restart_pod():
        pod_name = os.environ.get("MY_POD_NAME")
        if not pod_name:
            print("MY_POD_NAME not set - cannot self-restart, set the library path via the UI or restart the pod manually", flush=True)
            return

        secrets_dir = "/var/run/secrets/kubernetes.io/serviceaccount"
        with open(f"{secrets_dir}/token") as f:
            token = f.read().strip()
        with open(f"{secrets_dir}/namespace") as f:
            namespace = f.read().strip()

        context = ssl.create_default_context(cafile=f"{secrets_dir}/ca.crt")
        conn = http.client.HTTPSConnection("kubernetes.default.svc", 443, context=context)
        try:
            conn.request(
                "DELETE",
                f"/api/v1/namespaces/{namespace}/pods/{pod_name}",
                headers={"Authorization": f"Bearer {token}"},
            )
            resp = conn.getresponse()
            print(f"self-restart requested for {pod_name}: HTTP {resp.status}", flush=True)
            resp.read()
        finally:
            conn.close()


    wait_for_schema()
    seed()
    needs_restart = configure_library()
    needs_restart = configure_session_protection() or needs_restart
    if needs_restart:
        print("settings just changed - self-restarting so calibre-web picks them up on its next boot", flush=True)
        restart_pod()
        # The DELETE above tears down this whole pod, including this
        # container - idle briefly rather than racing the termination
        # signal into the "done, idling" loop below.
        time.sleep(30)
    print("user-seed: done, idling", flush=True)
    while True:
        time.sleep(3600)
