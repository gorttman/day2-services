# Claims books.i3sec.com.au - the same public hostname kavita used.
# Must only be applied AFTER kavita's own books-ingress is removed;
# two Ingress objects claiming the same host is undefined/conflicting
# behavior in ingress-nginx, not a clean handoff. See README teardown
# sequence.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calibre-web-books
  namespace: calibre-web
  labels:
    app: calibre-web
    app.kubernetes.io/name: calibre-web
    argocd.argoproj.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: "private-ca"
    # cloudflared's Public Hostname (dashboard-managed) forwards here as
    # plain HTTP, not HTTPS - without this, nginx's default ssl-redirect
    # would 308 that request to https and loop. Same as kavita's.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  # Public, via Cloudflare Tunnel - same setup as kavita had.
  ingressClassName: nginx
  tls:
  - hosts:
    - books.i3sec.com.au
    secretName: books-tls
  rules:
  - host: books.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: calibre-web
            port:
              number: 8083
