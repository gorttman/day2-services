apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian
  namespace: obsidian
  labels:
    app: obsidian
    app.kubernetes.io/name: obsidian
    app.kubernetes.io/component: sync
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obsidian
  template:
    metadata:
      labels:
        app: obsidian
        app.kubernetes.io/name: obsidian
        app.kubernetes.io/component: sync
    spec:
      # Hard requirement, not a preference: obsidian-headless-state is
      # local-path, which is node-local. pinode-01's k3s data dir is RAM
      # tmpfs (loses local-path PVCs on reboot) - k8smaster has real disk.
      # Deliberate deviation from lane: applications for that reason.
      # Unpinned 2026-09-03: obsidian-headless-state is on Longhorn and
      # obsidian-vault is the qnap-static NFS PV, so nothing is node-local
      # any more. Soft workload-affinity comes from affinity-patch.yml.
      containers:
      - name: obsidian
        image: ghcr.io/gorttman/obsidian:latest
        imagePullPolicy: Always
        env:
        - name: OBSIDIAN_VAULT_NAME
          value: "commonplace"
        - name: OBSIDIAN_DEVICE_NAME
          value: "k8s-obsidian-headless"
        - name: OBSIDIAN_EMAIL
          valueFrom:
            secretKeyRef:
              name: obsidian-headless-credentials
              key: OBSIDIAN_EMAIL
        - name: OBSIDIAN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: obsidian-headless-credentials
              key: OBSIDIAN_PASSWORD
        - name: OBSIDIAN_SYNC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: obsidian-headless-credentials
              key: OBSIDIAN_SYNC_PASSWORD
        - name: OBSIDIAN_TOTP_SECRET
          valueFrom:
            secretKeyRef:
              name: obsidian-headless-credentials
              key: OBSIDIAN_TOTP_SECRET
        volumeMounts:
        - name: vault
          mountPath: /vault
        - name: state
          mountPath: /root
          subPath: home
        - name: state
          mountPath: /vault/.obsidian-headless-sync
          subPath: vault-sync-config
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: vault
        persistentVolumeClaim:
          claimName: obsidian-vault
      - name: state
        persistentVolumeClaim:
          claimName: obsidian-headless-state
