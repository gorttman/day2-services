# The vault. Longhorn, so it follows the pod and is replicated (was a static NFS PV on the QNAP until 2026-11-10).
# Created by hand first on 2026-11-10 and loaded with the merged vault; this file adopts it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-data
  namespace: obsidian
  labels:
    app: obsidian
    app.kubernetes.io/name: obsidian
    argocd.argoproj.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
