apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: obsidian-to-novnc
  namespace: obsidian
  labels:
    app: obsidian
    argocd.argoproj.io/managed-by: argocd
spec:
  redirectRegex:
    regex: ".*"
    replacement: "https://novnc.i3sec.com.au/vnc.html?autoconnect=true&path=websockify%3Ftoken%3Dobsidian"
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: obsidian
  namespace: obsidian
  labels:
    app: obsidian
    app.kubernetes.io/name: obsidian
    argocd.argoproj.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: obsidian-obsidian-to-novnc@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - obsidian.i3sec.com.au
    secretName: obsidian-tls
  rules:
  - host: obsidian.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: obsidian
            port:
              number: 5900
