apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: music-assistant

resources:
  - music-assistant-namespace.yml
  - music-assistant-pvc.yml
  - music-assistant-deployment.yml
  - music-assistant-service.yml
  - music-assistant-ingress.yml

# Hash suffix intentionally LEFT ENABLED: a change to desired-config.json must
# change the Deployment's volume reference so the pod rolls and re-applies it.
configMapGenerator:
  - name: music-assistant-desired
    files:
      - desired-config.json
      - apply-desired-config.py
