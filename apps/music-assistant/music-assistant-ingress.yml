apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music-assistant
  namespace: music-assistant
  labels:
    app: music-assistant
    app.kubernetes.io/name: music-assistant
    argocd.argoproj.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # Internal-only: no Cloudflare Tunnel entry, DNS lives in dns-conf. This is
  # only the web UI - Cast speakers never use this hostname, they pull audio
  # straight from the node on :8097.
  ingressClassName: traefik
  tls:
  - hosts:
    - music.i3sec.com.au
    secretName: music-assistant-tls
  rules:
  - host: music.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: music-assistant
            port:
              number: 8095
