# Garage: the S3-compatible object store behind Loki.
#
# Image: ghcr.io/gorttman/garage, a mirror of docker.io/dxflrs/garage:v2.3.0
# (.github/workflows/mirror-upstream-images.yml), pinned by digest.
#
# Data (block files) is on the QNAP /cold export (empty and unused until now),
# in the "garage" subfolder. The export is hard-mounted NFS, so a QNAP stall can
# stall Garage - and only Garage: Loki keeps ingesting and buffers on its own
# volume until Garage answers again (see loki-values.yml).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: loki
  labels:
    app: garage
    app.kubernetes.io/name: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: ghcr.io/gorttman/garage@sha256:e1af6511b92963c61ceacd499691d26ad48842de85b09dbea2919afa88abb327
          command: ["/garage", "server"]
          envFrom:
            - secretRef:
                name: garage-secrets
          ports:
            - {name: s3, containerPort: 3900}
            - {name: rpc, containerPort: 3901}
            - {name: admin, containerPort: 3903}
          volumeMounts:
            - {name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true}
            - {name: meta, mountPath: /meta}
            - {name: data, mountPath: /data, subPath: garage}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            tcpSocket: {port: s3}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: s3}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: garage-config
        - name: data
          nfs:
            server: qnap.i3sec.com.au
            path: /cold
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
