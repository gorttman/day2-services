# Pinned to k8smaster - same tmpfs/RAM reasoning as every other heavy
# image in this cluster (paperless, books-pipeline, immich-machine-learning).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  labels:
    app: immich-server
    app.kubernetes.io/name: immich-server
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: immich
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
        app.kubernetes.io/name: immich-server
    spec:
      # Hard pin to k8smaster removed 2026-08-17: same reasoning as
      # paperless-deployment.yml's identical change - pinode-01's
      # RAM-tmpfs image-store constraint that motivated this pin no
      # longer exists (real persistent iSCSI root as of that same
      # night), and soft workload-affinity (affinity-patch.yml) now
      # handles placement instead, without giving up failover if
      # pinode-01 is down.
      enableServiceLinks: false
      containers:
      - name: immich-server
        image: ghcr.io/immich-app/immich-server:v3.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 2283
        env:
        - name: TZ
          value: Australia/Sydney
        - name: DB_HOSTNAME
          value: postgres.postgres.svc.cluster.local
        - name: DB_USERNAME
          value: immich
        - name: DB_DATABASE_NAME
          value: immich
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-secret
              key: DB_PASSWORD
        - name: REDIS_HOSTNAME
          value: immich-redis
        # IMMICH_MACHINE_LEARNING_URL deliberately unset - defaults to
        # http://immich-machine-learning:3003, which matches this
        # Service's actual name (see immich-ml-deployment.yml's own
        # comment).
        volumeMounts:
        - name: library
          mountPath: /data
        # Read-only, test-only mount for the new QNAP /photos share -
        # added 2026-08-20 so a couple of sample files could actually be
        # seen in Immich as an External Library, without touching the
        # main /data library or copying anything into it. Deliberately
        # readOnly: Immich only needs to read/index an external library,
        # never write back to the source.
        - name: photos-test
          mountPath: /photos-test
          readOnly: true
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 2Gi
            cpu: "2"
        readinessProbe:
          httpGet:
            path: /api/server/ping
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/server/ping
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: library
        persistentVolumeClaim:
          claimName: immich-library
      - name: photos-test
        nfs:
          server: qnap
          path: /photos
          readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
  labels:
    app: immich-server
    app.kubernetes.io/name: immich-server
    argocd.argoproj.io/managed-by: argocd
spec:
  selector:
    app: immich-server
  ports:
  - name: http
    port: 2283
    targetPort: http
