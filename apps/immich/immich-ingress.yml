apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: immich
  labels:
    app: immich
    app.kubernetes.io/name: immich
    argocd.argoproj.io/managed-by: argocd
  annotations:
    # letsencrypt-prod, not private-ca: the Immich mobile app rejects
    # private CAs outright (its background_downloader networking layer
    # ignores the device trust store - upstream issues #28929/#15188),
    # so a publicly-trusted cert is the only way the app works at all.
    # Issued via DNS-01, so nothing here is publicly exposed.
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # Internal-only for now, same as paperless/calibre-web's internal
  # hostname - no Cloudflare Tunnel annotation. DNS entry needed in
  # dns-conf (pihole + coredns) before this actually resolves.
  ingressClassName: traefik
  tls:
  - hosts:
    - immich.i3sec.com.au
    secretName: immich-tls
  rules:
  - host: immich.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: immich-server
            port:
              number: 2283
