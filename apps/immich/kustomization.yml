apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - immich-namespace.yml
  - immich-sealed-secret.yml
  - immich-pvc.yml
  - immich-ml-pvc.yml
  - immich-redis-deployment.yml
  - immich-ml-deployment.yml
  - immich-server-deployment.yml
  - immich-ingress.yml

patches:
  - path: affinity-patch.yml
    target:
      kind: Deployment
      name: immich-server
  - path: affinity-patch.yml
    target:
      kind: Deployment
      name: immich-machine-learning
  # Switched off on purpose (2026-10-10, heat test: it OOMs the Pi). Git says
  # 0 so ArgoCD reads this as "as intended", not as drift. To turn it back on,
  # delete this patch (and decide the memory fix first - see the to-do page).
  - target:
      kind: Deployment
      name: immich-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
