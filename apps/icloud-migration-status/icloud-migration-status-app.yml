apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: icloud-migration-status
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  source:
    repoURL: https://github.com/gorttman/day2-services.git
    targetRevision: main
    path: apps/icloud-migration-status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # No CreateNamespace=true - monitoring already exists, owned by
    # day1-foundation's grafana/influxdb apps.
