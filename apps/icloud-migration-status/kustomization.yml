apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace manifest here deliberately - this deploys into the
# existing "monitoring" namespace (owned by day1-foundation's grafana/
# influxdb apps), not a namespace of its own. Creating a second
# Namespace resource for it would fight that app for ownership.
resources:
  - icloud-migration-status-configmap-script.yml
  - icloud-migration-status-cronjob.yml
