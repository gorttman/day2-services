# PLACEHOLDER STORAGE: local-path (k3s default) is node-local and
# non-durable - same caveat as apps/jellyfin. Swap storageClassName to an
# NFS-backed class once real storage exists; the swap requires recreating
# the PVC (delete + resync), and Kavita's internal SQLite DB lives here,
# so it must never sit directly on NFS (pihole gravity.db lesson).
#
# NOTE: only k8smaster has real disk. On diskless pinode-01,
# /var/lib/rancher/k3s (including local-path volumes) is a 4G RAM tmpfs
# wiped on reboot - never bind local-path PVCs there. Hence the
# nodeSelector in the deployment.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kavita-config
  namespace: kavita
  labels:
    app: kavita
    app.kubernetes.io/name: kavita
    argocd.argoproj.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
