# Kavita config now runs in a RAM emptyDir (pihole gravity.db pattern -
# SQLite must never sit on NFS, and only k8smaster has real local disk).
# This PVC holds the periodic tar backups the sidecar writes; the init
# container restores the newest one on pod start. nfs-client is safe
# here because the backups are plain tar files, not a live SQLite DB -
# and it is reachable from any node, so the pod can float.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kavita-config-backup
  namespace: kavita
  labels:
    app: kavita
    app.kubernetes.io/name: kavita
    argocd.argoproj.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
