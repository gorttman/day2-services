apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavita
  namespace: kavita
  labels:
    app: kavita
    app.kubernetes.io/name: kavita
    app.kubernetes.io/component: reading-server
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  # Recreate so the old pod takes its final preStop backup before the
  # new pod's init container restores from it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kavita
  template:
    metadata:
      labels:
        app: kavita
        app.kubernetes.io/name: kavita
        app.kubernetes.io/component: reading-server
    spec:
      # workload-affinity: when Kavita gets a preferred home, wire in the
      # patch template from components/workload-affinity/ and add kavita
      # to day1-foundation/ansible/label-nodes.yml.
      #
      # No node pin anymore: config runs in a RAM emptyDir with tar
      # backups on nfs-client (pihole gravity.db pattern), so nothing
      # requires k8smaster's local disk. The pod can float; note the
      # kavita image still has to fit pinode-01's 4G tmpfs image store.
      enableServiceLinks: false  # avoid injected <SVC>_PORT env vars (bit paperless)
      initContainers:
      # Restore the newest config backup into the RAM volume. Falls back
      # to the previous backup if the newest is torn/unreadable.
      - name: config-restore
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          set -e
          cd /config
          if [ -f /backup/kavita-config.tar ] && tar -xf /backup/kavita-config.tar -C /config 2>/dev/null; then
            echo "restored kavita-config.tar"
          elif [ -f /backup/kavita-config.prev.tar ] && tar -xf /backup/kavita-config.prev.tar -C /config 2>/dev/null; then
            echo "restored kavita-config.prev.tar (newest was unreadable)"
          else
            echo "no backup found - starting fresh"
          fi
          chown -R 1000:1000 /config
          chmod 0775 /config
        volumeMounts:
        - name: config
          mountPath: /config
        - name: backup
          mountPath: /backup
      containers:
      - name: kavita
        image: jvmilazz0/kavita:0.8.9
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /kavita/config
        # QNAP books library (static NFS PV, day1 apps/qnap-storage).
        # readOnly for now - flip if Kavita should manage files itself.
        - name: books
          mountPath: /books
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 45
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      # Hourly tar of the RAM config to the nfs-client backup PVC, with
      # one-generation rotation (a torn backup never overwrites the only
      # good copy) and a final backup at pod shutdown (preStop). Worst
      # case after an unclean node death: lose up to an hour of reading
      # progress. tar'ing a live SQLite db can produce a torn copy -
      # that's what the .prev rotation and the init fallback are for.
      - name: config-backup
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          backup() {
            tar -cf /backup/.tmp.tar -C /config --exclude=cache --exclude=temp --exclude=logs . || return 1
            sz=$(stat -c %s /backup/.tmp.tar 2>/dev/null || echo 0)
            if [ "$sz" -gt 10240 ]; then
              [ -f /backup/kavita-config.tar ] && cp /backup/kavita-config.tar /backup/kavita-config.prev.tar
              mv /backup/.tmp.tar /backup/kavita-config.tar
              echo "backup ok ($sz bytes) $(date)"
            else
              echo "backup skipped - suspiciously small ($sz bytes)"
              rm -f /backup/.tmp.tar
            fi
          }
          while true; do sleep 3600; backup; done
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "tar -cf /backup/.tmp.tar -C /config --exclude=cache --exclude=temp --exclude=logs . && sz=$(stat -c %s /backup/.tmp.tar) && [ \"$sz\" -gt 10240 ] && { [ -f /backup/kavita-config.tar ] && cp /backup/kavita-config.tar /backup/kavita-config.prev.tar; mv /backup/.tmp.tar /backup/kavita-config.tar; } || rm -f /backup/.tmp.tar"]
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: backup
          mountPath: /backup
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "200m"
      volumes:
      # RAM-backed: fast, node-agnostic, wiped on pod stop - which is
      # fine because the sidecar/preStop persist it to the backup PVC.
      # sizeLimit bounds the RAM cost (covers/config, cache excluded
      # from backups, lives here too).
      - name: config
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: backup
        persistentVolumeClaim:
          claimName: kavita-config-backup
      - name: books
        persistentVolumeClaim:
          claimName: kavita-books
