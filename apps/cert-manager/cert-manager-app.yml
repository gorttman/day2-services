apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  source:
    repoURL: https://github.com/gorttman/day2-services.git
    targetRevision: main
    path: apps/cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
