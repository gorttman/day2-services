apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
    app.kubernetes.io/name: pihole
    argocd.argoproj.io/managed-by: argocd
spec:
  ingressClassName: traefik
  rules:
  - host: pihole.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pihole-web
            port:
              number: 8080
