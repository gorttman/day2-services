# Second DNS VIP. Still on wlan-pool, not vlan20-pool: every client in the
# house is on 192.168.2.0/24, and until a real LAN client has confirmed it can
# reach a VLAN20 VIP, moving the resolver there would be betting the whole
# network's DNS on an untested path. traefik and ingress-nginx moved on 2026-09-03;
# Pi-hole follows once that is proven.
#
# Reachability on the WLAN does not come from MetalLB's ARP announcement - the
# AP drops it (see day1-foundation/apps/metallb/README.md). It comes from the
# VIP being bound as a /32 on a node's wlan0 with proxy_arp enabled, which is
# a normal ARP reply the AP does forward. .245 is bound on k8smaster and .246
# on pinode-01, deliberately: one resolver per node, so losing either node
# costs exactly one of the two.
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns-b
  namespace: pihole
  labels:
    app: pihole-b
    app.kubernetes.io/name: pihole
    app.kubernetes.io/component: dns
    argocd.argoproj.io/managed-by: argocd
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.20.246
  ports:
  - name: dns-tcp
    port: 53
    targetPort: 53
    protocol: TCP
  - name: dns-udp
    port: 53
    targetPort: 53
    protocol: UDP
  selector:
    app: pihole-b
