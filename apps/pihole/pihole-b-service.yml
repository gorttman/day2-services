# Second DNS VIP, on vlan20-pool (moved off wlan-pool 2026-09-03, same time as
# .245). Announced via MetalLB L2 on the Trusted VLAN, where the AP does forward
# the ARP reply (unlike the WLAN - see day1-foundation/apps/metallb/README.md).
#
# externalTrafficPolicy: Local (set 2026-09-06, see pihole-service.yml's comment
# for the full reasoning): forces MetalLB to announce this VIP only from the node
# running the app=pihole-b pod (pinode-01), so .245 (k8smaster) and .246
# (pinode-01) can never be announced from the same node. One resolver per node,
# losing either node costs exactly one of the two - the same intent the old
# hand-bound /32-on-wlan0 setup had, now done properly through MetalLB.
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns-b
  namespace: pihole
  labels:
    app: pihole-b
    app.kubernetes.io/name: pihole
    app.kubernetes.io/component: dns
    argocd.argoproj.io/managed-by: argocd
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.20.246
  externalTrafficPolicy: Local
  ports:
  - name: dns-tcp
    port: 53
    targetPort: 53
    protocol: TCP
  - name: dns-udp
    port: 53
    targetPort: 53
    protocol: UDP
  selector:
    app: pihole-b
