apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
    app.kubernetes.io/name: pihole
    app.kubernetes.io/component: dns
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
        app.kubernetes.io/name: pihole
        app.kubernetes.io/component: dns
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 1.1.1.1
        - 1.0.0.1
      initContainers:
      - name: fix-ftl-conf
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          grep -v '^GRAVITYDB=' /etc/pihole/pihole-FTL.conf > /tmp/ftl.conf || true
          cat /tmp/ftl.conf > /etc/pihole/pihole-FTL.conf
        volumeMounts:
        - name: pihole-data
          mountPath: /etc/pihole
          subPath: pihole
      containers:
      - name: pihole
        image: pihole/pihole:2024.07.0
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        ports:
        - name: dns-tcp
          containerPort: 53
          protocol: TCP
        - name: dns-udp
          containerPort: 53
          protocol: UDP
        - name: dhcp
          containerPort: 67
          protocol: UDP
        env:
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: pihole-config
              key: TZ
        - name: WEBPASSWORD
          valueFrom:
            configMapKeyRef:
              name: pihole-config
              key: WEBPASSWORD
        - name: PIHOLE_DNS_
          valueFrom:
            configMapKeyRef:
              name: pihole-config
              key: PIHOLE_DNS_
        - name: DNSSEC
          valueFrom:
            configMapKeyRef:
              name: pihole-config
              key: DNSSEC
        - name: DNSMASQ_LISTENING
          valueFrom:
            configMapKeyRef:
              name: pihole-config
              key: DNSMASQ_LISTENING
        - name: FTLCONF_LOCAL_IPV4
          valueFrom:
            configMapKeyRef:
              name: pihole-config
              key: FTLCONF_LOCAL_IPV4
        - name: SKIPGRAVITYONBOOT
          value: "true"
        - name: FTLCONF_REPLY_WHEN_BUSY
          value: REFUSE
        - name: FTLCONF_GRAVITYDB
          value: /etc/pihole/gravity.db
        - name: FTLCONF_DBFILE
          value: /db/pihole-FTL.db
        volumeMounts:
        - name: pihole-data
          mountPath: /etc/pihole
          subPath: pihole
        - name: pihole-data
          mountPath: /etc/dnsmasq.d
          subPath: dnsmasq.d
        - mountPath: /etc/dnsmasq.d/02-i3sec-custom-dns.conf
          name: pihole-custom-dns
          subPath: 02-i3sec-custom-dns.conf
        - name: pihole-db
          mountPath: /db
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /admin/
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /admin/
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: pihole-data
        persistentVolumeClaim:
          claimName: pihole-data
      - name: pihole-custom-dns
        configMap:
          name: pihole-custom-dns
      - name: pihole-db
        emptyDir: {}
