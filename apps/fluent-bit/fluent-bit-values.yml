# Fluent Bit collector, Helm chart fluent/fluent-bit (version pinned in
# fluent-bit-app.yml). One pod per node, including the control-plane node.
#
# Reads:   container logs from /var/log/containers (tail) and the host's
#          systemd journal.
# Writes:  to Loki (loki.loki.svc.cluster.local:3100), cluster-internal only.
#
# Labels sent to Loki are low-cardinality on purpose: cluster, node,
# namespace, app, signal_type. Pod name, container name, stream and the rest
# of the Kubernetes metadata stay in the log line (JSON) and are read with
# `| json` in LogQL - never as labels.
#   signal_type = container | host   (host = systemd journal)
kind: DaemonSet

image:
  repository: docker.io/fluent/fluent-bit
  tag: 5.1.3
  # Pinned by digest as well (manifest list, covers arm64).
  digest: sha256:c5542543523c9678398dd78d927c05e8425ec15b038f226b67b3b019b1a70845
  pullPolicy: IfNotPresent

testFramework:
  enabled: false

# Run on every node, control-plane included.
tolerations:
  - operator: Exists

env:
  - name: NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName

resources:
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    memory: 160Mi

# The chart already mounts /var/log (container logs) and /etc/machine-id.
# Added: the volatile journal (/run/log/journal - pinode nodes keep it only
# in memory) and a small state folder so a restart resumes where it left off.
extraVolumes:
  - name: runjournal
    hostPath:
      path: /run/log/journal
      type: DirectoryOrCreate
  - name: flbstate
    hostPath:
      path: /var/lib/fluent-bit
      type: DirectoryOrCreate
extraVolumeMounts:
  - name: runjournal
    mountPath: /run/log/journal
    readOnly: true
  - name: flbstate
    mountPath: /var/fluent-bit/state

luaScripts:
  labels.lua: |
    -- Sets the Loki labels as top-level keys; the output plugin lifts them out
    -- of the log line (remove_keys) so they are labels only.
    function container_labels(tag, ts, rec)
      local k = rec["kubernetes"] or {}
      local l = k["labels"] or {}
      rec["cluster"] = "pilab"
      rec["signal_type"] = "container"
      rec["node"] = k["host"] or os.getenv("NODE_NAME") or "unknown"
      rec["namespace"] = k["namespace_name"] or "unknown"
      rec["app"] = l["app.kubernetes.io/name"] or l["app"] or l["k8s-app"]
                   or k["container_name"] or "unknown"
      return 1, ts, rec
    end

    function host_labels(tag, ts, rec)
      rec["cluster"] = "pilab"
      rec["signal_type"] = "host"
      rec["node"] = os.getenv("NODE_NAME") or "unknown"
      rec["namespace"] = "host"
      rec["app"] = rec["SYSLOG_IDENTIFIER"] or rec["_COMM"] or "unknown"
      return 1, ts, rec
    end

config:
  service: |
    [SERVICE]
        Daemon        Off
        Flush         5
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        Parsers_File  /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/*_fluent-bit_*.log
        multiline.parser  docker, cri
        DB                /var/fluent-bit/state/containers.db
        Mem_Buf_Limit     20MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [INPUT]
        Name              systemd
        Tag               host.*
        Read_From_Tail    On
        DB                /var/fluent-bit/state/journal.db
        Mem_Buf_Limit     10MB

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  Off
        K8S-Logging.Exclude Off
        Labels              On
        Annotations         Off
        Buffer_Size         256k

    [FILTER]
        Name    lua
        Match   kube.*
        script  /fluent-bit/scripts/labels.lua
        call    container_labels

    [FILTER]
        Name    lua
        Match   host.*
        script  /fluent-bit/scripts/labels.lua
        call    host_labels

  outputs: |
    [OUTPUT]
        Name         loki
        Match        *
        Host         loki.loki.svc.cluster.local
        Port         3100
        Labels       job=fluent-bit
        Label_Keys   $cluster,$node,$namespace,$app,$signal_type
        Remove_Keys  cluster,node,namespace,app,signal_type
        Line_Format  json
        Retry_Limit  False
