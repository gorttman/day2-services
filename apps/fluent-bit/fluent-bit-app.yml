# Fluent Bit log collector (DaemonSet, every node) -> Loki. Chart pinned:
# 0.58.3 is Fluent Bit 5.1.3. Values in fluent-bit-values.yml.
# The store it writes to is apps/loki; design notes in apps/loki/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://fluent.github.io/helm-charts
      chart: fluent-bit
      targetRevision: 0.58.3
      helm:
        releaseName: fluent-bit
        valueFiles:
          - $values/apps/fluent-bit/fluent-bit-values.yml
    - repoURL: https://github.com/gorttman/day2-services.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: fluent-bit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
