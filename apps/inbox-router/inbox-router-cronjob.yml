# NFS volumes are mounted directly (nfs: volume type), not via PV/PVC.
# qnap-books is already bound 1:1 to kavita's PVC (day1-foundation's
# qnap-storage app) - a second static PV for the same export would work,
# but a direct pod-level nfs: volume gets the same result without adding
# a PV object, and fits a single-workload, non-shared-claim use case
# better. See day1-foundation/apps/qnap-storage/README.md for the
# reasoning, documented alongside that app's PV conventions.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: inbox-router
  namespace: inbox-router
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # backoffLimit was 0 (zero retries) until 2026-08-14 - a single
      # transient blip (an NFS permission hiccup, seen live hitting
      # /mnt/inbox/triage) was a hard failure with no second attempt.
      # 3 retries with Kubernetes' own default exponential backoff
      # (10s/20s/40s) adds well under 2 minutes worst-case, comfortably
      # inside both the 4-minute deadline below and the 5-minute cron
      # interval (concurrencyPolicy: Forbid, so no overlap risk).
      backoffLimit: 3
      activeDeadlineSeconds: 240
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: inbox-router
              image: ghcr.io/gorttman/inbox-router:0.2.0
              command: ["python3", "/app/inbox_router.py"]
              env:
                - name: ROUTER_CONFIG
                  value: /etc/inbox-router/routes.yaml
              volumeMounts:
                - name: script
                  mountPath: /app
                - name: routes-config
                  mountPath: /etc/inbox-router
                - name: inbox
                  mountPath: /mnt/inbox
                - name: books
                  mountPath: /mnt/books
                - name: paperless
                  mountPath: /mnt/paperless
                - name: photos
                  mountPath: /mnt/photos
              # No resources block: no precedent exists anywhere in this
              # repo for CronJob resource requests/limits (log-archiver
              # and sealed-secrets-backup both omit it too) - flagged in
              # Phase 1, not silently invented here.
          volumes:
            - name: script
              configMap:
                name: inbox-router-script
                defaultMode: 0555
            - name: routes-config
              configMap:
                name: inbox-router-routes
            - name: inbox
              nfs:
                server: qnap
                path: /inbox
            - name: books
              nfs:
                server: qnap
                path: /books
            - name: paperless
              nfs:
                server: qnap
                path: /paperless
            - name: photos
              nfs:
                server: qnap
                path: /photos
