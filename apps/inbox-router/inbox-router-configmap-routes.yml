apiVersion: v1
kind: ConfigMap
metadata:
  name: inbox-router-routes
  namespace: inbox-router
data:
  routes.yaml: |
    settle_seconds: 120   # skip files where (now - mtime) < this; stateless, single stat check
    
    hold_flag: /mnt/inbox/.hold
    quarantine: /mnt/inbox/quarantine
    
    # Evaluated first, in order, for files inside these inbox subdirectories.
    # Presence in the directory IS the declaration - no MIME check performed.
    # For bulk/pre-sorted uploads (e.g. a batch of ebooks) - normal day-to-day
    # activity is a single file dropped straight into the bare inbox root,
    # which mime_defaults below handles instead.
    explicit_dirs:
      - source: inbox/books
        dest: /mnt/books/import
    
      # Live 2026-08-01: /mnt/paperless is now mounted (raw QNAP export,
      # qnap.i3sec.com.au:/paperless). Paperless-ngx's own consume PVC was
      # swapped for the same export (subPath: consume) so this is the exact
      # directory the app watches - the earlier "wrong underlying storage"
      # caveat is resolved, not carried forward.
      - source: inbox/records
        dest: /mnt/paperless/consume
    
      # Dormant, out of scope for this deployment - vault is reserved for
      # the Obsidian vault mount when that gets built. Not mounted here.
      - source: inbox/working
        dest: /mnt/vault/incoming        # TBD - path unconfirmed, deliberately not resolved yet

      # Live 2026-08-22, corrected same day: originally staged straight
      # into /mnt/photos/import, but that's INSIDE the QNAP /photos
      # export Immich's External Library recursively scans - anything
      # sitting there unsorted risked getting indexed by Immich before
      # scripts/photos_importer.py (day0-infra-build) had a chance to
      # SHA-dedup and re-file it into /photos/<EXIF-year>/. Staging
      # instead under the /inbox export (already mounted here, no new
      # volume needed) keeps unsorted drops completely outside the
      # tree Immich ever looks at. photos_importer.py reads FROM here
      # and writes the real, sorted output into /photos itself.
      - source: inbox/photos
        dest: /mnt/inbox/photos-staging
    
    # Evaluated only for files sitting in the bare inbox root.
    mime_defaults:
      - name: books-ebook
        mime:
          - application/epub+zip
          - application/x-mobipocket-ebook
          - application/vnd.amazon.ebook
          - application/x-fictionbook+xml
          - image/vnd.djvu
        dest: /mnt/books/import
    
      - name: books-comic
        mime: [application/vnd.comicbook+zip, application/vnd.comicbook-rar]
        dest: /mnt/books/import
    
      # Live 2026-08-01, same as inbox/records above.
      - name: office-to-records
        mime:
          - application/msword
          - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          - application/vnd.oasis.opendocument.text
          - application/rtf
          - text/plain
          - application/vnd.ms-excel
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - application/vnd.oasis.opendocument.spreadsheet
          - application/vnd.ms-powerpoint
          - application/vnd.openxmlformats-officedocument.presentationml.presentation
          - application/vnd.oasis.opendocument.presentation
        dest: /mnt/paperless/consume
    
      # Changed 2026-08-04: retires the "PDF triage subagent" plan (was
      # "proposal not yet applied" per books-pipeline's README, and
      # inbox/triage had no downstream consumer at all - PDFs landing
      # there just sat forever). Simpler resolution: a bare/undeclared
      # PDF defaults to being a document, same as office-to-records
      # above - Paperless handles PDFs natively and automatically, no
      # review step needed. A PDF that's actually a book still has a
      # clear, unambiguous path: place it in inbox/books (explicit_dirs
      # above), same "presence in directory is the declaration"
      # convention as everything else here - see
      # books-pipeline-configmap-script.yml's PDF promotion path for
      # that side of this change.
      - name: pdf-to-records
        mime: [application/pdf]
        dest: /mnt/paperless/consume

      # Live 2026-08-22, added for the Google Drive photo/video
      # offboarding. MIME list confirmed against libmagic (the same
      # library python-magic/this script uses) run directly against
      # real sample files, not guessed from file extension - notably
      # raw camera formats don't have a single consistent type: CR2
      # gets its own distinct signature, but DNG is generically
      # image/tiff (no separate DNG signature in this libmagic
      # version), so image/tiff has to be routed here too even though
      # that also catches plain TIFF photos - which belong here anyway.
      - name: photo-video
        mime:
          - image/jpeg
          - image/png
          - image/gif
          - image/tiff
          - image/x-canon-cr2
          - image/heic
          - image/webp
          - video/mp4
          - video/quicktime
          - video/x-msvideo
          - video/x-matroska
        dest: /mnt/photos/import

    # No match on any explicit_dir or mime_default rule -> quarantine.
    # Audio and archives still have no subagent - that's still correct,
    # not a gap. Photos/video are handled above as of 2026-08-22.
