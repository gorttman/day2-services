apiVersion: v1
kind: ConfigMap
metadata:
  name: inbox-router-routes
  namespace: inbox-router
data:
  routes.yaml: |
    settle_seconds: 120   # skip files where (now - mtime) < this; stateless, single stat check
    
    hold_flag: /mnt/inbox/.hold
    quarantine: /mnt/inbox/quarantine
    
    # Evaluated first, in order, for files inside these inbox subdirectories.
    # Presence in the directory IS the declaration - no MIME check performed.
    # For bulk/pre-sorted uploads (e.g. a batch of ebooks) - normal day-to-day
    # activity is a single file dropped straight into the bare inbox root,
    # which mime_defaults below handles instead.
    explicit_dirs:
      - source: inbox/books
        dest: /mnt/books/import
    
      # Live 2026-08-01: /mnt/paperless is now mounted (raw QNAP export,
      # qnap.i3sec.com.au:/paperless). Paperless-ngx's own consume PVC was
      # swapped for the same export (subPath: consume) so this is the exact
      # directory the app watches - the earlier "wrong underlying storage"
      # caveat is resolved, not carried forward.
      - source: inbox/records
        dest: /mnt/paperless/consume
    
      # Dormant, out of scope for this deployment - vault is reserved for
      # the Obsidian vault mount when that gets built. Not mounted here.
      - source: inbox/working
        dest: /mnt/vault/incoming        # TBD - path unconfirmed, deliberately not resolved yet
    
    # Evaluated only for files sitting in the bare inbox root.
    mime_defaults:
      - name: books-ebook
        mime:
          - application/epub+zip
          - application/x-mobipocket-ebook
          - application/vnd.amazon.ebook
          - application/x-fictionbook+xml
          - image/vnd.djvu
        dest: /mnt/books/import
    
      - name: books-comic
        mime: [application/vnd.comicbook+zip, application/vnd.comicbook-rar]
        dest: /mnt/books/import
    
      # Live 2026-08-01, same as inbox/records above.
      - name: office-to-records
        mime:
          - application/msword
          - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          - application/vnd.oasis.opendocument.text
          - application/rtf
          - text/plain
          - application/vnd.ms-excel
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - application/vnd.oasis.opendocument.spreadsheet
          - application/vnd.ms-powerpoint
          - application/vnd.openxmlformats-officedocument.presentationml.presentation
          - application/vnd.oasis.opendocument.presentation
        dest: /mnt/paperless/consume
    
      # Re-added 2026-07-17 (prompt 6 landed): a bare-root PDF is ambiguous
      # (could be a book or a Paperless document), so it goes to the PDF
      # triage subagent rather than either destination directly. Note
      # inbox/records above already bypasses this entirely - a PDF placed
      # there by directory convention goes straight to Paperless, no
      # triage. This rule only ever catches undeclared PDFs.
      - name: pdf-to-triage
        mime: [application/pdf]
        dest: /mnt/inbox/triage
    
    # No match on any explicit_dir or mime_default rule -> quarantine.
    # Includes photos/video/audio/archives - no subagent exists yet for
    # those, so quarantine is correct, not a gap.
