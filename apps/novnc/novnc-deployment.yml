apiVersion: apps/v1
kind: Deployment
metadata:
  name: novnc
  namespace: remote-access
  labels:
    app: novnc
    app.kubernetes.io/name: novnc
    app.kubernetes.io/component: remote-access
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: novnc
  template:
    metadata:
      labels:
        app: novnc
        app.kubernetes.io/name: novnc
        app.kubernetes.io/component: remote-access
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: lane
                operator: In
                values:
                - applications

      containers:
      - name: novnc
        image: alpine:3.19
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - "apk add --no-cache novnc py3-websockify &&
             python3 -m websockify --web=/usr/share/webapps/novnc 0.0.0.0:8080 192.168.2.163:5900"
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
