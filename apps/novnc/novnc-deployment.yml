apiVersion: apps/v1
kind: Deployment
metadata:
  name: novnc
  namespace: remote-access
  labels:
    app: novnc
    app.kubernetes.io/name: novnc
    app.kubernetes.io/component: remote-access
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: novnc
  template:
    metadata:
      labels:
        app: novnc
        app.kubernetes.io/name: novnc
        app.kubernetes.io/component: remote-access
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: lane
                operator: In
                values:
                - applications

      containers:
      - name: novnc
        image: ghcr.io/gorttman/novnc:latest
        imagePullPolicy: Always
        command: ["websockify", "--web", "/opt/novnc", "--token-file", "/tokens/tokens.cfg", "8080"]
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: NO_VNC_PORT
          value: "8080"
        - name: REMOTE_HOST
          value: "192.168.2.163"
        - name: REMOTE_PORT
          value: "5900"
        volumeMounts:
        - name: tokens
          mountPath: /tokens
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: tokens
        configMap:
          name: novnc-tokens
