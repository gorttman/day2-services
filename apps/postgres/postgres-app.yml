apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  source:
    repoURL: https://github.com/gorttman/day2-services.git
    targetRevision: main
    path: apps/postgres
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: adminer
      namespace: postgres
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Without this, selfHeal re-applies replicas:0 from git on every sync
      # despite ignoreDifferences, defeating manual scale-up
      - RespectIgnoreDifferences=true
