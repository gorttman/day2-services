# Idempotent - safe to leave in place and re-run (delete the completed Job
# to force a re-check). Same pattern as postgres-immich-db-init-configmap.yml.
#
# Only creates the role and database. LiteLLM runs its own migrations as
# the 'litellm' role on startup and owns everything it creates. The
# password is `openssl rand -hex 24` (hex only), so direct interpolation into
# the SQL string below is safe.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-litellm-db-init
  namespace: postgres
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    argocd.argoproj.io/managed-by: argocd
data:
  init-litellm-db.sh: |
    #!/bin/sh
    set -eu

    echo "[*] Ensuring role 'litellm' exists"
    psql -v ON_ERROR_STOP=1 -d postgres <<-SQL
      DO \$\$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'litellm') THEN
          CREATE ROLE litellm LOGIN PASSWORD '${LITELLM_DB_PASSWORD}';
        END IF;
      END
      \$\$;
    SQL

    echo "[*] Ensuring database 'litellm' exists"
    if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'litellm'" | grep -q 1; then
      psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE litellm OWNER litellm;"
    fi

    echo "[*] Done - litellm database ready, migrations run from LiteLLM itself"
