apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: postgres
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
    spec:
      containers:
      - name: postgres
        # Adds the pgvector extension for Immich's ML/smart-search
        # features (apps/immich) - built from postgres:16.9-alpine itself
        # (images/postgres-pgvector), not the upstream Debian/glibc-based
        # pgvector/pgvector:pg16 image, to avoid a musl->glibc collation
        # change corrupting existing text-column indexes. Extension is
        # additive and per-database (CREATE EXTENSION is scoped to
        # whichever DB calls it) - paperless/homeassistant/n8n/books/
        # cloudflare_tf are all unaffected either way. See
        # images/postgres-pgvector/Dockerfile for the full build story
        # (2026-08-04) and README.md's Postgres section.
        image: ghcr.io/gorttman/postgres-pgvector:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-superuser
              key: POSTGRES_PASSWORD
        - name: PAPERLESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-superuser
              key: PAPERLESS_DB_PASSWORD
        - name: HOMEASSISTANT_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-superuser
              key: HOMEASSISTANT_DB_PASSWORD
        - name: N8N_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-superuser
              key: N8N_DB_PASSWORD
        - name: CLOUDFLARE_TF_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-superuser
              key: CLOUDFLARE_TF_DB_PASSWORD
        # subdir keeps initdb happy when the volume root already exists
        # (nfs-subdir provisioner pre-creates the directory)
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
      - name: initdb
        configMap:
          name: postgres-initdb
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: nfs-client
      resources:
        requests:
          storage: 5Gi
