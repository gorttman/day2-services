apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: postgres
  labels:
    app: adminer
    app.kubernetes.io/name: adminer
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  # Off by default; the Application ignores replica drift, so switch on with
  #   sudo kubectl scale deploy adminer -n postgres --replicas=1
  # and back to 0 when done - same pattern as ca-portal.
  replicas: 0
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
        app.kubernetes.io/name: adminer
    spec:
      containers:
      - name: adminer
        image: adminer:5.4.2
        imagePullPolicy: IfNotPresent
        env:
        - name: ADMINER_DEFAULT_SERVER
          value: postgres
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            memory: 64Mi
            cpu: 25m
          limits:
            memory: 256Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: postgres
  labels:
    app: adminer
    app.kubernetes.io/name: adminer
    argocd.argoproj.io/managed-by: argocd
spec:
  selector:
    app: adminer
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adminer
  namespace: postgres
  labels:
    app: adminer
    app.kubernetes.io/name: adminer
    argocd.argoproj.io/managed-by: argocd
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - adminer.i3sec.com.au
    secretName: adminer-tls
  rules:
  - host: adminer.i3sec.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: adminer
            port:
              number: 8080
