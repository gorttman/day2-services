apiVersion: apps/v1
kind: Deployment
metadata:
  name: ca-portal
  namespace: ca-portal
  labels:
    app: ca-portal
    app.kubernetes.io/name: ca-portal
    app.kubernetes.io/part-of: day2-services
    argocd.argoproj.io/managed-by: argocd
spec:
  # Off by default; the Application ignores replica drift, so switch on with
  #   sudo kubectl scale deploy ca-portal -n ca-portal --replicas=1
  # and back to 0 when done - ArgoCD will not fight either direction.
  replicas: 0
  selector:
    matchLabels:
      app: ca-portal
  template:
    metadata:
      labels:
        app: ca-portal
        app.kubernetes.io/name: ca-portal
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        volumeMounts:
        - name: content
          mountPath: /usr/share/nginx/html
          readOnly: true
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 100m
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
      volumes:
      - name: content
        configMap:
          name: ca-portal-content
