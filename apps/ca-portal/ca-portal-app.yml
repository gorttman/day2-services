apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ca-portal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ca-portal
  source:
    repoURL: https://github.com/gorttman/day2-services.git
    targetRevision: main
    path: apps/ca-portal
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: ca-portal
      namespace: ca-portal
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Without this, selfHeal would re-apply replicas:0 from git on every
      # sync despite ignoreDifferences, defeating manual scale-up
      - RespectIgnoreDifferences=true
