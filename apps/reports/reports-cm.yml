    var SECTIONS=[
     ["Reports",[
      ["Where things run","Nodes, apps, containers",s("reports","/placement/")],
      ["Backups","Postgres, QNAP, secrets",s("reports","/backups/")],
      ["Media status","Radarr and Sonarr health",s("movie-status")],
