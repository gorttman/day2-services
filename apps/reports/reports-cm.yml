    </head>
    <body>
    <main>
      <header style="display:flex;flex-direction:column;gap:10px">
        <div class="eyebrow">i3sec homelab · reports</div>
        <h1>Data Consolidation</h1>
        <p class="lede">Every scattered copy of your data, and whether it has really been moved. Nothing is marked done until it has been checked against live data.</p>
      </header>
      <div class="tiles" id="tiles"></div>
      <div class="panel" id="list"><div class="bulk">Loading</div></div>
      <div class="panel" id="bulk"></div>
      <footer id="foot">Heavy work only runs Monday to Wednesday, 08:00 to 18:00, while you are away and Jellyfin is idle. <a href="/">All reports</a>.</footer>
    </main>
    <script>
    var LABEL={check:["Needs checking","warn"],needs_you:["Needs you","crit"],not_started:["Not started",""],in_progress:["In progress","info"],paused:["Paused","warn"],verified:["Verified","good"]};
    function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
    fetch("consolidation-register.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
      var n={};d.sources.forEach(function(s){n[s.status]=(n[s.status]||0)+1});
      var t=[["verified","Verified"],["check","Needs checking"],["needs_you","Needs you"],["in_progress","In progress"],["not_started","Not started"]];
      document.getElementById("tiles").innerHTML=t.map(function(x){return '<div class="tile"><b>'+(n[x[0]]||0)+'</b><span>'+x[1]+'</span></div>'}).join("");
      var order={needs_you:0,check:1,in_progress:2,paused:3,not_started:4,verified:5};
      var s=d.sources.slice().sort(function(a,b){return (order[a.status]||9)-(order[b.status]||9)});
      document.getElementById("list").innerHTML=s.map(function(x){var l=LABEL[x.status]||[x.status,""];
        return '<details><summary><div><div class="name">'+esc(x.name)+'</div><div class="sub">'+esc(x.kind)+'</div></div><span class="chip '+l[1]+'">'+l[0]+'</span></summary><div class="body">'
        +'<div><b>Earlier notes said</b>'+esc(x.claimed)+'</div><div><b>Actually checked</b>'+esc(x.evidence)+'</div><div><b>Next</b>'+esc(x.next)+'</div></div></details>'}).join("");
      document.getElementById("bulk").innerHTML=d.bulk_sources.map(function(b){var p=b.expected?Math.round(100*b.processed/b.expected):0;
        return '<div class="bulk"><div><h2>'+esc(b.name)+'</h2><div class="sub">'+esc(b.note)+'</div></div><div style="text-align:right"><div class="name">'+b.processed+' of '+b.expected+'</div><div class="bar"><i style="width:'+p+'%"></i></div></div></div>'}).join("");
      document.getElementById("foot").insertAdjacentHTML("beforeend"," Register updated "+esc(d.updated)+".");
    }).catch(function(e){document.getElementById("list").innerHTML='<div class="bulk">Could not load the register.</div>'});
    </script>
    </body>
    </html>
