# The reports server and its pages. server.py routes requests; the backup
# report's scanner lives in reports-backups-cm.yml (moved there unchanged
# from the old backup-dashboard app).
#
# subscriptions.json is edited by hand (or by Claude). The claude.ai copy of
# the subscriptions page, with a live Gmail receipt check, keeps its own
# list - see README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reports
  namespace: reports
  labels:
    app: reports
    app.kubernetes.io/name: reports
    argocd.argoproj.io/managed-by: argocd
data:
  server.py: |
    #!/usr/bin/env python3
    """Serves reports.i3sec.com.au - the landing page, the subscriptions
    report and the backup report, from one process.

      /                        landing page (index.html) linking every report
      /subscriptions/          subscriptions report, reads subscriptions.json
      /backups/                backup report, rendered fresh per request by
                               generate_dashboard.py (formerly the separate
                               backup-dashboard app, moved here unchanged)
      /todo/                   long-term watchlist/todo register, reads
                               todo-register.json
      /placement/              nodes -> apps -> containers, read live from the
                               Kubernetes API (read-only ServiceAccount)
      /api/placement           the same as JSON
      /api/certificates        cert-manager Certificates: status and expiry, for the
                               certificates panel on /placement/
      /control/                every report and admin site on one page; also served
                               at / for the control.i3sec.com.au host (internal only)
      /api/hosts               hostnames of every ingress, so new apps show up there
      /api/backups             the backup report's overall verdict as JSON,
                               for the landing page's status line
      /api/media               the same for the media report, summarised from
                               movie-status's /api/status
      /healthz                 probes

    The media report stays at movie-status.i3sec.com.au in arr-stack: it needs
    Radarr's RWO config volume, which pins it to the arr-stack pod's node.

    Requests for the old backup-status.i3sec.com.au host redirect to /backups/
    so existing bookmarks keep working.

    Every file is read from disk per request, so a ConfigMap edit shows up as
    soon as the kubelet refreshes the volume - no restart, no cache.
    """
    import json
    import sys
    import threading
    import time
    import urllib.request
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path

    sys.path.insert(0, "/app/backups")
    import generate_dashboard as backups  # noqa: E402

    SITE = Path("/app/site")
    CANONICAL = "https://reports.i3sec.com.au"

    STATIC = {
        "/": ("index.html", "text/html; charset=utf-8"),
        "/index.html": ("index.html", "text/html; charset=utf-8"),
        "/subscriptions/": ("subscriptions.html", "text/html; charset=utf-8"),
        "/subscriptions/subscriptions.json": ("subscriptions.json", "application/json"),
        "/icloud-migration/": ("icloud-migration.html", "text/html; charset=utf-8"),
        "/consolidation/": ("consolidation.html", "text/html; charset=utf-8"),
        "/consolidation/consolidation-register.json": ("consolidation-register.json", "application/json"),
        "/todo/": ("todo.html", "text/html; charset=utf-8"),
        "/todo/todo-register.json": ("todo-register.json", "application/json"),
        "/placement/": ("placement.html", "text/html; charset=utf-8"),
        "/control/": ("control.html", "text/html; charset=utf-8"),
    }
    # The subscriptions page fetches subscriptions.json relative to itself, so
    # it must be served from a trailing-slash URL.
    SLASH_REDIRECTS = {"/subscriptions": "/subscriptions/", "/backups": "/backups/", "/icloud-migration": "/icloud-migration/", "/consolidation": "/consolidation/", "/todo": "/todo/", "/placement": "/placement/", "/control": "/control/"}

    ORDER = {"good": 0, "warn": 1, "crit": 2}

    # movie-status's own JSON, read in-cluster - a browser on reports.* cannot
    # fetch it cross-origin. movie-status re-queries every *arr per request, so
    # the summary is held for a minute rather than recomputed on every landing
    # page load.
    MEDIA_STATUS_URL = "http://movie-status.arr-stack.svc.cluster.local/api/status"
    MEDIA_TTL = 60
    _media_cache = {"at": 0.0, "value": None}
    _media_lock = threading.Lock()


    def media_summary():
        with _media_lock:
            if _media_cache["value"] and time.time() - _media_cache["at"] < MEDIA_TTL:
                return _media_cache["value"]
            with urllib.request.urlopen(MEDIA_STATUS_URL, timeout=45) as resp:
                d = json.load(resp)
            stall = (d.get("health") or {}).get("stall") or {}
            stalled = sorted(app for app, v in stall.items() if v.get("stalled"))
            needs_you = len(d.get("needsYou") or [])
            main = d.get("main") or {}
            sab = d.get("sab") or {}
            value = {
                "overall": "crit" if stalled else "warn" if needs_you else "good",
                "stalled": stalled,
                "needsYou": needs_you,
                "movies": {"atTarget": main.get("meetCutoff"), "total": main.get("titles"), "eta": main.get("eta")},
                "imported24h": main.get("imported24h"),
                "sabPaused": (sab.get("byStatus") or {}).get("Paused", 0),
                "generated": d.get("generated"),
            }
            _media_cache.update(at=time.time(), value=value)
            return value


    # Read-only view of the cluster for /placement/, via the pod's own
    # ServiceAccount (reports-rbac.yml: get/list on pods and nodes only).
    # Held for 10 seconds so a page refresh does not hit the API every time.
    KUBE_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    PLACE_TTL = 10
    _place_cache = {"at": 0.0, "value": None}
    _place_lock = threading.Lock()


    def kube_get(path):
        import os
        import ssl
        host = os.environ["KUBERNETES_SERVICE_HOST"]
        port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
        token = Path(KUBE_DIR, "token").read_text().strip()
        ctx = ssl.create_default_context(cafile=f"{KUBE_DIR}/ca.crt")
        req = urllib.request.Request(f"https://{host}:{port}{path}", headers={"Authorization": f"Bearer {token}"})
        with urllib.request.urlopen(req, timeout=20, context=ctx) as resp:
            return json.load(resp)


    def container_view(spec_name, image, st):
        state = (st or {}).get("state") or {}
        if "running" in state:
            ok = st.get("ready", False)
            return {"name": spec_name, "image": image, "restarts": st.get("restartCount", 0),
                    "state": "ok" if ok else "warn", "text": "running" if ok else "not ready"}
        if "waiting" in state:
            reason = state["waiting"].get("reason") or "waiting"
            return {"name": spec_name, "image": image, "restarts": (st or {}).get("restartCount", 0),
                    "state": "bad" if reason in ("CrashLoopBackOff", "ImagePullBackOff", "ErrImagePull", "CreateContainerError") else "warn",
                    "text": reason}
        if "terminated" in state:
            reason = state["terminated"].get("reason") or "terminated"
            return {"name": spec_name, "image": image, "restarts": (st or {}).get("restartCount", 0),
                    "state": "ok" if reason == "Completed" else "bad", "text": reason}
        return {"name": spec_name, "image": image, "restarts": 0, "state": "warn", "text": "starting"}


    def owner_kind(p):
        owner = next((o for o in p["metadata"].get("ownerReferences", []) if o.get("controller")), None)
        return owner["kind"] if owner else "Pod"


    def app_name(p):
        """The workload a pod belongs to: its Deployment/StatefulSet/DaemonSet/
        CronJob name, not the pod's hashed name. Falls back to the pod name."""
        import re
        owner = next((o for o in p["metadata"].get("ownerReferences", []) if o.get("controller")), None)
        if not owner:
            return p["metadata"]["name"]
        name, kind = owner["name"], owner["kind"]
        if kind == "ReplicaSet":
            return re.sub(r"-[a-z0-9]{6,10}$", "", name)
        if kind == "Job":
            return re.sub(r"-\d{6,}$", "", name)
        return name


    def pod_view(p):
        spec, status = p["spec"], p.get("status", {})
        by_name = {c["name"]: c for c in status.get("containerStatuses", [])}
        cons = [container_view(c["name"], c.get("image", ""), by_name.get(c["name"])) for c in spec.get("containers", [])]
        phase = status.get("phase", "Unknown")
        ready = sum(1 for c in cons if c["state"] == "ok" and c["text"] == "running")
        if p["metadata"].get("deletionTimestamp"):
            state, text = "warn", "Terminating"
        elif phase == "Succeeded":
            state, text = "ok", "Completed"
        elif phase == "Failed":
            state, text = "bad", status.get("reason") or "Failed"
        elif any(c["state"] == "bad" for c in cons):
            state, text = "bad", next(c["text"] for c in cons if c["state"] == "bad")
        elif phase == "Running" and ready == len(cons):
            state, text = "ok", "Running"
        else:
            state, text = "warn", phase
        return {"ns": p["metadata"]["namespace"], "name": p["metadata"]["name"], "app": app_name(p), "kind": owner_kind(p), "phase": phase,
                "state": state, "text": text, "ready": f"{ready}/{len(cons)}", "containers": cons}


    def placement():
        with _place_lock:
            if _place_cache["value"] and time.time() - _place_cache["at"] < PLACE_TTL:
                return _place_cache["value"]
            nodes = {}
            for n in kube_get("/api/v1/nodes")["items"]:
                ready = next((c["status"] == "True" for c in n["status"].get("conditions", []) if c["type"] == "Ready"), False)
                ip = next((a["address"] for a in n["status"].get("addresses", []) if a["type"] == "InternalIP"), "")
                nodes[n["metadata"]["name"]] = {"name": n["metadata"]["name"], "ip": ip, "ready": ready, "pods": []}
            for p in kube_get("/api/v1/pods")["items"]:
                node = p["spec"].get("nodeName") or "(not placed)"
                nodes.setdefault(node, {"name": node, "ip": "", "ready": None, "pods": []})["pods"].append(pod_view(p))
            out = sorted(nodes.values(), key=lambda n: n["name"])
            for n in out:
                n["pods"].sort(key=lambda x: (x["ns"], x["name"]))
            value = {"generated": datetime.now(timezone.utc).isoformat(), "nodes": out}
            _place_cache.update(at=time.time(), value=value)
            return value


    _hosts_cache = {"at": 0.0, "value": None}


    def ingress_hosts():
        with _place_lock:
            if _hosts_cache["value"] and time.time() - _hosts_cache["at"] < 30:
                return _hosts_cache["value"]
            hosts = set()
            for i in kube_get("/apis/networking.k8s.io/v1/ingresses")["items"]:
                for r in i["spec"].get("rules", []):
                    if r.get("host"):
                        hosts.add(r["host"])
            value = {"hosts": sorted(hosts)}
            _hosts_cache.update(at=time.time(), value=value)
            return value


    _certs_cache = {"at": 0.0, "value": None}


    def certificates():
        """Every cert-manager Certificate with its readiness and expiry. Read-only
        (reports-rbac.yml: get/list on certificates.cert-manager.io, no secrets)."""
        with _place_lock:
            if _certs_cache["value"] and time.time() - _certs_cache["at"] < 30:
                return _certs_cache["value"]
            now = datetime.now(timezone.utc)
            rows = []
            for c in kube_get("/apis/cert-manager.io/v1/certificates")["items"]:
                st = c.get("status", {})
                ready = next((x for x in st.get("conditions", []) if x.get("type") == "Ready"), {})
                not_after = st.get("notAfter")
                days = None
                if not_after:
                    days = int((datetime.fromisoformat(not_after.replace("Z", "+00:00")) - now).total_seconds() // 86400)
                is_ready = ready.get("status") == "True"
                if not is_ready:
                    state = "bad"
                elif days is not None and days < 7:
                    state = "bad"
                elif days is not None and days < 14:
                    state = "warn"
                else:
                    state = "ok"
                rows.append({
                    "ns": c["metadata"]["namespace"], "name": c["metadata"]["name"],
                    "hosts": c.get("spec", {}).get("dnsNames", []),
                    "issuer": c.get("spec", {}).get("issuerRef", {}).get("name", ""),
                    "ready": is_ready, "message": ready.get("message", "") if not is_ready else "",
                    "notAfter": not_after, "renewalTime": st.get("renewalTime"), "days": days, "state": state,
                })
            rows.sort(key=lambda r: (r["state"] == "ok", r["days"] if r["days"] is not None else -1, r["ns"], r["name"]))
            value = {"generated": now.isoformat(), "certificates": rows}
            _certs_cache.update(at=time.time(), value=value)
            return value


    def backup_summary():
        def worst(statuses):
            return max(statuses, key=ORDER.get) if statuses else "crit"

        postgres = backups.scan_postgres()
        qnap, _ = backups.scan_qnap_snapshot()
        secrets = backups.scan_sealed_secrets()
        streams = {
            "postgres": worst([backups.status_for_days(r["stale_days"]) for r in postgres]),
            "qnap-snapshot": worst([backups.row_status(r) for r in qnap]),
            "sealed-secrets": backups.status_for_days(secrets["stale_days"]) if secrets else "crit",
        }
        name, when = backups.next_run(datetime.now(timezone.utc))
        return {
            "overall": worst(list(streams.values())),
            "streams": streams,
            "nextRun": name,
            "nextRunAt": when.isoformat(),
        }


    class Handler(BaseHTTPRequestHandler):
        def send(self, status, body, content_type):
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.send_header("Cache-Control", "no-cache, must-revalidate")
            self.end_headers()
            self.wfile.write(body)

        def redirect(self, location):
            self.send_response(301)
            self.send_header("Location", location)
            self.send_header("Content-Length", "0")
            self.end_headers()

        def do_GET(self):
            path = self.path.split("?", 1)[0]
            host = (self.headers.get("Host") or "").split(":", 1)[0]

            if host.startswith("backup-status."):
                self.redirect(CANONICAL + "/backups/")
                return
            if path == "/healthz":
                self.send(200, b"ok", "text/plain")
                return
            if path in SLASH_REDIRECTS:
                self.redirect(SLASH_REDIRECTS[path])
                return
            if path == "/backups/":
                try:
                    self.send(200, backups.generate().encode("utf-8"), "text/html; charset=utf-8")
                except Exception as exc:  # noqa: BLE001 - surface it on the page, not a bare 500
                    self.send(500, f"<h1>Backup report failed</h1><pre>{exc}</pre>".encode("utf-8"), "text/html; charset=utf-8")
                return
            if path == "/api/backups":
                try:
                    self.send(200, json.dumps(backup_summary()).encode("utf-8"), "application/json")
                except Exception as exc:  # noqa: BLE001
                    self.send(500, json.dumps({"error": str(exc)}).encode("utf-8"), "application/json")
                return
            if path == "/api/media":
                try:
                    self.send(200, json.dumps(media_summary()).encode("utf-8"), "application/json")
                except Exception as exc:  # noqa: BLE001
                    self.send(502, json.dumps({"error": str(exc)[:300]}).encode("utf-8"), "application/json")
                return
            if path == "/api/placement":
                try:
                    self.send(200, json.dumps(placement()).encode("utf-8"), "application/json")
                except Exception as exc:  # noqa: BLE001
                    self.send(502, json.dumps({"error": str(exc)[:300]}).encode("utf-8"), "application/json")
                return
            if path == "/api/certificates":
                try:
                    self.send(200, json.dumps(certificates()).encode("utf-8"), "application/json")
                except Exception as exc:  # noqa: BLE001
                    self.send(502, json.dumps({"error": str(exc)[:300]}).encode("utf-8"), "application/json")
                return
            if path == "/api/hosts":
                try:
                    self.send(200, json.dumps(ingress_hosts()).encode("utf-8"), "application/json")
                except Exception as exc:  # noqa: BLE001
                    self.send(502, json.dumps({"error": str(exc)[:300]}).encode("utf-8"), "application/json")
                return
            if host.startswith("control.") and path in ("/", "/index.html"):
                self.send(200, (SITE / "control.html").read_bytes(), "text/html; charset=utf-8")
                return
            if path in STATIC:
                name, content_type = STATIC[path]
                self.send(200, (SITE / name).read_bytes(), content_type)
                return
            self.send(404, b"Not found", "text/plain")

        def log_message(self, fmt, *args):
            if "/healthz" not in (args[0] if args else ""):
                print(f"[*] {self.address_string()} {fmt % args}")


    def main():
        server = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
        print("[*] Serving reports on :8080")
        server.serve_forever()


    if __name__ == "__main__":
        main()
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homelab Reports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
    <style>
    :root{--bg:#f3f5f4;--surface:#fff;--ink:#16201d;--muted:#5b6b66;--faint:#8a9994;--line:#d7dfdc;--accent:#1c6b56;
      --good:#1f7a4d;--good-soft:#dcefe3;--warn:#a35f00;--warn-soft:#fbead0;--crit:#b3372b;--crit-soft:#f7dcd8;color-scheme:light}
    @media (prefers-color-scheme:dark){:root{--bg:#0f1513;--surface:#171f1c;--ink:#e4ece9;--muted:#9cafa8;--faint:#6f817b;--line:#2a3632;--accent:#5cc4a3;
      --good:#5cc48c;--good-soft:#1c3527;--warn:#e5a54b;--warn-soft:#3a2c16;--crit:#ef8579;--crit-soft:#3d1f1b;color-scheme:dark}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding-inline:16px;padding-block:40px 48px}
    main{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
    .eyebrow{font:500 11px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    h1{font:700 clamp(30px,5vw,44px)/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:6px 0 0}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
    a.card{display:flex;flex-direction:column;gap:10px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;transition:border-color .15s}
    a.card:hover{border-color:var(--accent)}
    a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .card h2{font:700 21px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0;display:flex;justify-content:space-between;gap:8px}
    .card h2 span{color:var(--faint);font-weight:500}
    .card p{margin:0;color:var(--muted);font-size:14px}
    .status{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;padding-top:12px;border-top:1px solid var(--line)}
    .pill{font:500 11px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:5px;background:var(--line);color:var(--muted)}
    .pill.good{background:var(--good-soft);color:var(--good)}
    .pill.warn{background:var(--warn-soft);color:var(--warn)}
    .pill.crit{background:var(--crit-soft);color:var(--crit)}
    .muted{color:var(--muted)}
    .num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
    footer{font-size:12.5px;color:var(--faint)}
    @media (prefers-reduced-motion:reduce){a.card{transition:none}}
    </style>
    </head>
    <body>
    <main>
      <header>
        <div class="eyebrow">i3sec homelab</div>
        <h1>Reports</h1>
      </header>
      <div class="cards">
        <a class="card" href="/control/" target="_blank" rel="noopener">
          <h2>Control <span>→</span></h2>
          <p>Every report and admin site on one page: Longhorn, ArgoCD, Grafana, Pi-hole, the apps and the media tools.</p>
          <div class="status"><span class="pill">Links</span><span>control.i3sec.com.au, home network only</span></div>
        </a>
        <a class="card" href="/backups/" target="_blank" rel="noopener">
          <h2>Backups <span>→</span></h2>
          <p>Postgres dumps, QNAP snapshots and sealed-secrets keys, checked for staleness on every load.</p>
          <div class="status" id="backups-status"><span class="pill">Checking</span></div>
        </a>
        <a class="card" href="/subscriptions/" target="_blank" rel="noopener">
          <h2>Subscriptions <span>→</span></h2>
          <p>What's being paid for each month, how it's billed, and what renews next.</p>
          <div class="status" id="subs-status"><span class="pill">Loading</span></div>
        </a>
        <a class="card" href="https://movie-status.i3sec.com.au/" target="_blank" rel="noopener">
          <h2>Media <span>→</span></h2>
          <p>Radarr and Sonarr backfills, downloads, stalls and the scheduled jobs behind them.</p>
          <div class="status" id="media-status"><span class="pill">Checking</span></div>
        </a>
        <a class="card" href="/icloud-migration/" target="_blank" rel="noopener">
          <h2>iCloud Migration <span>→</span></h2>
          <p>Progress moving off iCloud Drive: what's landed in Paperless/Immich, what's blocked, what's not started.</p>
          <div class="status"><span class="pill">Snapshot</span><span>Live numbers on the Grafana dashboard</span></div>
        </a>
        <a class="card" href="/consolidation/" target="_blank" rel="noopener">
          <h2>Data Consolidation <span>→</span></h2>
          <p>Every scattered source of your data (phones, drives, SD cards, cloud, old folders) and whether it has really been moved.</p>
          <div class="status"><span class="pill">Register</span><span>Nothing counts as done until checked</span></div>
        </a>
        <a class="card" href="https://grafana.i3sec.com.au/alerting/list" target="_blank" rel="noopener">
          <h2>Alerts <span>→</span></h2>
          <p>Volumes filling up, critical workloads that are down, node load, and stalled migrations. Red means look at it.</p>
          <div class="status"><span class="pill">Grafana</span><span>Nothing is sent anywhere yet - check this page</span></div>
        </a>
        <a class="card" href="/placement/" target="_blank" rel="noopener">
          <h2>Where Things Run <span>→</span></h2>
          <p>Every node, the apps on it and the containers inside each app, read live from the cluster.</p>
          <div class="status" id="place-status"><span class="pill">Loading</span></div>
        </a>
        <a class="card" href="/todo/" target="_blank" rel="noopener">
          <h2>Long-term TODO <span>→</span></h2>
          <p>Things worth revisiting later: tools to re-check once they mature, ideas parked on purpose, no deadline attached.</p>
          <div class="status" id="todo-status"><span class="pill">Loading</span></div>
        </a>
      </div>
      <footer>Each report reads its data fresh when you open it.</footer>
    </main>
    <script>
    const LABEL = { good: "Healthy", warn: "Degraded", crit: "Critical" };
    const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    function setStatus(id, parts) {
      const el = document.getElementById(id);
      el.replaceChildren(...parts.map(([cls, text]) => {
        const s = document.createElement("span");
        if (cls) s.className = cls;
        s.textContent = text;
        return s;
      }));
    }

    fetch("/api/backups", { cache: "no-store" }).then(r => r.json()).then(b => {
      if (b.error) throw new Error(b.error);
      const at = new Date(b.nextRunAt);
      const t = at.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const bad = Object.entries(b.streams).filter(([, s]) => s !== "good").map(([n]) => n);
      setStatus("backups-status", [
        ["pill " + b.overall, LABEL[b.overall] || b.overall],
        ["", bad.length ? bad.join(", ") + " behind" : `Next run ${b.nextRun} at ${t}`],
      ]);
    }).catch(() => setStatus("backups-status", [["pill crit", "Unavailable"], ["", "Couldn't read /mnt/backup"]]));

    fetch("/api/media", { cache: "no-store" }).then(r => r.json()).then(m => {
      if (m.error) throw new Error(m.error);
      const pill = m.stalled.length ? ["pill crit", m.stalled.join(", ") + " stalled"]
        : m.needsYou ? ["pill warn", `${m.needsYou} need you`] : ["pill good", "Flowing"];
      const parts = [pill];
      if (m.stalled.length && m.needsYou) parts.push(["pill warn", `${m.needsYou} need you`]);
      if (m.movies.total) parts.push(["", `${m.movies.atTarget}/${m.movies.total} movies at 1080p`]);
      if (m.imported24h != null) parts.push(["", `${m.imported24h} imported today`]);
      if (m.sabPaused) parts.push(["pill warn", `${m.sabPaused} paused in SABnzbd`]);
      setStatus("media-status", parts);
    }).catch(() => setStatus("media-status", [["pill", "No status"], ["", "movie-status didn't answer"]]));

    fetch("/subscriptions/subscriptions.json", { cache: "no-store" }).then(r => r.json()).then(d => {
      const fx = d.fx || { AUD: 1 };
      const active = d.subs.filter(s => s.status === "active");
      const monthly = active.filter(s => s.cycleMonths === 1).reduce((t, s) => t + (s.price || 0) * (fx[s.currency] || 1), 0);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const due = active.filter(s => s.next && s.cycleMonths).map(s => {
        const [y, m, dd] = s.next.split("-").map(Number);
        let when = new Date(y, m - 1, dd);
        while (when < today) when = new Date(when.getFullYear(), when.getMonth() + s.cycleMonths, when.getDate());
        return { name: s.name, when };
      }).sort((a, b) => a.when - b.when)[0];
      const review = d.subs.filter(s => s.status === "review").length;
      const parts = [["pill good", `A$${monthly.toFixed(0)}/mo`]];
      if (due) parts.push(["", `Next: ${due.name}, ${due.when.getDate()} ${MON[due.when.getMonth()]}`]);
      if (review) parts.push(["pill warn", `${review} to check`]);
      setStatus("subs-status", parts);
    }).catch(() => setStatus("subs-status", [["pill crit", "Unavailable"]]));

    fetch("/api/placement", { cache: "no-store" }).then(r => r.json()).then(d => {
      if (d.error) throw new Error(d.error);
      const parts = d.nodes.map(n => ["", n.name + " " + n.pods.filter(p => p.phase !== "Succeeded").length]);
      const bad = d.nodes.reduce((t, n) => t + n.pods.filter(p => p.state === "bad").length, 0);
      setStatus("place-status", [bad ? ["pill warn", bad + " unhealthy"] : ["pill good", "All running"], ...parts]);
    }).catch(() => setStatus("place-status", [["pill crit", "Unavailable"]]));

    fetch("/todo/todo-register.json", { cache: "no-store" }).then(r => r.json()).then(d => {
      const open = d.items.filter(i => i.status === "open").length;
      setStatus("todo-status", [["pill", open + " open"], ["", "No deadlines, just revisit later"]]);
    }).catch(() => setStatus("todo-status", [["pill crit", "Unavailable"]]));
    </script>
    </body>
    </html>
