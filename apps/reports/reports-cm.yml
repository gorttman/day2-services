    function section(name,tiles,count){return '<details data-n="'+esc(name)+'"'+(isOpen(name)?' open':'')+'><summary><h2>'+esc(name)+'</h2><span class="c">'+count+(count===1?' site':' sites')+'</span></summary><div class="grid">'+tiles+'</div></details>'}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
    document.addEventListener("toggle",function(e){var n=e.target.getAttribute&&e.target.getAttribute("data-n");if(!n)return;st[n]=e.target.open;save()},true);
    function setAll(v){var d=document.querySelectorAll("details[data-n]");for(var i=0;i<d.length;i++){d[i].open=v}}
    document.getElementById("openall").addEventListener("click",function(){setAll(true)});
    document.getElementById("closeall").addEventListener("click",function(){setAll(false)});
    var known={};
    SECTIONS.forEach(function(sec){sec[1].forEach(function(x){try{known[new URL(x[2]).hostname]=1}catch(e){}})});
    // Aliases of a site that already has a tile (not separate sites).
    known["backup-status"+D]=1;known["control"+D]=1;known["books"+D]=1;
    function draw(extra){
      var html=SECTIONS.map(function(sec){return section(sec[0],sec[1].map(function(x){return tile(x[0],x[1],x[2])}).join(""),sec[1].length)}).join("");
      if(extra.length)html+=section("Other sites (found automatically)",extra.map(function(h){return tile(h.replace(D,""),"Not named yet",H+h+"/")}).join(""),extra.length);
      document.getElementById("sections").innerHTML=html;
    }
    draw([]);
    fetch("/api/hosts",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
      if(d.error)throw new Error(d.error);
      draw(d.hosts.filter(function(h){return !known[h]}));
    }).catch(function(){});
    </script>
