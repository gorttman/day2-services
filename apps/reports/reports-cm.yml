    </head>
    <body>
    <main>
      <header>
        <div class="eyebrow">i3sec homelab</div>
        <h1>Reports</h1>
      </header>
      <div class="cards">
        <a class="card" href="/backups/">
          <h2>Backups <span>→</span></h2>
          <p>Postgres dumps, QNAP snapshots and sealed-secrets keys, checked for staleness on every load.</p>
          <div class="status" id="backups-status"><span class="pill">Checking</span></div>
        </a>
        <a class="card" href="/subscriptions/">
          <h2>Subscriptions <span>→</span></h2>
          <p>What's being paid for each month, how it's billed, and what renews next.</p>
          <div class="status" id="subs-status"><span class="pill">Loading</span></div>
        </a>
        <a class="card" href="https://movie-status.i3sec.com.au/">
          <h2>Media <span>→</span></h2>
          <p>Radarr and Sonarr backfills, downloads, stalls and the scheduled jobs behind them.</p>
          <div class="status"><span class="muted">Hosted with the arr-stack at movie-status.i3sec.com.au</span></div>
        </a>
      </div>
      <footer>Each report reads its data fresh when you open it.</footer>
    </main>
    <script>
    const LABEL = { good: "Healthy", warn: "Degraded", crit: "Critical" };
    const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    function setStatus(id, parts) {
      const el = document.getElementById(id);
      el.replaceChildren(...parts.map(([cls, text]) => {
        const s = document.createElement("span");
        if (cls) s.className = cls;
        s.textContent = text;
        return s;
      }));
    }

    fetch("/api/backups", { cache: "no-store" }).then(r => r.json()).then(b => {
      if (b.error) throw new Error(b.error);
      const at = new Date(b.nextRunAt);
      const t = at.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const bad = Object.entries(b.streams).filter(([, s]) => s !== "good").map(([n]) => n);
      setStatus("backups-status", [
        ["pill " + b.overall, LABEL[b.overall] || b.overall],
        ["", bad.length ? bad.join(", ") + " behind" : `Next run ${b.nextRun} at ${t}`],
      ]);
    }).catch(() => setStatus("backups-status", [["pill crit", "Unavailable"], ["", "Couldn't read /mnt/backup"]]));

    fetch("/subscriptions/subscriptions.json", { cache: "no-store" }).then(r => r.json()).then(d => {
      const fx = d.fx || { AUD: 1 };
      const active = d.subs.filter(s => s.status === "active");
      const monthly = active.filter(s => s.cycleMonths === 1).reduce((t, s) => t + (s.price || 0) * (fx[s.currency] || 1), 0);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const due = active.filter(s => s.next && s.cycleMonths).map(s => {
        const [y, m, dd] = s.next.split("-").map(Number);
        let when = new Date(y, m - 1, dd);
        while (when < today) when = new Date(when.getFullYear(), when.getMonth() + s.cycleMonths, when.getDate());
        return { name: s.name, when };
      }).sort((a, b) => a.when - b.when)[0];
      const review = d.subs.filter(s => s.status === "review").length;
      const parts = [["pill good", `A$${monthly.toFixed(0)}/mo`]];
      if (due) parts.push(["", `Next: ${due.name}, ${due.when.getDate()} ${MON[due.when.getMonth()]}`]);
      if (review) parts.push(["pill warn", `${review} to check`]);
      setStatus("subs-status", parts);
    }).catch(() => setStatus("subs-status", [["pill crit", "Unavailable"]]));
    </script>
    </body>
    </html>
