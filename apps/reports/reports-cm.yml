# The reports server and its pages. server.py routes requests; the backup
# report's scanner lives in reports-backups-cm.yml (moved there unchanged
# from the old backup-dashboard app).
#
# subscriptions.json is edited by hand (or by Claude). The claude.ai copy of
# the subscriptions page, with a live Gmail receipt check, keeps its own
# list - see README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reports
  namespace: reports
  labels:
    app: reports
    app.kubernetes.io/name: reports
    argocd.argoproj.io/managed-by: argocd
data:
  server.py: |
    #!/usr/bin/env python3
    """Serves reports.i3sec.com.au - the landing page, the subscriptions
    report and the backup report, from one process.

      /                        landing page (index.html) linking every report
      /subscriptions/          subscriptions report, reads subscriptions.json
      /backups/                backup report, rendered fresh per request by
                               generate_dashboard.py (formerly the separate
                               backup-dashboard app, moved here unchanged)
      /api/backups             the backup report's overall verdict as JSON,
                               for the landing page's status line
      /healthz                 probes

    The media report stays at movie-status.i3sec.com.au in arr-stack: it needs
    Radarr's RWO config volume, which pins it to the arr-stack pod's node.

    Requests for the old backup-status.i3sec.com.au host redirect to /backups/
    so existing bookmarks keep working.

    Every file is read from disk per request, so a ConfigMap edit shows up as
    soon as the kubelet refreshes the volume - no restart, no cache.
    """
    import json
    import sys
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path

    sys.path.insert(0, "/app/backups")
    import generate_dashboard as backups  # noqa: E402

    SITE = Path("/app/site")
    CANONICAL = "https://reports.i3sec.com.au"

    STATIC = {
        "/": ("index.html", "text/html; charset=utf-8"),
        "/index.html": ("index.html", "text/html; charset=utf-8"),
        "/subscriptions/": ("subscriptions.html", "text/html; charset=utf-8"),
        "/subscriptions/subscriptions.json": ("subscriptions.json", "application/json"),
    }
    # The subscriptions page fetches subscriptions.json relative to itself, so
    # it must be served from a trailing-slash URL.
    SLASH_REDIRECTS = {"/subscriptions": "/subscriptions/", "/backups": "/backups/"}

    ORDER = {"good": 0, "warn": 1, "crit": 2}


    def backup_summary():
        def worst(statuses):
            return max(statuses, key=ORDER.get) if statuses else "crit"

        postgres = backups.scan_postgres()
        qnap, _ = backups.scan_qnap_snapshot()
        secrets = backups.scan_sealed_secrets()
        streams = {
            "postgres": worst([backups.status_for_days(r["stale_days"]) for r in postgres]),
            "qnap-snapshot": worst([backups.status_for_days(r["stale_days"]) for r in qnap]),
            "sealed-secrets": backups.status_for_days(secrets["stale_days"]) if secrets else "crit",
        }
        name, when = backups.next_run(datetime.now(timezone.utc))
        return {
            "overall": worst(list(streams.values())),
            "streams": streams,
            "nextRun": name,
            "nextRunAt": when.isoformat(),
        }


    class Handler(BaseHTTPRequestHandler):
        def send(self, status, body, content_type):
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.send_header("Cache-Control", "no-cache, must-revalidate")
            self.end_headers()
            self.wfile.write(body)

        def redirect(self, location):
            self.send_response(301)
            self.send_header("Location", location)
            self.send_header("Content-Length", "0")
            self.end_headers()

        def do_GET(self):
            path = self.path.split("?", 1)[0]
            host = (self.headers.get("Host") or "").split(":", 1)[0]

            if host.startswith("backup-status."):
                self.redirect(CANONICAL + "/backups/")
                return
            if path == "/healthz":
                self.send(200, b"ok", "text/plain")
                return
            if path in SLASH_REDIRECTS:
                self.redirect(SLASH_REDIRECTS[path])
                return
            if path == "/backups/":
                try:
                    self.send(200, backups.generate().encode("utf-8"), "text/html; charset=utf-8")
                except Exception as exc:  # noqa: BLE001 - surface it on the page, not a bare 500
                    self.send(500, f"<h1>Backup report failed</h1><pre>{exc}</pre>".encode("utf-8"), "text/html; charset=utf-8")
                return
            if path == "/api/backups":
                try:
                    self.send(200, json.dumps(backup_summary()).encode("utf-8"), "application/json")
                except Exception as exc:  # noqa: BLE001
                    self.send(500, json.dumps({"error": str(exc)}).encode("utf-8"), "application/json")
                return
            if path in STATIC:
                name, content_type = STATIC[path]
                self.send(200, (SITE / name).read_bytes(), content_type)
                return
            self.send(404, b"Not found", "text/plain")

        def log_message(self, fmt, *args):
            if "/healthz" not in (args[0] if args else ""):
                print(f"[*] {self.address_string()} {fmt % args}")


    def main():
        server = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
        print("[*] Serving reports on :8080")
        server.serve_forever()


    if __name__ == "__main__":
        main()
