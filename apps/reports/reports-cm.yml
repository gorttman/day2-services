    <body>
    <main>
      <header style="display:flex;flex-direction:column;gap:10px">
        <div class="eyebrow">i3sec homelab · reports</div>
        <h1>Where Things Run</h1>
        <p class="lede">Each node, the applications running on it (one per namespace, e.g. Longhorn, Pi-hole), and the containers inside each. Click to open. Read live from the cluster.</p>
      </header>
      <div class="bar"><span id="updated">Loading</span><label><input type="checkbox" id="fin"> show finished jobs</label><span><span class="key ds"></span>runs one per node (DaemonSet)</span></div>
      <div class="panel" id="tree"></div>
      <div class="eyebrow" style="margin-top:8px">Certificates</div>
      <div class="bar"><span id="certsum">Loading</span></div>
      <div class="panel" id="certs"></div>
      <footer>Logs: <a href="https://grafana.i3sec.com.au/d/cluster-logs/cluster-logs" target="_blank" rel="noopener">search cluster and host logs</a> (Grafana, Loki). Refreshes every 30 seconds. <a href="/">All reports</a>.</footer>
    </main>
    <script>
    var OPEN=new Set(),DATA=null;
    function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
    function chip(c,t){return '<span class="chip '+c+'">'+esc(t)+'</span>'}
    function tag(img){var s=String(img||"");var i=s.lastIndexOf("/");return s.slice(i+1)}
    function det(key,cls,sum,body){return '<details class="'+cls+'" data-k="'+esc(key)+'"'+(OPEN.has(key)?" open":"")+'><summary>'+sum+'</summary>'+body+'</details>'}
    var SYS={"kube-system":1,"longhorn-system":1,"metallb-system":1,"cert-manager":1,"argocd":1,"ingress-nginx":1};
    function cls(st){return st==="bad"?"crit":st==="ok"?"good":""}
    function worst(list){return list.some(function(x){return x==="bad"})?"bad":list.some(function(x){return x==="warn"})?"warn":"ok"}
    function render(){
      if(!DATA)return;
      var fin=document.getElementById("fin").checked,html="";
      DATA.nodes.forEach(function(n){
        var pods=n.pods.filter(function(p){return fin||p.phase!=="Succeeded"});
        var apps={};
        pods.forEach(function(p){var k=p.ns;(apps[k]=apps[k]||{ns:p.ns,name:p.ns,pods:[]}).pods.push(p)});
        var list=Object.keys(apps).map(function(k){return apps[k]}).sort(function(a,b){
          return (SYS[a.ns]?1:0)-(SYS[b.ns]?1:0)||a.ns.localeCompare(b.ns)||a.name.localeCompare(b.name)});
        var bad=list.filter(function(a){return worst(a.pods.map(function(p){return p.state}))==="bad"}).length;
        var head='<div class="l">'+esc(n.name)+' <span class="ns">'+esc(n.ip||"")+'</span></div>'
          +'<div>'+(n.ready===false?chip("crit","Not ready"):"")+(bad?chip("warn",bad+" unhealthy"):"")+chip(bad||n.ready===false?"":"good",list.length+" apps")+'</div>';
        var body='<div class="pods">'+list.map(function(a){
          var wl={};a.pods.forEach(function(p){wl[p.app]=(wl[p.app]||0)+1});
          var nwl=Object.keys(wl).length;
          var st=worst(a.pods.map(function(p){return p.state}));
          var cons=[];a.pods.forEach(function(p){p.containers.forEach(function(c){cons.push({c:c,pod:p})})});
          var rows=cons.map(function(x){
            return '<div class="con'+(x.pod.kind==="DaemonSet"?" ds":"")+'"><span>'+esc(x.c.name)+' <span class="img">'+esc(tag(x.c.image))+'</span>'+(nwl>1||wl[x.pod.app]>1?' <span class="ns">'+esc(x.pod.app)+(wl[x.pod.app]>1?' \u00b7 '+esc(x.pod.name.slice(x.pod.app.length)):'')+'</span>':'')+'</span><span>'
              +(x.c.restarts?chip("warn",x.c.restarts+" restarts"):"")+" "+chip(cls(x.c.state),x.c.text)+'</span></div>'}).join("");
          var text=a.pods.length>1?(st==="ok"?"all running":a.pods.filter(function(p){return p.state!=="ok"}).length+" need a look"):a.pods[0].text;
          var s='<div class="l">'+esc(a.name)+' <span class="ns">'+nwl+(nwl===1?" workload":" workloads")+'</span></div><div>'+chip(cls(st),text)+" "+chip("",cons.length+(cons.length===1?" container":" containers"))+'</div>';
          var allds=a.pods.every(function(p){return p.kind==="DaemonSet"});
          return det(n.name+"/"+a.ns+"/"+a.name,"pod"+(allds?" ds":""),s,'<div class="cons">'+rows+'</div>')}).join("")+'</div>';
        html+=det(n.name,"node",head,body);
      });
      document.getElementById("tree").innerHTML=html;
    }
    function load(){
      fetch("/api/placement",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
        if(d.error)throw new Error(d.error);
        DATA=d;render();
        document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
      }).catch(function(e){document.getElementById("updated").textContent="Could not read the cluster: "+e.message});
    }
    function dfmt(t){return new Date(t).toLocaleDateString([], {day:"numeric",month:"short",year:"numeric"})}
    function sev(x){return x==="bad"?2:x==="warn"?1:0}
    function certRender(d){
      var list=d.certificates||[],bad=list.filter(function(c){return c.state==="bad"}).length,warn=list.filter(function(c){return c.state==="warn"}).length;
      var nss={};
      list.forEach(function(c){
        var n=nss[c.ns]=nss[c.ns]||{ns:c.ns,hosts:{},state:"ok",days:null};
        var k=c.hosts.length?c.hosts.join(", "):c.name;
        var h=n.hosts[k]=n.hosts[k]||{key:k,certs:[],state:"ok",days:null};
        h.certs.push(c);
        if(sev(c.state)>sev(h.state))h.state=c.state;
        if(c.days!=null&&(h.days==null||c.days<h.days))h.days=c.days;
      });
      var arr=Object.keys(nss).map(function(k){
        var n=nss[k];n.list=Object.keys(n.hosts).map(function(x){return n.hosts[x]});
        n.list.forEach(function(h){if(sev(h.state)>sev(n.state))n.state=h.state;if(h.days!=null&&(n.days==null||h.days<n.days))n.days=h.days});
        n.list.sort(function(a,b){return sev(b.state)-sev(a.state)||(a.days==null?-1:a.days)-(b.days==null?-1:b.days)||a.key.localeCompare(b.key)});
        return n}).sort(function(a,b){return sev(b.state)-sev(a.state)||(a.days==null?-1:a.days)-(b.days==null?-1:b.days)||a.ns.localeCompare(b.ns)});
      var nh=arr.reduce(function(t,n){return t+n.list.length},0);
      document.getElementById("certsum").innerHTML=chip(bad?"crit":warn?"warn":"good",nh+" hostnames \u00b7 "+list.length+" certificates")+" "
        +(bad?chip("crit",bad+" need action"):"")+" "+(warn?chip("warn",warn+" expiring soon"):"")+" Managed by cert-manager (Let's Encrypt), renewed automatically. Grouped by app, then hostname; soonest expiry first.";
      function tone(s){return s==="bad"?"crit":s==="warn"?"warn":"good"}
      function ctext(x){return x.ready===false?"Not ready":x.days==null?"unknown":x.days+" days left"}
      document.getElementById("certs").innerHTML=arr.map(function(n){
        var rows=n.list.map(function(h){
          var inner=h.certs.map(function(c){
            return '<div class="con"><span>'+esc(c.name)+' <span class="img">'+esc(c.issuer)+'</span></span><span>'
              +(c.message?esc(c.message)+" ":"")+(c.renewalTime?'<span class="img">renews from '+esc(dfmt(c.renewalTime))+'</span> ':"")
              +chip("",c.notAfter?dfmt(c.notAfter):"not issued")+" "+chip(tone(c.state),ctext(c))+'</span></div>'}).join("");
          var hs='<div class="l">'+esc(h.key)+'</div><div>'+chip(tone(h.state),h.days==null?"not ready":h.days+" days left")+" "+chip("",h.certs.length+(h.certs.length===1?" certificate":" certificates"))+'</div>';
          return det("cert/"+n.ns+"/"+h.key,"pod",hs,'<div class="cons">'+inner+'</div>')}).join("");
        var ns='<div class="l">'+esc(n.ns)+' <span class="ns">'+n.list.length+(n.list.length===1?" hostname":" hostnames")+'</span></div><div>'+chip(tone(n.state),n.days==null?"not ready":"soonest "+n.days+" days")+'</div>';
        return det("certns/"+n.ns,"node",ns,'<div class="pods">'+rows+'</div>')}).join("");
    }
    function loadCerts(){
      fetch("/api/certificates",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
        if(d.error)throw new Error(d.error);certRender(d);
      }).catch(function(e){document.getElementById("certsum").textContent="Could not read certificates: "+e.message});
    }
    document.addEventListener("toggle",function(e){var k=e.target.getAttribute&&e.target.getAttribute("data-k");if(!k)return;if(e.target.open)OPEN.add(k);else OPEN.delete(k)},true);
    document.getElementById("fin").addEventListener("change",render);
    load();setInterval(load,30000);
    loadCerts();setInterval(loadCerts,30000);
    </script>
    </body>
    </html>
