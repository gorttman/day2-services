# The reports server and its pages. server.py routes requests; the backup
# report's scanner lives in reports-backups-cm.yml (moved there unchanged
# from the old backup-dashboard app).
#
# subscriptions.json is edited by hand (or by Claude). The claude.ai copy of
# the subscriptions page, with a live Gmail receipt check, keeps its own
# list - see README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reports
  namespace: reports
  labels:
    app: reports
    app.kubernetes.io/name: reports
    argocd.argoproj.io/managed-by: argocd
data:
  server.py: |
    #!/usr/bin/env python3
    """Serves reports.i3sec.com.au - the landing page, the subscriptions
    report and the backup report, from one process.

      /                        landing page (index.html) linking every report
      /subscriptions/          subscriptions report, reads subscriptions.json
      /backups/                backup report, rendered fresh per request by
                               generate_dashboard.py (formerly the separate
                               backup-dashboard app, moved here unchanged)
      /todo/                   long-term watchlist/todo register, reads
                               todo-register.json
      /api/backups             the backup report's overall verdict as JSON,
                               for the landing page's status line
      /api/media               the same for the media report, summarised from
                               movie-status's /api/status
      /healthz                 probes

    The media report stays at movie-status.i3sec.com.au in arr-stack: it needs
    Radarr's RWO config volume, which pins it to the arr-stack pod's node.

    Requests for the old backup-status.i3sec.com.au host redirect to /backups/
    so existing bookmarks keep working.

    Every file is read from disk per request, so a ConfigMap edit shows up as
    soon as the kubelet refreshes the volume - no restart, no cache.
    """
    import json
    import sys
    import threading
    import time
    import urllib.request
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path

    sys.path.insert(0, "/app/backups")
    import generate_dashboard as backups  # noqa: E402

    SITE = Path("/app/site")
    CANONICAL = "https://reports.i3sec.com.au"

    STATIC = {
        "/": ("index.html", "text/html; charset=utf-8"),
        "/index.html": ("index.html", "text/html; charset=utf-8"),
        "/subscriptions/": ("subscriptions.html", "text/html; charset=utf-8"),
        "/subscriptions/subscriptions.json": ("subscriptions.json", "application/json"),
        "/icloud-migration/": ("icloud-migration.html", "text/html; charset=utf-8"),
        "/consolidation/": ("consolidation.html", "text/html; charset=utf-8"),
        "/consolidation/consolidation-register.json": ("consolidation-register.json", "application/json"),
        "/todo/": ("todo.html", "text/html; charset=utf-8"),
        "/todo/todo-register.json": ("todo-register.json", "application/json"),
    }
    # The subscriptions page fetches subscriptions.json relative to itself, so
    # it must be served from a trailing-slash URL.
    SLASH_REDIRECTS = {"/subscriptions": "/subscriptions/", "/backups": "/backups/", "/icloud-migration": "/icloud-migration/", "/consolidation": "/consolidation/", "/todo": "/todo/"}

    ORDER = {"good": 0, "warn": 1, "crit": 2}

    # movie-status's own JSON, read in-cluster - a browser on reports.* cannot
    # fetch it cross-origin. movie-status re-queries every *arr per request, so
    # the summary is held for a minute rather than recomputed on every landing
    # page load.
    MEDIA_STATUS_URL = "http://movie-status.arr-stack.svc.cluster.local/api/status"
    MEDIA_TTL = 60
    _media_cache = {"at": 0.0, "value": None}
    _media_lock = threading.Lock()


    def media_summary():
        with _media_lock:
            if _media_cache["value"] and time.time() - _media_cache["at"] < MEDIA_TTL:
                return _media_cache["value"]
            with urllib.request.urlopen(MEDIA_STATUS_URL, timeout=45) as resp:
                d = json.load(resp)
            stall = (d.get("health") or {}).get("stall") or {}
            stalled = sorted(app for app, v in stall.items() if v.get("stalled"))
            needs_you = len(d.get("needsYou") or [])
            main = d.get("main") or {}
            sab = d.get("sab") or {}
            value = {
                "overall": "crit" if stalled else "warn" if needs_you else "good",
                "stalled": stalled,
                "needsYou": needs_you,
                "movies": {"atTarget": main.get("meetCutoff"), "total": main.get("titles"), "eta": main.get("eta")},
                "imported24h": main.get("imported24h"),
                "sabPaused": (sab.get("byStatus") or {}).get("Paused", 0),
                "generated": d.get("generated"),
            }
            _media_cache.update(at=time.time(), value=value)
            return value


    def backup_summary():
        def worst(statuses):
            return max(statuses, key=ORDER.get) if statuses else "crit"

        postgres = backups.scan_postgres()
        qnap, _ = backups.scan_qnap_snapshot()
        secrets = backups.scan_sealed_secrets()
        streams = {
            "postgres": worst([backups.status_for_days(r["stale_days"]) for r in postgres]),
            "qnap-snapshot": worst([backups.status_for_days(r["stale_days"]) for r in qnap]),
            "sealed-secrets": backups.status_for_days(secrets["stale_days"]) if secrets else "crit",
        }
        name, when = backups.next_run(datetime.now(timezone.utc))
        return {
            "overall": worst(list(streams.values())),
            "streams": streams,
            "nextRun": name,
            "nextRunAt": when.isoformat(),
        }


    class Handler(BaseHTTPRequestHandler):
        def send(self, status, body, content_type):
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.send_header("Cache-Control", "no-cache, must-revalidate")
            self.end_headers()
            self.wfile.write(body)

        def redirect(self, location):
            self.send_response(301)
            self.send_header("Location", location)
            self.send_header("Content-Length", "0")
            self.end_headers()

        def do_GET(self):
            path = self.path.split("?", 1)[0]
            host = (self.headers.get("Host") or "").split(":", 1)[0]

            if host.startswith("backup-status."):
                self.redirect(CANONICAL + "/backups/")
                return
            if path == "/healthz":
                self.send(200, b"ok", "text/plain")
                return
            if path in SLASH_REDIRECTS:
                self.redirect(SLASH_REDIRECTS[path])
                return
            if path == "/backups/":
                try:
                    self.send(200, backups.generate().encode("utf-8"), "text/html; charset=utf-8")
                except Exception as exc:  # noqa: BLE001 - surface it on the page, not a bare 500
                    self.send(500, f"<h1>Backup report failed</h1><pre>{exc}</pre>".encode("utf-8"), "text/html; charset=utf-8")
                return
            if path == "/api/backups":
                try:
                    self.send(200, json.dumps(backup_summary()).encode("utf-8"), "application/json")
                except Exception as exc:  # noqa: BLE001
                    self.send(500, json.dumps({"error": str(exc)}).encode("utf-8"), "application/json")
                return
            if path == "/api/media":
                try:
                    self.send(200, json.dumps(media_summary()).encode("utf-8"), "application/json")
                except Exception as exc:  # noqa: BLE001
                    self.send(502, json.dumps({"error": str(exc)[:300]}).encode("utf-8"), "application/json")
                return
            if path in STATIC:
                name, content_type = STATIC[path]
                self.send(200, (SITE / name).read_bytes(), content_type)
                return
            self.send(404, b"Not found", "text/plain")

        def log_message(self, fmt, *args):
            if "/healthz" not in (args[0] if args else ""):
                print(f"[*] {self.address_string()} {fmt % args}")


    def main():
        server = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
        print("[*] Serving reports on :8080")
        server.serve_forever()


    if __name__ == "__main__":
        main()
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homelab Reports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
    <style>
    :root{--bg:#f3f5f4;--surface:#fff;--ink:#16201d;--muted:#5b6b66;--faint:#8a9994;--line:#d7dfdc;--accent:#1c6b56;
      --good:#1f7a4d;--good-soft:#dcefe3;--warn:#a35f00;--warn-soft:#fbead0;--crit:#b3372b;--crit-soft:#f7dcd8;color-scheme:light}
    @media (prefers-color-scheme:dark){:root{--bg:#0f1513;--surface:#171f1c;--ink:#e4ece9;--muted:#9cafa8;--faint:#6f817b;--line:#2a3632;--accent:#5cc4a3;
      --good:#5cc48c;--good-soft:#1c3527;--warn:#e5a54b;--warn-soft:#3a2c16;--crit:#ef8579;--crit-soft:#3d1f1b;color-scheme:dark}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding-inline:16px;padding-block:40px 48px}
    main{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
    .eyebrow{font:500 11px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    h1{font:700 clamp(30px,5vw,44px)/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:6px 0 0}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
    a.card{display:flex;flex-direction:column;gap:10px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;transition:border-color .15s}
    a.card:hover{border-color:var(--accent)}
    a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .card h2{font:700 21px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0;display:flex;justify-content:space-between;gap:8px}
    .card h2 span{color:var(--faint);font-weight:500}
    .card p{margin:0;color:var(--muted);font-size:14px}
    .status{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;padding-top:12px;border-top:1px solid var(--line)}
    .pill{font:500 11px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:5px;background:var(--line);color:var(--muted)}
    .pill.good{background:var(--good-soft);color:var(--good)}
    .pill.warn{background:var(--warn-soft);color:var(--warn)}
    .pill.crit{background:var(--crit-soft);color:var(--crit)}
    .muted{color:var(--muted)}
    .num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
    footer{font-size:12.5px;color:var(--faint)}
    @media (prefers-reduced-motion:reduce){a.card{transition:none}}
    </style>
    </head>
    <body>
    <main>
      <header>
        <div class="eyebrow">i3sec homelab</div>
        <h1>Reports</h1>
      </header>
      <div class="cards">
        <a class="card" href="/backups/" target="_blank" rel="noopener">
          <h2>Backups <span>→</span></h2>
          <p>Postgres dumps, QNAP snapshots and sealed-secrets keys, checked for staleness on every load.</p>
          <div class="status" id="backups-status"><span class="pill">Checking</span></div>
        </a>
        <a class="card" href="/subscriptions/" target="_blank" rel="noopener">
          <h2>Subscriptions <span>→</span></h2>
          <p>What's being paid for each month, how it's billed, and what renews next.</p>
          <div class="status" id="subs-status"><span class="pill">Loading</span></div>
        </a>
        <a class="card" href="https://movie-status.i3sec.com.au/" target="_blank" rel="noopener">
          <h2>Media <span>→</span></h2>
          <p>Radarr and Sonarr backfills, downloads, stalls and the scheduled jobs behind them.</p>
          <div class="status" id="media-status"><span class="pill">Checking</span></div>
        </a>
        <a class="card" href="/icloud-migration/" target="_blank" rel="noopener">
          <h2>iCloud Migration <span>→</span></h2>
          <p>Progress moving off iCloud Drive: what's landed in Paperless/Immich, what's blocked, what's not started.</p>
          <div class="status"><span class="pill">Snapshot</span><span>Live numbers on the Grafana dashboard</span></div>
        </a>
        <a class="card" href="/consolidation/" target="_blank" rel="noopener">
          <h2>Data Consolidation <span>→</span></h2>
          <p>Every scattered source of your data (phones, drives, SD cards, cloud, old folders) and whether it has really been moved.</p>
          <div class="status"><span class="pill">Register</span><span>Nothing counts as done until checked</span></div>
        </a>
        <a class="card" href="https://grafana.i3sec.com.au/alerting/list" target="_blank" rel="noopener">
          <h2>Alerts <span>→</span></h2>
          <p>Volumes filling up, critical workloads that are down, node load, and stalled migrations. Red means look at it.</p>
          <div class="status"><span class="pill">Grafana</span><span>Nothing is sent anywhere yet - check this page</span></div>
        </a>
        <a class="card" href="/todo/" target="_blank" rel="noopener">
          <h2>Long-term TODO <span>→</span></h2>
          <p>Things worth revisiting later: tools to re-check once they mature, ideas parked on purpose, no deadline attached.</p>
          <div class="status" id="todo-status"><span class="pill">Loading</span></div>
        </a>
      </div>
      <footer>Each report reads its data fresh when you open it.</footer>
    </main>
    <script>
    const LABEL = { good: "Healthy", warn: "Degraded", crit: "Critical" };
    const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    function setStatus(id, parts) {
      const el = document.getElementById(id);
      el.replaceChildren(...parts.map(([cls, text]) => {
        const s = document.createElement("span");
        if (cls) s.className = cls;
        s.textContent = text;
        return s;
      }));
    }

    fetch("/api/backups", { cache: "no-store" }).then(r => r.json()).then(b => {
      if (b.error) throw new Error(b.error);
      const at = new Date(b.nextRunAt);
      const t = at.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const bad = Object.entries(b.streams).filter(([, s]) => s !== "good").map(([n]) => n);
      setStatus("backups-status", [
        ["pill " + b.overall, LABEL[b.overall] || b.overall],
        ["", bad.length ? bad.join(", ") + " behind" : `Next run ${b.nextRun} at ${t}`],
      ]);
    }).catch(() => setStatus("backups-status", [["pill crit", "Unavailable"], ["", "Couldn't read /mnt/backup"]]));

    fetch("/api/media", { cache: "no-store" }).then(r => r.json()).then(m => {
      if (m.error) throw new Error(m.error);
      const pill = m.stalled.length ? ["pill crit", m.stalled.join(", ") + " stalled"]
        : m.needsYou ? ["pill warn", `${m.needsYou} need you`] : ["pill good", "Flowing"];
      const parts = [pill];
      if (m.stalled.length && m.needsYou) parts.push(["pill warn", `${m.needsYou} need you`]);
      if (m.movies.total) parts.push(["", `${m.movies.atTarget}/${m.movies.total} movies at 1080p`]);
      if (m.imported24h != null) parts.push(["", `${m.imported24h} imported today`]);
      if (m.sabPaused) parts.push(["pill warn", `${m.sabPaused} paused in SABnzbd`]);
      setStatus("media-status", parts);
    }).catch(() => setStatus("media-status", [["pill", "No status"], ["", "movie-status didn't answer"]]));

    fetch("/subscriptions/subscriptions.json", { cache: "no-store" }).then(r => r.json()).then(d => {
      const fx = d.fx || { AUD: 1 };
      const active = d.subs.filter(s => s.status === "active");
      const monthly = active.filter(s => s.cycleMonths === 1).reduce((t, s) => t + (s.price || 0) * (fx[s.currency] || 1), 0);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const due = active.filter(s => s.next && s.cycleMonths).map(s => {
        const [y, m, dd] = s.next.split("-").map(Number);
        let when = new Date(y, m - 1, dd);
        while (when < today) when = new Date(when.getFullYear(), when.getMonth() + s.cycleMonths, when.getDate());
        return { name: s.name, when };
      }).sort((a, b) => a.when - b.when)[0];
      const review = d.subs.filter(s => s.status === "review").length;
      const parts = [["pill good", `A$${monthly.toFixed(0)}/mo`]];
      if (due) parts.push(["", `Next: ${due.name}, ${due.when.getDate()} ${MON[due.when.getMonth()]}`]);
      if (review) parts.push(["pill warn", `${review} to check`]);
      setStatus("subs-status", parts);
    }).catch(() => setStatus("subs-status", [["pill crit", "Unavailable"]]));

    fetch("/todo/todo-register.json", { cache: "no-store" }).then(r => r.json()).then(d => {
      const open = d.items.filter(i => i.status === "open").length;
      setStatus("todo-status", [["pill", open + " open"], ["", "No deadlines, just revisit later"]]);
    }).catch(() => setStatus("todo-status", [["pill crit", "Unavailable"]]));
    </script>
    </body>
    </html>
  subscriptions.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
    <title>Recurring Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <style>
    :root{
      --bg:#f3f5f4; --surface:#ffffff; --sunk:#e9eeec; --ink:#16201d; --muted:#5b6b66; --faint:#8a9994;
      --line:#d7dfdc; --accent:#1c6b56; --accent-soft:#d7ece5;
      --ok:#1f7a4d; --warn:#a35f00; --warn-soft:#fbead0; --bad:#b3372b; --bad-soft:#f7dcd8; --info-soft:#dfe7f5; --info:#2f5597;
      --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
      --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0f1513; --surface:#171f1c; --sunk:#1d2723; --ink:#e4ece9; --muted:#9cafa8; --faint:#6f817b;
      --line:#2a3632; --accent:#5cc4a3; --accent-soft:#1d3a31;
      --ok:#5cc48c; --warn:#e5a54b; --warn-soft:#3a2c16; --bad:#ef8579; --bad-soft:#3d1f1b; --info-soft:#1e2a40; --info:#8fb0ec;
    }}
    :root[data-theme="dark"]{
      color-scheme:dark;
      --bg:#0f1513; --surface:#171f1c; --sunk:#1d2723; --ink:#e4ece9; --muted:#9cafa8; --faint:#6f817b;
      --line:#2a3632; --accent:#5cc4a3; --accent-soft:#1d3a31;
      --ok:#5cc48c; --warn:#e5a54b; --warn-soft:#3a2c16; --bad:#ef8579; --bad-soft:#3d1f1b; --info-soft:#1e2a40; --info:#8fb0ec;
    }
    *{box-sizing:border-box}
    body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:24px 48px}
    .wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
    h1,h2{font-family:var(--display);text-wrap:balance;margin:0}
    h1{font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.02em}
    h2{font-size:19px;font-weight:700}
    .eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
    .muted{color:var(--muted)}
    header{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}
    @media (max-width:720px){header{grid-template-columns:1fr}}
    .totals{display:flex;gap:28px;flex-wrap:wrap}
    .total b{display:block;font:700 34px/1.1 var(--display);letter-spacing:-.02em}
    .total span{font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
    @media (max-width:880px){.grid{grid-template-columns:1fr}}
    section{display:flex;flex-direction:column;gap:12px}
    .sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
    .tablewrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    th{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
    td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
    tr:last-child td{border-bottom:0}
    td.r,th.r{text-align:right}
    .name{font-weight:600}
    .sub{font-size:12.5px;color:var(--muted)}
    .chip{display:inline-block;font:500 11px/1 var(--mono);padding:5px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
    .chip.apple{background:var(--info-soft);color:var(--info)}
    .chip.soon{background:var(--warn-soft);color:var(--warn)}
    .chip.review{background:var(--warn-soft);color:var(--warn)}
    .chip.cancelled{background:var(--bad-soft);color:var(--bad)}
    .chip.ok{background:var(--accent-soft);color:var(--accent)}
    select{font:500 12px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
    select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .upcoming{display:flex;flex-direction:column}
    .up{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
    .up:last-child{border-bottom:0}
    .leaf{border:1px solid var(--line);border-radius:6px;text-align:center;overflow:hidden;background:var(--surface)}
    .leaf i{display:block;font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:var(--surface);padding:4px 0}
    .leaf b{display:block;font:700 20px/1.3 var(--display)}
    .flags{display:flex;flex-direction:column;gap:10px}
    .flag{padding:12px 14px;border-left:3px solid var(--warn);background:var(--surface);border-radius:0 8px 8px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    .flag{display:flex;flex-direction:column;gap:4px}
    .flag strong{display:block}
    .flag.back{border-left-color:var(--info)}
    .flag .decision{font-style:italic}
    .flag-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
    .flag-actions button{padding:6px 10px;font-size:12.5px}
    .decided{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
    .decided summary{cursor:pointer}
    .drow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-top:10px;margin-top:10px;border-top:1px solid var(--line)}
    .drow button{padding:5px 9px;font-size:12px;flex-shrink:0}
    button{font:500 13px var(--body);background:var(--accent);color:var(--surface);border:0;border-radius:7px;padding:8px 12px;cursor:pointer}
    button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
    button:disabled{opacity:.55;cursor:default}
    .feed{display:flex;flex-direction:column}
    .fi{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line)}
    .fi:last-child{border-bottom:0}
    .fi .d{font:500 12px/1.6 var(--mono);color:var(--faint);white-space:nowrap}
    .fi .s{font-weight:500;overflow-wrap:anywhere}
    .fi .x{grid-column:2;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
    .note{padding:14px;font-size:13.5px;color:var(--muted)}
    details summary{cursor:pointer;list-style:none}
    details summary::-webkit-details-marker{display:none}
    details summary h2::after{content:" +";color:var(--faint);font-weight:500}
    details[open] summary h2::after{content:" –"}
    footer{font-size:12.5px;color:var(--faint);max-width:70ch}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
    </style>

    <div id="root"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
    <script>
    const { useState, useEffect, useMemo } = React;
    const html = htm.bind(React.createElement);

    // Approximate conversion so everything sums in AUD.
    const FX = { AUD: 1, USD: 1.52, EUR: 1.65 };
    const SYM = { AUD: "A$", USD: "US$", EUR: "€" };
    const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const DAY = 86400000;
    const HOSTED = typeof window.claude?.use === "function";
    const LIVE_URL = "https://claude.ai/artifact/9HZSSJVTgNp4o93y4zcqfr";

    const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
    const parse = s => { if (!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
    const fmtDate = d => d ? `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}` : "—";
    const money = (v, c) => v == null ? "—" : `${SYM[c] || ""}${v.toFixed(2)}`;
    const aud = s => (s.price || 0) * (FX[s.currency] || 1);
    const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    // A snoozed flag counts as open again once its date arrives.
    const flagOpen = f => f.state === "open" || (f.state === "snoozed" && (!f.snoozeUntil || parse(f.snoozeUntil) <= today()));

    // Roll a stored renewal date forward by its cycle until it is today or later.
    function nextDate(s) {
      let d = parse(s.next);
      if (!d || !s.cycleMonths) return d;
      const t = today();
      let guard = 0;
      while (d < t && guard++ < 120) d = new Date(d.getFullYear(), d.getMonth() + s.cycleMonths, d.getDate());
      return d;
    }
    const cycleLabel = m => m === 1 ? "Monthly" : m === 12 ? "Yearly" : m ? `${m / 12} years` : "One-off";

    function matchSub(subs, text) {
      const t = text.toLowerCase();
      return subs.find(s => (s.match || []).some(k => t.includes(k.toLowerCase())));
    }

    const FEED_QUERY = 'newer_than:35d (subject:(receipt OR invoice OR subscription OR renew OR renewal OR trial OR "payment") OR from:(paypal OR email.apple.com))';

    function App() {
      const [subs, setSubs] = useState(null);
      const [dbState, setDbState] = useState("loading");
      const [db, setDb] = useState(null);
      const [canEdit, setCanEdit] = useState(false);
      const [flags, setFlags] = useState([]);
      const [busy, setBusy] = useState(null);
      const [snoozeFor, setSnoozeFor] = useState({});
      const [feed, setFeed] = useState({ state: "loading", threads: [], at: null, error: null });

      useEffect(() => {
        let unsub = () => {};
        // Self-hosted copy (reports.i3sec.com.au): no claude.ai runtime, so read
        // the list from the JSON file served next to the page instead.
        if (!HOSTED) {
          fetch("subscriptions.json", { cache: "no-store" }).then(r => r.json())
            .then(d => { setSubs(d.subs); setFlags(d.flags || []); setDbState("ready"); })
            .catch(() => setDbState("unavailable"));
          return;
        }
        let unsubFlags = () => {};
        claude.use("db").then(d => {
          if (!d) { setDbState("unavailable"); return; }
          setDb(d);
          unsub = d.collection("subs").onSnapshot(
            snap => { setSubs(snap.docs.map(x => ({ id: x.id, ...x.data() }))); setDbState("ready"); },
            () => setDbState("unavailable"));
          unsubFlags = d.collection("flags").onSnapshot(
            snap => setFlags(snap.docs.map(x => ({ id: x.id, ...x.data() }))),
            () => setFlags([]));
        });
        claude.use("user").then(u => {
          if (!u) return;
          const w = u.can("data.write");
          setCanEdit(w == null ? u.isOwner() : w);
        });
        return () => { unsub(); unsubFlags(); };
      }, []);

      useEffect(() => {
        let stop = () => {};
        if (!HOSTED) { setFeed(f => ({ ...f, state: "unavailable" })); return; }
        claude.use("mcp").then(mcp => {
          if (!mcp) { setFeed(f => ({ ...f, state: "unavailable" })); return; }
          stop = mcp.watchTool("Gmail", "search_threads", { query: FEED_QUERY, pageSize: 40 }, ev => {
            if (ev.type === "data") {
              const p = ev.result.payload || {};
              setFeed({ state: "ready", threads: p.threads || [], at: ev.result.cache?.storedAt || Date.now(), error: null });
            } else {
              const code = ev.error.code;
              const retract = ["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required"].includes(code);
              setFeed(f => ({ state: retract || !f.threads.length ? "error" : "stale", threads: retract ? [] : f.threads, at: f.at, error: ev.error }));
            }
          }, { cache: { staleTime: 120000, gcTime: 86400000 }, refetchInterval: 30 * 60000 });
        });
        return () => stop();
      }, []);

      async function setStatus(id, status) {
        if (!db) return;
        try { await db.doc("subs/" + id).update({ status }); }
        catch (e) { setCanEdit(false); }
      }

      // Worth-a-look decisions. "Keep for now" hides a flag until a date, then it
      // comes back on its own; "Done for good" closes it and, where the flag says
      // so, marks its subscriptions cancelled so they drop out of the totals.
      async function decide(f, action) {
        if (!db || busy) return;
        setBusy(f.id);
        const stamp = isoDay(today());
        try {
          if (action === "snooze") {
            const months = Number(snoozeFor[f.id] || 3);
            const t = today();
            const until = isoDay(new Date(t.getFullYear(), t.getMonth() + months, t.getDate()));
            await db.doc("flags/" + f.id).update({ state: "snoozed", snoozeUntil: until, decidedAt: stamp });
          } else if (action === "resolve") {
            for (const id of f.resolveSubs || []) {
              await db.doc("subs/" + id).update({ status: "cancelled", note: f.resolveNote || "Resolved from Worth a look", endDate: stamp });
            }
            await db.doc("flags/" + f.id).update({ state: "resolved", decidedAt: stamp });
          } else if (action === "reopen") {
            await db.doc("flags/" + f.id).update({ state: "open", snoozeUntil: null, decidedAt: null });
          }
        } catch (e) { setCanEdit(false); }
        setBusy(null);
      }

      const view = useMemo(() => {
        if (!subs) return null;
        const withNext = subs.map(s => ({ ...s, due: nextDate(s) }));
        const active = withNext.filter(s => s.status === "active");
        const review = withNext.filter(s => s.status === "review");
        const cancelled = withNext.filter(s => s.status === "cancelled");
        const monthly = active.filter(s => s.cycleMonths === 1).sort((a,b) => aud(b) - aud(a));
        const longer = active.filter(s => s.cycleMonths > 1).sort((a,b) => (a.due||0) - (b.due||0));
        const runMonthly = monthly.reduce((t,s) => t + aud(s), 0);
        const runAll = active.reduce((t,s) => t + (s.cycleMonths ? aud(s) / s.cycleMonths : 0), 0);
        const t = today();
        const upcoming = active.filter(s => s.due && s.due - t <= 45 * DAY).sort((a,b) => a.due - b.due);
        return { active, review, cancelled, monthly, longer, runMonthly, runAll, upcoming };
      }, [subs]);

      // Latest email seen per subscription, and emails no subscription accounts for.
      const inbox = useMemo(() => {
        const last = {}; const rows = [];
        if (!subs) return { last, rows };
        for (const th of feed.threads) {
          const m = (th.messages || [])[0] || {};
          const text = `${m.sender || ""} ${m.subject || ""} ${m.snippet || ""}`;
          const s = matchSub(subs, text);
          const date = m.date ? new Date(m.date) : null;
          if (s && date && (!last[s.id] || date > last[s.id])) last[s.id] = date;
          rows.push({ id: th.id, date, sender: m.sender || "", subject: m.subject || "(no subject)", snippet: (m.snippet || "").replace(/&#39;/g,"'").replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/[͏‌­\s]+/g," ").slice(0,140), sub: s, url: th.viewUrl });
        }
        return { last, rows };
      }, [feed.threads, subs]);

      if (dbState === "loading") return html`<div class="wrap"><p class="muted">Loading your subscriptions…</p></div>`;
      if (dbState === "unavailable" || !view) return html`<div class="wrap"><h1>Recurring Ledger</h1><p class="muted">The subscription list couldn't be loaded in this view. Open the page on claude.ai while signed in.</p></div>`;

      const t = today();
      const daysTo = d => Math.round((d - t) / DAY);

      const statusCell = s => canEdit
        ? html`<select id=${"st-" + s.id} aria-label=${"Status for " + s.name} value=${s.status} onChange=${e => setStatus(s.id, e.target.value)}>
            <option value="active">Active</option><option value="review">Check</option><option value="cancelled">Cancelled</option></select>`
        : html`<span class=${"chip " + (s.status === "active" ? "ok" : s.status)}>${s.status}</span>`;

      const byOrder = (a, b) => (a.order || 99) - (b.order || 99);
      const openFlags = flags.filter(flagOpen).sort(byOrder);
      const decidedFlags = flags.filter(f => !flagOpen(f)).sort(byOrder);
      // Live cost of the subscriptions a flag is about, so the figure moves when prices or statuses do.
      const flagCost = f => {
        const linked = (f.subIds || []).map(id => subs.find(s => s.id === id)).filter(s => s && s.status !== "cancelled" && s.cycleMonths);
        if (!linked.length) return null;
        const perMonth = linked.reduce((t, s) => t + aud(s) / s.cycleMonths, 0);
        return html`<span class="sub num">${linked.map(s => s.name).join(" + ")} ≈ A$${perMonth.toFixed(0)}/month</span>`;
      };

      const lastSeen = s => inbox.last[s.id] ? html`<div class="sub">Last email ${fmtDate(inbox.last[s.id])}</div>` : null;

      const row = (s, showCycle) => html`<tr key=${s.id}>
        <td><div class="name">${s.name}</div><div class="sub">${s.note || s.category}</div>${lastSeen(s)}</td>
        <td><span class=${"chip" + (s.via === "Apple" ? " apple" : "")}>${s.via}</span></td>
        ${showCycle ? html`<td class="sub">${cycleLabel(s.cycleMonths)}</td>` : null}
        <td class="r num">${money(s.price, s.currency)}</td>
        <td class="num">${s.due ? fmtDate(s.due) : "—"}${s.due && daysTo(s.due) <= 7 ? html` <span class="chip soon">${daysTo(s.due) === 0 ? "today" : daysTo(s.due) + "d"}</span>` : null}</td>
        <td>${statusCell(s)}</td></tr>`;

      const feedBody = () => {
        if (feed.state === "unavailable") return HOSTED
          ? html`<p class="note">Live inbox checks aren't available in this view.</p>`
          : html`<p class="note">The live Gmail check runs on the claude.ai copy of this page. <a href=${LIVE_URL} target="_blank" rel="noopener">Open it on claude.ai</a>.</p>`;
        if (feed.state === "loading") return html`<p class="note">Reading recent receipts from Gmail… The first time, claude.ai asks you to allow Gmail for this page.</p>`;
        if (feed.state === "error") {
          const c = feed.error?.code;
          const msg = c === "needs_reauth" ? "Gmail needs reconnecting. Reconnect it in claude.ai Settings → Connectors, then reload."
            : c === "server_not_connected" ? "Gmail isn't connected. Add it in claude.ai Settings → Connectors, then reload."
            : c === "not_in_manifest" ? "Gmail access is turned off for this page. Allow it from the page's connector settings to see live receipts."
            : c === "selection_required" ? "You have more than one Gmail connector. Choose one when claude.ai asks, then reload."
            : `Couldn't read Gmail (${feed.error?.message || c}). The list above is unaffected.`;
          return html`<p class="note">${msg}</p>`;
        }
        const rows = inbox.rows;
        if (!rows.length) return html`<p class="note">No receipts or renewal notices in the last 35 days.</p>`;
        return rows.map(r => html`<div class="fi" key=${r.id}>
          <span class="d">${r.date ? `${r.date.getDate()} ${MON[r.date.getMonth()]}` : ""}</span>
          <span class="s">${r.subject}</span>
          <span class="x">${r.sub ? html`<span class=${"chip " + (r.sub.status === "cancelled" ? "cancelled" : "ok")}>${r.sub.name}</span> ` : html`<span class="chip review">Not tracked</span> `}${r.snippet}</span>
        </div>`);
      };

      return html`<div class="wrap">
        <header>
          <div>
            <div class="eyebrow">Brett's subscriptions · as of ${fmtDate(t)}</div>
            <h1>Recurring Ledger</h1>
          </div>
          <div class="totals">
            <div class="total"><b class="num">A$${view.runMonthly.toFixed(0)}</b><span>monthly plans, per month</span></div>
            <div class="total"><b class="num">A$${view.runAll.toFixed(0)}</b><span>everything, averaged per month</span></div>
            <div class="total"><b class="num">A$${(view.runAll * 12).toFixed(0)}</b><span>per year</span></div>
          </div>
        </header>

        <div class="grid">
          <section>
            <div class="sechead"><h2>Monthly</h2><span class="eyebrow">${view.monthly.length} active</span></div>
            <div class="panel tablewrap"><table>
              <thead><tr><th>Service</th><th>Paid via</th><th class="r">Price</th><th>Next charge</th><th>Status</th></tr></thead>
              <tbody>${view.monthly.map(s => row(s, false))}</tbody></table></div>
          </section>

          <section>
            <div class="sechead"><h2>Next 45 days</h2><span class="eyebrow">${view.upcoming.length} charges</span></div>
            <div class="panel upcoming">${view.upcoming.length ? view.upcoming.map(s => html`<div class="up" key=${s.id}>
              <div class="leaf"><i>${MON[s.due.getMonth()]}</i><b class="num">${s.due.getDate()}</b></div>
              <div><div class="name">${s.name}</div><div class="sub">${daysTo(s.due) === 0 ? "Today" : daysTo(s.due) === 1 ? "Tomorrow" : `In ${daysTo(s.due)} days`} · ${s.via}</div></div>
              <div class="num">${money(s.price, s.currency)}</div></div>`) : html`<p class="note">Nothing due.</p>`}</div>
          </section>
        </div>

        <section>
          <div class="sechead"><h2>Yearly and multi-year</h2><span class="eyebrow">${view.longer.length} active</span></div>
          <div class="panel tablewrap"><table>
            <thead><tr><th>Service</th><th>Paid via</th><th>Term</th><th class="r">Price</th><th>Renews</th><th>Status</th></tr></thead>
            <tbody>${view.longer.map(s => row(s, true))}</tbody></table></div>
        </section>

        <div class="grid">
          <section>
            <div class="sechead"><h2>From your inbox</h2>
              <span class="eyebrow">${feed.at ? `Checked ${new Date(feed.at).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}` : "Last 35 days"}${feed.state === "stale" ? " · refresh failed" : ""}</span></div>
            <div class="panel feed">${feedBody()}</div>
          </section>

          <section>
            <div class="sechead"><h2>Worth a look</h2><span class="eyebrow">${openFlags.length} open</span></div>
            <div class="flags">
              ${openFlags.length ? openFlags.map(f => html`<div class=${"flag" + (f.state === "snoozed" ? " back" : "")} key=${f.id}>
                <strong>${f.title}</strong>
                <span class="sub">${f.body}</span>
                ${flagCost(f)}
                ${f.state === "snoozed" ? html`<span class="sub decision">Back after "keep for now" on ${fmtDate(parse(f.decidedAt))}${f.decision ? ": " + f.decision : ""}</span>` : null}
                ${canEdit ? html`<div class="flag-actions">
                  <select id=${"snz-" + f.id} aria-label=${"Keep " + f.title + " for"} value=${snoozeFor[f.id] || "3"} onChange=${e => setSnoozeFor({ ...snoozeFor, [f.id]: e.target.value })}>
                    <option value="1">1 month</option><option value="3">3 months</option><option value="6">6 months</option><option value="12">12 months</option></select>
                  <button class="ghost" disabled=${busy === f.id} onClick=${() => decide(f, "snooze")}>Keep for now</button>
                  <button disabled=${busy === f.id} onClick=${() => decide(f, "resolve")}>${f.resolveSubs?.length ? "Done, cancel it" : "Done for good"}</button>
                </div>` : null}
              </div>`) : html`<p class="note panel">Nothing needs a decision right now.</p>`}
              ${decidedFlags.length ? html`<details class="decided">
                <summary class="eyebrow">Decided · ${decidedFlags.length}</summary>
                ${decidedFlags.map(f => html`<div class="drow" key=${f.id}>
                  <div><div class="name">${f.title}</div>
                    <div class="sub">${f.state === "resolved" ? `Done for good ${fmtDate(parse(f.decidedAt))}` : `Kept for now · flags again ${fmtDate(parse(f.snoozeUntil))}`}${f.decision ? " · " + f.decision : ""}</div></div>
                  ${canEdit ? html`<button class="ghost" disabled=${busy === f.id} onClick=${() => decide(f, "reopen")}>Reopen</button>` : null}
                </div>`)}
              </details>` : null}
            </div>
          </section>
        </div>

        <section>
          <details>
            <summary><div class="sechead"><h2>Cancelled or ending</h2><span class="eyebrow">${view.cancelled.length} · no further charges expected</span></div></summary>
            <div class="panel tablewrap" style=${{ marginTop: "12px" }}><table>
              <thead><tr><th>Service</th><th>Paid via</th><th>Term</th><th class="r">Was</th><th>Date</th><th>Status</th></tr></thead>
              <tbody>${view.cancelled.map(s => html`<tr key=${s.id}>
                <td><div class="name">${s.name}</div><div class="sub">${s.note}</div>${lastSeen(s)}</td>
                <td><span class=${"chip" + (s.via === "Apple" ? " apple" : "")}>${s.via}</span></td>
                <td class="sub">${cycleLabel(s.cycleMonths)}</td>
                <td class="r num">${money(s.price, s.currency)}</td>
                <td class="num">${s.endDate ? fmtDate(parse(s.endDate)) : "—"}</td>
                <td>${statusCell(s)}</td></tr>`)}</tbody></table></div>
          </details>
        </section>

        <footer>Totals convert US$ at 1.52 and € at 1.65, so they're approximate. The inbox panel searches the Gmail account connected to claude.ai and flags receipts that don't match a tracked subscription. ${canEdit ? "Change a status and it saves for everyone who opens this page." : ""}</footer>
      </div>`;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
    </script>

    </body>
    </html>
