    <div id="root"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
    <script>
    const { useState, useEffect, useMemo } = React;
    const html = htm.bind(React.createElement);

    // Approximate conversion so everything sums in AUD.
    const FX = { AUD: 1, USD: 1.52, EUR: 1.65 };
    const SYM = { AUD: "A$", USD: "US$", EUR: "€" };
    const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const DAY = 86400000;
    const HOSTED = typeof window.claude?.use === "function";
    const LIVE_URL = "https://claude.ai/artifact/9HZSSJVTgNp4o93y4zcqfr";

    const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
    const parse = s => { if (!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
    const fmtDate = d => d ? `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}` : "—";
    const money = (v, c) => v == null ? "—" : `${SYM[c] || ""}${v.toFixed(2)}`;
    const aud = s => (s.price || 0) * (FX[s.currency] || 1);

    // Roll a stored renewal date forward by its cycle until it is today or later.
    function nextDate(s) {
      let d = parse(s.next);
      if (!d || !s.cycleMonths) return d;
      const t = today();
      let guard = 0;
      while (d < t && guard++ < 120) d = new Date(d.getFullYear(), d.getMonth() + s.cycleMonths, d.getDate());
      return d;
    }
    const cycleLabel = m => m === 1 ? "Monthly" : m === 12 ? "Yearly" : m ? `${m / 12} years` : "One-off";

    function matchSub(subs, text) {
      const t = text.toLowerCase();
      return subs.find(s => (s.match || []).some(k => t.includes(k.toLowerCase())));
    }

    const FEED_QUERY = 'newer_than:35d (subject:(receipt OR invoice OR subscription OR renew OR renewal OR trial OR "payment") OR from:(paypal OR email.apple.com))';

    function App() {
      const [subs, setSubs] = useState(null);
      const [dbState, setDbState] = useState("loading");
      const [db, setDb] = useState(null);
      const [canEdit, setCanEdit] = useState(false);
      const [feed, setFeed] = useState({ state: "loading", threads: [], at: null, error: null });

      useEffect(() => {
        let unsub = () => {};
        // Self-hosted copy (reports.i3sec.com.au): no claude.ai runtime, so read
        // the list from the JSON file served next to the page instead.
        if (!HOSTED) {
          fetch("subscriptions.json", { cache: "no-store" }).then(r => r.json())
            .then(d => { setSubs(d.subs); setDbState("ready"); })
            .catch(() => setDbState("unavailable"));
          return;
        }
        claude.use("db").then(d => {
          if (!d) { setDbState("unavailable"); return; }
          setDb(d);
          unsub = d.collection("subs").onSnapshot(
            snap => { setSubs(snap.docs.map(x => ({ id: x.id, ...x.data() }))); setDbState("ready"); },
            () => setDbState("unavailable"));
        });
        claude.use("user").then(u => {
          if (!u) return;
          const w = u.can("data.write");
          setCanEdit(w == null ? u.isOwner() : w);
        });
        return () => unsub();
      }, []);

      useEffect(() => {
        let stop = () => {};
        if (!HOSTED) { setFeed(f => ({ ...f, state: "unavailable" })); return; }
        claude.use("mcp").then(mcp => {
          if (!mcp) { setFeed(f => ({ ...f, state: "unavailable" })); return; }
          stop = mcp.watchTool("Gmail", "search_threads", { query: FEED_QUERY, pageSize: 40 }, ev => {
            if (ev.type === "data") {
              const p = ev.result.payload || {};
              setFeed({ state: "ready", threads: p.threads || [], at: ev.result.cache?.storedAt || Date.now(), error: null });
            } else {
              const code = ev.error.code;
              const retract = ["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required"].includes(code);
              setFeed(f => ({ state: retract || !f.threads.length ? "error" : "stale", threads: retract ? [] : f.threads, at: f.at, error: ev.error }));
            }
          }, { cache: { staleTime: 120000, gcTime: 86400000 }, refetchInterval: 30 * 60000 });
        });
        return () => stop();
      }, []);

      async function setStatus(id, status) {
        if (!db) return;
        try { await db.doc("subs/" + id).update({ status }); }
        catch (e) { setCanEdit(false); }
      }

      const view = useMemo(() => {
        if (!subs) return null;
        const withNext = subs.map(s => ({ ...s, due: nextDate(s) }));
        const active = withNext.filter(s => s.status === "active");
        const review = withNext.filter(s => s.status === "review");
        const cancelled = withNext.filter(s => s.status === "cancelled");
        const monthly = active.filter(s => s.cycleMonths === 1).sort((a,b) => aud(b) - aud(a));
        const longer = active.filter(s => s.cycleMonths > 1).sort((a,b) => (a.due||0) - (b.due||0));
        const runMonthly = monthly.reduce((t,s) => t + aud(s), 0);
        const runAll = active.reduce((t,s) => t + (s.cycleMonths ? aud(s) / s.cycleMonths : 0), 0);
        const t = today();
        const upcoming = active.filter(s => s.due && s.due - t <= 45 * DAY).sort((a,b) => a.due - b.due);
        return { active, review, cancelled, monthly, longer, runMonthly, runAll, upcoming };
      }, [subs]);

      // Latest email seen per subscription, and emails no subscription accounts for.
      const inbox = useMemo(() => {
        const last = {}; const rows = [];
        if (!subs) return { last, rows };
        for (const th of feed.threads) {
          const m = (th.messages || [])[0] || {};
          const text = `${m.sender || ""} ${m.subject || ""} ${m.snippet || ""}`;
          const s = matchSub(subs, text);
          const date = m.date ? new Date(m.date) : null;
          if (s && date && (!last[s.id] || date > last[s.id])) last[s.id] = date;
          rows.push({ id: th.id, date, sender: m.sender || "", subject: m.subject || "(no subject)", snippet: (m.snippet || "").replace(/&#39;/g,"'").replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/[͏‌­\s]+/g," ").slice(0,140), sub: s, url: th.viewUrl });
        }
        return { last, rows };
      }, [feed.threads, subs]);

      if (dbState === "loading") return html`<div class="wrap"><p class="muted">Loading your subscriptions…</p></div>`;
      if (dbState === "unavailable" || !view) return html`<div class="wrap"><h1>Recurring Ledger</h1><p class="muted">The subscription list couldn't be loaded in this view. Open the page on claude.ai while signed in.</p></div>`;

      const t = today();
      const daysTo = d => Math.round((d - t) / DAY);

      const statusCell = s => canEdit
        ? html`<select id=${"st-" + s.id} aria-label=${"Status for " + s.name} value=${s.status} onChange=${e => setStatus(s.id, e.target.value)}>
            <option value="active">Active</option><option value="review">Check</option><option value="cancelled">Cancelled</option></select>`
        : html`<span class=${"chip " + (s.status === "active" ? "ok" : s.status)}>${s.status}</span>`;

      const lastSeen = s => inbox.last[s.id] ? html`<div class="sub">Last email ${fmtDate(inbox.last[s.id])}</div>` : null;

      const row = (s, showCycle) => html`<tr key=${s.id}>
        <td><div class="name">${s.name}</div><div class="sub">${s.note || s.category}</div>${lastSeen(s)}</td>
        <td><span class=${"chip" + (s.via === "Apple" ? " apple" : "")}>${s.via}</span></td>
        ${showCycle ? html`<td class="sub">${cycleLabel(s.cycleMonths)}</td>` : null}
        <td class="r num">${money(s.price, s.currency)}</td>
        <td class="num">${s.due ? fmtDate(s.due) : "—"}${s.due && daysTo(s.due) <= 7 ? html` <span class="chip soon">${daysTo(s.due) === 0 ? "today" : daysTo(s.due) + "d"}</span>` : null}</td>
        <td>${statusCell(s)}</td></tr>`;

      const feedBody = () => {
        if (feed.state === "unavailable") return HOSTED
          ? html`<p class="note">Live inbox checks aren't available in this view.</p>`
          : html`<p class="note">The live Gmail check runs on the claude.ai copy of this page. <a href=${LIVE_URL} target="_blank" rel="noopener">Open it on claude.ai</a>.</p>`;
        if (feed.state === "loading") return html`<p class="note">Reading recent receipts from Gmail… The first time, claude.ai asks you to allow Gmail for this page.</p>`;
        if (feed.state === "error") {
          const c = feed.error?.code;
          const msg = c === "needs_reauth" ? "Gmail needs reconnecting. Reconnect it in claude.ai Settings → Connectors, then reload."
            : c === "server_not_connected" ? "Gmail isn't connected. Add it in claude.ai Settings → Connectors, then reload."
            : c === "not_in_manifest" ? "Gmail access is turned off for this page. Allow it from the page's connector settings to see live receipts."
            : c === "selection_required" ? "You have more than one Gmail connector. Choose one when claude.ai asks, then reload."
            : `Couldn't read Gmail (${feed.error?.message || c}). The list above is unaffected.`;
          return html`<p class="note">${msg}</p>`;
        }
        const rows = inbox.rows;
        if (!rows.length) return html`<p class="note">No receipts or renewal notices in the last 35 days.</p>`;
        return rows.map(r => html`<div class="fi" key=${r.id}>
          <span class="d">${r.date ? `${r.date.getDate()} ${MON[r.date.getMonth()]}` : ""}</span>
          <span class="s">${r.subject}</span>
          <span class="x">${r.sub ? html`<span class=${"chip " + (r.sub.status === "cancelled" ? "cancelled" : "ok")}>${r.sub.name}</span> ` : html`<span class="chip review">Not tracked</span> `}${r.snippet}</span>
        </div>`);
      };

      return html`<div class="wrap">
        <header>
          <div>
            <div class="eyebrow">Brett's subscriptions · as of ${fmtDate(t)}</div>
            <h1>Recurring Ledger</h1>
          </div>
          <div class="totals">
            <div class="total"><b class="num">A$${view.runMonthly.toFixed(0)}</b><span>monthly plans, per month</span></div>
            <div class="total"><b class="num">A$${view.runAll.toFixed(0)}</b><span>everything, averaged per month</span></div>
            <div class="total"><b class="num">A$${(view.runAll * 12).toFixed(0)}</b><span>per year</span></div>
          </div>
        </header>

        <div class="grid">
          <section>
            <div class="sechead"><h2>Monthly</h2><span class="eyebrow">${view.monthly.length} active</span></div>
            <div class="panel tablewrap"><table>
              <thead><tr><th>Service</th><th>Paid via</th><th class="r">Price</th><th>Next charge</th><th>Status</th></tr></thead>
              <tbody>${view.monthly.map(s => row(s, false))}</tbody></table></div>
          </section>

          <section>
            <div class="sechead"><h2>Next 45 days</h2><span class="eyebrow">${view.upcoming.length} charges</span></div>
            <div class="panel upcoming">${view.upcoming.length ? view.upcoming.map(s => html`<div class="up" key=${s.id}>
              <div class="leaf"><i>${MON[s.due.getMonth()]}</i><b class="num">${s.due.getDate()}</b></div>
              <div><div class="name">${s.name}</div><div class="sub">${daysTo(s.due) === 0 ? "Today" : daysTo(s.due) === 1 ? "Tomorrow" : `In ${daysTo(s.due)} days`} · ${s.via}</div></div>
              <div class="num">${money(s.price, s.currency)}</div></div>`) : html`<p class="note">Nothing due.</p>`}</div>
          </section>
        </div>

        <section>
          <div class="sechead"><h2>Yearly and multi-year</h2><span class="eyebrow">${view.longer.length} active</span></div>
          <div class="panel tablewrap"><table>
            <thead><tr><th>Service</th><th>Paid via</th><th>Term</th><th class="r">Price</th><th>Renews</th><th>Status</th></tr></thead>
            <tbody>${view.longer.map(s => row(s, true))}</tbody></table></div>
        </section>

        <div class="grid">
          <section>
            <div class="sechead"><h2>From your inbox</h2>
              <span class="eyebrow">${feed.at ? `Checked ${new Date(feed.at).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}` : "Last 35 days"}${feed.state === "stale" ? " · refresh failed" : ""}</span></div>
            <div class="panel feed">${feedBody()}</div>
          </section>

          <section>
            <div class="sechead"><h2>Worth a look</h2></div>
            <div class="flags">
              ${view.review.map(s => html`<div class="flag" key=${s.id}><strong>${s.name}</strong><span class="sub">${s.note}</span></div>`)}
              <div class="flag"><strong>Three AI subscriptions</strong><span class="sub">Claude Pro, SuperGrok and Venice.ai together cost about A$103 a month.</span></div>
              <div class="flag"><strong>Confirm the Apple list</strong><span class="sub">System Settings → your name → Media & Purchases → Subscriptions is the definitive list for Apple billing.</span></div>
            </div>
          </section>
        </div>

        <section>
          <details>
            <summary><div class="sechead"><h2>Cancelled or ending</h2><span class="eyebrow">${view.cancelled.length} · no further charges expected</span></div></summary>
            <div class="panel tablewrap" style=${{ marginTop: "12px" }}><table>
              <thead><tr><th>Service</th><th>Paid via</th><th>Term</th><th class="r">Was</th><th>Date</th><th>Status</th></tr></thead>
              <tbody>${view.cancelled.map(s => html`<tr key=${s.id}>
                <td><div class="name">${s.name}</div><div class="sub">${s.note}</div>${lastSeen(s)}</td>
                <td><span class=${"chip" + (s.via === "Apple" ? " apple" : "")}>${s.via}</span></td>
                <td class="sub">${cycleLabel(s.cycleMonths)}</td>
                <td class="r num">${money(s.price, s.currency)}</td>
                <td class="num">${s.endDate ? fmtDate(parse(s.endDate)) : "—"}</td>
                <td>${statusCell(s)}</td></tr>`)}</tbody></table></div>
          </details>
        </section>

        <footer>Totals convert US$ at 1.52 and € at 1.65, so they're approximate. The inbox panel searches the Gmail account connected to claude.ai and flags receipts that don't match a tracked subscription. ${canEdit ? "Change a status and it saves for everyone who opens this page." : ""}</footer>
      </div>`;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
    </script>

    </body>
    </html>
