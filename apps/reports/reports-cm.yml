      "items": [
        {"id":"artcraft-lightcraft","title":"ArtCraft / LightCraft and the rest of the open-source Adobe clones","category":"watch","added":"2026-10-09","status":"open",
         "note":"ArtCraft used Opus 5.5 to build clean-room, open-source clones of the whole Adobe suite in Rust (Photocraft/Photoshop, Filmcraft/Premiere, Effect/After Effects, Lightcraft/Lightroom, Designcraft/InDesign, Vectorcraft/Illustrator, PDF/Acrobat). Desktop-only, no iPad or web version, so it sits alongside rather than replaces the current iPad-based photo workflow (Affinity/Photomator/ProCamera). Early alpha (~0.2.x per third-party coverage, self-reported completeness claims not independently verified). Lightcraft specifically could fill a real gap once it matures. Revisit maturity before trying it for real work; if it ever becomes worth running, novnc is already deployed and could expose a desktop session to the iPad.",
         "link":"https://getartcraft.com/apps"},
        {"id":"why-always-broken","title":"Deep dive: why is something always wrong when I work on the cluster?","category":"investigate","added":"2026-10-10","status":"open",
         "note":"User observation 2026-10-10: every session turns up a new fault. Find the common causes rather than fixing each one. Evidence so far: Radarr database and the shared Postgres data both hit file corruption/I/O errors within a day of the 10-08/09 outage (not yet proven to share a cause); k8smaster NFS client wedge recurred 09-26, 10-03, 10-08; the QNAP is a 1 GB box that gets starved by backups; Longhorn has two copies and no off-site backup; several apps are Progressing or Degraded for days with no alert; immich-server OOMs daily. Questions: what is the real single point of failure, which faults are the same fault, and what would make faults visible before a session finds them."},
        {"id":"rename-backup-dirs","title":"Rename the backup folders so they match the jobs and the report (after the backup drive clean-out)","category":"build","added":"2026-10-11","status":"open",
         "note":"The backup drive's folder names grew by accident: there is no reason for a folder called active_backup. Once the drive holds only backup data, rename the folders to match the backup jobs and the names on the backup report page (postgres, QNAP data snapshot, sealed secrets, etcd). The names are used in the snapshot script, the Ansible variables, the cron entries, the reports page scanner, the etcd and credentials copy jobs and the Postgres dump job, so it needs one plan that changes them all together, a dry run, and a rename that is tested on a copy first. Claude to propose the name map when the clean-out finishes."},
        {"id":"media-mirror-paused","title":"Media mirror is paused while folders move off the backup disk - it turns itself back on (started 2026-10-11)","category":"scheduled","added":"2026-10-11","status":"open",
         "note":"Nothing for you to do. The QNAP runs a check every 15 minutes (media-mirror-resume.sh) and puts the mirror schedule back by itself once the woodworking and My Videos folders have gone from the backup disk, or after 72 hours at the latest, whichever comes first. While paused the backup page will show the media mirror ageing. If it is still paused after 3 days something is wrong: tell Claude."},
        {"id":"major-crimes-upgrade","title":"Major Crimes: 1080p upgrade and missing episodes in progress (started 2026-10-10)","category":"scheduled","added":"2026-10-10","status":"open",
         "note":"Sonarr profile changed from Any to HD-1080p Upgrade. Batch 1 (S1 upgrade, 10 episodes, plus 6 missing S4 episodes, about 45 GB, WEB-DL 1080p) was downloading on 10-10. Batches for the missing S5 (19 episodes) and S6 (13 episodes) are started one at a time when the queue drains by a watcher running in the Claude session; if that session has ended and they are not done, ask Claude to run them. Check Jellyfin afterwards: S1 should be 1080p. Seasons 2-4 are 720p and will also upgrade when searched (not yet requested). Only 1080p is accepted by this profile, so an episode that exists only at 720p keeps its old file."},
        {"id":"fit-fan-pinode-01","title":"Fit the Noctua fan to pinode-01 (ordered 2026-10-10, arrives about 17 Oct, with the new Pi), then tell Claude","category":"scheduled","added":"2026-10-10","status":"open",
         "note":"Noctua NF-A14 5V PWM 140 mm (about $49, Scorptec) with its own USB cable, powered from the Pi's USB port if it has the 27 W supply, else a phone charger. Stand it near the board so air runs across the Pi, the NVMe board and the shelf. Before: CPU 73-75C and NVMe 57-61C at 4% load. Tell Claude the time it is on: it marks the dashboard, compares hour by hour, then runs the stress tests (CPU heat, heat plus disk, memory) with auto-stop at 85C. Later plan: new Pi in the house, this one to the shed as the backup-drive host with a filtered fan box and a thermal guard that shunts jobs away on hot days."},
        {"id":"switched-off-apps","title":"Switched off on purpose (2026-10-10): Immich, Paperless, Home Assistant","category":"scheduled","added":"2026-10-10","status":"open",
         "note":"Turned off to take load off pinode-01 during the heat investigation. Nothing is deleted: data, volumes and databases are intact. To bring one back just ask. Paperless and Home Assistant (with Mosquitto) are off via a replicas-0 patch in their kustomization.yml (delete the block, ArgoCD syncs). Immich is scaled to 0 by hand (its ArgoCD app is manual sync). Documents sent to inbox/records wait in the Paperless consume folder meanwhile. Music Assistant is unaffected. Jellyfin and Postgres now prefer k8smaster."},
        {"id":"nfs-wedge-evidence","title":"NFS wedge: evidence is now being recorded (added 2026-10-10)","category":"investigate","added":"2026-10-10","status":"open",
         "note":"k8smaster wedged on NFS to the QNAP on 09-26, 10-03 and 10-08 and the cause was never proven (client, network or QNAP). Both nodes now record NFS retransmits, timeouts, TCP reconnects, request time and queue, QNAP port 2049 reachability, and processes stuck on disk. Rows 9-13 of the heat dashboard (grafana.i3sec.com.au/d/heat-longhorn). Alert: Node processes stuck on disk (over 50 for 5 min) tells you while it is happening: do not reboot first, read the dashboard. Nothing prevents a wedge; this only explains the next one."},
        {"id":"heat-test-verdict","title":"pinode-01 heat test: CLOSED 18 Oct, fan fitted and the node is fixed","category":"scheduled","added":"2026-10-10","status":"done",
         "note":"Verdict 2026-10-18. The original fault was heat on the OLD board: 10-13 Oct it peaked 84-88C and Longhorn replicas failed. The NVMe moved to a new Pi 5 on 14 Oct (peaks fell to 67C with every app back on, no Longhorn fault since 14 Oct 17:34 UTC, 23 volumes healthy). The Noctua fan went on early on Sat 17 Oct: at about 05:15 AEDT the CPU dropped from about 49C to about 34C and has sat at 32-42C since (brief 55C blips are pod restarts). No throttling (clock never under 1.5 GHz) and no undervoltage on any node. Not every fault was heat: the 12 and 14 Oct faults happened at 54-79C, and the 14 Oct ones coincide with the board swap. The same fan blows across the whole cluster, so pinode-02 (old board, no cooling device of its own) dropped from 62-70C to about 31C at the same moment and sits at 30-37C (NVMe 22C): it needs no fan of its own. It is still marked not schedulable for Longhorn; that is a separate decision. Optional: one bounded stress test (auto-stop at 80C) to prove headroom. Dashboard: grafana.i3sec.com.au/d/heat-longhorn."},
        {"id":"pg-clone-cleanup","title":"Safety copy of the postgres volume is deleted automatically on 17 Oct","category":"scheduled","added":"2026-10-10","status":"open",
         "note":"pg-clone-fsck (4 GB Longhorn clone made during the 10-10 postgres fault) is removed by the postgres-clone-cleanup CronJob at 11:00 on 2026-10-17. It only deletes if postgres is Ready and a nightly backup succeeded in the last 36 hours; otherwise it leaves the copy and logs why. Nothing for you to do. Check its last run: kubectl -n postgres get jobs."},
        {"id":"alert-fix-skill","title":"A skill that fixes most alerts","category":"build","added":"2026-10-10","status":"open",
         "note":"STARTED 2026-10-10: skill alert-fix exists (status + idempotent ArgoCD sync, ~/gm-dev/agent-skills/skills/alert-fix). Still to do: the other alert types, and a button on a report page to run it (needs a small read/patch permission for the reports pod, to be approved first). Original idea: given a Telegram alert, the skill reads the rule's next step, checks live state, applies the safe known fix (or says what needs you) and verifies. Each fix must be idempotent: check first, do nothing if already fixed, never delete data. Start with ArgoCD app out of sync and volume over 85% full. Modelled on the media-queue-fix skill. The 13 alert rules are in day1-foundation/apps/grafana/grafana-alerting-cm.yml."},
        {"id":"paperless-cleanup","title":"Clean up Paperless: remove the screenshots and other things that should not be in it","category":"build","added":"2026-10-12","status":"open",
         "note":"Paperless should hold documents only. Images belong in Immich and books in the books library. Still in it: about 150 image documents added in September (mostly screenshots from the Study folders: SCU, MNG, ISY) and about 16 iCloud images from 6 Oct (Tax, Greenlaw, screenshots). Check whether the originals exist elsewhere, copy any that do not to Immich (photos/year/Documents scans/...), then delete them from Paperless. Also review the Imported: tags the 2026-10-12 backup-drive ingest created, and the duplicate Moroccan Meatballs recipe (documents 25 and 2176). Already done 2026-10-12: 44 image and book documents removed (Europe trip, aviation, Postfix); they sit in Paperless trash for a while."}
