# Read-only view of pods, nodes, ingresses and cert-manager Certificates for the /placement/ and /control/ pages (reports-cm.yml,
# server.py). The one write is patch on certificates/status for the "Renew now" button. No secrets, no exec.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reports
  namespace: reports
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reports-placement-read
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list"]
  # The "Renew now" button on /placement/ (same call as `cmctl renew`: set the
  # Issuing condition). Status subresource only - cannot create, edit or delete a
  # Certificate, and cannot read a Secret.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reports-placement-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reports-placement-read
subjects:
  - kind: ServiceAccount
    name: reports
    namespace: reports
