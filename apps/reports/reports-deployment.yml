# One Python server for every report that can live here: the landing page,
# subscriptions, and backups (formerly the separate backup-dashboard app).
# See server.py in reports-cm.yml for the routes.
#
# nodeSelector: k8smaster - the backup report reads /mnt/backup, which only
# exists as a real mount on that node (day0-infra-build's qnap_client
# role), same as postgres-backup.
#
# The media report is not here: movie-status needs Radarr's RWO config
# volume and so has to sit beside the arr-stack pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  namespace: reports
  labels:
    app: reports
    app.kubernetes.io/name: reports
    argocd.argoproj.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reports
  template:
    metadata:
      labels:
        app: reports
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8smaster
      containers:
        - name: reports
          image: python:3.12-alpine
          command: ["python3", "-u", "/app/site/server.py"]
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: site, mountPath: /app/site, readOnly: true}
            - {name: backups-scanner, mountPath: /app/backups, readOnly: true}
            - {name: backup, mountPath: /mnt/backup, readOnly: true}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {memory: "32Mi", cpu: "10m"}
            limits: {memory: "128Mi", cpu: "500m"}
      volumes:
        - name: site
          configMap:
            name: reports
        - name: backups-scanner
          configMap:
            name: reports-backups
        - name: backup
          hostPath:
            path: /mnt/backup
            type: Directory
