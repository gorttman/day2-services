    <text x="703" y="1192" font-size="14.5" fill="#2b2f3a">1.</text>
    <text x="726" y="1192" font-size="14.5" fill="#2b2f3a">Agents write only at the bottom. Tiers 0 and 1 are</text>
    <text x="726" y="1210" font-size="14.5" fill="#2b2f3a">generated, so they cannot drift from the notes.</text>
    <text x="703" y="1233" font-size="14.5" fill="#2b2f3a">2.</text>
    <text x="726" y="1233" font-size="14.5" fill="#2b2f3a">Reading goes top down: router, map, notes, source. Each</text>
    <text x="726" y="1251" font-size="14.5" fill="#2b2f3a">tier links to the one below.</text>
    <text x="703" y="1274" font-size="14.5" fill="#2b2f3a">3.</text>
    <text x="726" y="1274" font-size="14.5" fill="#2b2f3a">The router is the only tier loaded every time. Its size is</text>
    <text x="726" y="1292" font-size="14.5" fill="#2b2f3a">the main budget decision. Claude Code's own 200-line</text>
    <text x="726" y="1310" font-size="14.5" fill="#2b2f3a">memory limit does not apply: that feature is off.</text>
    <text x="703" y="1333" font-size="14.5" fill="#2b2f3a">4.</text>
    <text x="726" y="1333" font-size="14.5" fill="#2b2f3a">External-origin claims are written as needs_review and</text>
    <text x="726" y="1351" font-size="14.5" fill="#2b2f3a">cannot enter tiers 0 or 1 until you approve.</text>
    <text x="703" y="1374" font-size="14.5" fill="#2b2f3a">5.</text>
    <text x="726" y="1374" font-size="14.5" fill="#2b2f3a">OPEN: area or topic maps; router token budget; where</text>
    <text x="726" y="1392" font-size="14.5" fill="#2b2f3a">attachments live.</text>
