    <text x="703" y="1192" font-size="14.5" fill="#2b2f3a">1.</text>
    <text x="726" y="1192" font-size="14.5" fill="#2b2f3a">The router is the only tier loaded every time; maps, notes</text>
    <text x="726" y="1210" font-size="14.5" fill="#2b2f3a">and sources are opened only as needed.</text>
    <text x="703" y="1233" font-size="14.5" fill="#2b2f3a">2.</text>
    <text x="726" y="1233" font-size="14.5" fill="#2b2f3a">Each tier links to the one below, so the agent always</text>
    <text x="726" y="1251" font-size="14.5" fill="#2b2f3a">knows where to go next for detail.</text>
    <text x="703" y="1274" font-size="14.5" fill="#2b2f3a">3.</text>
    <text x="726" y="1274" font-size="14.5" fill="#2b2f3a">If the router misses, search is the fallback. The method</text>
    <text x="726" y="1292" font-size="14.5" fill="#2b2f3a">(keyword, vectors, or both) is still open.</text>
    <text x="703" y="1315" font-size="14.5" fill="#2b2f3a">4.</text>
    <text x="726" y="1315" font-size="14.5" fill="#2b2f3a">Reading never writes. Anything new learned during the</text>
    <text x="726" y="1333" font-size="14.5" fill="#2b2f3a">session is captured by Workflow A.</text>
    <text x="703" y="1356" font-size="14.5" fill="#2b2f3a">5.</text>
    <text x="726" y="1356" font-size="14.5" fill="#2b2f3a">Unverified: how well each model follows the</text>
    <text x="726" y="1374" font-size="14.5" fill="#2b2f3a">router-then-map-then-notes rule; test with real questions.</text>
