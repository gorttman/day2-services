    <text x="703" y="1192" font-size="14.5" fill="#2b2f3a">1.</text>
    <text x="726" y="1192" font-size="14.5" fill="#2b2f3a">Every read and write of the vault goes through the MCP</text>
    <text x="726" y="1210" font-size="14.5" fill="#2b2f3a">server; nothing touches the files directly.</text>
    <text x="703" y="1233" font-size="14.5" fill="#2b2f3a">2.</text>
    <text x="726" y="1233" font-size="14.5" fill="#2b2f3a">Claude Code runs on the cluster. The iPad app reaches it</text>
    <text x="726" y="1251" font-size="14.5" fill="#2b2f3a">by Remote Control; both sides dial out, so no inbound port</text>
    <text x="726" y="1269" font-size="14.5" fill="#2b2f3a">opens.</text>
    <text x="703" y="1292" font-size="14.5" fill="#2b2f3a">3.</text>
    <text x="726" y="1292" font-size="14.5" fill="#2b2f3a">Only Open WebUI has a public name (tunnel plus mTLS). The</text>
    <text x="726" y="1310" font-size="14.5" fill="#2b2f3a">MCP server and vault are never exposed.</text>
    <text x="703" y="1333" font-size="14.5" fill="#2b2f3a">4.</text>
    <text x="726" y="1333" font-size="14.5" fill="#2b2f3a">Open WebUI holds a narrower MCP credential: read, search,</text>
    <text x="726" y="1351" font-size="14.5" fill="#2b2f3a">propose for review. No direct writes.</text>
    <text x="703" y="1374" font-size="14.5" fill="#2b2f3a">5.</text>
    <text x="726" y="1374" font-size="14.5" fill="#2b2f3a">Unverified: OpenCode MCP and custom-endpoint support, and</text>
    <text x="726" y="1392" font-size="14.5" fill="#2b2f3a">routing Claude Code through LiteLLM.</text>
