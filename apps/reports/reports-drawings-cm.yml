    <text x="703" y="1192" font-size="14.5" fill="#2b2f3a">1.</text>
    <text x="726" y="1192" font-size="14.5" fill="#2b2f3a">Every write goes through the MCP server, whichever trigger</text>
    <text x="726" y="1210" font-size="14.5" fill="#2b2f3a">fired.</text>
    <text x="703" y="1233" font-size="14.5" fill="#2b2f3a">2.</text>
    <text x="726" y="1233" font-size="14.5" fill="#2b2f3a">Nothing depends on you closing a session: the timer works</text>
    <text x="726" y="1251" font-size="14.5" fill="#2b2f3a">from a mark, so a week-long session is read in slices.</text>
    <text x="703" y="1274" font-size="14.5" fill="#2b2f3a">3.</text>
    <text x="726" y="1274" font-size="14.5" fill="#2b2f3a">External-origin claims always arrive as needs_review and</text>
    <text x="726" y="1292" font-size="14.5" fill="#2b2f3a">stay out of the router and maps until you approve.</text>
    <text x="703" y="1315" font-size="14.5" fill="#2b2f3a">4.</text>
    <text x="726" y="1315" font-size="14.5" fill="#2b2f3a">A conflict is never settled by newest-wins; both versions</text>
    <text x="726" y="1333" font-size="14.5" fill="#2b2f3a">are linked and you decide (see AI-003C).</text>
    <text x="703" y="1356" font-size="14.5" fill="#2b2f3a">5.</text>
    <text x="726" y="1356" font-size="14.5" fill="#2b2f3a">Unverified: Claude Code hook behaviour (pre-compact,</text>
    <text x="726" y="1374" font-size="14.5" fill="#2b2f3a">exit); test before relying on it.</text>
