    <text x="703" y="1192" font-size="14.5" fill="#2b2f3a">1.</text>
    <text x="726" y="1192" font-size="14.5" fill="#2b2f3a">Two things reach the queue: external-origin claims and</text>
    <text x="726" y="1210" font-size="14.5" fill="#2b2f3a">conflicts. Both are written as needs_review.</text>
    <text x="703" y="1233" font-size="14.5" fill="#2b2f3a">2.</text>
    <text x="726" y="1233" font-size="14.5" fill="#2b2f3a">You see the count at every session start, so review does</text>
    <text x="726" y="1251" font-size="14.5" fill="#2b2f3a">not rely on memory.</text>
    <text x="703" y="1274" font-size="14.5" fill="#2b2f3a">3.</text>
    <text x="726" y="1274" font-size="14.5" fill="#2b2f3a">A held-out item cannot appear in the router or maps, so a</text>
    <text x="726" y="1292" font-size="14.5" fill="#2b2f3a">poisoned or wrong claim cannot steer an agent.</text>
    <text x="703" y="1315" font-size="14.5" fill="#2b2f3a">4.</text>
    <text x="726" y="1315" font-size="14.5" fill="#2b2f3a">OPEN: how a conflict is shown, and whether a superseded</text>
    <text x="726" y="1333" font-size="14.5" fill="#2b2f3a">claim is kept (dated) or removed.</text>
    <text x="703" y="1356" font-size="14.5" fill="#2b2f3a">5.</text>
    <text x="726" y="1356" font-size="14.5" fill="#2b2f3a">Rejected items are closed with their source kept, so the</text>
    <text x="726" y="1374" font-size="14.5" fill="#2b2f3a">same claim is not silently re-proposed.</text>
