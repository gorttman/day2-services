    <text x="703" y="1192" font-size="14.5" fill="#2b2f3a">1.</text>
    <text x="726" y="1192" font-size="14.5" fill="#2b2f3a">Interfaces reach agents; agents reach the vault only</text>
    <text x="726" y="1210" font-size="14.5" fill="#2b2f3a">through the MCP tool set.</text>
    <text x="703" y="1233" font-size="14.5" fill="#2b2f3a">2.</text>
    <text x="726" y="1233" font-size="14.5" fill="#2b2f3a">Full credential (Claude Code, OpenCode, timers): all</text>
    <text x="726" y="1251" font-size="14.5" fill="#2b2f3a">tools. Narrow credential (Open WebUI): search, read,</text>
    <text x="726" y="1269" font-size="14.5" fill="#2b2f3a">propose, review queue.</text>
    <text x="703" y="1292" font-size="14.5" fill="#2b2f3a">3.</text>
    <text x="726" y="1292" font-size="14.5" fill="#2b2f3a">Skills and hooks shape the agent. Timers run with no</text>
    <text x="726" y="1310" font-size="14.5" fill="#2b2f3a">session at all, so capture never depends on a clean exit.</text>
    <text x="703" y="1333" font-size="14.5" fill="#2b2f3a">4.</text>
    <text x="726" y="1333" font-size="14.5" fill="#2b2f3a">Obsidian Sync carries the vault to your devices. git keeps</text>
    <text x="726" y="1351" font-size="14.5" fill="#2b2f3a">local history only. Snapshots go to QNAP, then USB; a</text>
    <text x="726" y="1369" font-size="14.5" fill="#2b2f3a">scheduled restore test proves them.</text>
    <text x="703" y="1392" font-size="14.5" fill="#2b2f3a">5.</text>
    <text x="726" y="1392" font-size="14.5" fill="#2b2f3a">The private folder is blocked server-side; unlocking is</text>
    <text x="726" y="1410" font-size="14.5" fill="#2b2f3a">time-boxed and logged.</text>
